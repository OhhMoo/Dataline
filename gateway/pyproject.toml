[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alkera-gateway"
version = "0.1.0"
description = "Audited tools for Alkera data-agent environments"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "mcp>=1.18,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "sqlglot>=27,<31",
  "filelock>=3.18,<4",
  "psutil>=7,<8",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.9,<2"]
snowflake = ["snowflake-connector-python>=3,<5"]
# Native mode (gateway/NATIVE.md): the fake vendor services and the
# clients their compatibility tests are driven by. Not a base dependency -
# an MCP-transport episode never imports any of it, and the episode image's
# own `pip install --no-deps` would carry none of it either.
#   fastapi/uvicorn  the services' apps and the one process that mounts them
#                    (`native/serve.py` itself needs only uvicorn, so a stack
#                    that serves stubs runs on the base image as it stands)
#   httpx            the tailers and every service-side probe
#   jira, slack_sdk, atlassian-python-api
#                    the REAL vendor clients. They are a dependency of the
#                    thing under test, not of the test: a service that only
#                    ever answers curl has not been shown to answer the
#                    library the agent would actually reach for.
#   psycopg[binary]  already a base dependency; listed nowhere twice.
native = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "jira>=3.8,<4",
  "slack_sdk>=3.33,<4",
  "atlassian-python-api>=3.41,<5",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
alkera-gateway = "alkera_gateway.cli:main"
alkera-mcp-smoke = "alkera_gateway.smoke:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
