# The engine's log: warnings and errors to stderr (the container log), nothing
# else. Spark's default (log4j2-defaults.properties) is INFO, a few hundred lines
# per query; the one line that says the server is up is SeededConnectServer's
# own JSON on stdout.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'}{UTC} %p %c{1}: %m%n%ex
