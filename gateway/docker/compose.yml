name: alkera-track-b

networks:
  episode_net:
    internal: true
  backend_net:
    internal: true

services:
  episode:
    build:
      context: ../..
      dockerfile: gateway/docker/Dockerfile
    image: alkera-stack:track-b
    networks: [episode_net, backend_net]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      ALKERA_POSTGRES_DSN: postgresql://episode:episode-local@postgres/episode
      ALKERA_BACKEND: ${ALKERA_BACKEND:-postgres}
    volumes:
      - worlddata:/world
      - auditdata:/audit
      - bistate:/service-state/bi
      # Public half of the Snowflake socket's TLS material. The image already seeds
      # this path with certifi and points REQUESTS_CA_BUNDLE at it, so the mount is
      # valid whether or not the snowflake profile is running. The private key is
      # never mounted here.
      - snowflaketrust:/etc/alkera/snowflake-tls
    entrypoint: ["python", "/opt/stack/start.py"]
    # `up --wait` on a service with no healthcheck returns as soon as the container is
    # running, which here is before the control plane has finished provisioning and
    # long before the gateway is listening - measured: the first MCP call from the
    # harness failed with ConnectError against a perfectly healthy stack.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  postgres:
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    networks: [backend_net]
    environment:
      POSTGRES_PASSWORD: control-plane-local
      POSTGRES_DB: episode
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d episode"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    image: adobe/s3mock@sha256:e7c36014dcf4c7f0f6bec9de888477d1d9b8f55eceb7d9c1186f70d7aadf81ca
    networks: [backend_net]
    # `initialBuckets`, `root` and `retainFilesOnExit` were all set here and are all
    # ignored on this digest - measured 2026-09-13, found by B3-FINISH: ListAllMyBuckets
    # came back empty, /s3-data and the image's own /s3mockroot stayed empty, and the
    # file store is a random /tmp/s3mockFileStore* directory. They are removed rather
    # than left in place because their presence is why nobody noticed the bucket was
    # missing and the storage half of acceptance_inside.py had never passed.
    # Consequences, both real: the control plane creates the buckets
    # (start.py provision_storage), and object storage here is effectively in-memory
    # and does not survive a restart of this service. Anything that needs S3 state
    # across a restart - snapshot/restore before replay - needs another mechanism.

  harness:
    image: alkera-stack:track-b
    profiles: [harness]
    networks: [episode_net]
    entrypoint: []
    command: ["sleep", "infinity"]

  grading:
    image: alkera-stack:track-b
    profiles: [grading]
    network_mode: none
    entrypoint: []
    command: ["sleep", "infinity"]
    volumes:
      - worlddata:/world:ro
      - auditdata:/audit:ro
      - bistate:/service-state/bi:ro

  snowflake:
    profiles: [snowflake]
    build:
      context: ../..
      dockerfile: gateway/docker/Dockerfile.snowflake
    image: alkera-snowflake:plumbing
    networks:
      backend_net:
        # The fake hostname. backend_net only: the agent's zone must not resolve it.
        aliases: [acme.snowflake.local]
    volumes:
      - snowflakedata:/snowflake-data
      - snowflaketls:/tls
      - snowflaketrust:/etc/alkera/snowflake-tls

volumes:
  worlddata:
  auditdata:
  bistate:
  pgdata:
  snowflakedata:
  snowflaketls:
  snowflaketrust:
