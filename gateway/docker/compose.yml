name: alkera-track-b

networks:
  episode_net:
    internal: true
  backend_net:
    internal: true

services:
  episode:
    build:
      context: ../..
      dockerfile: gateway/docker/Dockerfile
    image: alkera-stack:track-b
    networks: [episode_net, backend_net]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      ALKERA_POSTGRES_DSN: postgresql://episode:episode-local@postgres/episode
      ALKERA_BACKEND: ${ALKERA_BACKEND:-postgres}
      # Additional warehouses for the fixture world, as a JSON list of
      # WarehouseSpec objects (gateway/SURFACES.md#dual-warehouse); empty means
      # the one-warehouse stack every recorded evidence file describes. Read by
      # start.py; set by containment.py --warehouses.
      ALKERA_WAREHOUSES: ${ALKERA_WAREHOUSES:-}
    volumes:
      - worlddata:/world
      - auditdata:/audit
      # The publication ledger is world evidence, not an agent surface
      # (world/README.md#publication-ledger). /world is one bind of the whole world root,
      # so without this the shell would `cat /world/var/ledger/receipts.jsonl`.
      # An empty read-only tmpfs mounted OVER that path shadows it: the
      # directory exists and is empty, the receipts underneath are unreachable
      # from this container, and a write fails on a read-only filesystem - so
      # the agent can neither read the ledger nor forge a line in it. The world
      # writes the real file from OUTSIDE the container (world/world/scheduler.py
      # `advance`, run by the harness on the host), which is why shadowing the
      # path costs the writer nothing.
      - type: tmpfs
        target: /world/var/ledger
        read_only: true
        tmpfs:
          size: 4096
      - bistate:/service-state/bi
      # Public certificates only; the private key stays in the Snowflake service.
      - snowflaketrust:/etc/alkera/snowflake-tls
    entrypoint: ["python", "/opt/stack/start.py"]
    # Wait for provisioning and the gateway listener, not just the process.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  postgres:
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    networks: [backend_net]
    environment:
      POSTGRES_PASSWORD: control-plane-local
      POSTGRES_DB: episode
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d episode"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    image: adobe/s3mock@sha256:e7c36014dcf4c7f0f6bec9de888477d1d9b8f55eceb7d9c1186f70d7aadf81ca
    networks: [backend_net]
    # start.py creates buckets. This configuration does not persist S3 across restarts.

  harness:
    image: alkera-stack:track-b
    profiles: [harness]
    networks: [episode_net]
    entrypoint: []
    command: ["sleep", "infinity"]

  grading:
    image: alkera-stack:track-b
    profiles: [grading]
    network_mode: none
    entrypoint: []
    command: ["sleep", "infinity"]
    volumes:
      - worlddata:/world:ro
      - auditdata:/audit:ro
      - bistate:/service-state/bi:ro

  snowflake:
    profiles: [snowflake]
    build:
      context: ../..
      dockerfile: gateway/docker/Dockerfile.snowflake
    image: alkera-snowflake:plumbing
    networks:
      backend_net:
        # The fake hostname. backend_net only: the agent's zone must not resolve it.
        aliases: [acme.snowflake.local]
    volumes:
      - snowflakedata:/snowflake-data
      - snowflaketls:/tls
      - snowflaketrust:/etc/alkera/snowflake-tls

  # The BigQuery plug (gateway/docker/bigquery/README.md): goccy/bigquery-emulator,
  # multi-arch, pinned by index digest. Profile-gated like `snowflake`; a task
  # that selects warehouse_backend "bigquery" supplies ALKERA_BIGQUERY_OPTIONS.
  # Cost is NOT modelled (alkera_gateway/bigquery.py fences it).
  bigquery:
    profiles: [bigquery]
    image: ghcr.io/goccy/bigquery-emulator:0.8.1@sha256:f4e428d265a93dc5ce36c294e1c584c7c9b384117d47ab8ddbb63d8d50b7f393
    command: ["--project=episode", "--port=9050", "--grpc-port=9060",
              "--database=/bigquery-data/emulator.db"]
    networks:
      backend_net:
        aliases: [bigquery.internal]
    volumes:
      - bigquerydata:/bigquery-data

volumes:
  worlddata:
  auditdata:
  bistate:
  pgdata:
  snowflakedata:
  snowflaketls:
  snowflaketrust:
  bigquerydata:
