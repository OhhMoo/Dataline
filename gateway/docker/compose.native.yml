# Native-mode overlay: the agent gets bash and a network, not a tool list.
#
#   docker compose -p <project> \
#     -f compose.yml -f compose.episode.yml -f compose.native.yml up -d --wait
#
# It layers on the episode overlay, never instead of it: compose.episode.yml is
# what parks the entrypoint, binds the rollout's own world and audit
# directories and fixes the healthcheck, and none of that changes here. This
# file changes what the episode container can *see*.
#
# -------------------------------------------------------------------------
# The DNS restriction, and why there is no dnsmasq
# -------------------------------------------------------------------------
# NATIVE.md: "DNS in the episode network resolves *.internal to the
# fake services; nothing else resolves." Two mechanisms already in the stack
# produce that, and a third container would only add a thing to go wrong:
#
#   1. `networks.<net>.aliases` gives each service its `<name>.internal` name
#      on episode_net. Docker's embedded resolver (127.0.0.11) answers those
#      for every container attached to that network, and answers nothing else
#      it has not been told about.
#   2. episode_net is `internal: true` (compose.yml). An unknown name is
#      forwarded by the embedded resolver to the daemon's upstream resolvers -
#      which sit on a route this network does not have - so the forward times
#      out and the lookup fails. That is the same mechanism evidence/
#      containment.json already records for `example.com` under P2/P3.
#
# The third piece is new here: the episode container is detached from
# backend_net (`networks: !override [episode_net]`). Without that it would
# keep resolving the bare compose service names `postgres`, `s3` and
# `acme.snowflake.local`, and "only the fake services resolve" would be false
# while every `.internal` probe still passed. containment.py P6 probes the
# bare names as controls for exactly this reason.
#
# Consequence, deliberate: every backend the agent is allowed to reach must
# appear below with an episode_net alias. A backend that is not listed is not
# reachable, and that is the property, not an oversight.
#
# -------------------------------------------------------------------------
# Egress
# -------------------------------------------------------------------------
# Unchanged and not re-proven here. Both networks are `internal: true` in
# compose.yml; P2 probes every running service from inside its own network
# namespace, with a positive control that shows the probe can detect egress
# when there is some. Nothing in this file adds a network, a port publication
# or a second interface, and P6 records each container's interface list so a
# future edit that does cannot pass quietly.
#
# -------------------------------------------------------------------------
# Ports and aliases
# -------------------------------------------------------------------------
#   jira.internal:8080        slack.internal:8081        airbyte.internal:8001
#   deploy.internal:8085      confluence.internal:8090   metabase.internal:3000
#   prometheus.internal:9090  alertmanager.internal:9093 loki.internal:3100
#     -> all nine are one process in the `native-services` container
#        (alkera_gateway/native/serve.py, one uvicorn Server per port).
#        The ports are NOT a free choice: tasks/harness/agent_under_test
#        .NATIVE_SERVICES is what the subject env carries, and
#        docs/implementation_plan/harness/NATIVE_DRIVER_REQUESTS.md item 3 fixes them.
#   sched.internal:8120       the scheduler plane behind the workspace's own
#        ./ops/sched. Served by the same process; not a vendor, and not one of
#        the nine the aggregate reports.
#   powerbi.internal:8095  tableau.internal:8096  sigma.internal:8097
#        the BI vendors, EXPLICIT-ONLY: named nowhere in this file. Served by
#        the same process only under a profile that plugs one; the per-rollout
#        overlay (container_episode.profile_overlay) then adds the alias below
#        and the vendor's variables to the episode environment.
#   native-services.internal:8099  the aggregate /health over all nine
#     The services' own STATE (the BI vendors' published content, the config
#     they read) is in /service-state, a mount only native-services has - never
#     in /audit, which the episode container mounts read-write.
#   native-services.internal:8110  MinIO's audit webhook receiver. Served by
#        the same process; dialled by MinIO, never by the episode, and so not
#        a row in destinations.jsonl. The episode can still REACH it (same
#        network), so it answers only a POST carrying the per-stack
#        ALKERA_MINIO_AUDIT_TOKEN that MinIO's webhook sends; see `minio` below.
#   postgres.internal:5432    the primary warehouse, log_statement=all
#   minio.internal:9000       object storage, audit webhook -> the tailer
#   airflow.internal:8080     the scheduler's REST API and CLI
#   snowflake.internal:8443   fakesnow, the second warehouse
#
# Nothing in THIS file publishes a host port, and the episode container never
# gets one: `published_host_ports` for `episode` is a P6 and a P7 pass
# condition, and the harness reaches the episode with `docker exec`.
#
# NOTHING ELSE PUBLISHES ONE EITHER, AND IT CANNOT. The surface gate
# (`tasks/harness/surface_audit.probe_native`) asks each service for `/health`
# from the HARNESS process, which is on the host and cannot resolve
# `jira.internal`, so the harness spent an afternoon publishing the nine
# services to loopback - and Docker will not publish off an `internal: true`
# network. The bindings appear in `HostConfig.PortBindings` and nothing ever
# listens: GT004's first container rollout failed its surface gate with
# `WinError 10061` on all nine while `docker inspect` reported all nine
# mappings. The gate now reaches them through
# `tasks/harness/container_episode.ServiceGate`, one `docker exec` byte relay
# per connection, and `published_host_ports: {}` is true for every container in
# the project - which P6 asserts and P7 now asserts too.

services:

  # The agent's box. Same parked entrypoint compose.episode.yml gives it; the
  # difference is the network it sits on and what it therefore resolves.
  episode:
    networks: !override [episode_net]
    depends_on: !override
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      native-services:
        condition: service_started
    # Anchored: the `jupyter` service below is the same box for the agent's
    # notebook code and gets the same endpoint table, verbatim.
    environment: &native-endpoints
      # The endpoint variables, in the process environment. The workspace's
      # own .envrc exports the same names with the same values, on purpose: the
      # .envrc is what an engineer reads and what `run.sh` sources, and these
      # are what a process that never sourced it still sees. One table
      # (world/world/native_workspace.environment, itself pinned to
      # tasks/harness/agent_under_test.NATIVE_SERVICES) feeds both, and
      # world/tests/test_native_workspace.py fails when they drift.
      AIRBYTE_API_KEY: alkera-local-dev
      AIRBYTE_URL: http://airbyte.internal:8001
      AIRFLOW_API_URL: http://airflow.internal:8080/api/v2
      AIRFLOW_PASSWORD: alkera-local-dev
      AIRFLOW_USER: alkera-local-dev
      ALERTMANAGER_URL: http://alertmanager.internal:9093
      AWS_ACCESS_KEY_ID: alkera-local-dev
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio.internal:9000
      AWS_SECRET_ACCESS_KEY: alkera-local-dev
      CONFLUENCE_API_TOKEN: alkera-local-dev
      CONFLUENCE_URL: http://confluence.internal:8090
      CONFLUENCE_USER: alkera-local-dev
      DBT_PROFILES_DIR: /root/.dbt
      DEPLOY_API_TOKEN: alkera-local-dev
      DEPLOY_URL: http://deploy.internal:8085
      JIRA_API_TOKEN: alkera-local-dev
      JIRA_URL: http://jira.internal:8080
      JIRA_USER: alkera-local-dev
      LOKI_ADDR: http://loki.internal:3100
      LOKI_URL: http://loki.internal:3100
      METABASE_API_KEY: alkera-local-dev
      METABASE_URL: http://metabase.internal:3000
      PGDATABASE: alkera
      PGHOST: postgres.internal
      PGPASSWORD: alkera-local-dev
      PGPORT: "5432"
      PGUSER: alkera
      PROMETHEUS_URL: http://prometheus.internal:9090
      SCHED_URL: http://sched.internal:8120
      SLACK_BASE_URL: http://slack.internal:8081
      SLACK_BOT_TOKEN: alkera-local-dev
      SNOWFLAKE_ACCOUNT: acme
      SNOWFLAKE_HOST: snowflake.internal
      SNOWFLAKE_PASSWORD: alkera-local-dev
      SNOWFLAKE_USER: alkera-local-dev
      # Every row the agent's own shims write lands in the same file the
      # services write (gateway/src/alkera_gateway/native/audit.py).
      ALKERA_NATIVE_AUDIT: /audit/actions.jsonl
      HOME: /root
    # THE MOUNT SET, AND IT REPLACES compose.episode.yml'S. `!override` and not
    # a merge: the episode overlay binds the WHOLE world root at /world, and
    # that single mount is what made a host-topology native rollout
    # unmeasurable. Measured, GT001 native-20260916-k5: two of five subjects
    # ran `cp var/warehouse/warehouse.duckdb <a backup name>` - good practice,
    # nothing audits it, and the world diff read the new file as an
    # out_of_band_world_change and threw the rollout away. Here the warehouse
    # is mounted as a FILE, so the same `cp` writes into the container's own
    # filesystem at /world/var/warehouse/ and the world never moves.
    #
    #   /workspace  the working tree, read-write. The agent's repository.
    #   /audit      this rollout's audit directory, read-write: the PATH shims
    #               run INSIDE this container and append their 9.2.2 rows to
    #               the same actions.jsonl the services write.
    #   /world/var/ledger  an empty read-only tmpfs, exactly as before. /world
    #               itself is no longer a mount, so the shadow now shadows a
    #               container-local directory - kept because P7 measures that
    #               the ledger path answers read-only from inside, and because
    #               a topology where it silently stopped being checked is worse
    #               than one where the check is cheap.
    #
    # The warehouse FILES are NOT here: their names and their number come from
    # the world the rollout built (`blindness.declared_warehouses`, which is
    # `world/world/fingerprint.py`'s own rule), so compose cannot spell them.
    # `tasks/harness/container_episode.NativeContainerEpisode` writes one more
    # overlay per rollout with exactly those file binds and the shim PATH, and
    # keeps it in the rollout directory as the record of what this container
    # could see.
    #
    # `<world>/home:/root` is gone with the rest: home is COPIED in instead
    # (`docker cp`), so `~/.dbt/profiles.yml` is there for a bare `dbt` and an
    # edit to it stays inside the box.
    volumes: !override
      - "${ALKERA_EPISODE_WORLD:?episode world directory}/workspace:/workspace"
      - "${ALKERA_EPISODE_AUDIT:?episode audit directory}:/audit"
      - type: tmpfs
        target: /world/var/ledger
        read_only: true
        tmpfs:
          size: 4096
    # THE INTERPRETER IS NAMED ABSOLUTELY, and that is a fix rather than a
    # style. compose.episode.yml's healthcheck runs `python`, and in THIS
    # container the first entry on PATH is `/opt/alkera/shims`, where `python`
    # is the audited shim - so every healthcheck wrote a `shim.python` row into
    # /audit/actions.jsonl and the first native container rollout counted TEN of
    # them as the subject's own tool calls. Nothing the harness or the runtime
    # does may become a row in the episode's action log.
    #
    # The condition changes with the mount set: /world is no longer a mount, so
    # the thing to assert is the working tree and the audit directory.
    healthcheck: !override
      test: ["CMD", "/usr/local/bin/python", "-c",
             "import pathlib,sys; sys.exit(0 if pathlib.Path('/workspace').is_dir() and pathlib.Path('/audit').is_dir() else 1)"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 1s

  # The Jupyter plug (gateway/docker/jupyter/README.md): jupyter-server with the
  # audited `alkera-python` kernel as the only kernelspec, so every executed
  # cell writes one 9.2.2 row (alkera_gateway.native.notebook). Gated behind the
  # compose profile `notebook`, which `container_episode.NativeContainerEpisode`
  # enables only for an environment profile that plugs the notebook slot: an
  # unprofiled stack never starts it and `jupyter.internal` never resolves.
  # The per-rollout overlay adds the same shim PATH, shim watch list and
  # warehouse FILE binds the episode gets, so a cell sees the box the shell sees.
  jupyter:
    profiles: [notebook]
    image: ${ALKERA_EPISODE_IMAGE:-alkera-stack:track-b}
    # --strip: the paths tasks/harness/container_episode.STRIP_PATHS removes from
    # the episode container, removed here by the launcher before any cell runs.
    entrypoint: ["/usr/local/bin/python", "/opt/stack/jupyter/launch.py",
                 "--strip", "/opt/stack", "--strip", "/opt/gateway/tests"]
    stop_grace_period: 2s
    networks:
      episode_net:
        aliases:
          - jupyter.internal
    environment: *native-endpoints
    volumes:
      - "${ALKERA_EPISODE_WORLD:?episode world directory}/workspace:/workspace"
      - "${ALKERA_EPISODE_AUDIT:?episode audit directory}:/audit"
      - type: tmpfs
        target: /world/var/ledger
        read_only: true
        tmpfs:
          size: 4096
    # Port 8888 listening (0x22B8, state 0A), read from /proc rather than
    # dialled: an HTTP probe would be a connection the episode never made.
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "-c",
             "import pathlib,sys;sys.exit(0 if any(f[1].endswith(':22B8') and f[3]=='0A' for f in (l.split() for l in pathlib.Path('/proc/net/tcp').read_text().splitlines()[1:])) else 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  # The nine fake vendor services, one port each, one process.
  #
  # `sh -c` rather than a plain argument list because ALKERA_NATIVE_STUBS is a
  # whole word list (`--stub jira --stub slack`), and compose substitutes it as
  # one string; the shell is what splits it. Empty in a complete stack - it
  # exists so containment P6 can be measured against serve.py before every
  # service module has landed, and the evidence records the value it ran with.
  # ALKERA_NATIVE_PROFILE_ARGS is the same kind of word list: `--profile
  # ROLE/STACK --plug SLOT=PLUG...` for a task that declares an environment
  # profile (tasks/harness/container_episode.NativeContainerEpisode sets it,
  # empty otherwise), and the per-rollout overlay narrows the aliases below to
  # match.
  #
  # THE SERVICES' OWN STATE IS NOT IN /audit. `native_services.py` (this
  # directory, /opt/stack in the image) writes the services' gateway config to
  # /service-state with `bi_state_dir: /service-state/bi` and execs serve.py
  # with it. /service-state is a mount THIS service has and no other: /audit is
  # read-write in the episode container (the shims append rows there), and
  # until 2026-10-04 serve.py's defaults put the BI vendors' published state
  # (`/audit/bi`, which the grader stages as `{bi_state}`) and the config every
  # service re-reads per request (`/audit/native_gateway.json`) there, both
  # forgeable from the subject's shell. Containment P7 asserts per rollout that
  # the episode cannot see it (tasks/harness/bistate.py has the whole story).
  native-services:
    image: ${ALKERA_EPISODE_IMAGE:-alkera-stack:track-b}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec python /opt/stack/native_services.py --state-dir /service-state --
        --audit /audit --world /world --bind 0.0.0.0
        ${ALKERA_NATIVE_STUBS:-} ${ALKERA_NATIVE_PROFILE_ARGS:-}
    stop_grace_period: 2s
    environment:
      # The MinIO audit receiver's shared secret; the `minio` service below
      # says why and where it comes from. serve.py takes it out of its own
      # environment before any service module loads.
      ALKERA_MINIO_AUDIT_TOKEN: ${ALKERA_MINIO_AUDIT_TOKEN:-}
    networks:
      episode_net:
        aliases:
          # native-services.internal is the aggregate /health on 8099, not a
          # tenth service.
          - native-services.internal
          - jira.internal
          - confluence.internal
          - slack.internal
          - deploy.internal
          - airbyte.internal
          - metabase.internal
          - prometheus.internal
          - alertmanager.internal
          - loki.internal
          # NOT a tenth vendor. `sched.internal` is the backend of the agent's
          # own `./ops/sched`, and it exists because the episode container
          # mounts the workspace and the warehouse files and nothing else - so
          # `var/sched`, its run logs, `var/obs` and `build/sched`, which that
          # CLI drives, are not on the episode's filesystem. This container
          # mounts the whole world, so it can. See
          # `alkera_gateway.native.serve.sched_plane` and
          # docs/implementation_plan/harness/NATIVE_CONTAINER.md.
          - sched.internal
    volumes:
      # The same world the episode mounts: NATIVE.md's rule is that a
      # fake service serves and mutates the fixture files the MCP tools serve,
      # so there is one world and the graders do not change.
      - "${ALKERA_EPISODE_WORLD:?episode world directory}:/world"
      - "${ALKERA_EPISODE_AUDIT:?episode audit directory}:/audit"
      # The services' own state: the BI vendors' published content and the
      # config they read. <rollout>/service-state on the host
      # (tasks/harness/bistate.service_state_dir), and in NO other service of
      # this stack - that absence is the property (see the command above).
      - "${ALKERA_EPISODE_SERVICE_STATE:?the native services' own state directory}:/service-state"
      # The publication ledger is world evidence, not an agent surface
      # (world/README.md#publication-ledger). This container answers HTTP for the agent,
      # so a service module that read /world/var/ledger would be a channel to
      # it. The same tmpfs shadow the episode container gets, for the same
      # reason, so no service module can become that channel by accident.
      - type: tmpfs
        target: /world/var/ledger
        read_only: true
        tmpfs:
          size: 4096
      # Read-only: the Postgres statement log is a source for the action-log
      # tailer, and a tailer that could edit its own source is not evidence.
      - pgdata:/pgdata:ro
    healthcheck:
      # NOT an HTTP probe, and the reason is measured. `serve.py` counts every
      # ACCEPTED connection into destinations.jsonl, and `blindness` reads that
      # file as the episode's own traffic - so a healthcheck that dialled
      # 127.0.0.1:8099 every two seconds put 23 connections to
      # `native-services.internal:8099` in the log of a rollout whose subject
      # never touched it, and the rollout quarantined on `network_destination`.
      # `tasks/harness/native_stack._await_listening` hit the same wall on the
      # host topology and answered it the same way.
      #
      # So readiness is read, never dialled: destinations.jsonl exists (serve.py
      # writes it before it opens a socket) and every port it names is in LISTEN
      # according to /proc/net/tcp, which is state 0A and the local port in hex.
      test: ["CMD", "python", "-c",
             "import json,pathlib;rows=[json.loads(l) for l in pathlib.Path('/audit/destinations.jsonl').read_text().splitlines() if l.strip()];listening={int(f[1].split(':')[1],16) for f in (ln.split() for ln in pathlib.Path('/proc/net/tcp').read_text().splitlines()[1:]) if f[3]=='0A'};assert rows and not {r['port'] for r in rows} - listening"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  # The primary warehouse, and in native mode the agent's own psql target.
  #
  # The server log is the action-log source: every statement the AGENT runs
  # appears in it with its timestamp, and the tailer turns each one into a
  # 9.2.2 row (`psql.statement`). logging_collector writes files rather than
  # the container's stdout, because a row source the harness reads must survive
  # `compose logs` rotation and be mountable read-only somewhere else.
  #
  # ROLE-SCOPED, not global, and both settings move together. Measured in
  # native/PARITY.md on postgres 16.15: with `log_statement=all` globally, a
  # bare container start plus one readiness probe put FIVE statements the agent
  # never typed into its action log (`SELECT 1 FROM pg_database`,
  # `CREATE DATABASE "episode"`, `BEGIN`, `SELECT 1`, `COMMIT`) - provisioning
  # rows indistinguishable from agent work by content alone. With
  # `log_statement=none` globally and `ALTER ROLE alkera SET
  # log_statement='all'` (in the config below), the `alkera` role's statements
  # are logged and the superuser's are not.
  #
  # `log_min_duration_statement=-1` globally is the other half and the half
  # that is easy to get wrong: left at 0 globally, the superuser's statements
  # come back anyway in the combined `duration: N ms  statement: ...` form,
  # which the tailer parses exactly like a plain statement entry. Measured, and
  # the reason AUDIT asked for BOTH (native/AUDIT_REQUESTS.md item 2): setting
  # one and not the other silently re-pollutes the log while looking fixed.
  #
  # log_directory is `log`, which postgres resolves under PGDATA - so the log
  # lands in the `pgdata` volume, which the entrypoint has already chowned to
  # the `postgres` user. A separate named volume would be created root-owned at
  # a path the image does not have, and the server would fail to open its own
  # log file. The harness and the grader mount `pgdata:/pgdata:ro` and read
  # /pgdata/log/postgresql.log.
  postgres:
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=on
      - -c
      - log_directory=log
      - -c
      - log_filename=postgresql.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
      - -c
      - log_line_prefix=%m [%p] %u@%d
      # The wall clock is not the world clock. An absolute timestamp in this
      # log is only ever used to order statements against each other and
      # against the audit file, never to date one in the world.
      - -c
      - log_timezone=UTC
    networks:
      backend_net: {}
      episode_net:
        aliases: [postgres.internal]
    environment:
      # The identity the harness ships (NATIVE_DRIVER_REQUESTS.md item 7):
      # PGUSER=alkera, PGDATABASE=alkera, password alkera-local-dev. The
      # superuser stays `postgres` and the agent is NOT it - compose.yml's
      # own postgres.sql runs first and is unchanged; zz-native.sql below adds
      # the non-superuser role the episode connects as.
      POSTGRES_PASSWORD: control-plane-local
      POSTGRES_DB: alkera
    configs:
      - source: pg_native_role
        target: /docker-entrypoint-initdb.d/zz-native.sql
      - source: pg_compose_owner
        target: /docker-entrypoint-initdb.d/zz-native-owner.sql
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  # Object storage. MinIO and not adobe/s3mock because the audit webhook is
  # the row source for the storage plane: s3mock has no such hook, so an `aws
  # s3 cp` against it would move the world with nothing in the action log,
  # which is the one failure native mode may not have.
  #
  # MINIO_AUDIT_WEBHOOK_* (not MINIO_NOTIFY_WEBHOOK_*): the notify webhook
  # fires on object events only, while the audit webhook fires on every API
  # call including the reads, and "what did the agent look at" is half of the
  # blindness rule.
  #
  # QUEUE_DIR is what makes the tailer's own startup order irrelevant: events
  # raised before the tailer is up are spooled on disk and delivered when it
  # answers, so a slow import in a service module cannot silently cost the
  # episode its storage rows.
  minio:
    # Re-pinned 2026-09-25. The original pin, minio/minio@sha256:14cea493...,
    # can no longer be pulled: MinIO withdrew its community images from Docker
    # Hub and quay.io (both answer "access denied" for the repository, not just
    # the digest). pgsty/minio is a maintained community build of the same
    # server (RELEASE.2026-08-04), runs as root like the original, and ships
    # `sh` and `mc`, which the entrypoint and the healthcheck below need.
    # Measured on it: the MINIO_AUDIT_WEBHOOK_* config below is accepted, the
    # `alkera` bucket is served, and `mc ready local` passes. A run that needs
    # byte-identical storage with the Windows-era rollouts should `docker save`
    # the old digest on a machine that still has it and `docker load` it here.
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    # MinIO serves each top-level directory under /data as a bucket, so the
    # bucket the harness ships (`alkera`, NATIVE_DRIVER_REQUESTS.md item 7) is
    # created by making the directory rather than by a second container running
    # `mc mb`. `HEAD /alkera` then answers 200, which is what the s3 surface
    # check reads as live (item 8).
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/alkera && exec minio server /data"]
    networks:
      backend_net: {}
      episode_net:
        aliases: [minio.internal]
    environment:
      MINIO_ROOT_USER: alkera-local-dev
      MINIO_ROOT_PASSWORD: alkera-local-dev
      MINIO_AUDIT_WEBHOOK_ENABLE_alkera: "on"
      MINIO_AUDIT_WEBHOOK_ENDPOINT_alkera: >-
        ${ALKERA_MINIO_AUDIT_ENDPOINT:-http://native-services.internal:8110/minio/audit}
      MINIO_AUDIT_WEBHOOK_QUEUE_DIR_alkera: /audit-spool
      MINIO_AUDIT_WEBHOOK_QUEUE_SIZE_alkera: "100000"
      # Sent as the webhook's Authorization header; the receiver refuses any
      # POST without it, so nothing else on episode_net (the episode above all)
      # can forge `minio.*` rows (evidence/CONTAINMENT_2026-10-07.md, the
      # native-services:8110 row). The value is minted per rollout by
      # tasks/harness/container_episode.NativeContainerEpisode and handed to
      # compose in its process environment, so it is in no file: not here, not
      # in the per-rollout overlay. Only this service and native-services
      # interpolate it, and the episode can read neither one's environment.
      # Unset (a stack someone else brings up), MinIO sends no token and
      # serve.py serves no receiver; it reports the receiver as `missing` and
      # MinIO keeps its events in the queue directory.
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN_alkera: ${ALKERA_MINIO_AUDIT_TOKEN:-}
      # 8110 and not 8099: 8099 is serve.py's aggregate /health. The receiver
      # is AUDIT's `native/tailers/minio.py:build_app()`, hosted by serve.py in
      # the native-services process (serve.MINIO_AUDIT_PORT) - one process, so
      # one writer for the `seq` lock `native.audit` takes per audit directory.
      # The queue directory above still matters: MinIO raises events while that
      # process is starting, and they are spooled on disk and delivered when it
      # answers rather than lost.
      #
      # That port is deliberately NOT in destinations.jsonl. MinIO dials it,
      # the episode never does, and a counted row there would be a destination
      # outside the episode's endpoint map - which blindness reads as a hard
      # `network_destination` violation on every rollout that touched storage.
    volumes:
      - miniodata:/data
      - minioaudit:/audit-spool
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The control plane. `airflow standalone` is the single-process form: API
  # server, scheduler and a SQLite metadata database in one container, which is
  # what a world that advances under a virtual clock needs - one process to
  # stop and start, no second database to keep deterministic.
  #
  # DESIGNED, NOT EXECUTED. Nothing in this repository drives Airflow yet
  # (there is no DAG bundle, no vclock bridge wired to this container), so
  # containment.py P6 has never probed `airflow.internal` and
  # evidence/containment-native.json does not claim it. It is declared here so
  # the alias table is complete and the next builder edits a stanza instead of
  # inventing one.
  airflow:
    image: apache/airflow@sha256:d1a74224f2a653e7eba97cd631125524fa0eb97cf9e76342d623931e554c9fd9
    profiles: [airflow]
    command: ["standalone"]
    networks:
      episode_net:
        aliases: [airflow.internal]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /world/workspace/dags
      AIRFLOW__API__BASE_URL: http://airflow.internal:8080
      TZ: UTC
    volumes:
      - "${ALKERA_EPISODE_WORLD:?episode world directory}:/world"
      - airflowdata:/opt/airflow

  # The second warehouse. compose.yml already builds it and puts it on
  # backend_net under `acme.snowflake.local`, deliberately out of the agent's
  # reach. In native mode the agent addresses warehouses directly, so it gains
  # an episode_net alias - and keeps the old one, because the fake account
  # hostname is what the connector's own URL construction expects.
  snowflake:
    networks:
      backend_net:
        aliases: [acme.snowflake.local]
      episode_net:
        aliases: [snowflake.internal]

  # adobe/s3mock is replaced by minio above. A profile it is not started
  # under is the only way an overlay can take a service out of a stack; this
  # leaves compose.yml untouched and keeps the mock one `--profile mock-s3`
  # away for anyone who wants to compare the two.
  s3:
    profiles: [mock-s3]

  harness:
    volumes:
      # The statement log (/pgdata/log/postgresql.log), read-only, so the
      # harness can fold Postgres rows into the action log after teardown
      # without being able to edit them.
      - pgdata:/pgdata:ro

  grading:
    volumes:
      - worlddata:/world:ro
      - auditdata:/audit:ro
      - bistate:/service-state/bi:ro
      - pgdata:/pgdata:ro

# An inline file rather than one on disk: gateway/docker/postgres.sql belongs
# to the MCP stack and is not this overlay's to edit, and a second .sql file
# beside it would be a file nobody reading compose.native.yml would find.
configs:
  pg_native_role:
    content: |
      -- Native mode: the role the episode connects as. NOT a superuser - the
      -- agent has psql now, and a superuser session is a second channel to
      -- everything the server can reach (the same rule containment P3 checks
      -- for the gateway's own role in MCP mode).
      CREATE ROLE alkera LOGIN PASSWORD 'alkera-local-dev'
        NOSUPERUSER NOCREATEDB NOCREATEROLE;
      GRANT USAGE, CREATE ON SCHEMA raw, staging, warehouse TO alkera;
      GRANT SELECT, INSERT, UPDATE, DELETE
        ON ALL TABLES IN SCHEMA raw, staging, warehouse TO alkera;
      -- The statement log is the agent's action log, so it logs the AGENT'S
      -- role and nothing else. The server-level settings above it are
      -- `log_statement=none` and `log_min_duration_statement=-1`; these two
      -- lines are what puts the episode's own statements back in. Both are
      -- required: with only the first, the superuser's provisioning
      -- statements return through the combined `duration: ... statement: ...`
      -- entry (native/PARITY.md, measured).
      ALTER ROLE alkera SET log_statement = 'all';
      ALTER ROLE alkera SET log_min_duration_statement = 0;
  # compose.yml's postgres.sql creates `episode` LOGIN: the MCP gateway's role,
  # which it reaches through compose.yml's ALKERA_POSTGRES_DSN. On a native box
  # no client should be it. The server logs `alkera`'s statements and no one
  # else's, so a session as `episode` was a second, unaudited way into
  # raw/staging/warehouse, with its password in every box's environment
  # (evidence/CONTAINMENT_2026-10-07.md, the `postgres.internal:5432 as role
  # episode` row). It still owns what postgres.sql made it own; it just cannot
  # log in. This is a script of its own and not a line in pg_native_role:
  # that one is the agent's role, which Harbor's
  # postgres_start.NATIVE_ROLE_SQL repeats statement for statement, and Harbor
  # closes this same door with pg_hba instead (only `alkera` over TCP).
  pg_compose_owner:
    content: |
      -- Native mode: compose's schema owner (gateway/docker/postgres.sql) cannot
      -- log in. Its statements are not logged, so no client may be it.
      ALTER ROLE episode NOLOGIN;

volumes:
  miniodata:
  minioaudit:
  airflowdata:
