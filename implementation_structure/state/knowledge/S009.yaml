id: S009
rq: RQ1
claim: >
  Pinterest runs over 10,000 Airflow DAGs across many teams, and because Airflow has become the
  user interface to a range of data and ML infrastructure sitting behind it, failures originating
  in those other systems surface inside Airflow. Triage is therefore a cross-system problem, and
  user support has been an ongoing productivity bottleneck for the platform team.
