notes: >
  Key structural fact for environment design: the orchestrator is where the symptom appears and
  almost never where the cause lives. Corroborated at the same summit by a Google session on
  Airflow-on-Kubernetes task-failure diagnosis (running a distributed system on another
  distributed system makes troubleshooting harder), by S011/S012 (Airbnb SLA misses trace to
  other teams' upstreams), and by S018 (the academic taxonomy names missing knowledge of the
  external systems Airflow talks to as a leading root cause). Uber's session at the same event
  reports 200,000 pipelines and roughly 1M task executions per day on a single instance.
