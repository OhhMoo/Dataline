notes: >
  Verdict: COPY-PATTERN. The per-query (query.json, ground_truth.csv, validate.py) triplet is a
  minimal, composable deterministic-grading unit we can adopt for query-answering tasks, and
  the read-only-query guardrail + containerized code execution should be standard in our
  environments. Also note leaderboard integrity practices: 5 mandatory runs, execution traces
  required with submissions, and they re-scored a query when a validator was wrong (tied
  answers) — validators need versioning. Task mix (multi-DB joins, ill-formatted keys,
  unstructured text) is adjacent to but narrower than full DE work.
