notes: >
  Resource exhaustion is a first-class, cheaply-instrumented failure mode: disk/RAM limits in the container turn 'did the agent plan its compute budget' into a deterministic check. Also a warning that inspecting a huge raw file is itself a trap worth planting in a world.
