id: S106
rq: RQ1
claim: >
  MLE-bench agents systematically failed at resource budgeting: they issued commands that exhausted the container's disk or RAM and got their process killed, ending the run early, and they rarely reasoned about how long their training code would take. One scaffold (MLAB) repeatedly read files thousands of lines long and filled its own context window.
url: https://arxiv.org/html/2410.07095v6
quote: 'All three agents failed to effectively factor in compute and time limitations to their strategies.'
