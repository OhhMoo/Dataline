notes: >
  ORDER-DEPENDENT TYPING IS A DETERMINISM HAZARD AS WELL AS A TASK MECHANISM: a world generator
  that produces landing files in a nondeterministic row order would make the resulting dtype
  nondeterministic too, which would break the bit-reproducible reset gate. Worth a note in the
  flat-file world builder regardless of whether a task uses it. NOT re-fetched by T3.
