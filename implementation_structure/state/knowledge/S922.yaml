claim: >
  Per-chunk dtype inference in a CSV reader is order-dependent, so the same column can be typed
  differently depending on which value appears first, yielding a column whose distinct values mix
  strings and integers.
url: https://github.com/pandas-dev/pandas/issues/13746
quote: >
  the column that contains '1' and 1 is inferred as string; one that contains 1 and '1' is inferred as numeric.
