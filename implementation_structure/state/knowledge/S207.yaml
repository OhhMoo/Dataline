claim: >
  A team's headline KPI reported 0.0% for three months because all seven measurement runs (40 questions each, 280 consecutive API calls) failed against a retired model that returned 404 and each failure was silently recorded as a negative observation; the aggregation divided by questions asked rather than questions answered, so total failure rendered as a clean 0.0%. It survived undetected because 0% was exactly what the team's strategy predicted.
