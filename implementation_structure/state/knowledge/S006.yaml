notes: >
  The compounding step is what makes this hard to unwind: the failure leaves half-written output
  and the scheduler's next run silently consumes it, so the responder must reason about state
  left behind by a crash, not just re-run. The same source describes a Kafka consumer group that
  auto-scaled during a product launch but hit an untested DB connection-pool limit, stalled, and
  let unprocessed events age out of retention - auto-scaling covers compute, not pools, disk, or
  downstream rate limits. Both are parameterizable by input volume.
