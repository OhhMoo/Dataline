claim: >
  Load-spike and backpressure failures were 24% of the 50 surveyed postmortems. A batch ETL job
  that had run fine for two years failed on Black Friday when the source emitted files 40x larger
  than usual: it ran for 18 hours, exhausted temporary storage, failed without cleaning up its
  partial outputs, and the next scheduled run then started on top of that corrupted partial data.
