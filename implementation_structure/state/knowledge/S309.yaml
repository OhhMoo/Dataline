notes: >
  Verdict: COPY-PATTERN — this is the "updated judge / prompt-optimized rubrics" lead from the
  meeting, confirmed. The recipe to copy: (1) harvest real trajectories, (2) hand-label rubric
  item outcomes, (3) GEPA-optimize the judge prompt against those labels, (4) report judge
  accuracy on a held-out split with explicit FP/FN tradeoffs. Gives us a defensible way to
  sell "calibrated judges" to frontier labs rather than vibes-based rubric grading.
