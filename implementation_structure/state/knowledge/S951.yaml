id: S951
claim: >
  fakesnow's HTTP server implements Snowflake's CONNECTOR WIRE PROTOCOL, not the public SQL REST
  API, and the two are different surfaces. Probed 2026-09-13: routes served are
  /session/v1/login-request, /session, /queries/v1/query-request, /queries/v1/abort-request and
  /monitoring/queries/{sfqid}. The real snowflake-connector-python driver connects over HTTP with
  only host/port/protocol overridden and round-trips CREATE DATABASE, CREATE SCHEMA, CREATE TABLE
  and SELECT. The documented public REST endpoint /api/v2/statements returns HTTP 404 - it is not
  implemented. Separately, current_version() returns the string '0.0.0', where real Snowflake
  returns a real version, so a single query distinguishes the emulator from the product.
