notes: >
  FIRSTHAND MEASUREMENT. Ran fakesnow.server:app under uvicorn in a clean python:3.11-slim
  container, enumerated the Starlette routes, drove it with the genuine
  snowflake-connector-python driver, and separately POSTed to /api/v2/statements.
  Result: connector protocol returned (42, '0.0.0'); /api/v2/statements returned 404.

  WHY IT MATTERS - three distinct consequences:

  1. T254 claimed replication_ease: easy for the /api/v2/statements surface with no probe, and
     G5 failed it. The claim is wrong: that surface does not exist in fakesnow and would have to
     be BUILT. Anything speaking the DOCUMENTED REST API - curl, a light HTTP client, some BI
     and orchestration integrations - gets a 404 rather than an answer. T2 drew the
     surface distinction correctly in its own records; only the ease rating was wrong, and it
     looks inherited from fakesnow working through the driver.

  2. T253 (connector protocol) is confirmed working and was upgraded medium -> easy. This is the
     load-bearing good news: agents and dbt reach Snowflake through the driver, which is exactly
     the path that works.

  3. current_version() = '0.0.0' is a ONE-QUERY sandbox tell, and a concrete instance of the
     detectability question T2 argues in its report section 8 is over-weighted. This does not
     settle that argument - T2's position may well be right that detectability matters less than
     it feels - but it moves it from speculation to a specific, cheap, checkable string. If we
     ever decide detectability matters, this is the first thing to patch, and it is a one-line fix.

  The quoted span is the project's own description of itself; the routing and version findings
  are mine, attested by the method above rather than by the URL.
