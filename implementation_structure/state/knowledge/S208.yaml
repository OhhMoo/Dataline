claim: >
  The same team reported a three-week traffic decline that did not exist: roughly 28% of finalized days in the upstream analytics source came back near zero, so any fixed-length window summed a varying number of near-empty days, and the comparison window happened to hold five valid days against the current window's seven. Measured per valid day the metric had doubled while the totals fell; both statements were true.
