id: S022
rq: RQ1
claim: >
  Airbyte OSS bug report: a Salesforce Opportunity stream syncing Incremental + Deduped into
  Snowflake lost rows after the Salesforce team added a column, with the connection set to
  "Propagate field changes only". Row count in the destination dropped below the source, the
  supposedly append-only airbyte_internal raw table also shrank, and the created-date distribution
  of surviving rows collapsed so that almost everything appeared to be created in one month. A
  from-scratch re-sync into a separate destination table returned the correct counts.
url: https://github.com/airbytehq/airbyte/issues/77627
quote: "the row count in the destination table in Snowflake is lower than expected"
