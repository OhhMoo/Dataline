notes: >
  Unusually complete as a rebuildable scenario: named connector and version (source-salesforce
  2.7.16), named destination, named sync mode, the exact schema-change trigger, and two
  independent symptoms (row count and a distorted createddate distribution) plus the control
  experiment that isolates it. The distribution check is the detection method that actually
  worked, which is a good grading signal - a count alone would not have localised it. Note also
  that it was data-quality monitors detecting a sudden count decrease that raised the alarm,
  one of the few cases in my sample where monitoring, not a human, caught the problem.
