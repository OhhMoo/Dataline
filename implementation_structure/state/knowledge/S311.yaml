id: S311
rq: RQ7
claim: >
  For agentic RL the harness must guarantee token-in-token-out (TITO): re-tokenizing the
  inference engine's text output when feeding the trainer silently misaligns what the model
  generated with what the trainer sees, making training off-policy; Mercor solved it by using
  the /completions endpoint with raw token IDs instead of /chat/completions.
