notes: >
  Verdict: COPY-PATTERN (RL plumbing requirement). If our substrate sells RL rollouts to
  frontier labs, TITO compliance is a hard requirement, not a nicety — a harness that returns
  strings instead of token IDs produces subtly off-policy training data. Our agent-loop API
  should expose raw token IDs (or document that a proxy-based translation layer is needed).
