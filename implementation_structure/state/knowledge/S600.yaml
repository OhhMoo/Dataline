id: S600
rq: RQ1
claim: >
  Two dbt jobs building the same incremental model concurrently race on the schema-evolution
  step: both read the target's column list, both emit the same ALTER TABLE, and the slower
  executor dies on a compilation error - there is no atomic check-then-alter in the adapter.
url: https://github.com/dbt-labs/dbt-adapters/issues/710
quote: "When running an incremental table with the on_schema_change policy set to append_new_columns, a race condition can occur. If two jobs perform the column check at the same time, the same ALTER TABLE statement will be generated, resulting in a SQL compilation error on the slower executor"
