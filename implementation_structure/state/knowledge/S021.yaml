notes: >
  The causal chain is the interesting part: a silent, undocumented tool behaviour (a command that
  hangs instead of erroring) led directly to an operator acting on the wrong host. Data loss was
  quantified in business terms - roughly 5,000 projects, 5,000 comments and 700 user accounts
  between 17:20 and 00:00 UTC. Destructive-action-under-ambiguity is a hazard worth building for:
  the environment can present two near-identical hosts and let a wrong move be genuinely costly.
