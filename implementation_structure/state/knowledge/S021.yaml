id: S021
rq: RQ1
claim: >
  In the same GitLab incident, the triggering action was a repair gone wrong: pg_basebackup was
  hanging with no output (normal behaviour while waiting for the primary, but undocumented in
  their runbooks or upstream docs), so an engineer wiped the PostgreSQL data directory believing
  he was on the secondary. He was on the primary. He aborted a second or two later, by which time
  about 300 GB had been removed, and six hours of production data was permanently lost.
