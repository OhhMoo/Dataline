id: S607
rq: RQ1
claim: >
  In Airflow 3.3.1 a stale executor SUCCESS event from a deferrable task's defer-exit can be
  drained after the resumed attempt is already RUNNING; because both attempts share one
  TaskInstanceKey and try_number does not increment on resume, the scheduler logs a state
  mismatch and fails a task whose work in fact completed, and the run history is the only
  place the true ordering is visible.
url: https://github.com/apache/airflow/issues/72716
quote: "Not deterministically reproducible: anything that makes the scheduler slower to drain the event buffer widens the window."
