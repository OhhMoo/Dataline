id: S017
rq: RQ1
claim: >
  Written-up production incident: application servers began throwing "No space left on device"
  for the WAL directory and the database froze. Adding disk did not help because the replication
  slot still would not advance; the slot was held open by a stuck Debezium connector whose
  downstream had choked. The escape hatch - dropping the replication slot - unblocks the database
  but destroys CDC continuity and forces a fresh full snapshot taking hours or days.
