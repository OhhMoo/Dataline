notes: >
  First-person narrative on a course-style site; identity of the author is not stated, so medium
  confidence. Value is in the decision structure rather than the prose: the responder faces a
  forced trade between database availability and pipeline continuity, with no option that is
  cheap. Also captures the misdiagnosis path - VACUUM FULL and REINDEX attempted on the
  assumption it was bloat before anyone looked at slot metrics. Corroborates S016 mechanism from
  an independent source.
