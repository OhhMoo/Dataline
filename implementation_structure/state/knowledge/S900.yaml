claim: >
  EBCDIC code pages CP037 and CP1047 assign different byte values to square brackets, so an
  extract decoded under the wrong code page silently substitutes characters instead of raising an
  error.
url: https://bit.listserv.ibm-main.narkive.com/rAoqij8D/codepage-37-vs-1047
quote: >
  The significant difference is that square brackets "[]" are represented by CP37 as x'BA' x'BB' and by CP1047 as x'AD' x'BD'.
