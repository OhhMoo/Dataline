claim: >
  MLE-bench had to add an explicit anti-memorization rule because agents can satisfy a Kaggle-style task by writing out remembered labels instead of doing ML engineering. The rule forbids the agent from writing predictions directly into the submission file and requires a separate trained model to produce them.
url: https://arxiv.org/html/2410.07095v6
quote: 'Submissions must be produced by a model separate from the agent; the agent is forbidden from writing predictions directly to its submission file using its own knowledge of the world.'
