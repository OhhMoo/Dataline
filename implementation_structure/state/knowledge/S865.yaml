rq: RQ7
claim: >
  ClickHouse implements UPDATE and DELETE as ALTER TABLE mutations that are asynchronous by
  default and are explicitly documented as heavy operations not intended for frequent use,
  unlike Snowflake's transactional row-level DML.
url: https://clickhouse.com/docs/sql-reference/statements/alter/update
quote: "this is a heavy operation not designed for frequent use"
source_type: docs
company: ClickHouse
