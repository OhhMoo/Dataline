notes: >
  Core evidence against the ClickHouse-wrapping hypothesis. dbt incremental models, MERGE-based
  upserts and every 'the backfill overwrote yesterday' archetype depend on synchronous
  transactional row-level DML. On ClickHouse that becomes an async mutation whose visibility
  timing is a background-merge detail - a silent-divergence generator sitting inside the exact
  mechanism our tasks are about. The same page states the synchronicity is governed by the
  mutations_sync setting and that by default it is asynchronous.
