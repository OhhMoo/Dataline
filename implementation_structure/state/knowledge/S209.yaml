notes: >
  First-party process documentation, not opinion. Gives both the hazard (incremental model silently wrong after a schema change) and the expected remediation trajectory (dbt list to enumerate blast radius, MINUS comparison against prod, stakeholder and SME review). A grader can check whether the agent enumerated the downstream set before changing anything.
