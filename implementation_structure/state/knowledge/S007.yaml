notes: >
  The same source describes the sibling poison-pill case: one malformed record sent a parser into
  an infinite loop, the consumer thread hung, the partition rebalanced onto a new consumer which
  also hung, and the entire consumer group went offline within minutes, degrading unrelated
  pipelines sharing the Kafka cluster. Both force the responder to reason about a blast radius
  that appears nowhere in the failing pipeline's own code or DAG.
