id: S007
rq: RQ1
claim: >
  Cascade failures through invisible shared state were 14% of the 50 surveyed postmortems and the
  most catastrophic class. Example: a schema migration for one batch job held a lock on a shared
  metadata table for 90 seconds, and every other job touching that table failed or timed out,
  turning a single-team change into a company-wide incident.
