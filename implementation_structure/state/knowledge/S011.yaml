claim: >
  At Airbnb, diagnosing why a dataset missed its landing SLA required reasoning over dependency
  trees of hundreds of entities spanning pipelines owned by different teams. Their SLA Tracker
  reduced one real lineage from 82 datasets to an 8-dataset bottleneck path - the chain of
  latest-landing ancestors that actually blocked the child transformation from starting.
