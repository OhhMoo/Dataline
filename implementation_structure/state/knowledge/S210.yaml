id: S210
rq: RQ1
claim: >
  Auditing a refactored model against the original is described as a major part of analytics engineers' daily work, and the audit_helper package exists because ensuring values match used to require manual coding plus naive aggregate checks (row counts, column sums) that hide real differences. In practice mismatches cluster on inconsistent join keys producing unexpected NULLs, and on date columns whose time zone differs between legacy and refactored versions.
url: https://docs.getdbt.com/blog/audit-helper-for-migration
quote: "it is common that some keys used to join models are inconsistent, bringing up unwanted null values on the final model as a result"
source_type: blog
author_role: analytics engineer at a consultancy
company: Indicium Tech
year: 2023
retrieved: "2026-09-11"
confidence: high
produced_by: L3-practitioner-workflow-analytics
notes: >
  Names the exact failure categories a comparison must surface: perfect match, both null, values do not match, null in A only, null in B only, missing from A, missing from B. That is a ready-made rubric axis. Also confirms that matching row counts is an insufficient check - a trap worth building into a task.
