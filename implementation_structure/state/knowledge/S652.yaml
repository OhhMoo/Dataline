notes: >
  Liveness checked 2026-09-13 via GitHub REST API: state=open, opened 2026-05-17, 1 comment.
  vividness is medium because the chosen verbatim span is a bare behaviour statement; the
  rebuildable detail sits in the attached YAML in the same body, which shows three sibling
  relationships tests on fk_insertion_order, fk_line_item and fk_adgroup where exactly one
  to: ref(...) target does not exist, annotated by the reporter as THIS AND ONLY THIS ref is
