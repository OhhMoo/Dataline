  A practitioner triage guide for 'the numbers are wrong' reports argues that wrong almost always means a mismatch between expectation and reality, and sorts real incidents into three buckets: the data is confusing but correct (business logic hidden behind the reporting layer, or freshness lag), the stakeholder is checking against a faulty second source, or the data really is wrong.
