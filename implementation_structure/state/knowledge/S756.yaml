notes: >
  Mechanism ground for A003's "the quality gate is the bug" after F450 stripped S005 - the
  unauditable "12 percent of legitimate transactions filtered over three weeks" vendor anecdote -
  down to world_texture. What survives is a specified, rebuildable way for a validation predicate to
  remove valid rows silently while passing every schema check. What does NOT survive is any number:
  the 12 percent, the three weeks, and "this is common" are all unevidenced, and A003 now carries
  the loss magnitude as an explicit world parameter rather than as a finding.
  Quote verified verbatim 2026-09-13 with gate-identical fetch logic.
