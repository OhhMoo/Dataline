id: S756
rq: RQ1
claim: >
  PostgreSQL documents the three-valued-logic behaviour that makes an exclusion filter silently drop
  legitimate rows: an ordinary comparison against NULL yields NULL rather than true or false, so a
  WHERE predicate written to exclude bad values also excludes every row whose value is unknown, and
  a query filter treats that UNKNOWN as false. The documented remedy is IS DISTINCT FROM, which
  treats null as a comparable value - returning false when both inputs are null and true when only
  one is.
url: https://www.postgresql.org/docs/17/functions-comparison.html
quote: "However, if both inputs are null it returns false, and if only one input is null it returns true."
source_type: docs
