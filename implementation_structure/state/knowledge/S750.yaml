claim: >
  Zalando's own account of running PostgreSQL logical replication at scale names uncontrolled WAL
  growth on LOW-activity databases as their single biggest operational problem - the failure mode
  survives even with Debezium's heartbeat configured, because the slot's confirmed_flush_lsn only
  advances when the connector commits an offset, and a database whose captured tables are quiet
  gives it nothing to commit. The post also records the earlier, cruder form of the same problem:
  replication slots that would not advance without table activity, piling up WAL until the disk
  ran out. They ran their fix in production on Debezium 2.7.4 pinned to pgjdbc 42.7.2 for nearly
  two years before a later upstream change hard-coded the keepalive flush off and blocked the
  upgrade path.
