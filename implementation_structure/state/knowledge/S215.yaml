claim: >
  A data leader describes BI instances degrading into dashboard bloat, where time is wasted hunting for the right visual or recreating ones that already exist, and prescribes an automated deprecation pipeline: pull all dashboards, looks and users through the BI tool's SDK, join them against usage and history metadata (i__looker for Looker, audit logs for Power BI), model one row per visual with creator and last-viewed date, and delete what has not been used. The trigger anecdote is finding a dashboard refreshing every 15 minutes that nobody uses.
url: https://towardsdatascience.com/why-and-how-to-deprecate-dashboards-357a68f041ba/
quote: "updating every 15 minutes isn't actually used, sure, it can be deleted once"
