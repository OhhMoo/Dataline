notes: >
  Liveness checked 2026-09-13 via GitHub REST API: state=open, opened 2026-06-10, 3 comments.
  Also verbatim in the same body: Job runtime goes from minutes to hours; we cancel before
  completion. And: Offline comparison of defer baseline vs current-run manifest shows 0 model
  checksum diffs, 0 seed checksum diffs, and 0 new nodes. Two things matter here. First, the
  selector the agent would reach for to narrow a large project can lie to it. Second, the
  reporter found the truth by diffing two manifests offline, which is exactly the good search
  strategy a scale archetype should reward.
