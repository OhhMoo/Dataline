notes: >
  Verdict: COPY-PATTERN. Two mechanisms worth copying into our deterministic grading layer:
  (1) declarative reference-table comparison with include/exclude columns and alternate valid
  solutions (multiple correct answers are a first-class concept); (2) the sage/oracle agent as
  a CI gate for task quality — every task must pass under its own solution.sh before it enters
  the corpus. Harbor's oracle agent gives the same answer-key check if we adopt Harbor.
