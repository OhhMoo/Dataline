claim: >
  ade-bench auto-generates deterministic graders: declaring solution_seeds tables in task.yaml
  makes the harness seed reference tables and auto-create dbt existence and row-equality tests
  (AUTO_*), and its "sage" agent simply runs solution.sh as an answer key so tasks failing
  under sage are misconfigured tasks, not model failures.
