id: S113
rq: RQ1
claim: >
  External validation of the Epic Sepsis Model - a proprietary model deployed at hundreds of US hospitals - on 38,455 hospitalizations found an AUC of 0.63, substantially worse than its developer reported. It missed 67 percent of septic patients while firing alerts on 18 percent of all hospitalizations, producing large alert fatigue, and added little over existing clinical practice.
