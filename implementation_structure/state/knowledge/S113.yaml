notes: >
  The canonical offline-vs-deployed metric gap with a named model, cohort size and two numbers. A rebuildable task: given a vendor-reported metric and a local cohort, reproduce the external validation and discover the discrepancy. The second-order failure (alert fatigue) is an operating-point problem, not a model-quality problem - a distinct judge axis.
