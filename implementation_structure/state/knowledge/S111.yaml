id: S111
rq: RQ1
claim: >
  A systematic survey of ML-based science found data leakage to be pervasive rather than occasional: 17 fields with documented errors affecting 329 papers, and a taxonomy of 8 distinct leakage mechanisms. In the authors' own reproduction of civil-war prediction, every paper claiming complex ML beat logistic regression failed to reproduce once leakage was corrected, and the complex models were then no better than decades-old logistic regression.
url: https://arxiv.org/abs/2207.07048
quote: 'we find 17 fields where errors have been found, collectively affecting 329 papers and in some cases leading to wildly overoptimistic conclusions'
