notes: >
  Leakage is the highest-frequency, highest-impact DS failure with a real corpus behind it. Crucially the leakage is invisible from the artifact - none of the errors could be caught by reading the papers. That is exactly a task where a trajectory-blind grader must check PIPELINE state (was imputation fit on train only? is feature X a post-outcome proxy?) rather than the reported metric.
