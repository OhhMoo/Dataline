notes: >
  Field notes rather than a first-person incident, and the page ends in a sales CTA - discount
  accordingly. Kept because both mechanisms are precisely specified and checkable, and because the
  false-green freshness case is the only evidence I found of a data-quality check that actively
  misleads triage: freshness runs first, passes, and the real failure then appears downstream as a
  cryptic warehouse error (column not found, invalid cast) with the freshness gate green. Same
  page notes --full-refresh committed into a CI env var repeatedly dropping production tables, and
  credential rotation mid-run surfacing as a model Compilation Error rather than an auth error.
