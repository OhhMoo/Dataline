id: S023
rq: RQ1
claim: >
  Consultancy field notes on dbt-core in production describe five recurring failure patterns,
  including: changing a model from materialized table to incremental without a full refresh, where
  dbt does not detect the materialisation change, treats the existing relation as the incremental
  base and appends to it, leaving pre-existing historical rows under the old schema alongside new
  rows under the new one; and source freshness tests returning false-green after a source table is
  dropped and recreated with a different schema, because the check only inspects loaded_at.
url: https://perun.au/insights/dbt-core-production
quote: "dbt does not detect the materialisation change on the next run"
