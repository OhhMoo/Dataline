notes: >
  Verdict: CANNOT-USE for our core need (hermetic Snowflake emulation); pattern only. The
  fakesnow-vs-universql tradeoff resolves clearly: universql requires a live Snowflake account
  and Iceberg tables, which defeats cost-free parallel sandboxing; fakesnow is fully local but
  dialect-liberal. Notably universql itself builds on SQLGlot + fakesnow for query
  translation, corroborating fakesnow as the more foundational piece. Also pre-verified as
  less actively maintained (last push 2025-10).
