claim: >
  universql is a Snowflake proxy that executes queries locally on DuckDB over Iceberg/Polaris
  tables while relying on a real Snowflake account for catalog and access control — it cannot
  query native Snowflake tables locally at all, so it is a hybrid-execution tool, not a
  self-contained Snowflake emulator.
