notes: >
  Extremely rebuildable - the issue includes exact repro steps: build with columns id, name,
  status, then change the model to id, new_column, name, status and observe values intended for
  name landing in new_column. Affects append, insert_overwrite and replace_where strategies.
  Corroborated by S014 (independent filer, different config, same positional-matching root cause).
  This is the class of failure where dbt run and dbt test both go green and the data is wrong.
