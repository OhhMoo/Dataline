notes: >
  CLOSED AND FIXED - not a live trap. Re-verified via the GitHub API 2026-09-13: state=closed,
  ZERO comments, no labels, no assignee, never confirmed by a maintainer. The body is a code-reading
  analysis (it cites macro file paths and line numbers and proposes INSERT BY NAME), not an observed
  failure: the System information section is placeholders (dbt version 'Multiple versions affected',
  OS 'All platforms', Python 'All Python versions') and Steps To Reproduce is a written recipe with
  no output, no logs and no screenshots. The steps exist as text; the observation does not.
  The recipe itself is still rebuildable: build with columns id, name,
  status, then change the model to id, new_column, name, status and observe values intended for
  name landing in new_column. Affects append, insert_overwrite and replace_where strategies.
  S014 is a separate filing of the same root cause under a different config - that makes the defect
  reachable from at least two configurations, NOT frequent (F455). S013 must not be counted as a
  second independent OBSERVATION; S014 is the only one of the pair that observed anything.
  This is the class of failure where dbt run and dbt test both go green and the data is wrong.
