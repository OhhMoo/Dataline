id: S013
rq: RQ1
claim: >
  Filed dbt-databricks bug: with an incremental model configured on_schema_change sync_all_columns,
  dbt adds the new column to the target table but the subsequent INSERT uses SELECT * with no
  explicit column list, so matching is positional. Adding a column anywhere other than the end of
  the model's select list writes every value into the wrong column - silent data corruption in a
  table that dbt reports as having built successfully.
url: https://github.com/databricks/dbt-databricks/issues/1211
quote: "subsequent INSERT statements use SELECT * without explicit column specifications"
