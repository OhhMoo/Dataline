notes: >
  Liveness checked 2026-09-13 via GitHub REST API: state=open, opened 2025-05-07, 7 comments.
  The reproduction in the body sets memory_limit = 1GB and threads = 4, joins arrivals to
  stopdata on arrivals.stopPointRef = stopdata.stop_id or arrivals.stopPointRef =
  stopdata.quay_id, and contrasts it with the union of two separate hash joins, verbatim
  annotated: very fast query - 1 row returned in 144ms - 2 hash joins, then union. The
  reporter also notes, verbatim, that the correct result is produced. This is the cleanest
  available evidence for a performance cliff where the obvious formulation is correct and
  unusable and a strategy change, not more hardware, is the fix. The reporter also flags the
  either-key semantics explicitly: I can use a union all here because I know that no stop_id
  equals quay_id, which is exactly the grain trap to conjoin with the cliff.
