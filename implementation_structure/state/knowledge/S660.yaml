claim: In DuckDB 1.2.2 an inner join whose ON clause matches either of two keys with OR is planned as BLOCKWISE_NL_JOIN and takes 1m 42s on roughly 20MB of parquet, while the semantically equivalent two hash joins plus a union return in 144ms, a gap of nearly three orders of magnitude.
