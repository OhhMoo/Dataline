id: S705
rq: RQ1
claim: >
  A dbt Community Forum thread shows a practitioner discovering that unique_key on an incremental
  model is not a uniqueness constraint: with unique_key set to a three-column list, dbt loaded
  multiple rows sharing the same key without raising an error. The replies clarify that
  unique_key exists to decide which existing target rows to replace, not to reject duplicate
  source rows, and that de-duplication must happen before the insert.
url: https://discourse.getdbt.com/t/incremental-model-unique-constraint-still-allows-duplicates/17298
