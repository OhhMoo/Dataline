notes: >
  The same page describes the untouchable table - a mart that stopped being a function of its
  inputs after years of manual UPDATEs and a column named like flag_v2_final_USE_THIS, set by a
  query living in the home directory of an engineer who left in 2023, so recomputing from scratch
  does not reproduce it. That is a strong pre-existing-brokenness initial condition: it punishes
  the naive "just full-refresh it" move, which is exactly the move a model will reach for.
