notes: >
  Value is the decision structure, not the prose: the responder faces a forced trade between
  database availability and pipeline continuity with no cheap option, and the page also walks the
  misdiagnosis path (VACUUM FULL and REINDEX tried on a bloat assumption before anyone looked at
  slot metrics). That is good world texture for a runbook or a colleague's bad advice inside a
  generated world.
  THE INDEPENDENT-CORROBORATION CLAIM IS STRUCK. This record previously asserted it "Corroborates
  S016 mechanism from an independent source". It does not: a tutorial restating standard PostgreSQL
  WAL and replication-slot behaviour is a retelling of the documentation, and S016 is itself vendor
  content (RisingWave Labs). Two retellings of one manual are not two observations.
