id: S017
rq: RQ1
claim: >
  A course exercise on a learning platform narrates, as a teaching device, the shape of a
  replication-slot incident: application servers throwing "No space left on device" for the WAL
  directory and the database freezing; adding disk not helping because the slot's restart_lsn still
  will not advance; the slot held open by a stuck Debezium connector whose downstream has choked.
  The page then enumerates the responder's options and names dropping the replication slot as the
  "nuclear option" - it unblocks the database but destroys CDC continuity and forces a fresh full
  snapshot taking hours or days. NOT AN ATTESTED INCIDENT: there is no named author, no company, no
  date and no postmortem, and the page is numbered "Topic 332 of 367" inside a message-queues
  course. The decision structure is the usable content; the narration is not evidence.
