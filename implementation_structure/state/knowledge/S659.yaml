notes: >
  Liveness checked 2026-09-13 via GitHub REST API: state=open, opened 2026-01-31, 2 comments.
  The body names the code path: SingleFileCheckpointReader LoadFromStorage in
  src/storage/checkpoint_manager.cpp. Used here as a budget constraint rather than as a trap:
  it establishes that catalog load in DuckDB is linear in table count, so a 500 to 600 table
  world sits at roughly 0.2 percent of the reported pathological case and catalog load is NOT
  the thing that will blow the 2GB ceiling. What will is the query plan, which is S660.
