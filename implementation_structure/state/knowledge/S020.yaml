notes: >
  Gold-standard first-party postmortem with a full timeline and a five-whys section. Three
  independent silent failures stack here: a version mismatch, a missing data directory that
  changes which binary is selected, and an alerting channel that was itself broken. The
  "verify the recovery path actually works" task is completely unrepresented in anything else I
  found, and this is the best evidence that it is real work. Pairs with S021 (same incident).
