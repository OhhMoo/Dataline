claim: >
  A vendor's uncited synthesis of what it says were 50 public data-pipeline postmortems. THE
  PERCENTAGES ARE STRUCK (F450): the piece names none of its 50 cases, so its splits are
  unfalsifiable and may not be cited. What survives is the shape of one unattributable case: a warehouse loaded corrupted records for eleven days:
  the source API added a field, the JSON parser treated it as an unexpected key and silently
  dropped whole record batches, and no alert fired because the pipeline never crashed - it simply
  produced fewer rows than expected, within normal variance.
