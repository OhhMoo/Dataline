notes: >
  Secondary synthesis, not a first-hand postmortem, and the author sells a data-integration
  product - discount the framing, keep the frequency signal. The 38% figure is the most useful
  number I found for weighting archetype coverage. Corroborated by S010 (column rename), S022
  (Airbyte schema change), S013-S015 (dbt on_schema_change) and S019 (33% of data-related issues
  are incorrect data types). Note the detection mechanism: a shortfall small enough to hide inside
  normal variance until it is not - the world must tune that magnitude deliberately.
