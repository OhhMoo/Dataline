id: S115
rq: RQ1
claim: >
  Google's published ML engineering rules single out a specific, silent training/serving skew mechanism: joining a feature table by key at both training and serving time, where the table's contents mutate between those two moments, so the same entity gets different predictions offline and online. The recommended mitigations are logging features at serving time and snapshotting slow-changing tables hourly or daily.
url: https://developers.google.com/machine-learning/guides/rules-of-ml
quote: 'Beware that if you join data from a table at training and serving time, the data in the table may change.'
source_type: docs
