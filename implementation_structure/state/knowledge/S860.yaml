notes: >
  The delete-plus-insert representation is exactly what DuckLake's table_changes() emits as
  update_preimage/update_postimage, which is why Streams are a view rewrite rather than a
  rebuild on a DuckDB backend - verified on the DuckLake side by hand on 2026-09-13, see S866.
  The other half of stream semantics, the offset advancing only when the stream is consumed
  inside a DML transaction, is state we would have to keep ourselves.
