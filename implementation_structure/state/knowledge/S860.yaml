id: S860
rq: RQ4
claim: >
  A Snowflake stream exposes changes as the source table's own columns plus METADATA$ACTION,
  METADATA$ISUPDATE and METADATA$ROW_ID, and represents an UPDATE as a paired DELETE and INSERT.
url: https://docs.snowflake.com/en/user-guide/streams-intro.md
quote: "Indicates whether the operation was part of an UPDATE statement."
source_type: docs
company: Snowflake
