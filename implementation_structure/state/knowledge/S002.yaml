confidence: high
produced_by: L1-practitioner-workflow-de
notes: >
  This is semantic drift, not schema drift - the pipeline's own validation has nothing to catch.
  Corroborated as a distinct category by the 50-postmortem survey (S004 source), which names
  semantic drift separately from additive and type drift. Rebuildable: shift a source timestamp
  column by a fixed offset partway through history and leave the schema identical.
