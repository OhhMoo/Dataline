id: S706
rq: RQ1
claim: >
  A practitioner-facing article on Kafka's auto.offset.reset configuration states that resetting a
  consumer to the earliest offset on a topic with a large backlog means reprocessing that whole
  backlog, and that the surrounding system must therefore be idempotent because duplicate delivery
  is the expected outcome. This is the mechanism behind the repair-induces-defect shape in stream
  ingestion: rewinding a stalled consumer is the correct remedy for the stall and simultaneously
  the trigger for every non-idempotent sink downstream of it.
url: https://quix.io/docs/blog/2024/02/26/kafka-auto-offset-reset-use-cases-and-pitfalls.html
quote: "Reprocessing huge volumes of data can increase operational costs and strain system resources, leading to performance degradation, higher latency, instability and potential bottlenecks in data pipelines."
source_type: blog
