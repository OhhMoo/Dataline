notes: >
  A tutorial, not an incident report. Nobody is claiming this happened to them, so attestation is
  unattested and frequency is off the table. A second verbatim span from the same page states the
  idempotency requirement directly, "ensuring your ecosystem handles duplicate messages gracefully
  (i.e., idempotent processing) is critical", and is the half A063 actually leans on; contiguity
  with the quoted sentence was not confirmed so it is recorded here rather than in the quote
  field. This is a vendor's engineering blog. I judged it educational rather than
  vendor_marketing, but a reviewer may reasonably downgrade it to world_texture only.
