notes: >
  Low confidence individually, but it is the demand-side counterpart to S209 and S217: a rename that is trivial in the warehouse has an unbounded, unknown blast radius in the BI layer, including artifacts the data team does not own. That asymmetry - cheap upstream change, expensive and invisible downstream breakage - is the core of the BI-breakage hypothesis.
