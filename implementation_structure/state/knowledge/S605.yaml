claim: >
  dbt-redshift's view materialization swaps a view inside BEGIN/COMMIT, but on Redshift the
  ALTER ... RENAME takes effect for other sessions before the wrapping transaction commits,
  so a concurrent reader mid-swap gets relation does not exist or could not open relation
  with OID - a BI or test process reading a model that is being rebuilt sees torn state.
