notes: >
  Highest-density single list of concrete, reproducible orchestration failure modes I found, and
  framed explicitly as "the classics" - i.e. high-frequency across many customers, not one war
  story. Every item is directly instantiable: a DAG with a non-static start_date, a local-timezone
  schedule crossing a DST boundary, a sensor pool exhaustion, a 200-task hand-wired graph. The
  DST item pairs with S002 as a second, independent route to data that is wrong by a few hours.
