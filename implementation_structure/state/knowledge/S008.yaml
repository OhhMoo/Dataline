id: S008
rq: RQ1
claim: >
  An Airflow Summit 2025 talk by two Astronomer field engineers catalogues the recurring
  production Airflow failures they see across customers: datetime.now() in a DAG definition
  (which makes backfills implode), scheduling in local timezones producing daylight-savings
  incidents, unbounded retries creating immortal tasks, sensors causing resource starvation,
  dynamic task mapping expanding to 10,000 mapped tasks, XComs used to pass a whole Pandas
  DataFrame, hand-wired 200-task DAGs nobody will open, and SLAs repurposed as data-quality
  guarantees producing alerts so noisy nobody reads them.
url: https://airflowsummit.org/sessions/2025/lessons-from-airflow-gone-wrong/
