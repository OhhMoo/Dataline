  MLE-bench's task selection is gated on REPLICABILITY of grading, not on task interest: competitions were dropped whenever the team could not reimplement the scoring function locally or could not reconstruct a defensible train/test split from public data. Selection started from 5673 completed Kaggle competitions, narrowed to 586 manually screened, and finished at 75.
