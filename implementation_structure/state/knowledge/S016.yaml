notes: >
  Vendor blog, so treat the product framing sceptically, but the mechanism and the arithmetic are
  standard and checkable, and the page gives the exact diagnostic query (pg_replication_slots with
  pg_wal_lsn_diff to compute wal_retained). This is the rare data-engineering failure where the
  pipeline outage takes the source OLTP database down with it - the blast radius reaches
  production application writes, which raises the stakes of the triage decision.
