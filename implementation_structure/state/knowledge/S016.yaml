rq: RQ1
claim: >
  A stalled CDC consumer is one of the most common causes of production incidents in CDC-heavy
  systems: PostgreSQL cannot recycle WAL segments older than a replication slot's restart_lsn, so
  if the Debezium connector goes down the slot stays open and WAL accumulates at the database's
  write rate. A system generating 1 GB/hour of WAL with a connector down for 24 hours retains
  24 GB; on a 50 GB disk the database fills up and stops accepting writes.
