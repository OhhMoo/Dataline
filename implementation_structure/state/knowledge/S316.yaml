claim: >
  fakesnow emulates Snowflake over DuckDB either by in-process patching of the Python
  connector or as a standalone HTTP server usable by any language's connector (including JDBC
  and the Snowflake CLI), but its own caveats warn that row ordering is non-deterministic and
  that it accepts a more liberal SQL dialect than real Snowflake.
