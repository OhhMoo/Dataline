notes: >
  Verdict: ADOPT WITH CAVEATS. Apache-2.0 (pre-verified). The HTTP-server mode is the useful
  one for us: agents connect with the real snowflake connector/JDBC against a local fake,
  giving hermetic Snowflake-flavored environments with per-connection isolated databases
  (FAKESNOW_DB_PATH=":isolated:") — ideal for parallel RL rollouts. The caveats matter for
  grading: verifiers must fully specify ORDER BY, and fakesnow passing does not prove
  Snowflake-correctness, so it cannot be the sole fidelity axis (pair with real-Snowflake
  variant like data-eng-bench does). Not implemented: access control, stored procedures.
