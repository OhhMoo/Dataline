claim: >
  A reconciliation guide enumerates the recurring causes of two numbers disagreeing - time zone and window boundaries, differing metric definitions, silently applied filters, join fan-out changing the grain, refunded or soft-deleted rows, currency and cents-versus-dollars, float rounding, late-arriving data, null handling in SUM and COUNT, and row-level security - and prescribes comparing row counts at the same grain before comparing sums, then bisecting by dimension until the gap localizes.
