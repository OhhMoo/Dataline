claim: >
  Across all three agent scaffolds tested on MLE-bench, the dominant failure was not producing a gradeable artifact at all. o1-preview with AIDE produced a valid submission in only 82.8 percent of attempts; GPT-4o with AIDE 54.9 percent; Llama 3.1 405B 27.3 percent. A local submission-validation server was available and agents often simply did not use it.
