notes: >
  The most frequent failure mode in a DS agent benchmark is malformed or missing output, not bad modelling. Argues for rubric points separating 'produced a well-formed artifact' from 'produced a good artifact', and for making a validation tool available in-world so non-use is itself a measurable process signal.
