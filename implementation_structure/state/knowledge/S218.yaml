notes: >
  Vendor-authored, so discount the prescription; the premise is the useful part. A realistic world has the same aggregation implemented twice, once in dbt and once in LookML or Tableau, with the two free to drift. That is the generator recipe for a metric-mismatch task that cannot be solved by reading the warehouse alone.
