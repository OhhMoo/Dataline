claim: >
  Harbor's task format packages each task as a directory (instruction.md, task.toml,
  environment/, optional solution/solve.sh, tests/test.sh) and requires the test script to
  write a reward file (/logs/verifier/reward.txt or reward.json) that the harness reads to
  score the trial.
