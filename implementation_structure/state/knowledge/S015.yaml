notes: >
  The complementary case to S013/S014: adding a column corrupts silently, removing one fails
  loudly but with a cryptic warehouse-level error that does not name dbt's incremental logic as
  the cause. Open since 2022, so it is a live trap rather than a fixed historical curiosity. The
  obvious fix (--full-refresh) is destructive on a large table and interacts with the
  full-refresh hazards in S023.
