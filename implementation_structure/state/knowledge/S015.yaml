id: S015
rq: RQ1
claim: >
  Long-open dbt issue: if you remove a column from an incremental model, dbt leaves the column in
  the target table and then generates an INSERT listing all target-table columns, which fails on
  BigQuery with "Unrecognized name: <deleted_col>". on_schema_change ignore cannot ignore missing
  columns, so the model stops loading entirely until someone full-refreshes or manually alters
  the target relation.
url: https://github.com/dbt-labs/dbt-adapters/issues/601
quote: "The generated sql tries to insert all the columns from the target table."
source_type: repo
