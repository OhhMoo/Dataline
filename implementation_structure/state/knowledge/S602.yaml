claim: >
  The Airflow scheduler's completion sweep runs on a ~30s timer against backfill rows that
  are committed before their DagRun rows exist, so a sweep landing inside that window
  concludes a zero-run backfill is finished; the current fix is an EXISTS guard plus a
  two-minute time heuristic, not an atomic transaction.
