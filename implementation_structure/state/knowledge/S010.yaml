id: S010
rq: RQ1
claim: >
  A pipeline team renamed a warehouse column (amount_txn_ccy to txn_amount) as routine
  housekeeping and notified no downstream consumer. For three days the risk dashboard's query
  returned NULL for every row and a divide-by-zero fallback substituted a garbage value, so the
  failure surfaced as an overnight transaction volume off by a factor of ten - found by the head
  of risk two minutes before a board meeting, not by any alert.
