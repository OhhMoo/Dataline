notes: >
  Textbook symptom-first discovery: a human notices a wrong business number and triage runs
  backwards through lineage to a three-day-old DDL change. Note the amplifier - a defensive
  fallback converted NULLs into a plausible-looking number instead of an error. The same article
  lists sibling breakages on the same table: a new enum value in transaction_type that downstream
  CASE expressions do not handle, a NUMERIC(5,2) to NUMERIC(5,4) precision change, and the daily
  batch load shifting from 06:00 to 08:00 UTC so a 07:00 finance job reads yesterday's data.
  The author is arguing for data contracts / OpenMetadata, so treat the remedy as advocacy.
