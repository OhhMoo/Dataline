notes: >
  What this page supports is that a writer arguing for data contracts finds the scenario plausible,
  and that the defect LIBRARY it sketches is coherent and injectable. What it does NOT support, and
  what earlier versions of this record asserted, is a real bank, a real board meeting, or a real
  three-day detection lag. The two-minutes-before-a-board-meeting detail must not reach any
  archetype as evidence of how such failures are discovered.
  The author is advocating data contracts / OpenMetadata, so treat the remedy as advocacy.
  Note the amplifier the vignette does get right and which is worth building: a defensive fallback
  converting NULLs into a plausible number instead of an error. That property IS attested
  elsewhere in this corpus - S207 (Thicket, firsthand_named) reports a headline KPI rendering a
  clean 0.0% because total upstream failure was coerced to zero. Cite S207 for the mechanism and
  this page for texture only.
