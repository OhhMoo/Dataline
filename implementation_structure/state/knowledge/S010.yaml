id: S010
rq: RQ1
claim: >
  An illustrative scenario in a data-contracts argument describes a column rename breaking a
  downstream dashboard: a pipeline team renames a warehouse column (amount_txn_ccy to txn_amount)
  as routine housekeeping and notifies no downstream consumer; the risk dashboard's query then
  returns NULL for every row for three days and a divide-by-zero fallback substitutes a
  plausible-looking garbage value, so the failure surfaces as a business number off by a factor of
  ten rather than as an error. NOT AN ATTESTED INCIDENT: the article is written in the present
  tense as a constructed vignette - it opens "It's 8:58 AM. The head of risk at a bank opens the
  morning transaction dashboard..." - with no company, no date, no incident record and no claim
  that the author or anyone else lived through it. The same article sketches sibling breakages on
  the same table (a new enum value that downstream CASE expressions do not handle, a NUMERIC(5,2)
  to NUMERIC(5,4) precision change, and a batch load shifting from 06:00 to 08:00 UTC so a 07:00
  finance job reads yesterday's data).
