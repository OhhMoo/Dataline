notes: >
  A second confirmed verbatim span on the same page carries the first half of the mechanism,
  "tables can have row security policies that restrict, on a per-user basis, which rows can be
  returned by normal queries or inserted, updated, or deleted by data modification commands",
  but it contains inline markup in the rendered HTML, so the BYPASSRLS sentence was chosen for
  the quote field as the cleaner string match for G1. Reference documentation: unattested, no
