id: S703
rq: RQ1
claim: >
  PostgreSQL's documentation states that row security policies restrict on a per-user basis which
  rows normal queries return, and separately that superusers and roles holding BYPASSRLS always
  bypass the row security system entirely. Those two facts together are the evidence-collision
  mechanism: an investigator debugging a number mismatch gets a different answer depending on
  which role they happen to be connected as, and the role that sees everything is usually not
  the role anyone investigates from.
url: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
quote: "Superusers and roles with the BYPASSRLS attribute always bypass the row security system when accessing a table."
source_type: docs
author_role: PostgreSQL Global Development Group documentation
company: PostgreSQL
