id: S755
rq: RQ1
claim: >
  Apache Spark bug SPARK-8513, reported by a Spark committer from observed failures: when a write
  job using FileOutputCommitter fails, task cancellation is asynchronous, so the committer tries to
  delete the _temporary directory while still-running tasks recreate subdirectories underneath it.
  The directory therefore survives the failed job, with the observed error "Failed to delete file
  or dir [...] _temporary/0/_temporary]: it still exists". A failed write leaves partial output on
  storage rather than cleaning up after itself.
url: https://issues.apache.org/jira/browse/SPARK-8513
quote: "may be left undeleted when a write job committed with FileOutputCommitter fails due to a race condition"
source_type: repo
author_role: Spark committer reporting an observed failure (Cheng Lian)
company: reported against Apache Spark
