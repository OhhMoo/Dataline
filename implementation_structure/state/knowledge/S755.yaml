notes: >
  Replaces the S006 (vendor-survey) leg of A001/A009's "the crashed run left partial output"
  initial condition. HONEST SCOPE LIMIT, and it matters - this attests that a failed write job
  leaves partial output behind. It does NOT attest the second half of the story A001 and A009 tell,
  that the next scheduled run then silently consumes that debris. No source in this corpus attests
  that chain; it is a deliberate world-design choice and the archetypes now label it as such rather
  than cite it. Status Resolved (affected versions 1.2.2, 1.3.1, 1.4.0), so this is history, not a
  live trap - recorded explicitly because F454 was caused by exactly the opposite omission.
