notes: >
  VERIFIED BY RUNNING IT on 2026-09-13 with duckdb 1.5.5 and the ducklake extension (24MB,
  bakeable into an image): SELECT * FROM tbl AT (VERSION => 2) and AT (TIMESTAMP => ...) both
  returned correct historic states across INSERT, UPDATE and DELETE; snapshots() listed every
  version with timestamps; ALTER TABLE ADD COLUMN did not break older-version reads; an out-of-
  range version failed cleanly with 'No snapshot found at version 99'. Separately,
  table_changes('fct', 3, 5) returned rows tagged insert, delete, update_preimage and
  update_postimage, which is the Snowflake stream contract of S860. This is the finding that
  makes Time Travel and Streams affordable on a DuckDB backend.
