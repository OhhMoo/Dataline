id: S866
rq: RQ7
claim: >
  DuckLake, DuckDB's snapshot-based table format, records every historic snapshot and supports
  querying any of them by timestamp or version - giving a DuckDB backend the primitive that
  Snowflake Time Travel needs.
url: https://ducklake.select/docs/stable/duckdb/usage/time_travel
quote: "Using time travel, it is possible to query the state of the database as of any recorded snapshot."
source_type: docs
company: DuckDB Labs
