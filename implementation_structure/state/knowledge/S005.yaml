id: S005
rq: RQ1
claim: >
  Silent data loss accounted for 19% of the 50 surveyed postmortems. One concrete form: a data
  quality rule written to drop corrupted upstream records also matched legitimate records with
  unusual-but-valid values and quietly removed 12% of legitimate transactions over three weeks.
  The pipeline reported success, dashboards were green, and the SLA was met throughout.
