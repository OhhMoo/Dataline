notes: >
  Important because the failure is caused by the data quality control itself, not by its absence -
  an agent whose instinct is "add more validation" makes this worse. The same source lists two
  sibling forms: a non-idempotent sink under retry producing duplicates despite a nominal
  exactly-once claim, and a 24-hour queue retention window expiring unprocessed data while
  downstream was backed up by an unrelated incident.
