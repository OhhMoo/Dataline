notes: >
  The IDEA is important - the failure is caused by the data quality control itself, not by its
  absence, so an agent whose instinct is "add more validation" makes it worse. But the 12% and the
  three weeks are unattributable and may not be used as findings; A003 now carries the loss
  magnitude as an explicit world parameter and takes its mechanism from S756 (PostgreSQL's own
  documentation of how an exclusion predicate silently drops rows whose value is unknown). The same source lists two
  sibling forms: a non-idempotent sink under retry producing duplicates despite a nominal
  exactly-once claim, and a 24-hour queue retention window expiring unprocessed data while
  downstream was backed up by an unrelated incident.
