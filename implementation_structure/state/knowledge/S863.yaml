notes: >
  Recorded mainly to argue the opposite of the obvious: micro-partition pruning is the one
  Snowflake behaviour I would NOT try to emulate. Its only observable signature is a query
  profile and a wall-clock number, neither of which a sub-second DuckDB backend can produce
  honestly, and a fabricated profile is a fabricated artifact the agent would then be graded
  against. Drop the clustering and pruning task class rather than fake it.
