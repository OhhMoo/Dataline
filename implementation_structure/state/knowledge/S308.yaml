notes: >
  Verdict: COPY-PATTERN (benchmark is closed/paid; methodology is public). Critical lesson for
  our judge rubrics: binary inclusion-only rubric items are exploitable by hedging, so any
  LLM-judged grading we ship must penalize noncommittal/multi-answer responses, not just check
  for presence of correct info. Prefer deterministic verifiers where possible; where a judge is
  unavoidable, design rubric items with a single well-specified correct answer.
