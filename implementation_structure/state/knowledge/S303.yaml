notes: >
  Verdict: COPY-PATTERN. The dual-backend trick is the design to steal for our substrate:
  default to a fully hermetic DuckDB variant (no account, no network) for cheap RL rollouts,
  and offer the Snowflake variant as the dialect-fidelity axis. Also note their Snowflake
  isolation mechanism: each task's healthcheck clones the source DB into a retail_clone_*
  database per trial, and they ship a sweeper script because Harbor has no always-run teardown.
