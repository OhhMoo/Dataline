claim: >
  When the original Kaggle test labels were unavailable, MLE-bench rebuilt a test set from the public training data (typically a 10% holdout) and then VALIDATED the reconstruction by checking that a reference sample submission scored comparably on the original and reconstructed sets, so that agent scores stay comparable to the human leaderboard.
