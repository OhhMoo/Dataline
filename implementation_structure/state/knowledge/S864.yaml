id: S864
rq: RQ3
claim: >
  Snowflake has two distinct HTTP surfaces: the documented public SQL REST API for submitting
  statements, and the undocumented session and query protocol that the Python, JDBC and ODBC
  connectors actually speak - an emulator must implement whichever one the client uses.
url: https://docs.snowflake.com/en/developer-guide/sql-api/index.md
quote: "The Snowflake SQL API is a REST API that you can use to access and update data in a Snowflake database."
