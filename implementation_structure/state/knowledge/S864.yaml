notes: >
  Important scoping fact for the interception-versus-emulation question. fakesnow implements the
  CONNECTOR protocol - /session/v1/login-request, /session, /queries/v1/query-request,
  /queries/v1/abort-request, /monitoring/queries/{sfqid} - and does NOT implement the public
  /api/v2/statements SQL API; verified by reading fakesnow/server.py's route table on
  2026-09-13. Anything in a world that talks to /api/v2/statements, such as some Airflow
  operators or agent-written curl calls, would 404 today.
