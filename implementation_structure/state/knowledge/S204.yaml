claim: >
  A data leader describes the recurring analytics job of making two teams' KPIs reconcile - Finance computing cost per acquisition by product line while Marketing computes CPA by channel - and notes that unless both come from the same source of truth stakeholders cannot tell which to trust. The same post catalogues ambiguity inside a single metric name: does 'monthly' in Monthly Active Users mean trailing 30 days or the previous full calendar month, and what counts as active.
url: https://locallyoptimistic.com/post/kpis/
quote: "Finance may be looking at cost per acquisition (CPA) by product line and Marketing may be considering CPA by marketing channel"
