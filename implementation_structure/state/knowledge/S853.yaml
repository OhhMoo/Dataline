notes: >
  Re-cites the caveat already held as S316 but from the current README, because R002's backend
  decision rests on it. I verified divergences beyond the README's own list, all of them silent
  rather than error-raising: 1/0 returns inf and 0/0 returns nan where real Snowflake raises
  division by zero; CREATE DYNAMIC TABLE silently creates a plain table; ALTER TABLE ... CLUSTER
  BY is accepted as a no-op; a SQL UDF body is returned as a string literal instead of being
  evaluated.
