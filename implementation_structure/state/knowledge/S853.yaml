claim: >
  The fakesnow README states two fidelity caveats that bound its use as a grading substrate:
  non-deterministic row ordering unless ORDER BY is fully specified, and a more liberal SQL
  dialect than real Snowflake.
url: https://raw.githubusercontent.com/tekumara/fakesnow/main/README.md
quote: "Row ordering is non-deterministic and may differ from Snowflake unless you fully specify the ORDER BY clause."
