id: S950
claim: >
  dbt parse time at the scale the E2 archetypes need is dominated by a fixed ~4.1s
  interpreter/adapter startup, not by model count. Measured on dbt-core + dbt-duckdb as
  installed in this repo: an empty project parses in 4.08s; 570 models / 1,710 manifest
  nodes cold-parse in 11.12s; 900 models / 2,700 nodes in 12.81s. Going from 100 to 900
  models (300 to 2,700 nodes) costs only +2.5s, so scaling across this range is mild and
  sublinear in wall-clock, not superlinear. With partial_parse.msgpack present, 570 models
  re-parse in 4.55s and 900 in 5.02s - essentially the startup floor. Partial parsing is
  per-file and survives edits: after editing one model file, 570 models re-parse in 4.96s;
  after editing the schema.yml carrying 1,140 tests, 4.57s.
