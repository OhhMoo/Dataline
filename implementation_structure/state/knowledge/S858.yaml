id: S858
rq: RQ4
claim: >
  SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY retains 365 days of query history but its data can lag
  reality by up to 45 minutes, so an operator debugging a live incident from ACCOUNT_USAGE is
  reading a stale view by construction.
url: https://docs.snowflake.com/en/sql-reference/account-usage/query_history.md
quote: "Latency for the view may be up to 45 minutes."
