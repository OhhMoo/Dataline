notes: >
  The single most task-generative fact I found about Snowflake's observability surface. A mock
  that reproduces the 45-minute lag creates a real, non-obscure trap: the agent's most recent
  queries are absent from ACCOUNT_USAGE, while the INFORMATION_SCHEMA table function that has no
  lag only covers 7 days (S859). Choosing between the two is a genuine diagnostic skill, and the
  lag is one WHERE clause in a view.
