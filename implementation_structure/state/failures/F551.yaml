id: F551
target: S017
attack_type: unexecuted_mitigation
severity: medium
finding: >
  F453 landed on 2026-09-12 with recommended_action=re-source and a three-part mitigation: keep the
  record but source the mechanism to the PostgreSQL documentation rather than to two narratives,
  drop the independent-corroboration claim, and find A004 an attested slot-fills-the-disk incident
  or say plainly that none exists. None of the three was executed. A day later S017's claim still
  opened "Written-up production incident:" and its notes still asserted it "Corroborates S016
  mechanism from an independent source", while the page is "Topic 332 of 367" inside a
  message-queues course and S016 is a streaming-database vendor's blog. A004's entire CDC leg
  therefore continued to rest on a vendor page and a tutorial, carrying rebuildable 24 GB / 50 GB
  sizing arithmetic as though it came from somewhere, with every gate green.
  As with F550, this record also documents a mistake of my own, kept rather than erased: my first
  pass moved S017 to state/knowledge/withdrawn/ and filed this failure recommending withdrawal.
  F453 said keep. Reversed.
recommended_action: annotate
found_by: D2-reground
resolved: true
resolution_note: >
  Executed 2026-09-13, all three parts. (1) S017 restored to state/knowledge/ with its claim
  rewritten to state that the page is a course exercise, typed attestation=unattested /
  usable_for=[world_texture], confidence low. (2) The independent-corroboration sentence struck
  from its notes. (3) The attested incidents F453 asked for were found and written up: S750
  (Zalando engineering blog - a named Senior Principal Engineer on his own platform team's
  multi-year production experience; firsthand_named) and S751 (Debezium mailing list - a
  practitioner watching his own replication slot grow 152 kB to 16 MB after three inserted rows on
  Debezium 0.8.3; firsthand_anonymous, source_type=forum so frequency is machine-blocked). S752
  carries the mechanism from PostgreSQL's own documentation. All three quote-verified 2026-09-13
  with gate-identical fetch logic. A004's derived_from is rebuilt on those plus S020/S021 (GitLab's
  own postmortem), with S016 retained at world_texture only.
  A004 is the clearest win of this repair: its CDC leg went from zero attested incidents to one
  firsthand_named and one firsthand_anonymous.
notes: >
  Filed 2026-09-13 in R002 evidence repair. S750 supplies a better trap than the one A004 currently
  plants: WAL growth on LOW-activity databases persists even with Debezium heartbeat configured,
  because the slot only advances when the connector commits an offset and a quiet database gives it
  nothing to commit. The A004 world spec should adopt it.
