id: F550
target: S010
attack_type: unexecuted_mitigation
severity: medium
finding: >
  F452 landed on 2026-09-12 with recommended_action=re-source and a precise mitigation. Nothing
  executed it. A day later S010's claim field still read as reportage of a real incident - "A
  pipeline team renamed a warehouse column (amount_txn_ccy to txn_amount) ... found by the head of
  risk two minutes before a board meeting, not by any alert" - while the page it cites is a
  present-tense constructed vignette opening "It's 8:58 AM. The head of risk at a bank opens the
  morning transaction dashboard...". Two archetypes (A019, A022) carried the invented board meeting
  through another round with every gate green.
  The second-order finding is the important one and it is not about this record: a landed attack
  with a written mitigation changes nothing in the corpus unless a later agent happens to act on
  it, and no gate checks. See F553, which enumerates the unexecuted set.
  This record ALSO documents a mistake of my own, kept rather than erased: my first pass moved S010
  to state/knowledge/withdrawn/ and filed this failure recommending withdrawal. F452 ruled
  re-source, and its mitigation explicitly offered "keep S010 with the claim rewritten as 'an
  illustrative scenario in a data-contracts argument describes...'". Escalating a re-source into a
  withdrawal is not a neutral act - it makes the corpus look decisive while destroying the world
  texture the record legitimately carries. Reversed.
recommended_action: annotate
found_by: D2-reground
resolved: true
resolution_note: >
  Executed 2026-09-13. S010 restored to state/knowledge/, claim rewritten in F452's own prescribed
  form, confidence lowered high-to-low, typed attestation=unattested / usable_for=[world_texture].
  Dependent archetypes re-sourced: A022 now rests on S207 and S208 (a named team publishing its own
  incidents, firsthand_named, mechanism-licensed) plus S203; A019 could not be re-sourced and is
  status: redesign_required per F552.
notes: >
