agent_visible_brief: >
  The exec dashboard and the finance pack have been reporting different active customer counts
  since roughly the start of the year and the two teams have stopped trying to reconcile it. We
  have a definition on the internal wiki, we have descriptions in the dbt project, and we have
  whatever the SQL is doing, and people disagree about which is current. Last quarter's
  published numbers are in the warehouse as a frozen extract. Please work out which definition
  is the real one, get the models telling the truth, and leave the documentation in a state
  where this cannot happen again. We need to know when the definitions drifted apart.
status: draft
notes: >
  HOW THE CLUTTER IS GENERATED, DETERMINISTICALLY. The sixty near-identical models are not
  written sixty times; they are emitted once per business unit from a single template revision
  recorded in the fixture spec, which is exactly how a real multi-tenant project reaches this
  shape (S662: code generation that inspects metadata to decide which units get which models,
  and emits the models, seeds and YAML together). The defect is generated, not injected: the
  spec pins two business units to template revision 3 and the rest to revision 4, and revision
  3 carries the ninety-day window. That is why the two outliers are internally coherent rather
  than looking tampered with, and it is a failure mode that only exists at scale, because with
  six models nobody pins half of them to an old template. The doc block is emitted once and
  referenced by all sixty via the doc() macro, so the manifest hash check is testing a real
  property rather than a formatting convention. The wiki page is a markdown file in the git
  workspace with a fabricated but plausible edit history recorded in the world's commit log,
  generated from the same seed. THE TIEBREAKER IS DATA, NOT TASTE: the frozen published extract
  is computed by the world builder under the authoritative definition, and the two wrong
  definitions are calibrated so that each matches a contiguous stretch of the series and
  neither matches all of it, which is what turns this from a judgement call into arithmetic.
  WHAT A FULL REFRESH DESTROYS: snp_metric_definitions is a dbt snapshot over the model
  descriptions and the compiled window expressions, and it is the only record of the order in
  which the doc and the SQL changed; a full refresh rebuilds it from current state and the
  divergence date, which the grader asks for explicitly, becomes unrecoverable. NAIVE
  BASELINES: preferring the wiki must fail; preferring the current SQL must partially succeed
  on the last six weeks and fail overall; reading descriptions must fail cleanly. RESOURCE
  BUDGET: same prebuilt DuckDB attach and warm partial parse as A050; the expensive operation
  here is recomputing three candidate series over the frozen window, which is three aggregate
  scans over a few hundred megabytes and is well inside the ceiling. HONEST CAVEAT: the
  communication judge axis is doing real work here and the memo is not deterministically
  gradeable; everything that decides pass or fail is, but the quality of the reconciliation
  narrative is not, and I have kept the rubric weight on the deterministic half.
