agent_visible_brief: >
  From: Marcus Oyelaran, Director of Retention. Ticket DS-2209.
  Our save team works a daily list of accounts the churn model flags as high risk. Since roughly
  the start of last month that list has been junk - reps are calling accounts that renewed two
  weeks ago and the accounts that actually cancelled were not on it. I pulled the model's own
  dashboard and it says the model is performing better than it ever has, which is not what my
  team is experiencing. Before the QBR on the 30th I need to know whether we can trust this model
  and, if we can't, what it would actually be worth. Please give me a straight answer on whether
  the scores we are acting on are sound, fix whatever is making them unsound, and tell me what
  performance I should honestly expect from it. If the answer is that this model is not good
  enough to run a save program on, say so - I would rather know now.
notes: >
  Interaction mechanism: MASKING (bidirectional) plus REPAIR-INDUCES plus EVIDENCE-COLLISION.
  composed_of names A025 and A012. LINEAGE ONLY for A025: see repair_note. The silent-corruption
  leg here is a rename-collision, not a positional INSERT, and does not inherit A025's
  implementation. composed_of is not yet a schema field.
  Not solvable by full refresh: the raw landing zone has a 30-day retention and the collision
  boundary is 40 days back, so the pre-boundary partitions cannot be rebuilt from source. A blind
  dbt run --full-refresh also does not repair the collision, because rebuilding still selects the
  new plan_tier by name - the repair requires selecting plan_code and aliasing it, which is the
  diagnosis. The reference is NOT a computable function of the agent-visible landing zone (F511):
  the pre-boundary semantics survive only in the harness reference.
  Anti-trench-coat justification: the two defects share one number. The single metric the agent
  can observe is the sum of both effects, the honest band is reachable from neither single repair,
  and defect A's symptom is a metric INCREASE that argues against the investigation that would
  find defect B. An agent cannot solve these independently because it cannot measure either one
  in isolation.
  Generator note: set the label-leak magnitude so that the corrupted-plus-leaking AUC (0.94) is
  high enough to look like an unusually good model but not so high that it screams leakage. 0.94
  on churn is suspicious to an expert and unremarkable to a metric dashboard, which is the
  intended asymmetry.
  Honest caveat: the brief's last line ("if this model is not good enough, say so") is close to
  hinting that the answer is bad news. It is there because a real director would write it and
  because without it the agent has no licence to return a worse number. A reviewer may judge it
  too generous a hint and should feel free to cut it.
repair_note: >
  Authored 2026-09-13. During this session A002, A010 and A025 were all moved to
  status=redesign_required under F500: the positional-INSERT mechanism cannot occur on dbt Core
  plus dbt-duckdb, so it can only be fabricated as an agent-visible macro override. My first draft
  of this archetype used that mechanism for defect A and was therefore unbuildable. Defect A has
  been re-mechanismed to a rename-collision - upstream renames plan_tier to plan_code and
  simultaneously ships a NEW plan_tier carrying a different field - which needs no adapter
  behaviour at all, is pure SQL and source schema, and preserves every property the compound
  depends on: silent, name-and-type-stable, invisible to schema tests, and boundary-dated.
  derived_from was also repointed off S013 and S014 (positional-INSERT filings) onto S002 and S216
  (same-name-different-meaning column drift). composed_of still names A025 for lineage so the
  disposition owner can see where the shape came from; this archetype does not depend on A025
  being repaired.
