notes: >
  Evidence-thin by construction: derived from a benchmark gap (governance surfaces
  absent everywhere) rather than from incident-rich literature. If a future RQ1 pass
  finds no further first-party access-control incidents, consider merging the
  reconciliation core into A022 and dropping the policy-audit axis.
