agent_visible_brief: >
  From: Renata Sousa, Supply Planning. Ticket ML-3317.
  Our availability forecasts have been getting steadily worse since about the middle of July.
  Store managers have stopped trusting them and several regions have gone back to ordering off
  last year's numbers, which is expensive. I know we cannot measure accuracy properly for the last
  two weeks because the actuals lag, and I know the alerting is mostly noise so nobody looked at
  it. What I need out of this: tell me what changed and how much of the degradation each thing
  accounts for, get the forecasts back to something my planners will use, and leave me a warning
  signal that is worth reading. If you hand me another monitor that alerts every morning my team
  will turn it off in a week and we will be back here in January.
notes: >
  Interaction mechanism: EVIDENCE-COLLISION (primary, via contamination of the monitor's own
  reference window) plus SHARED-SYMPTOM with two partial causes plus a REPAIR-INDUCES twist.
  composed_of names A020 (demand-shift rescue under delayed labels and alert fatigue) and A017
  (ingestion-connector schema drift with silent destination row loss). composed_of is not yet a
  schema field.
  HONEST SELF-ASSESSMENT: this is the weakest of my five on the anti-trench-coat test and I want
  that on the record. An agent could in principle repair the connector, then build a monitor from
  scratch on clean post-repair data, and never reason about the interaction at all. Two design
  choices are what stop that: the monitor is replayed by the harness over the FULL historical
  window, so it must score the contaminated period and cannot be built on post-repair data alone;
  and the ingestion-loss onset is labelled a non-event, so the monitor must actively distinguish
  a data defect from a demand shift. If either of those is dropped in implementation this
  archetype collapses into two tasks in a container. They are load-bearing, not decoration.
  Not solvable by a from-scratch re-sync, and this is the specific trap F506 caught in A017, so it
  is designed against here rather than inherited. The upstream point-of-sale API serves a rolling
  30-day window, and the loss began six weeks ago, so a re-sync recovers only the most recent half
  of the missing rows. The earlier half survives nowhere in raw form; it can only be reconstructed
  at day grain from the store daily-summary table, which means the agent must decide what is
  restorable, restore it, and explicitly exclude the unrestorable window from the training
  population rather than silently training on a hole. The destination also carries
  manually-reconciled store-day corrections from a prior incident that exist nowhere upstream, so
  a truncate-and-reload destroys them and fails the reconciliation check. The grading reference is
  therefore not a computable function of the agent-visible source (F511).
  Length risk: at 14 to 22 hours this is the longest of my five and it is at the top of the
  deployable band. If playtesting puts it past 22, cut the connector repair to a single region and
  a single cursor column rather than cutting the monitor - the monitor is where the compound lives.
repair_note: >
  Authored 2026-09-13. A017, one of the two constituents, was moved to status=redesign_required
  during this session under F506: as specified, the mock source API is intact, so a from-scratch
  re-sync recovers everything and passes every check with zero diagnosis. That failure would have
  been inherited here verbatim. It is designed against explicitly in notes and in the added
  restorability check: the upstream API now serves only a rolling 30-day window while the loss
  spans six weeks, so a re-sync is a partial remedy at best and the agent must reason about what
  cannot be recovered. A017's own repair_note proposes exactly this direction ("window the mock
  source API so mid-history rows exist only in the destination"), so this archetype and a repaired
  A017 should share that world parameter. composed_of still names A017 for lineage; this archetype
  does not depend on A017 being repaired.
