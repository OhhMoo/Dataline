agent_visible_brief: >
  From: Dana Whitlock, Chief of Staff. Ticket BI-1180.
  I have two VPs in a standoff. Finance's quarterly revenue board shows 41.8M. RevOps' shows
  44.6M. Each of them has sent me a screenshot of their own dashboard as proof the other one is
  broken, and I have to put one number in front of the operating committee on Tuesday. I do not
  need a lecture on data governance, I need to know which number is right and why the other one
  is wrong, and I need both boards showing the same thing by Tuesday morning so this does not
  happen again next quarter. Signed contract values are in the contracts space on the wiki if
  that helps. Whatever you do, do not change anyone's permissions to make this go away - Legal
  signed off on the current access rules after the reorg and reopening that is a month of my life
  I am not spending.
notes: >
  Interaction mechanism: EVIDENCE-COLLISION (primary) plus CONFLICTING-REPAIR. composed_of names
  A021 (row-level security and masking misconfiguration) and A029 (bisect-by-dimension
  reconciliation). composed_of is not yet a schema field.
  Surface note: v1 has five surfaces and does not include a warehouse with native row access
  policies. This archetype is implemented against DuckDB as a deterministic policy layer - a
  session role variable plus a mapping table plus policy-applying views, with an equivalent
  role binding in the BI surface - and NOT against a real Snowflake or Postgres RLS engine. The
  mechanism is faithful to S702 and S703; the implementation is a stand-in. Saying so because
  ground rule 6 requires it.
  Not solvable by full refresh: no rebuild of any table changes a policy. The thing a full refresh
  destroys here is the mapping table's history rows, which are what let the agent date the org
  change and therefore date the onset of the exclusion.
  Anti-trench-coat justification: this is the compound I am most confident in. The two defects are
  not independently solvable because the diagnostic procedure for B - compute the true number and
  compare - returns a value corrupted by A, and because the two errors have opposite signs so the
  observable discrepancy corresponds to neither. An agent literally cannot measure the fan-out
  correctly until it has escaped the policy filter.
  The brief's final sentence forbids widening access. That is deliberate: it removes the cheap
  win without naming the defect, and it is the kind of thing a chief of staff actually writes.
