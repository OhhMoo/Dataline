agent_visible_brief: >
  From: Tobias Lund, Analytics Engineering. Ticket DATA-8842.
  Order volume on the exec revenue board flatlined some time around the 9th and nobody has been
  able to tell me why. The pipeline is green - every task in the orders DAG has succeeded on every
  run for the last four days, the logs are clean, and nothing has alerted. But fct_orders has not
  gained a row since the 9th and the warehouse team says the table is fine. Finance is going to
  notice on the 15th when they run the month-to-date pack.
  Please find out why orders have stopped arriving, get the missing four days into the table, and
  make sure whatever this was would page someone next time instead of silently reporting success.
  One thing worth knowing - the orders producer was rolled back and re-deployed on the 8th, so
  some orders around that date may have been sent more than once with corrections. Those
  corrections are real and Finance needs them.
notes: >
  Interaction mechanism: REPAIR-INDUCES-DEFECT (primary, with defect B causally unobservable
  before A is repaired) plus CONFLICTING-REPAIR on ordering. composed_of names A027 (green-DAG
  triage of a failure behind the orchestrator) and A026 (non-idempotent append loader).
  composed_of is not yet a schema field.
  Surface note: v1 has a deterministic scheduler state machine but not a real Kafka broker. This
  is implemented as a deterministic log-and-offset state machine with the same semantics -
  committed offsets, consumer lag, retention horizon, replay from an offset or a timestamp - not
  against a real broker. The mechanism follows S513 and S706; the implementation is a stand-in.
  Not solvable by full refresh: the fact table holds 90 days of history and the topic retains 30,
  so rebuilding from the stream loses 60 days permanently. That is what a full refresh destroys,
  and check 6 grades it.
  Anti-trench-coat justification: this is the strongest interaction in my set. Defect B leaves no
  trace in the world before defect A is repaired, so there is no order in which the agent could
  solve them independently - B literally does not exist as an observable until A is fixed. The
  ordering is not a preference, it is the difference between a clean repair and an unrecoverable
  ambiguity between replay duplicates and legitimate revisions.
  The brief's last two sentences plant the legitimate-revision constraint without naming either
  defect. They are the minimum needed to make the revision check fair rather than a gotcha.
built_as: GT002-orders-flatline
repair_note: >
  BUILT 2026-09-13 by C2-GT002 as tasks/GT002-orders-flatline. TASK VALID: oracle 24/24, no_op 0,
  single_defect_only 7, naive_dedupe 6, reset_earliest 2.05, full_refresh 12, checklist 21,
  reference_copy 18 (high by design; container topology is the only defence). Two findings landed
  during the build and both changed the design.

  F624 - THE CENTRAL CLAIM WAS TOO STRONG, AND IS NOW NARROWED. why_hard asserts that defect B is
  "causally unexpressible while A is live" and that "no amount of querying the warehouse reveals
  it". The first build made that false: the redelivery was triggered by a partially-committed batch
  at the stall boundary, and because topic offsets were ordered by event time, two read-only
  queries an agent runs anyway while diagnosing the stall isolated the whole overlap. The world was
  rebuilt so that offsets order by EMIT time while payloads carry EVENT time, the committed offset
  is exactly consistent with what is loaded, and the redelivery comes from producer re-emission of
  orders whose original log records have aged out of retention - so there is no duplicate in the
  table, none in the topic, and no timestamp that contradicts another. Twelve probes
  (tests/test_dormancy.py) now assert this on every build and block TASK VALID if any fires.

  THE CLAIM THAT SURVIVES, AND IT IS WEAKER THAN THE ONE WRITTEN ABOVE. Defect B itself - the sink
  has no merge key - genuinely has no data-side trace, and that part of why_hard holds. But a
  conjunction of this shape REQUIRES a redelivery trigger, and a trigger is a fact about the world,
  so some query can always find it. What is achievable, and what was achieved, is narrower:

    NO QUERY AN AGENT WOULD RUN TO DIAGNOSE DEFECT A SURFACES THE TRIGGER.

  Finding it takes decoding the pending payloads and joining them against the fact table - replay
  diligence, not stall diagnosis. An agent who writes that query has done the reasoning the task
  measures, and should find it. Anyone quoting A063's why_hard should quote this paragraph with it.

  F626 - THE BRIEF PRE-ANNOUNCED A SCORED ANSWER. The closing sentence ("those corrections are real
  and Finance needs them") is a genuine business constraint no query reveals, so it was kept; but
  paying 4 of 24 points for acting on it was charging twice, since message conservation already
  fails by exactly -1,100 when the revisions are collapsed. The revision check is now penalty-only
  and the points moved to conservation and the idempotency probe.

  ALSO ESTABLISHED, against the installed stack rather than assumed: a strict CAST over a
  locale-mangled numeric aborts the whole INSERT and writes nothing (duckdb 1.5.5), which is what
  makes "reads a batch, writes zero, exits zero" reproducible without a broker; and the
  surface note in `notes` is confirmed - the log-and-offset state machine carries committed
  offsets, lag, a retention horizon and replay-from-offset with no Kafka anywhere.

  STATUS LEFT AT draft DELIBERATELY. The schema requires attack records from R1, R2 and R3 for
  status: derived. A063 now carries two (F624, F626), both from R3 and both from the same reviewer.
  Promoting it would be the F553 error - recording a disposition instead of doing the work.
