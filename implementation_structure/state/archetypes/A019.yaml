id: A019
title: dbt refactor with invisible BI blast radius and rename-boundary reconciliation
discipline: data_analytics
description: >
  A legacy transformation is being consolidated into dbt and given stakeholder-friendly
  names. The rename propagates into the warehouse, but several dashboards reference
  the old model and column names, the BI layer has its own renames on top that are
  recorded nowhere, and one board-level dashboard has a silent divide-by-zero fallback
  that will render a plausible garbage number instead of erroring. The agent must
  catalogue which BI assets depend on the old model (including through the unrecorded
  BI rename boundary), migrate or duplicate-then-validate each one, keep the old
  model alive until dependents move, and prove numbers are unchanged for consumers.
why_hard: >
  The dependency graph that matters is split across three surfaces (dbt project,
  warehouse, BI metadata) and one of the edges - the BI-layer rename on top of the
  dbt model name - exists nowhere in any system and must be reconstructed from query
  logs and dashboard definitions (S217). The most dangerous failure is not a broken
  dashboard but a silently wrong one (S010), so 'nothing errored' is not evidence of
  success. Migration validation requires value-level comparison, not row counts
  (S211, S210).
human_hours: "10-25"
grading: >
  Deterministic: cell-level diff of every migrated dashboard's rendered query results
  against pre-migration reference snapshots (must match exactly); compile/parse check
  that zero BI assets still reference retired model or column names; audit_helper-style
  row-level value diff between legacy and refactored models (not just counts/sums);
  assert the deprecated model is dropped only after dependents are migrated. Rubric:
  20 points across completeness of the discovered dependency inventory, migration
  correctness, validation rigor, and deprecation discipline.
rubric_points: 20
apps_touched:
  - dbt
  - warehouse
  - bi_dashboard
  - catalog
  - docs_wiki
deterministic_checks:
  - "rendered dashboard cell values equal to pre-migration reference snapshots"
  - "zero dangling references to retired names across BI asset definitions"
  - "row-level value diff legacy vs refactored model (audit_helper style)"
  - "ordering assertion: dependents migrated before old model dropped"
judge_axes:
  - design
  - code_quality
failure_modes_expected:
  - "renames in dbt and declares done while dashboards silently fall back to garbage"
  - "finds direct dependents but misses assets behind the BI-layer rename boundary"
  - "validates with row counts and misses value-level divergence from join-key NULLs"
existing_coverage: >
  ade-bench and data-eng-bench (S302, S304) end at the warehouse: their graders check
  materialized tables, and no BI surface exists in the task world, so rename blast
  radius - the failure mode that actually reached a board meeting in S010 - is
  structurally untestable there. DA-6 evidence is practitioner blogs and forums
  (S216), not first-party vendor incidents, so this archetype should be weighted
  accordingly in the corpus.
derived_from:
  - S216
  - S207
  - S217
  - S218
  - S211
  - S210
produced_by: S3-benchmark-gaps
attacks:
  - F104
  - F550
  - F552
status: redesign_required
repair_note: >
  REDESIGN REQUIRED 2026-09-13 (D2, R002 evidence repair) - see F552. This is one of two
  archetypes this repair could NOT save, and the honest outcome is to mark it broken rather than
  paper over it.
  RE-SOURCED, NOT WITHDRAWN: S010 stays in state/knowledge/ with its claim rewritten as F452
  prescribed - "an illustrative scenario in a data-contracts argument describes..." - and typed
  attestation=unattested, usable_for=[world_texture]. It is dropped from this archetype's
  derived_from because texture is all it can now supply. It was a
  constructed present-tense vignette - "It's 8:58 AM. The head of risk at a bank opens the
  morning transaction dashboard..." - written to argue for data contracts, and S010's claim field
  rewrote it as reportage of a real bank incident with a real three-day detection lag and a real
  board meeting. That supplied this archetype's silently-wrong-dashboard leg and its
  divide-by-zero fallback.
  WHY IT CANNOT BE RE-GROUNDED: the load-bearing mechanism is the BI-layer rename boundary that
  "exists nowhere in any system". The only record that states that is S217 - and S217, S218, S211
  and S210 are all docs.getdbt.com/blog content, which the R002 back-classification typed
  attestation=vendor_marketing, capping them at world_texture by the F400 rule. S216 (Power BI
  community thread) is genuine firsthand_anonymous practitioner voice and is retained, but it is
  vividness=low and world_texture only: it attests that a rename has a wide unowned blast radius,
  not how the rename boundary comes to be unrecorded. So after honest typing, the archetype's
  entire why_hard rests on a vendor blog post. That is the F400/F450 failure shape one layer up.
  ADDED AS A PARTIAL REPLACEMENT: S207 (Thicket, a named team publishing its own incidents,
  firsthand_named, mechanism-licensed) carries the "nothing errored but the number is wrong"
  property honestly - a headline KPI rendering a clean 0.0 percent because total upstream failure
  was coerced to zero. A redesign built on S207 rather than on the rename boundary would be
  defensible today.
  WHAT WAS SEARCHED AND NOT FOUND: no attested source for the unrecorded-rename-boundary
  mechanism. r/dataengineering could not be searched at all - reddit.com is blocked to the
  research tooling and unreachable by the gate's fetcher. Power BI and Microsoft Fabric community
  threads 403-block the gate and are citable only through Wayback snapshots, as S216 already is.
  DO NOT re-add a dbt Labs blog post to fix this.
