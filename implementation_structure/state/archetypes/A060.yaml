agent_visible_brief: >
  From: Priya Raghavan, Group Controller. Ticket FIN-4471, priority high.
  We closed the quarter on Friday and Revenue Operations will not sign off. Our ledger has the
  quarter at 43.1M. The revenue dashboard has it at 41.3M and has had it there since Monday. That
  is a 1.8M hole and I need it explained before the board pack goes out on Thursday, not patched
  over. Two things to save you time. Our ledger figure is independently reconciled against the
  payment processor and I am confident in it. And the dashboard was right at the end of last
  quarter, so whatever this is, it is recent. Please tell me what the correct quarter number is,
  what made the warehouse disagree with it, and make the warehouse produce the correct number
  going forward. I do not want a manual adjustment entry - Audit will ask about it.
notes: >
  Interaction mechanism: MASKING plus SHARED-SYMPTOM arithmetic plus REPAIR-INDUCES, with a
  forced repair order. composed_of names A003 (quality gate is the bug, silent valid-row loss)
  and A026 (duplicate partitions after a wrong-mode re-run). The composed_of and
  interaction_mechanism concepts are not yet in the archetype schema; recorded here and in the
  composed_of field, which G0 will flag as an unknown field until the schema adds it.
  Not solvable by full refresh: the landing zone has a 45-day retention policy and the quarter is
  90 days, so a rebuild from raw loses the first 45 days irrecoverably. That is the thing a full
  refresh destroys.
  Anti-trench-coat justification: an agent that fixes A003-in-isolation and A026-in-isolation in
  either order still fails, because the amendment check requires the filter repair to precede the
  de-duplication and because neither single repair can close the ledger arithmetic. The defects
  are not separable.
  Generator note: choose the magnitudes so the net gap is small enough to look like a rounding or
  timezone problem (target 4 to 5 percent) while each component is large (9 percent and 13
  percent). The small net is what keeps the agent from suspecting two causes.
  Length control: kept at the low end of the band by giving both defects the same table and the
  same 90-day window. Do not add a third surface to this one - it is already at 20 hours.
