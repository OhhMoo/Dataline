id: A001
title: Non-idempotent backfill repair after a silent doubling incident
discipline: data_engineering
description: >
  A batch job that loads daily partitions into a warehouse revenue table was re-run over
  30 days of existing partitions in append mode, so a month of rows is now double-counted
  and every downstream dashboard agrees on the wrong number. The world also contains the
  original incident's debris: a crashed earlier run left half-written partial output in the
  landing area, and the next scheduled run silently consumed it. The agent must identify
  exactly which partitions are duplicated and which contain partial-load artifacts, remove
  the bad rows without touching legitimate late-arriving ones, re-run with a correct
  idempotent write mode, and leave the pipeline so that a retry cannot re-double the data.
why_hard: >
  There are two stacked failures, not one: the original silent bug and the botched repair
  (the structure attested in S001). Naive fixes all lose: delete-and-full-refresh destroys
  legitimate manually-adjusted rows; re-running the DAG re-doubles; trusting the
  orchestrator's green status misses that the job exits zero on corrupt state. Correctness
  cannot be read off any single surface - freshness is fine, row counts are merely large,
  and only a business-key duplicate analysis or a per-partition count comparison against
  the source files localizes the damage window.
human_hours: "8-20"
grading: >
  Deterministic: row-level diff of the repaired revenue table against a reference table in
  DuckDB (exact match on the affected 30-day window); assertion of zero duplicate business
  keys; per-partition row counts match source-file counts; the idempotency probe plants a NEW partition and
  requires the repaired load to ingest it exactly once while leaving the repaired window
  untouched, with a second run a true no-op - a load that never runs must score zero (F121). Rubric: 20 points across
  damage-window identification, repair correctness, idempotency hardening, and a written
  explanation of which downstream numbers were wrong and for how long.
  GRADING REFERENCE IS HARNESS-SIDE: the expected/reference table lives in a separate
  DuckDB file attached read-only at scoring time only, never in the agent-visible
  catalog, or the agent can copy it instead of diagnosing (F121).
rubric_points: 20
apps_touched:
  - warehouse
  - dbt
  - airflow
  - bi_dashboard
deterministic_checks:
  - "row-level diff vs HARNESS-SIDE expected reference (attached read-only at scoring time) on the affected window"
  - "duplicate business-key assertion returns zero rows"
  - "per-partition counts equal source-file counts"
  - "idempotency probe: repaired load ingests a newly planted partition exactly once, leaves the repaired window unchanged, and is a no-op on a second run - a permanently skipping load scores zero"
judge_axes:
  - code_quality
  - robustness
failure_modes_expected:
  - "re-runs the DAG, doubling the data a second time"
  - "full-refreshes the table and destroys legitimate manual adjustments"
  - "cleans the obvious 30-day window but misses partial-load debris from the crashed run"
  - "fixes data but leaves the load non-idempotent so the next retry re-corrupts"
existing_coverage: >
  ade-bench has setup-time corruption tasks of a similar flavor but not the two-stage
  original-bug-plus-botched-repair structure, and not a live orchestrator whose next
  scheduled run is a hazard. Thin in data-eng-bench.
derived_from:
  - S001
  - S754
  - S755
  - S008
produced_by: S1-postmortems
attacks:
  - F121
notes: >
  S005's sibling mechanism (non-idempotent sink under retry despite nominal exactly-once)
  and S006's crashed-run partial output consumed by the next schedule are folded in as the
  second failure layer. Tune the duplicate volume to sit inside normal daily variance so
  dashboards being green is plausible, per S001/S004's detection-via-human pattern.
repair_note: >
  RE-GROUNDED 2026-09-13 (D2, R002 evidence repair).
  WITHDRAWN OR DEMOTED: S005 and S006 dropped from derived_from. Both are the layline.io
  "50 postmortems" vendor synthesis condemned by F450 - the piece names not one of the 50
  postmortems, and under the R002 two-axis model both are attestation=vendor_marketing and
  therefore license world_texture ONLY. They can no longer carry the non-idempotent-sink leg or
  the crashed-run-partial-output leg. S001 is RETAINED but retyped: F451 showed the
  backfill-doubling story is the essay's narrated opening scene about "a teammate", not an
  attested incident, so it is now attestation=unattested, usable_for=[world_texture, mechanism].
  REPLACED WITH: S754 (dbt's own reference documentation stating that an incremental model
  without a unique_key appends every returned row "without regard for whether the rows represent
  duplicates" - mechanism, quote-verified 2026-09-13) and S755 (SPARK-8513, a Spark committer
  reporting an observed failure in which a failed write job leaves its _temporary output behind -
  firsthand_named, mechanism, quote-verified 2026-09-13). S008 (Airflow Summit talk by two named
  Astronomer field engineers, firsthand_named and the one source here that legitimately licenses
  frequency) is added for the backfill-implosion and DST items.
  FREQUENCY CLAIM DROPPED: nothing in derived_from now supports "this is common". S001's notes
  previously upgraded a single anecdote to "high-frequency" by citing the vendor survey; that
  clause is void. The duplicate volume, the 30-day window and the "sits inside normal daily
  variance" tuning are WORLD PARAMETERS chosen by the designer, not findings.
  HONEST GAP: S755 attests that a failed write leaves partial output behind. NO source in this
  corpus attests the second half of this archetype's story - that the next scheduled run then
  silently consumes that debris. That chain is a deliberate design choice and must be labelled as
  one in the world spec, not cited.
