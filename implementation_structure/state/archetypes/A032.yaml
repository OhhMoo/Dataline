notes: >
  NOT blind-generated - authored by the lead agent to close the DS coverage gap; the phase-3
  diversity property does not hold and it needs red-teaming before it counts as derived.
  DELIBERATELY ABSTRACTED from the published clinical case behind S113: synthetic domain,
  synthetic sites, no recognisable fingerprints, because re-enacting a famous incident is the
  training-data-leakage failure R1 filed as F101. The mechanism (global threshold vs
  heterogeneous base rates vs finite responder attention) is preserved; the identity is not.
