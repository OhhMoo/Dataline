  is simply not earning container space today.
  G5 note: replication_ease downgraded from easy to medium by T1 because no
  install probe was run for this item. Under the gate's rule an unprobed 'easy' is
  an unearned claim, and the distinction between 'this should be easy' and 'I ran it'
  is the whole point of G5.
