notes: >
  No OSS stand-in that resembles the semantic-layer-plus-scheduled-burst-report shape of these
  tools. FORTUNATELY THE EXISTING DECISION ALREADY COVERS IT: the project's BI surface returns
  computed VALUES rather than rendered images (agent.md 7.3), and at the level of values a 1990s
  enterprise BI tool and a modern dashboard are the same object -- a stored query definition plus
  a cached result. The legacy-specific texture is the CACHE: these tools served scheduled snapshot
  extracts, so the dashboard can legitimately disagree with the warehouse because it is showing
  last night's burst, which is a better reconciliation puzzle than a live dashboard offers.
