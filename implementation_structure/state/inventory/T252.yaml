notes: >
  The mechanism that makes Snowflake Time Travel, UNDROP, AT/BEFORE clones and Streams reachable
  on a DuckDB backend. Verified by running it on 2026-09-13: AT (VERSION => n) and AT (TIMESTAMP
  => ts) both correct across INSERT/UPDATE/DELETE; snapshots() gives the version-to-timestamp
  map an AT(TIMESTAMP) rewrite needs; table_changes(tbl, from, to) emits insert / delete /
  update_preimage / update_postimage, which maps onto METADATA$ACTION and METADATA$ISUPDATE;
  schema evolution does not break historic reads. Extension is 24MB and must be baked into the
  image because the episode has no egress. License confirmed MIT via the GitHub API on
  2026-09-13 (duckdb/ducklake, 2981 stars, pushed 2026-09-10).
