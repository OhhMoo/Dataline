notes: >
  T1 2026-09-13 (round R002, mock-priority pass): RESOLVED from none_found to
  native_oss, with a flag the meeting should see. PROBED by T1 2026-09-13:
  apache/airflow:3.0.2 ran and reported '3.0.2'. But ground rule 6 in the shared brief
  freezes v1 on 'a deterministic scheduler state machine', not on Airflow, while eight
  archetypes name airflow. RECOMMENDED SPLIT: keep the deterministic state machine as
  the executor of record, since that is what gets graded, and use Airflow's ARTIFACTS -
  DAG files the agent reads and edits, task logs, a run-history table - as the read
  surface. That buys the texture eight archetypes need without importing the scheduler's
  non-determinism into grading. Someone should confirm this reading of ground rule 6
  rather than letting two agents build two different orchestrators.
