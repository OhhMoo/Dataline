fidelity_gap: >
  Real Airflow fights the frozen determinism requirement. Its scheduler makes wall-clock
  and task-ordering decisions that do not reproduce byte for byte from a seed, and A018
  grades precisely on distinguishing ran-long from started-late - a distinction that
  only means something if the timings are ours. Conversely the deterministic state
  machine that ground rule 6 freezes for v1 has no real DAG parser, so a task turning on
  an import error or a scheduler-level misconfiguration cannot be expressed in it.
