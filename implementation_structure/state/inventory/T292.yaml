notes: >
  INVESTIGATED AND REJECTED -- recorded so the option is not rediscovered and re-litigated later.
  Findings: the Hercules emulator itself is open source under the Q Public License; modern z/OS is
  reported to be technically runnable on it but legally barred except in narrow circumstances and
  always requiring an IBM licence; the one OS with a plausible free status is the 1970s-era MVS
  3.8j, and even that is described in the sources as murky because licensed material may be
  present on the distributed volumes. Separately and importantly, the s390x Docker platform is NOT
  z/OS -- it is ordinary Linux compiled for IBM Z, with no JCL, no VSAM and no z/OS behaviour, so
  pulling an s390x image buys zero mainframe fidelity. RECOMMENDATION: reject on product grounds
  before legal ones. A 1970s operating system behind a 3270 emulator is not what a bank's data
  engineer touches in 2026, so even a successful build would be fidelity to the wrong surface. The
  faithful proxy is the extract file plus the batch window (T271, T284), at near-zero cost.
