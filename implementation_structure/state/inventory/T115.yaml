fidelity_gap: >
  lkml parses and dumps LookML; it does not evaluate it. There is no query generation,
  no join resolution, no symmetric aggregates. So a Looker-flavoured task can be about
  the MODEL being wrong or inconsistent - which is what A019 and A030 need - but cannot
  be about Looker's SQL generation differing from what the analyst expected.
