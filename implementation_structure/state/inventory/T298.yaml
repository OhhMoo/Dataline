notes: >
  INVESTIGATED AND REJECTED, recorded so the trade-off is explicit. A commonly used headless image
  is reported at roughly 1GB compressed, and the one measured is a full desktop-plus-remote-viewer
  bundle rather than a minimal command-line build, so a leaner image may exist but no verified
  smaller figure was found. Against that, the pure-Python writers in T290 are reported at well
  under 300KB each. CONCLUSION: LibreOffice buys formula EVALUATION and rendering fidelity, and a
  benchmark that grades on warehouse state rather than on pictures needs neither. Reject unless a
  task genuinely requires recalculating a workbook, in which case see T299 before reaching for a
  whole office suite.
