notes: >
  OPTIONAL, AND PROBABLY UNNECESSARY -- recorded so the decision is explicit rather than
  forgotten. A drop-folder theme needs files that appear and change on the virtual clock, which a
  directory provides. Adding a real SSH daemon adds a service, a credential surface, and a second
  network participant inside a zone whose whole security model is that it has no network. The
  partial-read race (S919) is reproducible by having the world write a file in two stages across
  two virtual-clock ticks. Build the daemon only if a task genuinely turns on the transfer
  protocol.
