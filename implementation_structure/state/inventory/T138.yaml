fidelity_gap: >
  See T204 for the build's own fidelity boundary. The gap specific to calling it
  'Tableau': no extract/live distinction, no extract refresh schedule, no LOD
  expressions, no published datasources, no workbook XML for the agent to read. Only the
  refresh model matters to current archetypes, and T204 supplies one deliberately.
notes: >
  T1 2026-09-13 (round R002, mock-priority pass): verdict changed from none_found to
  custom_mock_required. B1's finding was correct and is unchanged - Tableau Server has
  no offline edition and no OSS mock speaks its REST API - but 'none found' is the wrong
  terminal state for a surface fifteen archetypes touch. The resolution is not to mock
  Tableau; it is to build the small BI-values surface (T204) that those fifteen
  archetypes actually read, and let Tableau, Power BI, Looker and Sigma be names on it.
  Superset (T137) stays available as the heavyweight option for when a task needs a real
  BI tool rather than believable BI values.
