notes: >
  T1 2026-09-13 (round R002, mock-priority pass): RESOLVED from none_found to
  custom_mock_required - and the mock in question is a directory of seeded markdown,
  which is the cheapest item on the priority list relative to what it serves. Twelve of
  26 archetypes touch docs_wiki, third-highest demand in the corpus, and every one of
  them needs the same thing: stale, partial or contradictory documentation the agent
  must read and then decide to distrust. A seeded file tree delivers that, rebuilds
  identically from the seed, and costs nothing to grade. BookStack (T143, MIT, image
  already cached locally) stays as the upgrade path. Recorded for completeness:
  atlassian/confluence is a real Docker Hub image (verified present, pushed 2026-09-12)
  but is proprietary Data Center software needing a licence key - not shippable, not
  probed. T1 could NOT find a citable source stating the licence-key requirement and is
  asserting it from the product's nature; a human should confirm before anyone quotes
  it.
  G5 note: replication_ease downgraded from easy to medium by T1 because no
  install probe was run for this item. Under the gate's rule an unprobed 'easy' is
  an unearned claim, and the distinction between 'this should be easy' and 'I ran it'
  is the whole point of G5.
