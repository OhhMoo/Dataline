fidelity_gap: >
  A file tree has no page history, no comments, no author metadata and no edit path.
  That matters in exactly one case: if an archetype grades on the agent UPDATING
  documentation after a fix, or on reading a page's revision history to date a change,
  the file tree is not enough and BookStack (T143) comes back. All twelve current
  archetypes read docs; none write docs. Surface a real task needs: a page tree, page
  bodies, a last-modified date. Three objects.
