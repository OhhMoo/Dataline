notes: >
  T1 2026-09-13 (round R002, mock-priority pass): RESOLVED from none_found to
  oss_equivalent. The ticketing surface rides on the Gitea instance already being stood
  up for the forge, so its marginal cost is near zero. Worth recording what was
  rejected: atlassian/jira-software IS a real Docker Hub image (tag 'latest' verified
  present via the Docker Hub API, pushed 2026-09-12), but it is proprietary Data Center
  software requiring a licence key and activation - not shippable into a lab container,
  and not probed for that reason. OpenProject is GPL-3.0, Plane and Vikunja are
  AGPL-3.0, Redmine reports NOASSERTION (all via GitHub API 2026-09-13): the OSS
  ticketing field is almost entirely copyleft, which is why Gitea's MIT issues matter.
