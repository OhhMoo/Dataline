fidelity_gap: >
  Gitea issues have no JQL, no sprints or boards, no custom fields, and no workflow
  transition rules with status categories. A011 and A029 need a ticket with a title, a
  body, comments and a status change, and Gitea carries all four. The moment an
  archetype turns on JQL semantics or a workflow-transition guard, that is when the
  roughly six-endpoint Jira mock gets built - not before.
evidence:
