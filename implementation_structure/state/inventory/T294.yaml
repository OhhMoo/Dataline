notes: >
  A PROPOSED CHANGE TO AN EXISTING COMPONENT rather than a new tool, recorded here so it is
  costed. The deterministic scheduler currently models runs and logical dates. Enterprise batch
  schedulers differ in one behaviourally decisive way: a downstream job fires on the CLOCK, not on
  upstream completion, so a late-but-successful upstream yields a green downstream run computed
  over stale inputs. Adding a per-job trigger mode of clock versus upstream, plus a window cutoff,
  is a small change to world/world/scheduler.py (currently 98 lines) and unlocks themes C1, C7 and
  most of the hybrid family. Zero RAM, zero new services, zero new images.
