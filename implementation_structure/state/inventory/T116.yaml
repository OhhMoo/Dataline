fidelity_gap: >
  Kafka itself is faithful because it IS Kafka. The gap is around it: no schema registry
  unless one is added, and the obvious one is licence-poisoned (see notes). A027's
  defect originates behind the orchestrator in the streaming layer, so what it needs is
  consumer lag and partition state - both native - rather than schema evolution.
