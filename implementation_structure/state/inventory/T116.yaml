notes: >
  T1 2026-09-13 (round R002, mock-priority pass): RESOLVED from none_found to
  native_oss. PROBED by T1 2026-09-13: apache/kafka:latest came up in KRaft mode with no
  ZooKeeper, created topic probe.events, listed it back, and
  kafka-broker-api-versions.sh answered. LICENCE LANDMINE, and the one most likely to be
  stepped on: Apache Kafka is Apache-2.0, but almost every tutorial reaches for
  Confluent's cp-* images, and confluentinc/schema-registry is under the Confluent
  Community License (S803) - source-available, explicitly binding on anyone distributing
  the software, an automatic rejection here. Redpanda, the other reflex, is BSL 1.1
  (S804). If a schema registry is ever needed, Apicurio Registry is Apache-2.0 (T213,
  S811). Only one archetype touches streaming, so none of this is urgent - but the trap
  is well disguised.
