notes: >
  The warehouse of record in a large fraction of banking, insurance and government estates. NOT
  CONTAINERIZABLE: Db2 for z/OS runs on z/OS, and z/OS is not available as a container image on
  any platform. Db2 on Linux is a different product with a different dialect. PROPOSED PROXY: do
  not emulate the database at all. The agent-facing artifact in a real mainframe-sourced pipeline
  is almost never the mainframe -- it is a fixed-width extract file that arrives on a schedule
  with a copybook beside it. Simulate THAT (T294) and the batch window (T271), and the interesting
  surface is fully preserved. Note sqlglot 30.18.0 has no db2 dialect (measured by T3 2026-09-13),
  so even a dialect-shim route is unavailable.
