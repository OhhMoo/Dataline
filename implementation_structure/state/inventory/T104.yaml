fidelity_gap: >
  The real fidelity question is not the server, it is execution state. A033 grades
  reproducibility repair, which turns on out-of-order cell execution and a stale kernel
  namespace - properties of the .ipynb execution_count and the live kernel, not of the
  UI. Those are reproducible, but only if the harness seeds and inspects execution_count
  and kernel restarts deliberately. A notebook surface that always runs top to bottom
  cannot express A033 at all.
