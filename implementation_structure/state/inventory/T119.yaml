fidelity_gap: >
  Postgres wearing a Redshift name has no DISTKEY, SORTKEY, VACUUM, ANALYZE-driven
  planning or WLM queues, and no columnar storage. Every classic Redshift incident -
  skew, an unsorted region, a queue backing up - is therefore inexpressible. What
  survives is the SQL dialect, and only approximately.
