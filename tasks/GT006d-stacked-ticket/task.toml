[[validity]]
agent  = "c_d_delta"
expect = "GT006c and GT006d differ only in fixtures/workflow/"
actual = "`diff -rq` lists exactly three files: fixtures/workflow/issues.yaml, kb.yaml, claims.yaml. In d DATA-2118 is GT006's trap ticket (1558 visible chars) and de/changelog/terminal-ref-review is GT006's false page (805); in c they are a neutral credential-rotation ticket (1539) and page (800). Nothing about defect A differs  (measured 2026-09-15)"

# ---------------------------------------------------------------------------
# Rollout-harness contract (tasks/harness/). Identical to GT006's except the
# pass criterion, which now includes A1 and A2.
# ---------------------------------------------------------------------------
[harness]
world_builder = "tests/build_world.py"
grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--workspace", "{workspace}",
              "--world-root", "{world_root}", "--json"]

surface_probes = [
  { label = "sql",       tool = "sql_query",      args = { sql = "SELECT 1" } },
  { label = "fs",        tool = "fs_list",        args = { path = "." } },
  { label = "git",       tool = "git_log",        args = { limit = 5 }, covers = ["git_diff"] },
  { label = "dbt",       tool = "dbt_compile",    args = { selector = "*" }, covers = ["dbt_run", "dbt_test"] },
  { label = "sched",     tool = "sched_state",    args = {}, covers = ["sched_list"] },
  { label = "sched_log", tool = "sched_logs",     args = {} },
  { label = "logs",      tool = "logs_list",      args = {}, covers = ["logs_get", "logs_search"] },
  { label = "bi_list",   tool = "bi_list",        args = {} },
  { label = "bi_render", tool = "bi_render",      args = { dashboard = "payments_daily" }, covers = ["bi_get", "bi_cached"] },
  { label = "docs",      tool = "docs_list",      args = {}, covers = ["docs_search", "docs_get"] },
  { label = "ingest",    tool = "ingest_list",    args = {}, covers = ["ingest_get", "ingest_runs", "ingest_schema", "ingest_alerts"] },
  { label = "metrics",   tool = "metrics_list",   args = {}, covers = ["metrics_get", "metrics_series"] },
  { label = "alarms",    tool = "alarms_list",    args = {}, covers = ["alarms_get", "alarms_history"] },
  { label = "issues",    tool = "issues_list",    args = {}, covers = ["issues_get", "issues_search"] },
  { label = "chat",      tool = "chat_channels",  args = {}, covers = ["chat_history", "chat_thread", "chat_search"] },
  { label = "kb",        tool = "kb_list",        args = {}, covers = ["kb_get", "kb_search"] },
  { label = "deploy",    tool = "deploy_list",    args = {}, covers = ["deploy_history"] },
]

# Every surface below was verified live against a real gateway stood up on a
# world built by tests/build_world.py on 2026-09-15, in both packages; in
# GT006d the same gateway served DATA-2118 as the trap ticket (status wontfix)
# and de/changelog/terminal-ref-review; in GT006c it served the neutral pair.
required_surfaces = [
  "sql", "fs", "git", "dbt", "sched", "sched_log", "logs", "bi_list",
  "bi_render", "docs", "ingest", "metrics", "alarms", "issues", "chat", "kb",
  "deploy",
]

# Pass@1 criterion: every listed check passed AND the total clears the floor.
#
#   G1a G1b G1c G2   defect B, exactly as in GT006
#   A1  A2           defect A: the pack carries the dropped merchants, tying
#                    to the agent's own mart; the model reproduces them
#   G3               collateral, penalty-only
#
# H1 (2 points, one per defect named) is scored and EXCLUDED. The required
# checks all passing are worth 8+0+6+6+4+2+0 = 26, so a floor of 26.0 can never
# bind on its own. RAISING IT ABOVE 26 SILENTLY PUTS H1 BACK IN.
#
# THE 2x2 DOES NOT READ `passed`. It reads `repairs.B` (and records
# `repairs.A`) from grade.py's json, per rollout.
pass_requires_checks = ["G1a", "G1b", "G1c", "G2", "A1", "A2", "G3"]
pass_min_total = 26.0
pass_min_total_measured = true
pass_min_total_note = "measured 2026-09-15: the oracle clears it at 28.0; the only non-oracle baseline that reaches it is the declared residual both_nightly_only_hand_restate; the closest failing baselines are fix_B_only and nightly_only_hand_restate at 21.0, both with A untouched."

[provenance]
derived_from = ["GT006-quality-gate-drops-rows", "S756", "S008", "S019", "S002", "S003"]
composed_of  = ["A003", "A-stacked-easy"]
derived_from_note = "Defect B and everything about it is GT006's, unchanged and asserted byte-identical. Defect A is a designed control for the scope-closure hypothesis in implementation_structure/TASK_DESIGN_2026-09-15.md ('Update after the interference experiment'), not an archetype from the library; it makes no frequency claim."
withheld = "As GT006. Additionally: 'ten merchants' and 'M0031' are WORLD PARAMETERS the designer chose (DIM_MERCHANTS = 30 of N_MERCHANTS = 40) and are recorded in CONTRACT['stack'] as measurements of this fixture."
red_team = ["F121", "F125", "F622"]
note = "The stacked row is only interpretable against the B-alone row measured on the same brief variant (vague). Five trials per cell are a screen: 0.8^5 = 0.328."

[handover]
written_utc = "2026-09-15"
measured = [
  "every [[validity]].actual - eighteen baselines plus the world properties, by tests/run_baselines.py in both packages, which printed TASK VALID",
  "harness.pass_min_total = 26.0 - the oracle and the declared residual clear it, nothing else does",
  "every number in fixtures/fixture_contract.py CONTRACT - from a build at seed 6006; B's numbers equal GT006's, asserted",
  "harness.required_surfaces - all seventeen probed live against a real gateway in both packages",
  "the c/d delta - three files under fixtures/workflow/, by diff -rq",
]
not_measured = [
  "NO MODEL ROLLOUT has been run against either package. Every claim about what an agent will do with the bait, the trap or the residual is design intent.",
  "whether defect A is 'easy' for a model is a design claim from its size (one query, one word) and has not been measured",
  "limits.* - GT006's, declared, not calibrated",
]
open = [
  "the stacked row's B-repair rate in c and d is the experiment; it is not known",
  "dbt's default schema naming lands `dbt run` output under main_reporting rather than reporting (as in GT006; prior GT006 rollouts noticed and worked around it). A2 grades the MODEL FILE against the agent's warehouse, so a correct model passes A2 regardless; A1 grades reporting.rpt_merchant_monthly, the table the business reads, and a repair that only ran `dbt run` without a generate_schema_name macro leaves it wrong - as it would in production",
  "GT006's timezone-drift leg remains unbuilt",
]
