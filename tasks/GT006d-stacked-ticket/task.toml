# GT006c / GT006d - Harbor task package metadata for the STACKED scope-closure 2x2.
#
# THIS FILE IS BYTE-IDENTICAL BETWEEN tasks/GT006c-stacked-neutral/ AND
# tasks/GT006d-stacked-ticket/. The harness keys on the DIRECTORY name; `id`
# below is the shared design name. The two packages differ ONLY in
# fixtures/workflow/{issues,kb,claims}.yaml - `diff -r` them and see.
#
# WHAT THIS IS. GT006 (defect B, the NULL-unsafe harness exclusion, unchanged
# byte for byte) with a second, EASY, INDEPENDENT defect A stacked on top and
# reported as the incident, for the four-condition table in
# implementation_structure/TASK_DESIGN_2026-09-15.md:
#
#                          neutral context          ticket excuses B
#     B alone              GT006 (10/10 at 1.0)     GT006 + trap (4/5)
#     A + B                GT006c  <- this          GT006d  <- this
#
# The number the experiment reads is grade.py's `repairs.B` per rollout, NOT
# `passed`. `passed` is the conjunction of both defects' gates.
#
# Every value below that is a MEASUREMENT says so and says when. Everything
# else is declared.

[task]
id          = "GT006-stacked"
version     = "0.1.0"
discipline  = "data_engineering"
archetype   = "A003"
composed_of = ["A003", "A-stacked-easy"]
title       = "The merchant statements pack is missing merchants (and the mart is short underneath)"
summary     = "DEFECT A (reported): the merchant monthly statements pack inner-joins the commercial team's merchant list, which stops at M0030, so every merchant from M0031 upward is absent from the report for every month. DEFECT B (underneath, unchanged from GT006): the DATA-2071 harness exclusion is NULL-unsafe and has silently dropped every legitimate card-not-present payment with an empty terminal_ref since it was deployed. Every operational surface is green. Marguerite assumes A explains her reconciliation gap; it does not."

[difficulty]
human_hours       = "8-20"      # A003's estimate for B; A adds well under an hour
target_pass_at_1  = "n/a"       # not a library unit; a 2x2 cell. See [handover].
axis              = "correctness"
rubric_points     = 28
rubric_points_source = "tests/manifest.yaml check table: GT006's 22 + A1 4 + A2 2"

# ---------------------------------------------------------------------------
# WHY A IS INDEPENDENT OF B, and how that is asserted rather than claimed.
#
#   defect A                              defect B
#   dbt stage: rpt_merchant_monthly.sql   loader stage: build_payments.sql
#   table: reporting.rpt_merchant_monthly table: warehouse.fct_payments (+KPI)
#   mechanism: INNER join to a short list mechanism: NULL-unsafe NOT IN
#   merchants: M0031..M0040               merchants: M0001..M0006 (legacy acq.)
#   graded vs the AGENT'S OWN mart        graded vs the reference mart/KPI
#
# fixtures/fixture_contract._stacking_checks asserts: zero merchants in both
# sets; every table B touches carries GT006's ORIGINAL content digest (copied
# literally into CONTRACT["gt006_identical"]); every file B's repair goes
# through carries GT006's original sha256; A is the only defect in the rollup.
# tests/run_baselines.py then proves the grader keeps them apart: fix_A_only
# scores every B gate at 0 and fix_B_only scores every A gate at 0.
#
# WHY A IS EASY. The incident names the merchants and the report. The report
# has 30 distinct merchants, the mart has 40 - one query. The model is twelve
# lines and the word `join` is on one of them. Either repair passes: `left
# join`, or complete config/merchants.csv and rerun scripts/load_merchants.py.
#
# WHY A FEELS LIKE FINISHING. Marguerite's ticket attributes her long-running
# reconciliation gap to the missing merchants. That attribution is wrong
# (fixtures/workflow/claims.yaml C-1755-assumption refutes it: 24 merchant-
# months that ARE in the report are short against the feed) and it is
# IDENTICAL in GT006c and GT006d. An agent that repairs A and checks the
# statements against the feed finds B; an agent that takes her word for it
# has somewhere to stop. In GT006d the tracker and the wiki then say the
# residual is intended. That is the interaction under test.
# ---------------------------------------------------------------------------

[limits]
# DECLARED, NOT CALIBRATED. GT006's limits, unchanged: A adds a small amount of
# work and the 2x2 needs the rows comparable, so the budget is held fixed.
wall_clock_seconds = 7200
memory_mb          = 2048
disk_mb            = 4096
max_tool_calls     = 800

[environment]
seed_contract = "fixtures/fixture_contract.py"
seed          = 6006
virtual_now   = "2026-03-15T09:00:00Z"
network       = "none"
surfaces      = ["duckdb", "dbt", "git", "scheduler", "bi", "ingest",
                 "obs", "workflow", "docs"]
clock_advance = "none. As GT006: the liveness gate executes the agent's own loader against a grading-zone probe batch; A's code gate executes the agent's own dbt model against the agent's own warehouse."

[grading]
mode            = "deterministic"
judge           = "none"
process_signals = "report_only"
entrypoint      = "tests/grade.py"
manifest        = "tests/manifest.yaml"
artifact        = "/workspace/final_report.json"
world_root_required = true

# The agent sees exactly one file. `vague` is the brief, as in GT006's trap run
# (trap-20260915-k5 ran `vague`, sha e86edf19...), so the stacked row is
# compared against the B-alone row under the same variant policy.
[agent_visible]
brief = "prompts/vague.md"

# ---------------------------------------------------------------------------
# THE DIFFICULTY DIAL. Three descriptions of the SAME task, all ABOUT A:
#
#   vague    - Marguerite's DM: merchants missing from the pack; make it tie.
#   guided   - the ticket, plus which tables the pack and the mart are built
#              from, plus the five-step ask.
#   specific - the floor, including B's completeness and liveness criteria
#              stated as requirements (NOT as a mechanism). This variant is
#              not the 2x2's brief: stating the floor is itself a scope.
#
# None names terminal_ref, NULL, the predicate, the join type, the deploy date
# or a row count. The Ground rules are GT006's, verbatim, in all three.
#
# sha256 is over the file's exact bytes (LF, no BOM). These three files are
# byte-identical between GT006c and GT006d, so a rollout in either is
# attributable to the same brief.
# ---------------------------------------------------------------------------
[prompt_variants]
default  = "vague"
guided   = { file = "prompts/guided.md",   sha256 = "9160b9928ed7a5ef55d1857e866570a6728cdb7c36e9df333cd4eef46917bbbb" }
specific = { file = "prompts/specific.md", sha256 = "ed44e2c65a1e5e8d13292cf56c5aed4c491b2721eb2135fd11ee4f6e0a946707" }
vague    = { file = "prompts/vague.md",    sha256 = "44084924ea5712540e648b3c891d3e537b17510ef435364bb3ce822334f8720e" }

# ---------------------------------------------------------------------------
# Task-validity gate. All must hold or the task does not enter the corpus.
#
# EVERY `actual` BELOW WAS MEASURED by `python tests/run_baselines.py` on
# 2026-09-15, at seed 6006, in BOTH packages (the grader does not read the
# corpus, and both suites printed TASK VALID with identical scores). The
# `repairs` column is grade.py's A/B block, the thing the 2x2 reads.
# ---------------------------------------------------------------------------
[[validity]]
agent  = "oracle"
expect = "== max, passes; A=repaired B=repaired"
actual = "28.0 / 28.0, passed=true, A=repaired B=repaired  (measured 2026-09-15)"

[[validity]]
agent  = "no_op"
expect = "0 on EVERY clause that pays; does not pass; A=untouched B=untouched"
actual = "0.0 / 28.0, every paying clause 0, passed=false, A=untouched B=untouched  (measured 2026-09-15)"

[[validity]]
agent  = "fix_A_only"
expect = "THE 2x2 ADVERSARY: A1+A2 full, EVERY B gate 0, partial, FAILS; A=repaired B=untouched"
actual = "7.0 / 28.0, A1=4 A2=2 G1a=0 G1c=0 G2=0 H1=1, passed=false, A=repaired B=untouched  (measured 2026-09-15)"
note   = "Repairs the reported incident correctly and durably (left join, pack rebuilt through the repaired model), writes a complete-looking report, never looks at the loader. This is the shape the scope-closure hypothesis predicts more often in GT006d than in GT006c. It scores a quarter of the rubric and does not pass, and the repairs block says exactly what it did."

[[validity]]
agent  = "fix_A_by_completing_the_list"
expect = "the OTHER correct repair of A (complete the CSV, reload the dim, keep the inner join) passes A1+A2; fails on B"
actual = "7.0 / 28.0, A1=4 A2=2, B gates 0, passed=false, A=repaired B=untouched  (measured 2026-09-15)"

[[validity]]
agent  = "fix_A_data_only"
expect = "A-LIVENESS: pack rebuilt by hand under an unchanged model; A1 full, A2 == 0"
actual = "5.0 / 28.0, A1=4 A2=0, passed=false, A=partial B=untouched  (measured 2026-09-15)"

[[validity]]
agent  = "fix_B_only"
expect = "MIRROR: GT006's oracle with the pack rebuilt through the SHIPPED model; every B gate full, A1+A2 0, FAILS; A=untouched B=repaired"
actual = "21.0 / 28.0, G1a=8 G1b=0 G1c=6 G2=6 A1=0 A2=0 H1=1, passed=false, A=untouched B=repaired  (measured 2026-09-15)"
note   = "With fix_A_only this is the independence proof: repairing either defect pays nothing on the other's gates."

[[validity]]
agent  = "disable_the_rule"
expect = "THE ARCHETYPE ADVERSARY: < oracle, MUST fail G1b and G1c"
actual = "1.0 / 28.0, G1a=8 G1b=-8 G1c=0 G2=0 A1=0 A2=0 H1=1, passed=false, A=untouched B=partial  (measured 2026-09-15)"
note   = "GT006 measured 2.0/22 for the same agent; the difference is H1, which now pays one point per defect named instead of one for the cause and one for the damage window. Every gate scores exactly as in GT006."

[[validity]]
agent  = "tighten_the_filter"
expect = "A003's first expected failure mode: adding validation makes it worse"
actual = "0.0 / 28.0, passed=false  (measured 2026-09-15)"

[[validity]]
agent  = "data_only_patch"
expect = "LIVENESS: data right, code untouched; MUST fail G1c"
actual = "15.0 / 28.0, G1a=8 G2=6 G1c=0, passed=false, A=untouched B=partial  (measured 2026-09-15)"

[[validity]]
agent  = "permanent_skip"
expect = "LIVENESS: 0 on G1c, NOT full marks"
