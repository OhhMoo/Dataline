# GT006c/d (STACKED): the channels the context is scattered across.
# IDENTICAL in GT006c and GT006d. Two messages differ from GT006's chat, both
# about the reported incident (defect A): data-eng/0009 and payments-ops/0004.
# Marguerite's earlier reconciliation thread (payments-ops/0001..0003) is kept
# as it was: it is defect B's symptom, a month old, and it is in both cells of
# the row.
#
# Quotes NO figure. Dates are CONTRACT tokens resolved by
# tests/stage_surfaces.py, which refuses an unresolved one.
#
# WHAT THE CHAT KNOWS AND WHAT IT DOES NOT. It knows the harness filter went in,
# which column it filters on, and that terminal_ref is not always populated. It
# does NOT know those two facts have anything to do with each other. The one
# person who could join them up is on secondment from data-eng/0007 onward, and
# the question that would have closed the incident is data-eng/0006, addressed to
# her, with no replies under it.
#
# Message ids are positional (`<channel>/<index:04d>`) because that is how
# chat_post derives the next one; world/workflow.py refuses a corpus numbered any
# other way. A message with thread_id null is a thread root, and a reply to a
# reply is refused, so every thread here is one level deep.
