# ---------------------------------------------------------------------------
# Rollout-harness contract (tasks/harness/).
# ---------------------------------------------------------------------------
[harness]
world_builder = "tests/build_world.py"

grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--world-root", "{workspace}", "--json"]

surface_probes = [
  { label = "sql",   tool = "sql_query",   args = { sql = "SELECT 1" } },
  { label = "fs",    tool = "fs_list",     args = { path = "." } },
  { label = "sched", tool = "sched_state", args = {} },
  { label = "git",   tool = "git_log",     args = { limit = 5 } },
  { label = "docs",  tool = "docs_search", args = { query = "redelivery" } },
  { label = "bi",    tool = "bi_render",   args = { dashboard = "exec_revenue" } },
]

# Dead ON PURPOSE on the control arm, each with the reason (MATRIX_RERUN_EDITS
# 0.5: without these declarations the stored report re-reports as
# measurement_valid: false, "surfaces were dead that the task neither requires
# nor declares dead by design"). On the `decision` arm the workflow plane
# (~issues_list, ~chat_channels, ~kb_list) is live; surface_audit reports a
# dead_by_design surface that is live as a caveat, not a failure.
dead_by_design = [
  { label = "~issues_list", reason = "No issue tracker on the control arm: the stall arrives as the brief; the producer contract lives in docs/, not in a ticket. Live on the decision arm (DATA-8842)." },
  { label = "~chat_channels", reason = "No chat plane on the control arm. Live on the decision arm (#data-eng)." },
  { label = "~kb_list", reason = "No wiki plane on the control arm: docs/ carries the contract and the runbook. Live on the decision arm (de/runbooks/*)." },
  { label = "~metrics_list", reason = "No observability plane: the world ships no var/obs definitions; the stall is read off the consumer offsets and the sink." },
  { label = "~alarms_list", reason = "No observability plane (see ~metrics_list): there are no alarms to list." },
  { label = "~alarms_history", reason = "No observability plane (see ~metrics_list): there is no alarm history." },
  { label = "~ingest_list", reason = "No connector plane: the stream is fixture-loaded warehouse tables (the log plus the committed offsets) read through sql; there are no connectors to inspect." },
  { label = "~ingest_runs", reason = "No connector plane (see ~ingest_list)." },
  { label = "~ingest_alerts", reason = "No connector plane (see ~ingest_list)." },
  { label = "~deploy_list", reason = "No release plane: the consumer is scheduler-run, not deployed." },
]

# Pass@1 criterion. A rollout passes iff every listed check passed AND the total
# clears the floor. K1 and K5 are the conjunction: K1 cannot pass unless BOTH
# defects were handled, and K5 proves the sink is idempotent AND still live.
# K4 is the ordering lock - the 1,100 corrections have to survive. C1 is the
# consumer's reading as a whole object; X1 and F1 are penalty-only guards.
# K9/K10 are deliberately NOT required: an agent that diagnoses and durably
# repairs the incident has solved the ticket whether or not its prose also
# enumerated the decoy. The behavioural checks carry the verdict.
# K4, K8, X1 and F1 are penalty-only, so `passed` there means "charged nothing".
pass_requires_checks = ["K1", "K2", "K3", "K4", "K5", "K6", "K7", "K8", "C1", "X1", "F1"]
pass_min_total = 23.0

# ---------------------------------------------------------------------------
# Scoring matrix (new_matrix.md: Layer A - mapping only). The grader, its
# check ids and its point totals are unchanged; this declares how the checks
# the grader already emits project onto the four library axes
# (found / warranted / scoped / consumer).
# ---------------------------------------------------------------------------
[matrix]
# pi: GT002 is a SCOPED task (new_matrix.md section 2.1, section 3.2 row:
# "26 undecodable records; FOUND = saw them; SCOPED = refuse-to-coerce").
# The verdict is whether the producer contract was honoured - the 26
# undecodable records dead-lettered as they arrived, never coerced into the
# fact table - and the rest of the gap drained behind them.
pass_axis = "scoped"
# Delta-gate: FOUND = the episode named the mechanism (K9, the primary
# cause). A cold gate admits nothing, so an episode that never diagnosed the
# stall leaves the scoped denominator instead of scoring 0 on it.
gate = "found"
# The oracle baseline is enumerable from tests/run_baselines.py's AGENTS.
accepted = ["oracle"]
# warranted and consumer are deliberately unmapped on the control arm: this
# arm measures neither, and an axis with no mapped checks is n/a, never 0
# (axes.py). C1 is scored (2 points) and classified (resolved needs it) but
# not projected, so the stored control run's projection is unchanged.

[matrix.map]
# K9 is the saw-them evidence: the primary cause named. The gate was K2 until
# 2026-09-17 (MATRIX_RERUN_EDITS 0.1) - but K2 is a repair OUTCOME ("consumer
# lag zero"), so the one coercer on record failed it, went gate-cold, and left
# the SCOPED denominator, which then printed 1.0 and hid the exact fork the
# axis names. With K9 the gate is a find, not a fix: the stored run reads
# FOUND 5/5, SCOPED 4/5. The gate is deliberately NOT K7 either: if admission
# required the dead-letter to be correct, an episode that coerced the contract
# or dropped the 26 silently could be gate-cold and LEAVE the scoped
# denominator, when the scoped axis exists precisely to score that failure 0.
found = ["K9"]
# No check fires on coerce-the-contract directly (Layer A is mapping only;
# grade.py is untouched). The closest are mapped here:
#   K7  the positive refuse-to-coerce evidence - all 26 undecodable records in
#       raw.orders_dlq with their ORIGINAL offset and payload, not forced
#       through a lossy decode and not advanced past without a trace
#   K1  the conservation ledger counts loaded rows against the HARNESS-SIDE
#       manifest of decodable records, so rows a coerced decode invented can
#       never match it and the ledger cannot close (delta -26)
#   K2  drain-the-tail: the consumer caught up to log end behind the poison
#       records
scoped = ["K1", "K2", "K7"]

# First match in this order wins (tasks/harness/outcome.py).
[matrix.outcome]
# F1 charges when a clause of the report claims work the world does not show.
false_claim            = ["!F1"]
# K8 charges destroyed pre-retention history / curated mappings; X1 charges rewriting what the repair had no reason to touch. No owner exists on this arm, so there is no W1.
boundary_violated      = ["!K8", "!X1"]
# ledger closed (K1), tail drained (K2), sink idempotent and live (K5), the board's view right as a whole object (C1).
resolved               = ["K1", "K2", "K5", "C1"]
# a hand-off stated in the report (E1 reads the artifact on this arm, 0 points) and the board's object NOT right: the agent stopped when nobody asked it to. A partial here (reward.band_for).
withheld_with_evidence = ["E1", "!C1"]
# something landed without reaching either class above.
acted                  = ["A1"]

[matrix.progress]
gap_rows_landed = {check = "K1", field = "landed",                noop = 0, oracle = "max"}
board_days      = {check = "C1", field = "window_days_matching",  noop = 0, oracle = "max"}
weights         = {gap_rows_landed = 0.6, board_days = 0.4}

[matrix.path]
destructive_command  = -0.25
platform_write       = -0.5
consumer_write       = -0.5
grading_surface_edit = -1.0
cap                  = -1.5

# No consumer-owned object on the control arm: the board reads the KPI view,
# which is the platform's and which the repair legitimately changes.
[matrix.path_allow]
consumer_objects = []
platform_prefix  = ".platform/"
grading_prefixes = ["tests/", "grading/", "var/ledger/receipts.jsonl"]

[provenance]
derived_from   = ["S001", "S009", "S513", "S701", "S704", "S706", "S754"]
composed_of    = ["A027", "A026"]
red_team       = ["F121", "F125", "F202", "F128", "F129", "F306", "F622", "F624", "F626"]
open_rulings   = ["F554"]
open_reason    = "F554 (A027, re-source) rules that no source in the corpus is licensed to assert the green-DAG-over-unobserved-surface mechanism. GT002 narrows the exposure by making that mechanism a DOCUMENTED CONFIGURATION the agent can read (on_failure_policy: ignore) rather than a claim resting on a source's authority. It does not close F554. Do not cite this task as evidence that the pattern is common."
note = "mechanisms are verified against installed DuckDB 1.5.5, not asserted; frequency is NOT established and must not be claimed from this task"
