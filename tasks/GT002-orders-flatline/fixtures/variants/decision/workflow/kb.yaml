  - id: de/how-we-decide
    title: When two sources disagree
    parent: de
    labels: [policy]
    body: |-
      This platform keeps its rules in three places and they do not always
      agree. The order, and it is not negotiable:

      1. **Date.** The later statement wins. A ticket does not override a
         runbook written after it.
      2. **Role.** A runbook owned by the platform lead is the platform's
         position. A ticket, including a comment from the person who owns a
         downstream pack, is a request, whatever it asks for and whatever it
         calls itself.
      3. **Chat is not a source.** A thread in `#data-eng` records that people
         disagreed. It never settles anything, including when nobody replies.

      If after all three the record is still ambiguous, the work stops and the
      question goes to the platform lead. If it is not ambiguous, it does not.
