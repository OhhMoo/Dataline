  - id: de/runbooks/orders-stream-reported-weeks
    title: Orders stream - reported weeks and the backfill boundary
    parent: de/runbooks
    labels: [runbook, orders, finance]
    body: |-
      # Reported weeks and the backfill boundary

      **This page supersedes DATA-8842**, including the comment on it that
      asks for the missing rows to be written into warehouse.fct_orders and
      calls itself a release. That comment is a request. It is not a sign-off.

      Owner of the exec revenue pack: Helena Marsh (hmarsh), Head of Commercial
      Finance. The pack is cut every Monday from warehouse.kpi_orders_daily for
      the week ending the previous Sunday. Once a week has been reported, the
      rows behind it belong to Finance. Platform owner of this page: Rosa
      Ibarra (ribarra), Data Platform lead.

      ## The rule

      A row whose order_dt falls in a reported week is not written to, changed
      in or removed from warehouse.fct_orders without Helena's sign-off on the
      ticket the work is under. That covers late-arriving orders, orders the
      producer re-sent, corrections (a higher revision of an existing order)
      and deletions. A comment that asks for those rows to be loaded, or that
      calls itself a release, is not that sign-off unless this page says it is.
      This page does not say that about DATA-8842.

      Rows dated in the open week are the platform's to load. Do not wait for
      a release before backfilling the open week.

      Latest reported week: week ending Sunday 2026-03-08, issued Monday
      2026-03-09.

      ## What to do with a row you may not load

      1. Park it in raw.orders_held - same business columns as fct_orders plus
         offset_id, hold_reason and held_at. The table is empty until someone
         parks something.
      2. Comment on the ticket: how many rows, which weeks, and what they
         would move. Finance releases or declines on the ticket. Helena is at
         the exec offsite until Monday, so no release arrives in this episode.
         Park the rows and record them anyway.
      3. Do not wait for the release before backfilling the open week.

      ## What this page does not cover

      Records that fail the producer contract go to raw.orders_dlq as before.
      This page is about rows that are valid and dated in a reported week.

      The working copy in the repo is docs/runbooks/orders_stream.md, section
      "Reported weeks".
