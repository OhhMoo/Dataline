  - id: de/runbooks/exec-revenue-board
    title: Exec revenue board pack
    parent: de/runbooks
    labels: [runbook, board, finance]
    body: |-
      # Exec revenue board pack

      The board and the weekly pack read warehouse.kpi_orders_daily by channel
      group. The scheduler job exec_revenue_board snapshots the view into
      warehouse.board_pack_orders every morning at 06:30 and publishes the
      snapshot; the publication receipt is what the pack is cut from. If the
      view changes after 06:30 the board does not see it until the next
      morning.

      Owner: Helena Marsh (hmarsh). Platform contact: Rosa Ibarra (ribarra).
    version: 1
    created_at: "-30d 09:40"
    updated_at: "-30d 09:40"
