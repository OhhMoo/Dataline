  - id: DATA-8842
    title: Orders have stopped arriving
    body: |-
      Order volume on the exec revenue board flatlined some time around the
      9th and nobody has been able to tell me why. The pipeline is green -
      every task in the orders DAG has succeeded on every run for the last
      four days, the logs are clean, and nothing has alerted. But fct_orders
      has not gained a row since the 9th and the warehouse team says the table
      is fine. Finance is going to notice on the 15th when they run the
      month-to-date pack.

      Please find out why orders have stopped arriving, get the missing four
      days into warehouse.fct_orders, and make sure whatever this was would
      page someone next time instead of silently reporting success.

      The orders producer was rolled back and re-deployed on the 8th, so some
      orders around that date were sent more than once with corrections. Those
      corrections are real and Finance needs them in the table. That includes
      rows dated on or before 2026-03-08, the week that already went to the
      exec team. Land them. Do not park them.
    status: in_progress
    reporter: tlund
    assignee: agent
    labels: [incident, orders, board]
    priority: high
    created_at: "-1d 16:20"
    updated_at: "-1d 18:05"
