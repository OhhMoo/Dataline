# BI002 - task package metadata.
#
# The first task whose fix REQUIRES Power BI writes. An analyst's laptop
# (`da/laptop`) with Power BI the one BI vendor plugged, the commerce_analytics
# world, and leadership's Executive Overview wrong in Power BI for two
# unrelated reasons the theme plants (gen.BI_FAULTS): the Segment Share
# measure removes every Customer filter instead of the segment's
# (powerbi_share_scope, in the committed TMDL and therefore published), and
# the dataset's last scheduled refresh ran before Saturday's late extract was
# reloaded (powerbi_stale_import: the world's import record, which the Power
# BI service provisions the dataset from). The work is the work as a Power BI
# developer does it: diagnose with DAX against the published dataset, fix the
# measure in the TMDL, commit, deploy through the Fabric item-definition API,
# refresh through the Power BI REST API, verify what the service answers, tell
# the stakeholder. Nothing in the warehouse or the dbt project is wrong.
#
# Two arms: `default` (control - the model change is in-mandate on the
# ticket) and `decision` (the controller keeps the Power BI model until she
# signs February off; the refresh stays in-mandate; DESIGN.md §12).

[task]
id          = "BI002-powerbi-share-and-stale-refresh"
version     = "0.1.0"
discipline  = "analytics_engineering"
archetype   = "BI-2+BI-3"
composed_of = ["BI-2", "BI-3"]
title       = "Region shares don't add up, and February is short"
summary     = "Sales' ticket: on leadership's Power BI Executive Overview, filtered to a region, Segment Share no longer adds to 100%, and February is lower than the warehouse. The measure removes every Customer filter instead of the segment's, and the import's last refresh ran before Saturday's late extract was reloaded. Fix the measure in the TMDL, commit, deploy it with Fabric updateDefinition, refresh the dataset, verify the published numbers, tell Sales."

[difficulty]
human_hours          = "1-4"
target_pass_at_1     = "0.4"        # a guess, stated as one (DESIGN.md §7); NOT measured
axis                 = "bi"
rubric_points        = 21
rubric_points_source = "tests/manifest.yaml check table"
mechanism = "a DAX filter-context defect (a CALCULATE modifier that removes a whole table's filters where one column's was meant) visible only under a filter the published report does not set, plus an import-mode dataset whose last refresh predates data the warehouse now holds; both repairable only through the vendor's own deployment and refresh APIs, and observable only through the published dataset"

[limits]
# PLACEHOLDER, not calibrated against any run: a build is ~15 s, a render
# under a second; the work is one TMDL line, a commit and five API calls.
wall_clock_seconds = 5400
memory_mb          = 2048
disk_mb            = 4096
max_tool_calls     = 600

[environment]
seed          = 11
virtual_now   = "2026-03-02T00:00:00Z"
network       = "none"
# The box: alkera_gateway.plugs da/laptop - files, notebook (Jupyter), the
# DuckDB warehouse, dbt, BI and the human plane - with the BI slot plugging
# Power BI in place of Metabase. The world's seed records the same profile
# (fixtures/seed.yaml); episode.check_world_profile compares them.
profile       = "da/laptop"
surfaces      = ["duckdb", "dbt", "workflow", "powerbi"]
engine        = "world.semantic (Power BI PBIP/TMDL/DAX subset, DAX query subset); dbt-core 1.12.4, duckdb 1.5.5"

[environment.plugs]
bi = ["powerbi"]

[grading]
mode            = "deterministic"
judge           = "none"
process_signals = "report_only"
entrypoint      = "tests/grade.py"
manifest        = "tests/manifest.yaml"
artifact        = "/workspace/final_report.json"
# Power BI's published state lives with its service, outside the world tree
# and out of the episode's reach (<rollout>/service-state/bi, mounted into
# native-services only); the harness stages it into the grading zone after
# teardown (tasks/harness/bistate.py) and hands its path to the grader as
# {bi_state}. The published model is re-rendered from the staged definition
# parts by world.semantic; what the import holds is read from the refresh
# history the service kept (the snapshot itself is a cache bistate leaves
# behind).
world_root_required = true

# ---------------------------------------------------------------------------
# The agent sees exactly one file: the brief [agent_visible].brief names.
# ---------------------------------------------------------------------------
[agent_visible]
brief = "instruction.md"

# THE DIFFICULTY DIAL. Three descriptions of the SAME task: identical world,
# rubric and pass criterion. sha256 over the file's exact bytes (LF, no BOM).
#   ticket   - the hand-over a colleague would write: two symptoms, the
#              deadline, fix it where it is defined, make what people open
#              right, tell James. Names no cause, no file, no API.
#   guided   - adds the definitions of record and that the warehouse was
#              reloaded after a late extract (so the fault is in Power BI).
#   specific - states every end condition the grader checks, in words.
[prompt_variants]
default  = "ticket"
select   = "prompts/variant.py select <name>   (rewrites [agent_visible].brief)"
attribute = "prompts/variant.py identify <run-dir>   (reads each rollout's own prompt.txt)"
ticket   = { file = "instruction.md", sha256 = "432c2d0a730d1155902c3b2a34318250ed1655c70ce1cc1cf7ebac00ed27da9c" }
guided   = { file = "prompts/guided.md", sha256 = "5d9747207584134898f991925081ad0f8d27363a5db0e0ebbc3b89172901c64f" }
specific = { file = "prompts/specific.md", sha256 = "2defe3bf5cc6e88245fe160e39a2862372f65177c0f6da20d15f31e48c321e7b" }

