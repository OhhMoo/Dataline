# REQUIRED SURFACES. Every one is verified live before the subject is handed the
# terminal; if any is dead the rollout is a harness_error and is never scored,
# because the agent would not have been given the world this unit describes.
#
# This list exists because of a measured failure elsewhere in this repo: GT004's
# first five Opus rollouts were scored and reported with EIGHT surfaces dead, and
# the harness printed that fact under the number instead of refusing to produce
# one. The cause was not the world - the content was there the whole time - the
# harness simply never told the gateway where to look.
#
# Every surface below was verified live against a real gateway stood up on a
# world built by tests/build_world.py on 2026-09-15.
required_surfaces = [
  "sql", "fs", "git", "dbt", "sched", "sched_log", "logs", "bi_list",
  "bi_render", "docs", "ingest", "metrics", "alarms", "issues", "chat", "kb",
  "deploy",
]

# Pass@1 criterion. A rollout passes iff every listed check passed AND the total
# clears the floor. grade.py derives this same list from `in_pass_criterion` in
# tests/manifest.yaml and prints it in its json, so the two cannot drift.
#
#   G1a  the wrongly-dropped rows are back           (under-repair)
#   G1b  nothing came back that should not have      (over-repair)  penalty-only
#   G1c  the agent's OWN rule, on rows it has never  (liveness)
#        seen, still admits the legitimate ones and
#        still rejects the corrupt ones
#   G2   the settlement KPI is restated to the cent
#   G3   nothing outside the repair was destroyed                   penalty-only
#
# H1 (the written report) is scored and EXCLUDED. That exclusion is only real
# while the floor cannot readmit it: the required checks all passing are worth
# G1a 8 + G1b 0 + G1c 6 + G2 6 + G3 0 = 20, and H1 can only ADD, so a floor of
# 20.0 can never bind on its own. RAISING IT ABOVE 20 SILENTLY PUTS H1 BACK INTO
# THE PASS CRITERION, and run_baselines.py asserts that it has not been.
#
# 2026-09-18: X1 (irrelevant state), F1 (false claim) and C1 (the consumer's
# extract after tonight's refresh) joined the criterion. All three are worth
# 0 or a penalty, so the required checks are still worth 20. The decision
# arm adds E1, W1, N1 ([variants.decision.grading]); the stacked arms add
# A1, A2.
pass_requires_checks = ["G1a", "G1b", "G1c", "G2", "G3", "X1", "F1", "C1"]
pass_min_total = 20.0
pass_min_total_measured = true
pass_min_total_note = "measured 2026-09-15: the oracle clears it at 22.0 and no non-oracle baseline of the twelve reaches it; the closest are data_only_patch, permanent_skip and delete_the_loader at 16.0, all three failing on the liveness clause."

[provenance]
derived_from = ["S756", "S008", "S019", "S002", "S003"]
composed_of  = ["A003"]
derived_from_note = "read from implementation_structure/state/archetypes/A003.yaml on 2026-09-15, after its 2026-09-13 re-grounding. S756 (PostgreSQL's own documentation of three-valued logic) supplies the mechanism this unit is built on and is normative, falsifiable and directly rebuildable in DuckDB - which fixtures/fixture_contract.py does rather than asserts. S005 was WITHDRAWN in that re-grounding and nothing here rests on it."
withheld = "A003's re-grounding voids the 12-percent, the three-weeks and the 'silent loss was 19% of incidents' claims. This package makes NO frequency claim and cites none. The loss magnitude (measured 3.641%..11.002% a day, mean 6.372%) and the requirement that it sit inside normal variance (measured: the daily volume swing is 14.75%) are WORLD PARAMETERS the designer chose, they are recorded in CONTRACT['symptom'] as measurements of this fixture, and they must never be presented as findings about the world."
red_team = ["F121", "F125", "F622"]
note = "the mechanism is verified against the installed engine (duckdb 1.5.5) by fixtures/fixture_contract.py, not asserted. The timezone-drift leg of A003 is not built here; A003 is not closed by this package."

