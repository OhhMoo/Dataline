# GT006 - Harbor task package metadata.
#
# A CALIBRATED DIFFICULTY UNIT, not a world. agent.md section 8.10: hold ~20
# units each measured near a single-unit pass rate of 0.8, then compose 3-4 into
# one world. This package is one mechanism with one discriminating gate, and it
# is deliberately small: a unit measured at 1.0 contributes nothing to a
# composition, and neither does one at 0.0, and a six-gate monolith measures the
# conjunction rather than the mechanism.
#
# Every value below that is a MEASUREMENT says so and says when. Everything else
# is declared.

[task]
id          = "GT006-quality-gate-drops-rows"
version     = "0.1.0"
discipline  = "data_engineering"
archetype   = "A003"
composed_of = ["A003"]
title       = "The payments mart is short against the processor feed"
summary     = "A data-quality rule written to keep the processor's test harness out of the payments mart is NULL-unsafe, and has silently dropped every legitimate card-not-present payment whose terminal_ref is empty since the day it was deployed. Every operational surface is green."

[difficulty]
human_hours       = "8-20"      # A003's own estimate
target_pass_at_1  = "0.80"      # the unit library's target; see [handover]
axis              = "correctness"
rubric_points     = 22
rubric_points_source = "tests/manifest.yaml check table; equals A003's rubric_points"
rubric_points_stacked = 28
rubric_points_stacked_source = "the `stacked-neutral`/`stacked-ticket` arms add A1 (4) and A2 (2) for defect A; tests/manifest.yaml marks both rows `requires_stack: true` and grade.py filters them out for the other two arms, so `max` derives from the arm"

# ---------------------------------------------------------------------------
# WHY THIS UNIT IS ORTHOGONAL TO GT004 (A009), and why that matters more than
# it sounds. GT004's mechanism is GAIN: an append-mode re-run doubled a window,
# and a table->incremental switch left stale-layout rows. This unit's mechanism
# is LOSS, and the two do not overlap anywhere that composition could confuse:
#
#   GT004                              GT006
#   duplicate business keys > 0        duplicate payment_ids == 0, ASSERTED by
#                                      fixture_contract._property_checks
#   rows PRESENT that should not be    rows ABSENT that should be; extra_rows
#                                      == 0, asserted the same way
#   materialisation changed            materialisation is incremental
#                                      throughout and never changed
#   repaired by de-duplicating         de-duplication finds nothing to do
#   repair risk: destroying manual     repair risk: re-admitting corrupt rows
#   adjustments by reloading             by widening the rule
#
# An agent that has learned "the numbers moved, look for duplicates" from GT004
# finds no duplicates here and must argue from a row that is not there, which is
# the harder direction. That contrast is the reason the two compose instead of
# teaching the same lesson twice.
#
# WHAT A003 DESCRIBES THAT IS DELIBERATELY NOT BUILT. The archetype also carries
# a UTC-to-local timezone drift. It is a second, independently-failing mechanism;
# including it would turn a ~0.8 unit into a ~0.64 one and make this package
# compose worse. It belongs in its own unit. tests/manifest.yaml records the same
# decision next to the gate it would have been.
# ---------------------------------------------------------------------------

[limits]
# DECLARED, NOT CALIBRATED. Scaled off GT004's 10800s/1200 calls for its 20-40
# human-hours against A003's 8-20, then held generous because the detection step
# here is a distribution argument rather than a lookup. Raise or lower on the
# first K>=5 run that shows budget exhaustion in the classifier; a task whose
# failures classify as `budget` is measuring the limit, not the model.
wall_clock_seconds = 7200
memory_mb          = 2048
disk_mb            = 4096
max_tool_calls     = 800

[environment]
# fixtures/fixture_contract.py's CONTRACT is the single source of truth for
# every row count, date and hash. Nothing downstream hardcodes one.
seed_contract = "fixtures/fixture_contract.py"
seed          = 6006
virtual_now   = "2026-03-15T09:00:00Z"
network       = "none"
# Declared surfaces must match what the world actually seeds. A declared-but-
# unseeded surface is not cosmetic: GT002 shipped a bi_render probe for a
# dashboard that existed nowhere, so the probe failed against every world the
# harness could build. `surface_probes` below is the operational check on this
# list and `required_surfaces` is the gate.
surfaces      = ["duckdb", "dbt", "git", "scheduler", "bi", "ingest",
                 "obs", "workflow", "docs"]
clock_advance = "none. This unit does not advance the clock: the liveness gate executes the agent's own loader against a grading-zone probe batch instead, which is cheaper, needs no scheduler machinery, and measures the same durability property - does tonight's load do the right thing on data nobody has looked at."

[grading]
mode            = "deterministic"   # the official score has zero LLM involvement
judge           = "none"
process_signals = "report_only"
entrypoint      = "tests/grade.py"
manifest        = "tests/manifest.yaml"
artifact        = "/workspace/final_report.json"
# G1c executes the agent's OWN pipeline file against a copied world and G3 diffs
# the world tree, so the grader cannot be run without the workspace or the root.
world_root_required = true

# ---------------------------------------------------------------------------
# The agent sees exactly one file: the prompt variant [agent_visible].brief
# points at. No author prose ships - it would enumerate the planted defect.
# There is deliberately NO instruction.md: a fourth copy of the ticket that no
# variant lock covers is how the shipped prompt drifts away from the graded one.
# ---------------------------------------------------------------------------
[agent_visible]
brief = "prompts/vague.md"
# Each stacked arm names its OWN brief through `[variants].<arm>.prompt`, which
# taskspec.load() resolves in place of this line. `default` and `trap-ticket`
# read this one.

# ---------------------------------------------------------------------------
# THE DIFFICULTY DIAL. Three descriptions of the SAME task: identical world,
# identical rubric, identical pass criterion. Only the ticket changes. This is
# how a unit is tuned toward 0.8 without touching the world or the grader.
#
#   vague    - a stakeholder who cannot name what is wrong. No table, no job, no
#              date, no confirmation that a defect exists at all.
#   guided   - names the symptom and the two relations between which the
#              shortfall must sit. Not the cause, not the column, not the date.
#   specific - states what must be TRUE at the end, including that some rows are
#              excluded on purpose and that a paused load does not count. The
#              floor, not a walkthrough.
#
# None of the three names terminal_ref, NULL, the predicate, the deploy date or
# the row count. Every one states the same ground rules, so a rubric clause can
# never charge an agent for behaviour no variant warned it about - in
# particular, `raw.payments_landing` is declared read-only in all three because
# G3 penalises modifying it, and `build_payments.sql` is declared to be the
# nightly load in all three because G1c executes it.
#
# sha256 is over the file's exact bytes (LF, no BOM). A prompt that changes under
# a frozen lock invalidates every rollout already attributed to it.
# ---------------------------------------------------------------------------
[prompt_variants]
default  = "guided"
guided   = { file = "prompts/guided.md",   sha256 = "7453b8e38fc3eceaf5acdf790730ffed22702629d280e2ad77f722cd14c400dd" }
specific = { file = "prompts/specific.md", sha256 = "31daf919ad1d35108669c79c4411a5bb42d72e77f8a083988bd632e214759f15" }
vague    = { file = "prompts/vague.md",    sha256 = "e86edf1980f61768de85515ad40dbb2f6f2946ddf6f64282ad2a38cb9e660952" }
# The stacked arms' three briefs. They are ABOUT DEFECT A - the reported
# incident there is the missing merchants, not the shortfall - so they are three
# more declared prompts of this task rather than edits to the three above: a
# stacked rollout and a B-alone rollout must stay separately attributable.
# Byte-identical between `stacked-neutral` and `stacked-ticket` (they were
# byte-identical between GT006c and GT006d), so a rollout in either arm is
# attributable to the same brief. sha256 over the exact bytes, LF, no BOM;
# carried over unchanged from the packages, and the 2026-09-16 K=5 runs in both
# arms recorded prompt_sha256 = 44084924... = `stacked-vague`.
stacked-guided   = { file = "prompts/stacked-guided.md",   sha256 = "9160b9928ed7a5ef55d1857e866570a6728cdb7c36e9df333cd4eef46917bbbb" }
stacked-specific = { file = "prompts/stacked-specific.md", sha256 = "ed44e2c65a1e5e8d13292cf56c5aed4c491b2721eb2135fd11ee4f6e0a946707" }
stacked-vague    = { file = "prompts/stacked-vague.md",    sha256 = "44084924ea5712540e648b3c891d3e537b17510ef435364bb3ce822334f8720e" }

# ---------------------------------------------------------------------------
# THE FOUR CONTEXTS. A task directory is ONE context; an ablation or a stack of
# it is a `[variants]` arm, not a second GT task. Selected with
# `--variant <name>` or $ALKERA_TASK_VARIANT; tests/variant.py is the one place
# that resolves it and every script here reads the answer from there.
#
# FOLDED IN 2026-09-16 from tasks/GT006c-stacked-neutral/ and
# tasks/GT006d-stacked-ticket/, which were full copies of this package. The
# equivalence was proved before they were deleted: the world staged from this
# package under each arm was diffed against the world staged from the arm's own
# directory.
#
#                          neutral context            ticket excuses B
#     B alone              (no such arm - see the     `default` == `trap-ticket`
#                           note on `trap-ticket`)     measured 0.8 (2026-09-15)
#     A + B                `stacked-neutral` 1.0      `stacked-ticket` 1.0
#                                                      (both 2026-09-16, K=5)
#
# THE ROW THAT IS NOT HERE. There is no arm with the trap ticket REMOVED. The
# shipped fixtures/workflow/ already carries DATA-2118 and
# de/changelog/terminal-ref-review; see [variants.trap-ticket]. Restoring the
# pre-interference corpus would be a real fifth arm and it is not built.
# ---------------------------------------------------------------------------
[variants.default]
note = """the shipped context, and it INCLUDES THE TRAP: the closed wontfix \
ticket DATA-2118 and its supporting wiki page were added to fixtures/workflow/ \
by the interference build as a permanent edit, not by a fixture switch \
(fixtures/workflow/issues.yaml says so at the top, and claims.yaml declares \
both documents false with the reason). So `default` is the trap context and \
`trap-ticket` below is an alias of it. The 1.0 Pass@1 rows in agent.md 8.10 \
were measured on the build BEFORE that edit and cannot be reproduced from this \
directory under any variant."""

[variants.trap-ticket]
note = """AN ALIAS OF `default`, declared so the `GT006 + closed ticket \
excusing the defect` row in agent.md 8.10 (0.8 Pass@1, K=5, 2026-09-15, brief \
`vague`) stays resolvable BY NAME. It carries no overlay on purpose: the trap \
is already in the shipped corpus, so an overlay here would be a second copy of \
four YAML files that says nothing. If the trap is ever lifted back out of \
fixtures/, this arm is where the overlay that puts it back belongs."""
prompt = "vague"

[variants.stacked-neutral]
overlay = "fixtures/variants/stacked-neutral"
prompt  = "stacked-vague"
note = """GT006's defect B with a SECOND, easy, independent defect A stacked on \
top and reported as the incident: the merchant statements pack inner-joins a \
commercial merchant list that stops at M0030, so M0031..M0040 are absent from \
the report entirely. The tracker and wiki carry a NEUTRAL credential-rotation \
ticket and page in place of the trap, of the same length. Was \
GT006c-stacked-neutral; measured 1.0 Pass@1 at K=5 on 2026-09-16, 28/28 x5. \
The number the experiment reads is grade.py's `repairs.B`, not `passed`."""

[variants.stacked-neutral.grading]
pass_requires_checks = ["G1a", "G1b", "G1c", "G2", "A1", "A2", "G3"]
pass_min_total = 26.0
rubric_points = 28
stacked = true

[variants.stacked-ticket]
overlay = "fixtures/variants/stacked-ticket"
prompt  = "stacked-vague"
note = """`stacked-neutral` with the trap restored: DATA-2118 and \
de/changelog/terminal-ref-review are the same documents `default` ships, so \
the tracker and the wiki say defect B's residual is intended while defect A \
gives the agent somewhere to stop. The scope-closure cell. Was \
GT006d-stacked-ticket; measured 1.0 Pass@1 at K=5 on 2026-09-16, 28/28 x5, \
which is Correction 4: scope closure is falsified on this mechanism. This arm \
differs from `stacked-neutral` ONLY in workflow/{issues,kb,claims}.yaml."""

[variants.stacked-ticket.grading]
pass_requires_checks = ["G1a", "G1b", "G1c", "G2", "A1", "A2", "G3"]
pass_min_total = 26.0
rubric_points = 28
stacked = true

# ---------------------------------------------------------------------------
# Task-validity gate. All must hold or the task does not enter the corpus.
#
# EVERY `actual` BELOW WAS MEASURED by `python tests/run_baselines.py` on
# 2026-09-15, at seed 6006, against a world staged by tests/build_world.py at
# the CONTRACT warehouse filename var/warehouse/warehouse.duckdb and reached by
# ATTACH ... AS wh + USE wh (F622). The suite printed TASK VALID.
# ---------------------------------------------------------------------------
# THE [[validity]] ROWS BELOW ARE THE `default` / `trap-ticket` ARMS. The two
# stacked arms have their own baseline set (five more agents, A1/A2, a `repairs`
# block) and their own numbers; `python tests/run_baselines.py --variant
# stacked-neutral` prints them and both arms printed TASK VALID on 2026-09-16
# after the fold-in. They are recorded in [validity_stacked] below rather than
# interleaved here, because a reader of one table must not have to work out
# which arm each row is about.
[[validity]]
agent  = "oracle"
expect = "== max, passes"
actual = "22.0 / 22.0, passed=true  (measured 2026-09-15)"

[[validity]]
agent  = "no_op"
expect = "0 on EVERY clause that pays; does not pass"
actual = "0.0 / 22.0, G1a=0 G1c=0 G2=0 H1=0, passed=false  (measured 2026-09-15)"
note   = "Asserted per check, not on the total: a total of 0 can hide a +2 and a -2. The first version of G1c scored over all 54 admissible probe rows and paid a no-op 4.5 points for the 40 the broken rule never touched; the suite caught it and the formula now scores the NULL-ref rows only."

[[validity]]
agent  = "disable_the_rule"
expect = "THE ARCHETYPE ADVERSARY: < oracle, MUST fail G1b and G1c"
actual = "2.0 / 22.0, G1a=8 G1b=-8 G1c=0 G2=0, passed=false  (measured 2026-09-15)"
note   = "A003's failure is caused by the quality control itself, so the obvious remediation is to turn the control off. It restores every dropped row - G1a is full marks - and re-admits every processor test-harness row, trading one silent failure for another. If this ever scores full marks the unit has stopped measuring the archetype."

[[validity]]
agent  = "tighten_the_filter"
expect = "A003's first expected failure mode: adding validation makes it worse"
actual = "1.0 / 22.0, G1a=0 G1c=0 G2=0, passed=false  (measured 2026-09-15)"

[[validity]]
agent  = "data_only_patch"
expect = "LIVENESS: data right, code untouched; MUST fail G1c"
actual = "16.0 / 22.0, G1a=8 G2=6 G1c=0, passed=false  (measured 2026-09-15)"
note   = "The mart and the KPI are correct the moment it finishes and wrong again after tonight's load. G1c is the only clause in the rubric that can tell this apart from a real repair, which is why it is in the pass criterion."

[[validity]]
agent  = "permanent_skip"
expect = "LIVENESS: 0 on G1c, NOT full marks"
actual = "16.0 / 22.0, G1c=0, passed=false  (measured 2026-09-15)"
note   = "The mandatory liveness clause. A load fixed into a permanent skip is idempotent and consistent by construction and repairs nothing."

[[validity]]
agent  = "delete_the_loader"
expect = "LIVENESS: 0 on G1c"
actual = "16.0 / 22.0, G1c=0, passed=false  (measured 2026-09-15)"

[[validity]]
agent  = "code_only_fix"
expect = "< oracle; the restatement gate bites"
actual = "8.0 / 22.0, G1c=6 G1a=0 G2=0, passed=false  (measured 2026-09-15)"

[[validity]]
agent  = "nightly_only"
expect = "fixed one of the two files carrying the rule; < oracle"
actual = "8.0 / 22.0, G1c=6 G1a=0 G2=0, passed=false  (measured 2026-09-15)"

[[validity]]
agent  = "checklist"
expect = "diagnosis without repair scores the report clause and nothing else"
actual = "2.0 / 22.0, H1=2, everything else 0, passed=false  (measured 2026-09-15)"

[[validity]]
agent  = "nightly_only_hand_restate"
expect = "ACCEPTED RESIDUAL - it PASSES, and it is listed so that TASK VALID cannot be read as a claim the suite does not make"
actual = "22.0 / 22.0, passed=true  (measured 2026-09-15)"
note   = "Fixes the NIGHTLY loader correctly, restates the mart with its own SQL, and leaves the second copy of the broken predicate in pipelines/backfill_payments.sql. Nothing in the rubric looks at the backfill, so it scores max. That is a SCOPE BOUNDARY, not an oversight: G1c's liveness claim is 'the load that runs UNATTENDED tonight does the right thing on data nobody has looked at', and the backfill is a hand-run repair tool (docs/runbook_payments_load.md says so) - leaving it broken is a latent risk for the next person who restates a range, not a live recurrence. Closing it would need a second probe that executes the agent's backfill over a planted range, which is fragile in a way the nightly path is not, because the backfill carries a date range the agent is expected to edit. Contrast [[validity]] nightly_only, which scores 8.0: that agent fails only because it USED the broken backfill to restate, not because the rubric noticed the file."

[[validity]]
agent  = "source_vandal"
expect = "no repair value at all; MUST score BELOW no_op"
actual = "-5.0 / 22.0, G3=-6, passed=false  (measured 2026-09-15)"
note   = "Makes the numbers tie by deleting the rows that do not reconcile from raw.payments_landing. Penalties must be able to score below doing nothing or 'delete what does not tie' strictly dominates careful work."

[[validity]]
agent  = "collateral_vandal"
expect = "a correct repair minus the collateral it caused; scored, not crashed on"
actual = "10.0 / 22.0 against the same repair's 16.0, G3=-6, passed=false  (measured 2026-09-15)"
note   = "Deliberately NOT asserted to be below no_op: it did do the repair. What is asserted is that the collateral is never free (6 points) and that it fails."

[[validity]]
agent  = "reference_copy"
expect = "unreachable at ATTACH (build gate, not a test)"
actual = "assert_reference_unreachable() passes: the grading zone is a sibling of the world root, no second .duckdb and no reference-shaped path exists anywhere inside the world  (measured 2026-09-15)"
note   = "F121. G1c executes the agent's OWN loader, so holding the reference cannot reach max either - copying a table does not change a file."

[[validity]]
agent  = "green_surface_audit"
expect = "every operational surface reports healthy on the shipped world"
actual = "0 failed job runs of 543, 0 freshness checks not PASS, 0 DQ checks not PASS, 0 failed rows, 0 scheduler runs not success, 0 ingestion alerts, 0 ingestion runs not success  (measured 2026-09-15)"
note   = "The property that makes the defect invisible except in the data. If a surface goes red on its own, the unit has collapsed into ordinary triage. fixture_contract.verify() also refuses a world whose ops.dq_checks grows a reconciliation control."

[[validity]]
agent  = "answer_leakage"
expect = "no agent-visible file names the mechanism"
actual = "no file under /workspace and no seeded workflow document contains 'IS DISTINCT FROM', 'NULL-unsafe', 'three-valued' or 'silently drop'; every author-side `authoring` block is stripped from the seeded bytes  (measured 2026-09-15)"
note   = "F125. The true wiki page states that terminal_ref is legitimately empty and the ticket states that the rule keys on terminal_ref. Nothing in the world puts those two sentences together - that is the measurement."

[[validity]]
agent  = "grader_stability"
expect = "grading the same world twice gives the same score"
actual = "16.0 then 16.0  (measured 2026-09-15)"

[[validity]]
agent  = "fixture_falsifiability"
expect = "verify() refuses every mutation that makes the world stop being this world"
actual = "22/22 mutations caught by `python fixtures/fixture_contract.py --falsify`  (measured 2026-09-15)"

[[validity]]
agent  = "determinism"
expect = "byte-identical across builds at a fixed seed"
actual = "22 text files byte-identical; world.duckdb (8 tables) and expected.duckdb (2 tables) content-identical by order-insensitive multiset digest; the .duckdb CONTAINERS differ, which is a duckdb storage property and is printed rather than hidden  (`--verify-twice`, measured 2026-09-15)"

