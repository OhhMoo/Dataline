# ---------------------------------------------------------------------------
# Rollout-harness contract (tasks/harness/). The harness is task-agnostic: it
# knows only the key names below and refuses to run a task that has not declared
# them, because each of them decides the measured number.
# ---------------------------------------------------------------------------
[harness]
# python <world_builder> --root <dir> --grading <dir> --seed <n>
#   -> one json object on stdout carrying world_root, workspace, warehouse,
#      scheduler, dashboards, profiles_dir, grading, virtual_time, seed AND the
#      four plane keys episode.py:WORLD_PLANE_KEYS passes through
#      (workflow_dir, observability, obs_samples, ingest). Without those four the
#      workflow, observability and ingestion surfaces are dead no matter what the
#      world contains: GatewayConfig's defaults for them are absolute paths
#      outside any world root (config.py:19-23).
world_builder = "tests/build_world.py"

# argv appended to `python <grading.entrypoint>`. {placeholders} are filled from
# the world-builder's json plus {artifact}. Copied from the recommended_harness
# block of tests/manifest.yaml and checked against grade.py's own argparse.
# Note the split: the grader needs the real world root as well as the agent's
# tree, because G3 reads the seeded planes under var/.
grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--workspace", "{workspace}",
              "--world-root", "{world_root}", "--json"]

# Read-only probes against a THROWAWAY copy of the world, before the episode,
# with their own audit dir. They answer "which surfaces are actually live in the
# world this unit ships", so a failure can be attributed to a dead surface
# instead of silently counted as reasoning. `covers` lets one probe speak for
# siblings that cannot be probed read-only.
surface_probes = [
  { label = "sql",       tool = "sql_query",      args = { sql = "SELECT 1" } },
  { label = "fs",        tool = "fs_list",        args = { path = "." } },
  { label = "git",       tool = "git_log",        args = { limit = 5 }, covers = ["git_diff"] },
  { label = "dbt",       tool = "dbt_compile",    args = { selector = "*" }, covers = ["dbt_run", "dbt_test"] },
  { label = "sched",     tool = "sched_state",    args = {}, covers = ["sched_list"] },
