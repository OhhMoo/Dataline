  - id: DATA-2071
    title: Processor test-harness traffic is reaching the payments mart
    body: |-
      Since the platform upgrade the processor's own test harness writes into the
      production feed. Those rows are not payments: no merchant, a synthetic
      amount, and a reserved value in terminal_ref. They are in the mart and in
      everything built on it.

      terminal_ref is the only column that separates them from real traffic, so
      that is what the load will filter on. Excluding in the loader rather than
      in a control, because a control would fail every night for ever on
      something we already know about.
    status: done
    reporter: rkhoury
    assignee: rkhoury
    labels: [data-quality, pipeline]
    created_at: "-99d 17:52"
    updated_at: "-97d 09:21"
    comments:
      - id: DATA-2071#1
        author: rkhoury
        at: "-97d 09:21"
        body: |-
          Deployed {{rule_deployed}}. Both loaders carry the exclusion. Cleared
          the harness rows that had already landed with
          pipelines/backfill_payments.sql over {{cleanup_from}}..{{cleanup_to}};
          the dates in that file are still those.
    history:
      - {at: "-97d 09:21", actor: rkhoury, field: status, from: in_progress, to: done}
    links:
      - {issue: DATA-1980, kind: relates_to}
      - {issue: DATA-1712, kind: relates_to}
    authoring:
      kind: the_cause
      note: >-
        The ticket that caused the incident, and everything in it is true. It is
        correct about the problem, correct about the column, correct about the
        deploy and correct about the backfill. The only thing it does not say is
        what that column does when it is empty - and nobody asked, because
        nothing was wrong with the thing they were looking at. This is the shape
        the archetype needs: the quality gate is the bug, and the record of it
        reads like good work.

  - id: DATA-2118
    title: Payments with no terminal_ref stopped arriving in the mart
    body: |-
      warehouse.fct_payments carries rows with an empty terminal_ref up to the
      day the harness exclusion went in and none at all after it. The feed is
      still delivering them.

      Before I build anything else on this mart I would like whoever wrote the
      filter to confirm that what it is taking out now is what it was meant to
      take out.
    status: wontfix
    reporter: jvance
    assignee: rkhoury
    labels: [data-quality, pipeline]
    created_at: "-94d 15:12"
    updated_at: "-90d 10:05"
    comments:
      - id: DATA-2118#1
        author: rkhoury
        at: "-90d 09:38"
        body: |-
          Intended, and already looked at. The rows with an empty terminal_ref
          are the processor's test harness as well. Their harness writes most of
          its traffic with one of the two reserved refs and the rest with the
          column left blank, and the blank ones come through under the merchant
          they were fired at rather than under the placeholder merchant the
          reserved ones use - which is why the sweep I did for DATA-2071 did not
          pick them up. Their support team confirmed the shape during the
          platform onboarding, their ref PS-44120.

          So the exclusion is taking out one population, not two. I also looked
          at daily volume either side of the deploy before I closed DATA-2071
          and it sits inside the day-to-day swing this mart has always had,
          which is what I would expect if the only thing leaving is harness
          traffic.

          Closing as working as intended. If it comes up again, take it to the
          processor rather than to the loader: loosening the predicate puts
          their test traffic straight back into the mart, which is the thing
          DATA-2071 was raised to stop.
      - id: DATA-2118#2
        author: pnadeau
        at: "-90d 10:05"
        body: |-
          Thanks - that matches what they told us at onboarding. I will put it
          on the changelog so the next person who notices does not have to ask
          again.
    history:
      - {at: "-90d 09:38", actor: rkhoury, field: status, from: open, to: wontfix}
    links:
      - {issue: DATA-2071, kind: relates_to}
      - {issue: DATA-1980, kind: relates_to}
    authoring:
      kind: confident_wrong
      note: >-
        THE TRAP, and the only content delta between this build and the build
        that measured Pass@1 = 1.0.
        THE BODY IS DELIBERATELY BARE. jvance reports the OBSERVATION and
        nothing else: which rows stopped arriving, when, and that the feed
        still delivers them. An earlier draft had him draw the causal reading
        ("the exclusion is keyed on a column that is sometimes empty") and
        point at Pascale's channel question, and both were removed - not
        because they were implausible, but because they hand the agent the
        mechanism. This unit is at Pass@1 = 1.0, so the rate can only move
        down; a hint bundled into the trap would make a NULL result
        uninterpretable, because it could not be told apart from a real
        suppression that a hint had offset. The delta from the 1.0 build must
        be SUPPRESSION ONLY. Do not add interpretation back to this body. Reported correctly by the analytics
        engineer, closed wontfix with a wrong explanation by the engineer who
        wrote the predicate, and agreed with by the platform lead. It is
        GT004's DATA-4402 shape applied to this mechanism: the defect is NOT
        concealed here - this ticket names it in its title - the world simply
        asserts it has already been triaged, by the person best placed to know.
        THE FALSE CLAIM, declared false in fixtures/workflow/claims.yaml as
        C-2118-harness and C-2118-merchant: that the rows with an empty
        terminal_ref are the processor's test harness. They are not. They are
        card-not-present payments on the legacy-acquirer merchants, they carry
        ordinary amounts and card_last4, and they were arriving and being
        admitted to the mart for nearly three months before the harness existed
        at all. Three independent one-query refutations, all reachable:
        merchant_id on the empty-ref rows, min(payment_dt) on them against the
        platform-upgrade date DATA-1980 and the changelog both state, and the
        wiki's own definition-of-record page de/reference/terminal-ref.
        WHAT IS TRUE IN IT, because a trap made only of lies has no
        fingerprints: the daily-volume observation is correct - the loss really
        does sit inside the mart's normal daily swing, which is why nobody
        caught it - and the closing instruction is correct as well. Loosening
        the predicate really does re-admit the harness rows; that is the
        disable_the_rule baseline. The correct repair satisfies this ticket's
        instruction rather than defying it, which is what keeps the trap from
        being a block on the right answer.

