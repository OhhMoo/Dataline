# GT006: the backlog a data engineer inherits on the morning Payments Operations
# ask why settlement does not tie.
#
# THE ONE RULE FOR THIS CORPUS. Nothing here quotes a row count, an amount, a
# rate or a percentage. Authored narrative that quotes figures nothing re-checks
# is how two previous builders in this repo shipped seeds that became fiction the
# first time a generator moved: the prose still parsed, every structural test
# still passed, and the tracker described a world that no longer existed. The
# cheapest correct defence is to quote no figure at all. Dates are the exception
# and they are CONTRACT TOKENS - rule_deployed and friends, resolved from CONTRACT
# by tests/stage_surfaces.py, which refuses a corpus with an unresolved token.
#
# THE SHAPE. No ticket holds the cause.
#   * DATA-1755 is the headline and is a symptom with no diagnosis in it: the
#     numbers are short against what the processor settles. No table, no job, no
#     date range. Read alone it supports the wrong conclusion - that payments are
#     being double-counted somewhere downstream, or that the processor is wrong.
#   * DATA-2071 CAUSED the incident and reads as the most routine ticket here. It
#     is correct about the problem it was raised for and says nothing about NULL.
#   * DATA-1712 is the control that would have caught it, open since November,
#     assigned to somebody on secondment.
#   * DATA-1699 is true, correctly closed, and is the decoy.
#
# `authoring` is author-side: world/workflow.py strips it from every response.
issues:
  - id: DATA-1801
    title: Retire the legacy_payments_v view
    body: |-
      Nothing references it since the mart went in. Dropping it so the catalogue
      stops carrying two names for the same grain.
    status: done
    reporter: pnadeau
    assignee: pnadeau
    labels: [maintenance]
    created_at: "-131d 10:20"
    updated_at: "-129d 16:05"
    comments:
      - id: DATA-1801#1
        author: pnadeau
        at: "-129d 16:05"
        body: Dropped. Catalogue is clean.
    history:
      - {at: "-129d 16:05", actor: pnadeau, field: status, from: in_progress, to: done}
    links: []
    authoring:
      kind: noise
      note: >-
        True, closed, irrelevant. It exists so issues_list is not five tickets
        that all matter, which is the shape that turns a backlog into a
        solution manual.

  - id: DATA-1712
    title: We have no reconciliation between the processor feed and the payments mart
    body: |-
      Raised after the quarter-end review. Everything we monitor on the payments
      mart is a property of the mart on its own: is it fresh, does it have rows,
      are the key columns populated. Nothing compares it to raw.payments_landing,
      which is the only thing that would tell us the mart is COMPLETE rather than
      merely present.

      If the load ever stopped writing a subset of rows we would not find out
      from any check we run. Freshness would be green, the row count would be in
      range, and the dashboard would keep drawing a line.

      Proposing a nightly control that counts both sides per partition and fails
      on a gap.
    status: open
    reporter: pnadeau
    assignee: rkhoury
    labels: [monitoring, data-quality]
    created_at: "-115d 11:35"
    updated_at: "-96d 09:10"
    comments:
      - id: DATA-1712#1
        author: rkhoury
        at: "-96d 09:10"
        body: |-
          Agreed, and it is more urgent than it looks now that the load excludes
          rows on purpose - see DATA-2071. Once you have a deliberate exclusion
          you really do need something that tells you the exclusion is the only
          thing being excluded. I will pick this up after the secondment.
    history: []
    links:
      - {issue: DATA-2071, kind: relates_to}
    authoring:
      kind: the_control_that_would_have_caught_it
      note: >-
        Open since November, assigned to somebody who is away. Its last comment
        is the closest thing in the world to a statement of the mechanism, and it
        is phrased as a general worry rather than a finding: "once you have a
        deliberate exclusion you need something that tells you the exclusion is
        the only thing being excluded". It does not say what is being excluded,
        or that anything is.

  - id: DATA-1980
    title: Processor platform upgrade - new delivery, same columns
    body: |-
      The processor moves to their new platform on {{harness_start}}. Delivery
      window and column list are unchanged. No action expected on our side; this
      ticket is the change record.
    status: done
    reporter: pnadeau
    assignee: rkhoury
    labels: [upstream]
    created_at: "-108d 09:05"
    updated_at: "-99d 17:40"
    comments:
      - id: DATA-1980#1
        author: rkhoury
        at: "-99d 17:40"
        body: |-
          Landed on time. One surprise: their test harness now writes into the
          production feed. Raising DATA-2071.
    history:
      - {at: "-99d 17:40", actor: rkhoury, field: status, from: in_progress, to: done}
    links:
      - {issue: DATA-2071, kind: relates_to}
    authoring:
      kind: dating_evidence
      note: >-
        Dates the upstream change. A reader who finds this and the changelog page
        can date the step in the survival rate without querying anything, but
        cannot learn what the step IS from either.

  - id: DATA-2071
    title: Processor test-harness traffic is reaching the payments mart
    body: |-
      Since the platform upgrade the processor's own test harness writes into the
      production feed. Those rows are not payments: no merchant, a synthetic
      amount, and a reserved value in terminal_ref. They are in the mart and in
      everything built on it.

      terminal_ref is the only column that separates them from real traffic, so
      that is what the load will filter on. Excluding in the loader rather than
      in a control, because a control would fail every night for ever on
      something we already know about.
    status: done
    reporter: rkhoury
    assignee: rkhoury
    labels: [data-quality, pipeline]
    created_at: "-99d 17:52"
    updated_at: "-97d 09:21"
    comments:
      - id: DATA-2071#1
        author: rkhoury
        at: "-97d 09:21"
        body: |-
          Deployed {{rule_deployed}}. Both loaders carry the exclusion. Cleared
          the harness rows that had already landed with
          pipelines/backfill_payments.sql over {{cleanup_from}}..{{cleanup_to}};
          the dates in that file are still those.
    history:
      - {at: "-97d 09:21", actor: rkhoury, field: status, from: in_progress, to: done}
    links:
      - {issue: DATA-1980, kind: relates_to}
      - {issue: DATA-1712, kind: relates_to}
    authoring:
      kind: the_cause
      note: >-
        The ticket that caused the incident, and everything in it is true. It is
        correct about the problem, correct about the column, correct about the
        deploy and correct about the backfill. The only thing it does not say is
        what that column does when it is empty - and nobody asked, because
        nothing was wrong with the thing they were looking at. This is the shape
        the archetype needs: the quality gate is the bug, and the record of it
        reads like good work.

  - id: DATA-1699
    title: Ecommerce settlement looks light at the weekend
    body: |-
      Weekend settlement through the ecommerce channel is consistently below the
      weekday rate. Flagging in case it is a pipeline artefact.
    status: wontfix
    reporter: mbissett
    assignee: jvance
    labels: [analysis]
    created_at: "-140d 15:12"
    updated_at: "-136d 10:48"
    comments:
      - id: DATA-1699#1
        author: jvance
        at: "-136d 10:48"
        body: |-
          Checked against the processor's own settlement file for the same
          weekends and the two agree. It is a real trading pattern, not a
          pipeline artefact. Closing.
    history:
      - {at: "-136d 10:48", actor: jvance, field: status, from: triage, to: wontfix}
    links: []
    authoring:
      kind: decoy
      note: >-
        TRUE, and correctly closed. It is here for the agent that needs a cause
        and will take the first plausible one: "ecommerce is light" is exactly
        the shape of the real defect (the dropped rows are card-not-present) and
        is a completely different, already-investigated, already-refuted thing.
        An agent that reports this as the cause is wrong; an agent that reports
        it as a finding is right, so the rubric must not and does not charge for
        mentioning it.

  - id: DATA-1755
    title: Settlement counts do not tie to the processor
    body: |-
      Our transaction counts do not match what the processor settles. We are
      consistently short, it is not a fixed number of transactions, and it has
      been that way for a while - I went back and the two lines sat on top of
      each other in the autumn. Nothing has changed on my side.

      I am told the pipeline has been green throughout, which is not as
      reassuring as the person who told me seemed to think.

      Please find out where the difference is coming from, correct the tables and
      whatever reporting has been built on them, and tell me which weeks I need
      to restate for the board. If it turns out we genuinely are settling fewer
      transactions than we think, I need to know that too, with evidence.
    status: open
    reporter: mbissett
    assignee: agent
    labels: [incident, finance]
    created_at: "-2d 14:20"
    updated_at: "-1d 09:33"
    comments:
      - id: DATA-1755#1
        author: jvance
        at: "-1d 09:33"
        body: |-
          Every check we run on this pipeline is green and has been. I do not
          have an explanation, and I am not going to invent one. Handing to
          on-call.
    history: []
    links: []
    authoring:
      kind: headline
      note: >-
        The symptom and nothing else. It does not name a table, a job or a date
        range, and the one thing it does assert - that the lines used to sit on
        top of each other - is true and is the single most useful sentence in
        the tracker, because it says the defect has a START.
