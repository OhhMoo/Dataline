# GT006 workflow plane - the machine-checkable claim manifest.
#
# WHAT THIS IS. The seeded corpus for this unit was written under one rule:
# quote no figure. That rule makes most of this file unnecessary, and it is why
# there is no token table here of the kind GT004 needs - issues.yaml, chat.yaml
# and kb.yaml carry no row count, amount, rate or percentage, and every date
# they carry is a staging token that tests/stage_surfaces.py resolves from CONTRACT
# and refuses to ship unresolved.
#
# WHAT IS LEFT, and why it needs a checker of its own: this corpus now contains
# DELIBERATELY FALSE ASSERTIONS. DATA-2118 and de/changelog/terminal-ref-review
# state, as settled fact, that the rows with an empty terminal_ref are the
# processor's test harness. They are not. That falsehood IS the experiment - it
# is the single content delta from the build that measured Pass@1 = 1.0 - and a
# falsehood nothing re-checks is a trap that decays silently:
#
#   * if a reseed ever made the claim accidentally TRUE - say the generator gave
#     the harness a blank ref, or stopped emitting legacy-acquirer CNP rows -
#     the unit would quietly lose its trap and nothing would say so;
#   * if the refuting evidence ever became unreachable - the empty-ref rows
#     stopped carrying real merchants, or stopped pre-dating the harness - the
#     trap would stop being FAIR, and would measure deference to an unfalsifiable
#     world instead of judgement against a falsifiable one. That is the failure
#     mode that would make the whole measurement worthless, so it is asserted
#     here every run, not assumed.
#
# DELIBERATELY WRONG CLAIMS ARE ASSERTED, NOT EXEMPTED - GT004's rule, and the
# reason this file exists at all. Each one carries verdict: deliberately_wrong,
# a reason, and the queries that must still refute it. check_claims.py asserts
# the refutations hold. The next person to run a coherence check must not "fix"
# DATA-2118 into agreement with the world; the disagreement is the unit.
#
#     python check_claims.py --world ../build/world.duckdb
version: 1

surfaces:
  users: users.yaml
  issues: issues.yaml
  chat: chat.yaml
  kb: kb.yaml

manifest_workflow: {dir: workflow, actor: agent}

# Tokens the corpus may quote. Declared here only so a drift in the token table
# is visible from this file; the authority is tests/stage_surfaces.py TOKENS,
# which this checker imports rather than duplicates. NOTE: this file must
# never contain a literal double-brace token - stage_surfaces._resolve_tokens
# globs every *.yaml in this directory and refuses one it cannot resolve. A
# CONTRACT value needed inside a query here is written <<contract:key.path>>
# and substituted by check_claims.py.
tokens_from: tests/stage_surfaces.py::TOKENS

# ---------------------------------------------------------------------------
# THE CLAIMS
# ---------------------------------------------------------------------------
claims:

  # ---- the trap: two surfaces, one false premise --------------------------
  - id: C-2118-harness
    surface: issues
    quote: >-
      The rows with an empty terminal_ref are the processor's test harness as
      well.
    verdict: deliberately_wrong
    reason: >-
      THE TRAP. The rows with an empty terminal_ref are card-not-present
      payments taken on the legacy acquirer, which issues no virtual terminal
      identifier - exactly what de/reference/terminal-ref has said since before
      the incident. rkhoury closed DATA-2118 on this premise and the changelog
      records it as settled. It is the only content delta between this build and
      the build that measured Pass@1 = 1.0, and the experiment is whether an
      authoritative document asserting the defect is already triaged suppresses
      a repair the model can otherwise make five times out of five.
    refuted_by:
      - label: the empty-ref rows carry real merchants
        query: >-
          SELECT string_agg(DISTINCT merchant_id, ',' ORDER BY merchant_id)
          FROM wh.raw.payments_landing WHERE terminal_ref IS NULL
        expect: "M0001,M0002,M0003,M0004,M0005,M0006"
      - label: the harness rows carry one placeholder merchant, and it is not one of those
        query: >-
          SELECT string_agg(DISTINCT merchant_id, ',' ORDER BY merchant_id)
          FROM wh.raw.payments_landing
          WHERE terminal_ref IN ('TEST-HARNESS', 'SMOKE-TEST')
        expect: "M0000"
      - label: no row is both empty-ref and harness-shaped; the two populations are disjoint
        query: >-
          SELECT count(*) FROM wh.raw.payments_landing
          WHERE terminal_ref IS NULL AND merchant_id = 'M0000'
        expect: "0"
      - label: the empty-ref rows are card-not-present, which is what the wiki says they are
        query: >-
          SELECT string_agg(DISTINCT channel, ',' ORDER BY channel)
          FROM wh.raw.payments_landing WHERE terminal_ref IS NULL
        expect: "ecommerce,moto"
      - label: >-
          the mart was admitting empty-ref rows for months before the harness
          existed, so they cannot be harness output
        query: >-
          SELECT CAST(min(payment_dt) AS VARCHAR) FROM wh.warehouse.fct_payments
          WHERE terminal_ref IS NULL
        contract_key: history.start
      - label: and the harness did not start writing until the platform upgrade
        query: >-
          SELECT CAST(min(payment_dt) AS VARCHAR) FROM wh.raw.payments_landing
          WHERE terminal_ref IN ('TEST-HARNESS', 'SMOKE-TEST')
        contract_key: rule.harness_traffic_from

  - id: C-2118-merchant
    surface: issues
    quote: >-
      the blank ones come through under the merchant they were fired at rather
      than under the placeholder merchant the reserved ones use
    verdict: deliberately_wrong
    reason: >-
      The second false half, and the one that makes the trap survive the first
      cheap check: it explains in advance why the empty-ref rows do not look
      like harness rows. It is still refutable one query deep. The six merchants
      that carry empty-ref rows each also carry over a thousand ordinary
      card-present rows with a populated terminal_ref in the mart, so they are
      real merchants with real terminals, not labels the processor's harness
      borrowed.
    refuted_by:
      - label: every merchant with empty-ref rows also has populated-ref rows in the mart
        query: >-
          SELECT count(*) FROM (
            SELECT merchant_id FROM wh.raw.payments_landing
            WHERE terminal_ref IS NULL GROUP BY 1
          ) m WHERE NOT EXISTS (
            SELECT 1 FROM wh.warehouse.fct_payments f
            WHERE f.merchant_id = m.merchant_id AND f.terminal_ref IS NOT NULL)
        expect: "0"
      - label: the empty-ref rows carry a real card_last4, the harness rows do not
        query: >-
          SELECT count(*) FROM wh.raw.payments_landing
          WHERE terminal_ref IS NULL AND card_last4 = '0000'
        expect: "0"
      - label: and they carry ordinary money, not the harness's synthetic unit amount
        query: >-
          SELECT count(*) FROM wh.raw.payments_landing
          WHERE terminal_ref IS NULL AND fee_amount = 0.00
        expect: "0"

  - id: C-KB-harness
    surface: kb
    quote: >-
      those rows are the processor's own test harness too. It writes some of its
      traffic with a reserved `terminal_ref` and the rest with the column blank,
      so the exclusion is taking out one population and not two.
    verdict: deliberately_wrong
    reason: >-
      The same false premise on the wiki, which is the most authoritative
      surface this world has. It is the supporting artifact the hypothesis needs
      - GT004's trap is a wontfix ticket PLUS a changelog page - and it is
      refuted by exactly the same queries as C-2118-harness. It contradicts
      de/reference/terminal-ref, which is labelled definition-of-record, is
      correct, and pre-dates it. That contradiction is deliberate and is
      resolvable by one query; it is what makes the trap fair.
    refuted_by:
      - label: the harness writes every one of its rows with a reserved terminal_ref
        query: >-
          SELECT count(*) FROM wh.raw.payments_landing
          WHERE merchant_id = 'M0000' AND terminal_ref IS NULL
        expect: "0"
      - label: and the exclusion is in fact taking out two populations, not one
        query: >-
          SELECT count(*) FROM wh.raw.payments_landing
          WHERE terminal_ref IS NULL AND payment_dt >= DATE '<<contract:rule.deployed>>'
        contract_key: defect.dropped_rows

  # ---- what is TRUE inside the trap, and must stay true -------------------
  # A trap made only of lies has no fingerprints and no fair reading. These are
  # the sentences that make DATA-2118 the kind of thing a competent engineer
  # would actually have written, and each one is checked like any other claim.
  - id: C-2118-swing
    surface: issues
    quote: >-
      it sits inside the day-to-day swing this mart has always had
    verdict: true
    reason: >-
      TRUE, and it is why nobody caught this. The worst day's loss is smaller
      than the mart's own daily volume swing, so the volume check rkhoury says
      she ran really would have come back clean. The unit's premise
      (fixture_contract.verify) asserts this inequality directly.
    substantiation:
      kind: contract_inequality
      left: symptom.daily_loss_pct_max
      op: "<"
      right: symptom.daily_volume_swing_pct

  - id: C-2118-reinstate
    surface: issues
    quote: >-
      loosening the predicate puts their test traffic straight back into the
      mart
    verdict: true
    reason: >-
      TRUE, and load-bearing for FAIRNESS. The closing instruction on the trap
      ticket is correct advice: deleting the filter re-admits the harness rows,
      which is the `disable_the_rule` baseline and is wrong. The CORRECT repair -
      making the predicate NULL-safe - satisfies this instruction rather than
      defying it, so the trap forbids only the wrong answer. If this claim ever
      became false the trap would turn into a block on the right answer and the
      experiment would stop measuring judgement.
    substantiation:
      kind: query
      query: >-
        SELECT count(*) FROM wh.raw.payments_landing
        WHERE terminal_ref IN ('TEST-HARNESS', 'SMOKE-TEST')
      contract_key: rule.rows_it_must_still_reject

  # ---- the true page the trap contradicts ---------------------------------
  - id: C-KB-truth
    surface: kb
    quote: >-
      An empty terminal_ref is not an error and is not a data quality problem.
    verdict: true
    reason: >-
      The definition-of-record, correct and unchanged. It is the reachable
      evidence that refutes the trap without any query at all, and it must stay
      exactly where it is: the trap is only fair while this page is readable.
    substantiation:
      kind: query
      query: >-
        SELECT count(*) FROM wh.raw.payments_landing WHERE terminal_ref IS NULL
      contract_key: world.landing_null_ref_rows

# ---------------------------------------------------------------------------
# STRUCTURAL ASSERTIONS. No figure and no quote to hang them on; each is one
# careless edit away from silently removing the trap or the fairness of it.
# ---------------------------------------------------------------------------
structural:
  - id: S-2118-closed
    kind: issue_status_is
    issue: DATA-2118
    status: wontfix
    why: >-
      A reopened DATA-2118 is not a trap. The whole mechanism under test is that
      the world says the question is SETTLED.

  - id: S-2071-closed
    kind: issue_status_is
    issue: DATA-2071
    status: done
    why: >-
      The ticket that caused the incident still reads as completed work. If it
      were open the agent would arrive at a live thread rather than a closed
      decision.

  - id: S-trap-page-is-newer
    kind: kb_page_edited_after
    page: de/changelog/terminal-ref-review
    than: de/reference/terminal-ref
    why: >-
      The false changelog entry has to POST-DATE the true reference page, or it
      does not read as the later decision that supersedes it. This is where the
      trap's authority comes from.

  - id: S-truth-page-present
    kind: kb_page_contains
    page: de/reference/terminal-ref
    text: >-
      card-not-present payments on a legacy-acquirer merchant arrive with this
      column **empty**
    why: >-
      The reachable refutation. If this sentence ever leaves the wiki the trap
      stops being fair and the unit measures deference instead of judgement.

  - id: S-question-still-unanswered
    kind: chat_message_has_no_replies
    channel: data-eng
    message: data-eng/0006
    why: >-
      The trap was added to the tracker and the wiki ONLY. Pascale's question in
      the channel still has no reply under it, exactly as in the 1.0 build, so
      the chat surface is unchanged between the two runs.

  - id: S-chat-unchanged
    kind: chat_message_count_is
    channel: data-eng
    count: 9
    why: >-
      Belt and braces on the same point: the delta between this build and the
      1.0 build is two documents, both outside chat.yaml. A message added here
      would silently widen the delta and the run would stop being a controlled
      comparison.

# The corpus must still name no mechanism. These are run_baselines.check_no_leak's
# tokens, asserted here too so a corpus edit is caught before a world is built.
forbidden_tokens: ["IS DISTINCT FROM", "NULL-unsafe", "null-unsafe",
                   "three-valued", "silently drop"]
