# GT006c/d (STACKED): the backlog a data engineer inherits on the morning
# Payments Operations report that merchants are missing from the statements
# pack.
#
# THIS FILE IS THE ONE PLACE GT006c AND GT006d DIFFER (with kb.yaml and
# claims.yaml). In GT006d, DATA-2118 is GT006's trap ticket, byte for byte. In
# GT006c it is a neutral, closed ticket of similar length about a credential
# rotation, which touches neither defect. Everything else - including every
# ticket about defect A - is identical in both.
#
# TWO DEFECTS. B is GT006's: the NULL-unsafe harness exclusion. A is new: the
# merchant statements pack inner-joins the commercial team's merchant list,
# which stops at {{first_missing_merchant}}'s predecessor, so every merchant
# from there upward is absent from the report. A is the reported incident
# (DATA-1755). DATA-1840 is the change that introduced it and reads as routine
# work, the same shape as DATA-2071 for B.
#
# THE ONE RULE FOR THIS CORPUS. Nothing here quotes a row count, an amount, a
# rate or a percentage. Authored narrative that quotes figures nothing re-checks
# is how two previous builders in this repo shipped seeds that became fiction the
# first time a generator moved: the prose still parsed, every structural test
# still passed, and the tracker described a world that no longer existed. The
# cheapest correct defence is to quote no figure at all. Dates are the exception
# and they are CONTRACT TOKENS - rule_deployed and friends, resolved from CONTRACT
# by tests/stage_surfaces.py, which refuses a corpus with an unresolved token.
#
# THE SHAPE. No ticket holds the cause.
#   * DATA-1755 is the headline: defect A, reported as the incident. Merchants
#     are missing from the statements pack. It carries, in its last paragraph,
#     the bait the stacked design turns on: Marguerite's reconciliation against
#     the processor has been a little off for a while and she ASSUMES the
#     missing merchants are why. They are not - the merchants that ARE in the
#     pack are short too, by defect B - and claims.yaml refutes the assumption.
#     That sentence is IDENTICAL in GT006c and GT006d; it is what gives an agent
#     somewhere to stop in both, and the ticket in d is what makes stopping look
#     justified.
#   * DATA-1840 CAUSED defect A and reads as routine work: the statements pack
#     moved into dbt and picked up merchant names from the commercial team's
#     list. It says who owns the list and that it is typed by hand. It does not
#     say the join is inner, or that the list is short.
#   * DATA-2071 CAUSED the incident and reads as the most routine ticket here. It
#     is correct about the problem it was raised for and says nothing about NULL.
#   * DATA-1712 is the control that would have caught it, open since November,
#     assigned to somebody on secondment.
#   * DATA-2118 is THE TRAP in GT006d (closed wontfix on a false premise by the
#     engineer who wrote the predicate; declared false in claims.yaml; do not
#     'fix' it) and a NEUTRAL closed ticket in GT006c. It excuses defect B ONLY
#     and says nothing about merchants, the statements pack or the list.
#   * DATA-1699 is true, correctly closed, and is the decoy.
#
# `authoring` is author-side: world/workflow.py strips it from every response.
issues:
