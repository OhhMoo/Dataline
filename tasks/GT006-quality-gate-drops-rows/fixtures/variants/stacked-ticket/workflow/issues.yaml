    body: |-
      The merchant statements pack is still built from the old reporting view.
      Moving it into dbt next to the KPI model.

      Commercial have asked for the trading name on every row so a statement
      does not go out with just an id on it. They have sent their merchant list;
      it goes in as config/merchants.csv and is loaded to reporting.dim_merchant
      by scripts/load_merchants.py. Commercial own the list.
    status: done
    reporter: pnadeau
    assignee: pnadeau
    labels: [reporting, dbt]
    created_at: "-125d 10:05"
    updated_at: "-123d 15:30"
    comments:
      - id: DATA-1840#1
        author: pnadeau
        at: "-123d 15:30"
        body: |-
          Done {{dim_loaded}}. Model is in dbt_project/models/reporting, list
          loaded, statements pack re-issued from the new model and Commercial
          have signed it off. If a merchant is ever missing a name it is their
          sheet that needs updating - send it back to them, then rerun
          scripts/load_merchants.py.
    history:
      - {at: "-123d 15:30", actor: pnadeau, field: status, from: in_progress, to: done}
    links: []
    authoring:
      kind: the_cause_of_A
      note: >-
        The change that introduced defect A, and everything in it is true. The
        list is the commercial team's, it is typed by hand, and the model reads
        it. What it does not say is that the join is INNER and the list stops
        at M0030, so a merchant Commercial has not typed in vanishes from the
        pack rather than appearing without a name. Deliberately the same shape
        as DATA-2071: the record of the change reads like good work. "If a
        merchant is ever missing a name ... send it back to them" is the
        sentence that makes completing the list a legitimate repair - and the
        LEFT join the durable one.
