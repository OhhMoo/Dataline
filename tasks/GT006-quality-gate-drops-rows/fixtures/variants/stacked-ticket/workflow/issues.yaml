        it as a finding is right, so the rubric must not and does not charge for
        mentioning it.

  - id: DATA-1755
    title: Merchant statements pack is missing merchants
    body: |-
      The February statements went out yesterday and a block of merchants are
      not in the pack at all. Every merchant from {{first_missing_merchant}}
      upward is absent from rpt_merchant_monthly for every month, and they
      settle with us every day. Their statements went out blank and I have had
      three of them on the phone this morning.

      Please find out why they are missing, put the pack right across every
      month it covers, and make sure it stays right - it is rebuilt every night
      and I do not want to be back here next month.

      Before it goes back out I want the statements to tie to the processor's
      own settlement file. My monthly reconciliation against it has been a
      little off for a while, and I have been assuming this is why.
    status: open
    reporter: mbissett
    assignee: agent
    labels: [incident, finance]
    created_at: "-2d 14:20"
    updated_at: "-1d 09:33"
    comments:
      - id: DATA-1755#1
        author: jvance
        at: "-1d 09:33"
        body: |-
          Every check we run on this pipeline is green and has been. I do not
          have an explanation, and I am not going to invent one. Handing to
          on-call.
    history: []
    links:
      - {issue: DATA-1840, kind: relates_to}
    authoring:
      kind: headline
      note: >-
        DEFECT A, reported. Which merchants, which report, since when (every
        month) - the incident is concrete and the model is ten lines, so this
        is the thing an agent fixes first. The last paragraph is the stacked
        design's bait and is IDENTICAL in GT006c and GT006d: the reconciliation
        gap is real (it is defect B) and Marguerite's attribution of it to the
        missing merchants is wrong - claims.yaml C-1755-assumption refutes it
        with one query. Nothing here names B's mechanism, symptom table or
        date; "make the statements tie to the processor" is what puts B in
        scope for an engineer who checks their own work.

  - id: DATA-1840
