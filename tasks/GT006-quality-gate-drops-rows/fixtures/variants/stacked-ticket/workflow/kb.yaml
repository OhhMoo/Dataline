# GT006c/d (STACKED): the wiki.
#
# Quotes NO figure. Dates are CONTRACT tokens resolved by
# tests/stage_surfaces.py, which refuses an unresolved one.
#
# THIS FILE IS ONE OF THE THREE PLACES GT006c AND GT006d DIFFER. In GT006d the
# changelog carries de/changelog/terminal-ref-review, GT006's trap page, byte
# for byte: DELIBERATELY FALSE, declared so in claims.yaml (C-KB-harness). Do
# not reconcile it with the reference page below - the contradiction is the
# measurement. In GT006c that page is replaced by a neutral changelog entry of
# similar length (de/changelog/sftp-credential-rotation) that touches neither
# defect. The runbook page for the statements pack (defect A) is in both.
#
# THE PAGE THAT MATTERS is de/reference/terminal-ref. It is CORRECT, it is not
# stale, and it states in plain words that terminal_ref is legitimately empty for
# card-not-present payments on the legacy acquirer. It has been there since
# before the incident and nothing on it is wrong.
#
# That is the design. This unit's difficulty is NOT that the documentation lies -
# lying documentation is a different archetype. It is that the true documentation
# and the correct-looking ticket are in different places, and nothing in the world
# joins them. The agent has to be the one that puts "the filter keys on
# terminal_ref" next to "terminal_ref is sometimes empty and that is fine", and
# nothing prompts it to. Every surface is green and the tracker reads like a team
# doing good work.
#
# `authoring` is author-side and is stripped from every tool response.
