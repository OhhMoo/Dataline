  - id: de/runbooks/payments-load
    title: Nightly payments load
    parent: de/runbooks
    labels: [runbook, owned-by-data]
    body: |-
      # Nightly payments load

      The processor delivers the previous day's settled payments overnight. The
      loader takes every partition that has landed since the mart's own
      high-water mark, deletes those partitions and re-inserts them, so a
      re-delivery restates exactly what was re-delivered and an unchanged stream
      is a no-op.

      `pipelines/backfill_payments.sql` does the same for a closed date range.
      Edit the dates at the top and run it.

      ## If settlement does not tie

      Start from the partition, not from the total. The mart and the feed are
      the same grain, so any disagreement is a set of rows and can be named.

      ## What is monitored

      Freshness of the mart, a not-null control on the key columns, and a
      row-count-greater-than-zero control. All of them are properties of the
      mart considered on its own. There is no control that compares the mart to
      the feed - see DATA-1712.
    version: 6
    created_at: "-215d 11:00"
    updated_at: "-97d 09:35"
    author: rkhoury
    history:
      - {version: 5, at: "-160d 14:10", author: pnadeau, note: added the monitoring section}

  - id: de/runbooks/merchant-statements
    title: Merchant statements pack
    parent: de/runbooks
    labels: [runbook, owned-by-data]
    body: |-
      # Merchant statements pack

      `reporting.rpt_merchant_monthly`: one row per merchant per calendar
      month, with the trading name, the number of settled payments and the net
      amount. Payments Operations issue the statements from it at the start of
      each month.

      Built by the dbt model `dbt_project/models/reporting/rpt_merchant_monthly.sql`
      from `warehouse.fct_payments`. Trading names come from
      `reporting.dim_merchant`, which is the commercial team's list
      (`config/merchants.csv`) loaded by `scripts/load_merchants.py`.
      Commercial own the list: when they onboard a merchant they send an
      updated sheet, and it is reloaded by hand.

      ## Re-issuing

      Re-run the model, then tell Payments Operations which months changed.
    version: 1
    created_at: "-123d 15:40"
    updated_at: "-123d 15:40"
    author: pnadeau
    history: []
    authoring:
      kind: runbook_for_A
      note: >-
