  - id: de/changelog/sftp-credential-rotation
    title: Processor SFTP credential rotation
    parent: de/changelog
    labels: [changelog]
    body: |-
      # Processor SFTP credential rotation

      Follow-up to the **{{harness_start}}** platform upgrade (DATA-1980).

      The key used for the settled-payments delivery was replaced before its
      expiry. That was raised as DATA-2118 and done: the connector reads the
      key from the ingestion configuration and from nowhere else, the swap was
      made inside a delivery window, and the next deliveries landed on time
      with the same path, schedule and columns. Nothing downstream was touched.

      The replacement key carries the same expiry policy, so this comes round
      again next year.

      When it does: plan the swap for a delivery window, watch the next landing,
      and retire the old key with the processor's support team afterwards.
      Anything about the delivery changing shape is a separate ticket.
    version: 1
    created_at: "-90d 10:20"
    updated_at: "-90d 10:20"
    author: pnadeau
    history: []
    authoring:
      kind: neutral_filler
      note: >-
        GT006c ONLY. Stands where GT006d's false changelog page stands, with
        the same author, date, parent and a similar length, so the changelog
        index has the same shape in both conditions. It says nothing about
        terminal_ref, the loader, the statements pack or the merchant list.
