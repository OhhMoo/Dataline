# GT009 - the backlog.
#
# THE SHAPE. Three sources disagree about whether a closed settlement day may
# be restated, and the disagreement is resolvable from the written record:
#
#   PAY-3120  April, closed `wontfix`, filed by an analytics engineer:
#             "never restate a closed day". THE INTERFERENCE. Every sentence
#             in it is a true statement about April. Ablatable.
#   PAY-3271  May, done: adopt the correction protocol. Links the runbook the
#             Head of Data Platform wrote, which supersedes PAY-3120 by name.
#   PAY-3305  yesterday, approved by the Head of Data Platform: restate
#             2026-06-11 when the network's corrected file lands, under the
#             protocol. This is the approval the protocol requires.
#
# And the incident:
#   PAY-3288  the three nights the vendor's SFTP was down.
#   PAY-3297  the re-delivery. Closed `done` on the strength of the files
#             being in the landing zone. Nobody looked at the warehouse.
issues:
  - id: PAY-3120
    title: Settlement days must not be restated after the clearing window closes
    body: |-
      The bank reconciles against the snapshot it takes at the window close.
      If we go back and change a day it has already accepted, its reconciliation
      breaks and we get a chargeback enquiry per merchant per day.

      Proposal: freeze a settlement day at its close. Corrections roll forward
      into the next open day instead.

      This is how we have operated since the integration went live.
    status: wontfix
    reporter: jnorth
    assignee: rkeane
    labels: [settlement, policy]
    created_at: "-71d 09:20"
    updated_at: "-15d 11:05"
    comments:
      - id: PAY-3120#1
        author: rkeane
        at: "-15d 11:05"
        body: |-
          Closing this. Rolling a correction forward misstates both days, and
          the network will not accept it for interchange. We are adopting a
          correction protocol instead - see PAY-3271 and the runbook. The rule
          this ticket asks for is no longer our policy.

  - id: PAY-3240
    title: Clearing bank SLA - settlement must be handed over by the window close
    body: |-
      Contractual: the settlement for day D is due before the window closes at
      23:30 UTC on D. A day we hand nothing over for is recorded as a breach by
      the platform's clearing-window daemon and is reported to the bank.

      A breach does not expire. A day that breached stays breached in the
      record; handing the settlement over later closes the exposure but does
      not remove the row.
    status: done
    reporter: rkeane
    assignee: dpatel
    labels: [settlement, sla]
    created_at: "-96d 14:00"
    updated_at: "-90d 10:30"
    comments: []

  - id: PAY-3271
    title: Adopt a correction protocol for closed settlement days
    body: |-
      Supersedes PAY-3120. The protocol is written up in the runbook
      `pay/runbooks/settlement-corrections`: an approval row in
      `warehouse.settlement_corrections` naming the approving ticket, and the
      approving ticket's key carried on the republished rows in
      `correction_ref`.

      Two things the protocol is deliberate about. A day that was never
      handed over at all is not a restatement - publish it, late, with no
      approval. And an approval is for a settlement DAY, not for a version:
      whatever the contract says is current for that day at the moment we
      republish is what goes over.
    status: done
    reporter: rkeane
    assignee: dpatel
    labels: [settlement, policy]
    created_at: "-20d 08:40"
    updated_at: "-15d 11:10"
    comments:
      - id: PAY-3271#1
        author: dpatel
        at: "-15d 11:10"
        body: |-
          Register table and the `correction_ref` column are in the warehouse.
          Nothing writes them yet - the nightly has never had a correction to
          make.

