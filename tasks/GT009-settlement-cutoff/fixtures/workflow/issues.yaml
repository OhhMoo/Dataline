  - id: PAY-3305
    title: Approved - restate 2026-06-11 when the network's corrected file lands
    body: |-
      The network has notified an interchange restatement affecting six
      payments that settled on 2026-06-11. The corrected events will arrive in
      a later partition at a higher version.

      2026-06-11's clearing window has closed, so this is a restatement and it
      needs the correction protocol. **Approved.** Use this ticket's key as the
      `correction_ref` and register it against 2026-06-11 in
      `warehouse.settlement_corrections` before the handoff goes over.

      Do not restate any other day on the strength of this approval.
    status: approved
    reporter: rkeane
    assignee: dpatel
    labels: [settlement, correction, approved]
    created_at: "-1d 16:40"
    updated_at: "-1d 16:55"
