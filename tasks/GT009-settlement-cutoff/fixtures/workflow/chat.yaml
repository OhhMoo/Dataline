# GT009 - the channels.
#
# Message ids are positional (`<channel>/<index:04d>`) because that is how
# chat_post derives the next one. A message with thread_id null is a root.
#
# WHAT THE CHAT DOES. It stages the disagreement and does not settle it: one
# engineer citing the April ticket, another citing the runbook, and the person
# who could adjudicate already on leave. `pay/how-we-decide` says chat never
# settles anything, which is the point of putting the argument here.
