  - id: pay/runbooks/feed-recovery
    title: Recovering a partition the vendor did not deliver
    parent: pay
    version: 5
    body: |-
      The vendor re-delivers a missed partition under the `dt=` folder of the
      day it belongs to, which is in the past relative to the night you are
      standing in.

      The nightly is checkpoint-driven. Before you decide the feed is short,
      read `warehouse.load_checkpoint` and compare it against what is actually
      in the landing zone. A partition behind the checkpoint is not going to be
      read, however long you wait for it.

      Recovering is a reload, not a repair: the feed is immutable, so the
      correct state of any day is whatever the source contract folds the
      delivered events for it into.
    last_edited_by: dpatel
    last_edited_at: "-52d 15:20"

