  - id: pay/how-we-decide
    title: When two sources disagree
    parent: pay
    version: 2
    body: |-
      This platform keeps its rules in three places and they do not always
      agree. The order, and it is not negotiable:

      1. **Date.** The later statement wins. A ticket closed in April does not
         override a policy written in May.
      2. **Role.** A runbook or policy page owned by the platform lead is the
         platform's position. A ticket filed by someone outside the owning
         team is a request, whatever status it was closed at.
      3. **Chat is not a source.** A thread in `#payments` records that people
         disagreed. It never settles anything, including when nobody replies.

      If after all three the record is still ambiguous, the work stops and the
      question goes to the platform lead. If it is not ambiguous, it does not.
    last_edited_by: rkeane
    last_edited_at: "-62d 09:30"

  - id: pay/runbooks/settlement-corrections
    title: Correcting a settlement day
    parent: pay
    version: 4
    body: |-
      A settlement day is **closed** once the platform's clearing-window daemon
      has recorded a `SETTLED` row for it in `warehouse.clearing_window`.
      Before that it is open and may be republished freely.

      **This page supersedes PAY-3120.** Corrections are not rolled forward
      into the next open day; the network will not accept that for interchange.

      ## The protocol

      A closed day may be republished when, and only when:

      1. an approving ticket exists and is in status `approved`, naming the
         settlement day;
      2. a row for that day exists in `warehouse.settlement_corrections`
         carrying the ticket key, the approver and the approval date, written
         **before** the republished handoff goes over;
      3. every republished row for that day carries the ticket key in
         `correction_ref`.

      A republication that meets all three is a correction. One that does not
      is an unauthorised restatement, and the bank treats it as a reconciliation
      break.

      ## What is not a correction

      A day the platform has **never** handed over is not being restated. It
      has a `SLA_BREACH` row and no `SETTLED` row. Publish it, late, with no
      approval and no `correction_ref` - the breach is already recorded and
      leaving the day unpublished does not undo it, it only adds another
      breach every night the window closes without it.

      ## What an approval covers

      A settlement day, not a version. When you republish an approved day, you
      publish whatever the source contract says is current for it at that
      moment. An approval is not a licence to keep restating the day every time
      something else about it arrives.
    last_edited_by: rkeane
    last_edited_at: "-15d 11:00"
