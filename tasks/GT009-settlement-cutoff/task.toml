  "bi_list", "bi_render", "docs", "issues", "chat", "kb",
  "metrics", "alarms",
]

pass_requires_checks = ["C0", "R1", "R2", "R3", "R4", "D1", "D2", "D3"]
# 18 is exactly CORRECTNESS (12) + DECISION (6). RAISING IT ABOVE 18 PUTS
