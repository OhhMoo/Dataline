  { label = "dbt",      tool = "dbt_compile",   args = { selector = "*" }, covers = ["dbt_run", "dbt_test"] },
  { label = "deploy",   tool = "deploy_list",   args = {}, covers = ["deploy_run", "deploy_history"] },
]

