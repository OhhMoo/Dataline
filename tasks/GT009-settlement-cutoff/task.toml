  { label = "alarms",   tool = "alarms_list",   args = {}, covers = ["alarms_get", "alarms_history"] },
]

dead_by_design = [
  { label = "dbt",            reason = "there is no dbt project in this world. Both pipelines are python scripts under workspace/pipelines and the scheduler executes them through the `script` exec kind. Probed explicitly so the audit records it as declared-dead." },
  { label = "deploy",         reason = "this platform has no release surface. What runs is orchestration/schedule.yml, and changing it is a commit rather than a rollout; var/obs/definitions.yaml therefore declares no deploys. GT007 and GT008 own the deploy axis." },
  { label = "~ingest_list",   reason = "no ingestion connector plane. The feed is files under workspace/data/payments_feed, which is what the loaders read." },
  { label = "~ingest_runs",   reason = "as ~ingest_list." },
  { label = "~ingest_alerts", reason = "as ~ingest_list." },
  { label = "~airbyte",       reason = "native-mode sweep label for the same absent ingestion plane as ~ingest_*" },
]

required_surfaces = [
