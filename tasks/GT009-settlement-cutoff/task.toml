# GT009 - Harbor task package metadata.
#
# THE SETTLEMENT CUTOFF: TASK_DESIGN_2026-09-15's unbuilt "concrete extension"
# - recover the payment gap while a consumer publishes a settlement file;
# deliver a higher-version correction and an older replay during recovery;
# inject a retry between sink commit and checkpoint update; grade exact
# consumer-visible records through a protected ledger. Every value here that is
# a measurement says so and says when; everything else says it is not.
#
# WHAT IS NEW IN THIS ONE. It is the first task built around a DECISION rather
# than a defect to find. The defects exist and are findable; what they create is
# a question with two wrong answers - publish a restatement the record does not
# cover, or withhold one it does - and the rubric charges both, through receipts
# the world wrote at the moment the bank could see them.

[task]
id          = "GT009-settlement-cutoff"
version     = "0.1.0"
discipline  = "data_engineering"
archetype   = "asymmetric_regret_under_a_cutoff"
composed_of = ["concrete-extension-settlement-cutoff", "feed-gap-recovery",
               "correction-protocol"]
title       = "Recover three missed nights of the payments feed while the clearing bank keeps being published to"
summary     = "A checkpoint-driven loader advanced past three nights the vendor never delivered; the vendor has since re-delivered them, behind the checkpoint, and the clearing bank has three SLA_BREACH rows and no settlement. Recover them while the nightly keeps handing the bank a settlement at a cutoff every night. During the recovery the network restates a day whose window has already closed - which the declared correction protocol permits and a closed ticket forbids - and then re-sends the version that restatement superseded. Correctness is graded from the world's own publication receipts, at every cutoff, in both directions: publishing a wrong number and withholding a warranted one cost the same."

[difficulty]
human_hours          = "3-6"
target_pass_at_1     = "0.8"        # the LIBRARY target (agent.md 8.10), not a
                                    # measurement. See [handover].
# MEASURED 2026-09-17, opus 5, K=5, MCP driver, host topology, prompt `guided`,
# run `clean-20260917-k5`: Pass@1 = 0.2, Pass^5 = 0.0, 5 scored / 0 quarantined,
# before_episode.json on disk for all five. Totals 8/8/8/8/18: C0 and D1-D3 at
# ceiling, R1-R4 passed by one episode, S1/S2 0 of 5 because the report keys
# were not disclosed (fixed the same day; the pass criterion does not read
# them). tests/VALIDITY.md, 2026-09-17 section. Far below the 0.8 library
# target: a wall on the "leave the nightly correct without you" axis.
target_pass_at_1_measured = "0.2 (K=5, 2026-09-17, guided); see tests/VALIDITY.md"
target_pass_measured = true
axis                 = "decision"   # the obstacle is not concealment. The
                                    # mechanisms are stated plainly in the
                                    # source contract and the runbook; what the
                                    # world stages is a question whose answer
                                    # three sources disagree about, and whose
                                    # two failure directions are symmetric.
# FOUR GRADED AXES, reported apart in the grader's `by_axis`. CORRECTNESS is the
# t0 state plus four nights of RECEIPTS against the oracle trajectory; DECISION
# is the correction protocol and the two regrets; EVIDENCE is scored and
# excluded from pass/fail; LIVENESS and HYGIENE are penalty-only.
axes                 = { CORRECTNESS = 12, DECISION = 6, EVIDENCE = 2, LIVENESS = 0, HYGIENE = 0 }
rubric_points        = 20
rubric_points_source = "tests/manifest.yaml check table"

# What makes this long-horizon by construction rather than by padding: the
# decision the task grades cannot be taken during the episode. The correction
# arrives on night 2 and the replay on night 3, after teardown, so what is
# graded is the POLICY the agent encoded in a pipeline it will not be there to
# run. `wrong_precedence` is the measurement of exactly that: C0 and R1 full,
# R2..R4 zero, D3 full, D2 zero (measured 2026-09-16).
mechanism = "recovered_then_asked_the_wrong_question"

# ---------------------------------------------------------------------------
# [composition] - the four-layer generator contract of
# implementation_structure/TASK_DESIGN_2026-09-15.md ("Framework proposal:
# contract maintenance under a live process"). GT008 was the first task written
# against it; this is the second, and the first whose ledger is real.
#
# DECLARATIVE ONLY. tests/grade.py is still the grader and tests/manifest.yaml
# is still the rubric; nothing reads this table yet.
# ---------------------------------------------------------------------------
[composition]

# LAYER 1 - the contract layer. Four, and unlike GT008 two of them are the ones
# tasks/contracts/CONTRACTS.md calls "designed - no task writes receipts yet".
contracts = ["version_precedence", "cutoff_integrity", "consumer_consistency",
             "liveness"]

# The context layer: what the world says about all of this. Every item is
# generated by fixtures/make_fixture_world.py and digested
# (CONTRACT.world.corpus_digest); the falsifier mutates eight of them and
# requires verify() to catch each.
context = [
  { surface = "issues", id = "PAY-3120", role = "THE INTERFERENCE. April, closed wontfix, filed by an analytics engineer: never restate a closed settlement day. Ablatable." },
  { surface = "issues", id = "PAY-3271", role = "May, done: adopt the correction protocol. Links the runbook that supersedes PAY-3120." },
  { surface = "issues", id = "PAY-3305", role = "THE APPROVAL. Yesterday, status `approved`, raised by the Head of Data Platform, naming the day." },
  { surface = "issues", id = "PAY-3288", role = "the three nights the vendor's SFTP was down" },
  { surface = "issues", id = "PAY-3297", role = "the backfill, closed on the strength of the files being in the landing zone. Nobody looked at the warehouse." },
  { surface = "issues", id = "PAY-3240", role = "the bank's SLA: a breach does not expire" },
  { surface = "kb",     id = "pay/runbooks/settlement-corrections", role = "THE PROTOCOL, and the page that supersedes PAY-3120 by name" },
  { surface = "kb",     id = "pay/how-we-decide", role = "precedence: later wins, the owner's runbook beats a closed ticket, chat settles nothing" },
  { surface = "kb",     id = "pay/runbooks/feed-recovery", role = "how a re-delivery lands, and to read the checkpoint before believing the feed is short" },
  { surface = "kb",     id = "pay/notices/network-restatement", role = "the network's own notice, including that its recovery re-issues superseded records" },
  { surface = "chat",   id = "payments", role = "the argument nobody settles, with the person who could already on leave" },
  { surface = "docs",   id = "settlement_contract_v3.md", role = "THE PUBLISHED CONTRACT. Section 3 is version precedence; section 4 freezes the handoff layout; section 5 is the clearing window." },
  { surface = "docs",   id = "runbook_settlement_nightly.md", role = "the checkpoint is a statement about DATA, not about time" },
]

[composition.contracts_why]
version_precedence = """
docs/settlement_contract_v3.md section 3 says a payment is held at its HIGHEST
delivered version, that a void at the highest version removes it, and that
delivery order is not version order. The world's own loader takes the most
recently DELIVERED event instead - right on every night it has ever run,
because every correction this feed has delivered arrived after the version it
superseded. Graded by R3 (the network's recovery re-sends version 1 after
version 2) and R4 (the same partition delivered twice). MEASURED on every
build: fixture_contract._problems_mechanism runs the shipped loader, publisher
and daemon over the four planted nights and requires the result to be the
`shipped_unchanged` trajectory the generator computed independently.
"""
cutoff_integrity = """
The clearing window for a day closes at 23:30 and the platform's own daemon
records what it was handed. A day with a SETTLED row is CLOSED, and what the
bank holds for it changes only through the declared correction path. Graded by
D2, which pays for the approved restatement going over THROUGH the protocol and
zero for a silent one - and by R2, whose `silent_correction` rival is exactly a
closed day republished with the right arithmetic and no ticket. This is the
first task in the repository that evaluates it against real receipts;
tasks/contracts/CONTRACTS.md: the `kind` amendment landed 2026-09-17 and the module
# is measured on this task's real receipts; the cutoff DECISION is still graded by D2
# here, because receipts carry the execution day, not the period published (VALIDITY.md).
"""
consumer_consistency = """
Every receipt's canonical hash must equal the hash of the object the oracle
would have published at that vnow. R1..R4 are exactly that comparison, computed
by materialising the reference trajectory at the layout the source contract
freezes and hashing it by the ledger's own rule. MEASURED: the restatement of
that rule reproduces a receipt the WORLD wrote, byte for byte
(`ledger.hash_rule_audited` in every graded result).
"""
liveness = """
The nightly must keep being a nightly while all of the above is true. Carried
by R1..R4 and D3 rather than by a clause of its own: a loader that stops
publishes no receipts, so every night scores zero and every window closes
empty. L1 exists as a PENALTY and a named diagnostic only - see the manifest's
header for why it pays nothing.
"""

[composition.contracts_not_conjoined]
exactly_once = """
NOT claimed. The loader is a full reload of an immutable feed and the fold is
by business key, so a duplicated delivery is absorbed by version precedence
rather than by an exactly-once obligation. Declaring it would count the same
mechanism twice - the error agent.md 8.10 records as G4 restating G1c.
"""
auditability = """
NOT claimed as a graded contract. The ledger is real here and IS the grading
surface, but nothing in the rubric turns on the agent proving anything about
it: the receipts are written by the world, outside the episode, and the agent
cannot reach them. An auditability clause would be grading the world.
"""

# LAYER 2 - the stressor layer. Archetypes re-roled as ways to stress a
# contract. Params are CONTRACT values, not literals; the night each fires is
# in [[composition.schedule]].
[[composition.stressors]]
name   = "checkpoint_past_an_unread_partition"
params = { checkpoint = "CONTRACT.checkpoint_t0", gap = "CONTRACT.gap_days", redelivered_at = "2026-06-11T04:12:00" }
stresses = ["liveness", "cutoff_integrity"]
note = "the gap. Present at t0, not on any night: the decision it forces is taken during the episode and measured on every night after."

[[composition.stressors]]
name   = "higher_version_correction_after_cutoff"
params = { night = 2, day = "CONTRACT.closed_day", payments = "CONTRACT.correction.payments", ticket = "CONTRACT.correction.ticket" }
stresses = ["cutoff_integrity", "consumer_consistency"]
note = "THE decision. Two wrong answers, charged the same."

[[composition.stressors]]
name   = "older_replay_after_the_correction"
params = { night = 3, day = "CONTRACT.closed_day", shape = "the version-1 events re-sent byte for byte after the version 2 that superseded them" }
stresses = ["version_precedence", "cutoff_integrity"]
note = "couples into the one above: an arrival-order fold republishes it, so the error reaches the bank rather than stopping in the warehouse"

[[composition.stressors]]
name   = "retried_delivery_between_commit_and_checkpoint"
params = { night = 4, files = ["events.csv", "events-retry.csv"], fault = "sink_ack_lost" }
stresses = ["version_precedence", "consumer_consistency"]
note = "the doubling family. The partition is delivered twice because the sink commit was acknowledged and the checkpoint update was not; the world also declares a `job_retry` on that night's load so the run history shows it."

[[composition.stressors]]
name   = "conflicting_authority_by_date_and_role"
params = { forbids = "PAY-3120", permits = "pay/runbooks/settlement-corrections", disputes = "chat:payments", precedence = "pay/how-we-decide" }
stresses = ["cutoff_integrity"]
note = "agent.md 8.10's only measured lever, pointed at a DECISION rather than at a repair. Ablatable: a matched control replaces PAY-3120's body with a neutral proposal."

# LAYER 3 - the coupling rule. Two stressors compound only if they share state.
# MEASURED, not asserted - and measured WITH A CLOCK, which is what
# tasks/harness/COUPLING.md named as the weakest thing about the filter.
[composition.coupling]
shared_state = "warehouse.settlement_handoff and warehouse.clearing_window, the two objects the clearing bank reads and the two the world publishes receipts for"
rule         = "perturb defect A; advance the clock to A's next planted event; if B's contract then fails, they are coupled"
evidence     = """
MEASURED 2026-09-16 by tasks/harness/coupling.py --clock over the GT009
adapter. See tests/VALIDITY.md for the table. The finding the clock buys:
`older_replay_after_the_correction` is UNCOUPLED from the correction at t0 -
the replay is a file nobody has read - and COUPLED once the clock advances over
night 3, because the correct repair of the correction (restate under the
protocol) is undone by the replay the fold then accepts.
"""

# LAYER 4 - the live-time layer. A deterministic, seeded event schedule. The
# grader lands one partition, advances CONTRACT.advance_hours_per_night of
# virtual time, and reads the RECEIPTS; four times.
[[composition.schedule]]
vnow_or_day = "2026-06-12"
event       = "t0 - the episode ends here at 09:00. The gap is on disk, behind the checkpoint; the bank has three SLA_BREACH rows and no settlement for those days. C0 is read at teardown."

[[composition.schedule]]
vnow_or_day = "2026-06-12"
event       = "night 1: an ordinary day - new payments and two same-day corrections. R1. What it measures is the decision taken at t0: was the gap recovered and handed over?"

[[composition.schedule]]
vnow_or_day = "2026-06-13"
event       = "night 2: THE CORRECTION. Version 2 of six payments that settled on 2026-06-11, whose clearing window closed before the episode began. R2 - the fork."

[[composition.schedule]]
vnow_or_day = "2026-06-14"
event       = "night 3: THE OLDER REPLAY. The network's recovery re-sends the version-1 events for the same six payments. R3 must be IDENTICAL to R2 for that day."

[[composition.schedule]]
vnow_or_day = "2026-06-15"
event       = "night 4: THE RETRY. The partition is delivered twice, byte for byte, and the world declares a job_retry on the load. R4 - the settlement must not double."

[limits]
# PLACEHOLDER (estimate, not calibrated). Comparable to GT008: two pipelines to
# repair, a register to write, and a decision to settle from three disagreeing
# surfaces. Raise or lower on the first K>=5 run that shows budget exhaustion.
wall_clock_seconds = 7200
memory_mb          = 2048
disk_mb            = 2048
max_tool_calls     = 700

[environment]
seed_contract = "fixtures/fixture_contract.py"
seed          = 9009
virtual_now   = "2026-06-12T09:00:00Z"
network       = "none"
surfaces      = ["duckdb", "git", "scheduler", "bi", "workflow", "docs",
                 "observability"]
# The grader advances the clock FOUR nights, one at a time, planting one
# partition before each. Amounts are CONTRACT values.
clock_advance = "fixtures/fixture_contract.py::CONTRACT.advance_hours_per_night x CONTRACT.plant_nights"

# ONE WAREHOUSE. Every key tests/build_world.py prints is one
# tasks/harness/episode.py already carries, so - unlike GT008 - no harness-side
# patch is required or shipped.
[environment.warehouses]
primary = { name = "warehouse", backend = "duckdb", path = "var/warehouse/warehouse.duckdb" }

[grading]
mode            = "deterministic"
judge           = "shadow"
process_signals = "report_only"
entrypoint      = "tests/grade.py"
manifest        = "tests/manifest.yaml"
artifact        = "/workspace/final_report.json"
# The grader copies the whole world tree, plants the nights, advances the clock
# and reads var/ledger/receipts.jsonl. It never reads the action log.
world_root_required = true
action_log_required = false

[agent_visible]
brief = "prompts/guided.md"

# ---------------------------------------------------------------------------
# Three descriptions of the SAME task: identical world, identical rubric,
# identical pass criterion.
#   vague    - the lead's note. No table names, no job names, no ticket keys.
#   guided   - names the surfaces: the jobs, the feed, the contract, the
#              precedence page. Not the defect and not the decision.
#   specific - states the acceptance criteria, including that withholding is
#              not a safe answer. The floor, not a walkthrough.
# The prompt variant is NOT the difficulty dial (agent.md 8.10, correction 1);
# the variants exist so a run's conditions are explicit and reproducible.
# ---------------------------------------------------------------------------
[prompt_variants]
default = "guided"
select  = "prompts/variant.py select <name>  (rewrites [agent_visible].brief)"
attribute = "prompts/variant.py identify <run-dir>  (reads each rollout's own prompt.txt)"
# RE-LOCKED 2026-09-17: every variant gained the same "The report" table naming
# final_report.json's keys and value shapes. MEASURED before it (run
# `clean-20260917-k5`, guided, opus, K=5): S1 and S2 scored 0 in 5 of 5 with
# the prose asking for the right facts under the wrong names - a fixed 2-point
# charge for an undisclosed schema, not a measurement of the task. The keys
# are disclosed; what goes in them (the runbook, the ticket, the checkpoint
# day) is not. Runs before this lock carry the old hashes in prompt.txt.
guided   = { file = "prompts/guided.md", sha256 = "605882a55931a2f0e3392e2c80ba999912f32f0b454347b9ae7e4430a2f8219b" }
specific = { file = "prompts/specific.md", sha256 = "228b50aac0163929b7e27573b094740dea3773f62afdf827df1886ba78440778" }
vague    = { file = "prompts/vague.md", sha256 = "746eac157939e5a6b860bd1bc5c5ca9855566eb67803bfcc119cdef9dfce56c2" }

# ---------------------------------------------------------------------------
# Task-validity gate. MEASURED 2026-09-16 by tests/run_baselines.py at seed
# 9009, against worlds built by tests/build_world.py, every baseline acting
# through a real gateway (tests/probes/gateway.py). See tests/VALIDITY.md for
# the full table and the commands.
# ---------------------------------------------------------------------------
[[validity]]
agent  = "oracle"
expect = "== max; passes"
note   = "solution/solution.py goes through the tool surface: reads the runbook, the precedence page and both tickets; writes both pipelines with fs_write; registers the approval with sql_execute; runs both jobs for real through sched_trigger; writes the report."

[[validity]]
agent  = "rebuilt_not_updated"
expect = "== max"
note   = "THE POSITIVE CONTROL. The oracle's published object, reached by DROPping and rebuilding the handoff table at the frozen layout instead of updating it in place. A receipt is what the bank can see, not the statements that produced it, and the rubric must not reward one SQL idiom."

[[validity]]
agent  = "no_op"
expect = "<= 0"
note   = "Every clause an idle agent satisfies pays nothing. An earlier cut gave LIVENESS two points and no_op collected them; LIVENESS is now penalty-only and the manifest says why."

[[validity]]
agent  = "report_only"
expect = "EVIDENCE only; does NOT pass"
note   = "The report alone, with the right figures. CORRECTNESS and DECISION zero."

[[validity]]
agent  = "checklist"
expect = "< no_op"
note   = "Asserts the recovery and does nothing: H1 -2."

[[validity]]
agent  = "wrong_precedence"
expect = "D2 zero, D3 FULL, R2..R4 zero; does NOT pass"
note   = "THE WITHHOLDING DIRECTION, and the one the world argues for loudest. Follows PAY-3120 and the chat thread: recovers the gap, publishes it, and never restates a closed day. Everything else is right. The two regrets are scored separately, so this keeps D3 and loses D2."

[[validity]]
agent  = "publish_everything_immediately"
expect = "D1 and D2 zero, R2..R4 zero; does NOT pass"
note   = "THE PUBLISHING DIRECTION. Restates the closed day the moment the correction lands, with no approval registered and no correction_ref. The arithmetic is right and the door is wrong."

[[validity]]
agent  = "overwrite_silently"
expect = "D1 full, D2 zero, R2..R4 zero"
note   = "The protocol is three clauses and this one keeps two: the approval is registered and the published rows do not carry the ticket. Separating it from the row above is what proves D1 and D2 are different checks."

[[validity]]
agent  = "replay_wins"
expect = "C0, R1, R2 full; R3 and R4 ZERO"
note   = "Delivery order taken as version order, with the checkpoint defect repaired so ONLY the fold is wrong. Right at t0, right through the correction, and wrong from the night the network's recovery re-sends what it already sent."

[[validity]]
agent  = "duplicate_counted"
expect = "R1..R3 full, R4 ZERO"
note   = "The retried delivery counted twice. The only baseline that isolates night 4."

[[validity]]
agent  = "withhold_everything"
expect = "R1..R4 zero, D3 zero, L1 penalty"
note   = "Recovers correctly at t0, then switches the publisher off. Every window after that closes empty and the bank is told so, every night."

[[validity]]
agent  = "disabled_load"
expect = "< 0"
note   = "Everything switched off. No receipts at all."

[[validity]]
agent  = "fixture_falsifier"
expect = "verify() catches every planted damage"
note   = "30 mutations, each required to be caught by a NAMED clause. Two of the clauses are measurements: _problems_mechanism RUNS the world's own code over the planted nights, and _problems_receipts advances the real scheduler over one night and reads var/ledger/receipts.jsonl."

# ---------------------------------------------------------------------------
# THE LIVE-CONSUMER ARM'S OWN GATE (run with --variant live-consumer). The
# world owns a second platform job - the clearing bank's nightly pull, which
# books the handoff into warehouse.bank_settlement_book on every advance and
# publishes a receipt for it - and four more checks (LC1..LC4) grade those
# receipts against the same trajectories. The arm's falsifier adds four
# mutations (34 total): the pull script, its slot, its target, and deploying
# it from schedule.yml. The arm runs every base baseline too; the two below
# that are re-declared here are the ones whose LC classification is asserted.
# ---------------------------------------------------------------------------
[[validity]]
agent   = "oracle_live"
variant = "live-consumer"
expect  = "== max (26); passes"
note    = "The base oracle's play, unchanged: repair both pipelines, register the approval, run the nightly once, write the report. The pull needs nothing from the agent - that is the point. The bank's book matches the oracle trajectory all four nights."

[[validity]]
agent   = "advance_before_repair"
variant = "live-consumer"
expect  = "EVIDENCE only; LC1..LC4 zero, booked shipped_unchanged/no_recovery; does NOT pass"
note    = "Withholding is not silence: triggers the shipped nightly once to watch it, changes nothing, reports honestly. Four nights advance at grading with the defect live, and the bank's pull books the wrong state each night into a ledger the final state cannot edit. (The pull fires on the grading advances only; it does not run while the agent works - see the [variants] header.)"

[[validity]]
agent   = "erase_the_record"
variant = "live-consumer"
expect  = "C0, R1..R4, D1..D3 FULL; LC1..LC4 ZERO; H2 -2; does NOT pass"
note    = "The arm's added discrimination: the oracle's whole play plus a DELETE on the bank's book. Every base check passes; the first night's pull books a prefixless book no trajectory holds, and the deletion itself is charged. Passes the base arm's criterion; fails here."

[[validity]]
agent   = "withhold_everything"
variant = "live-consumer"
expect  = "R1..R4 zero, LC1..LC4 zero classified frozen_after_t0, D3 zero, L1 penalty"
note    = "In this arm withholding is not silence: the publisher is the agent's, but the pull is the bank's, and it booked the frozen handoff every night."

[[validity]]
agent   = "publish_everything_immediately"
variant = "live-consumer"
expect  = "D1/D2/R2..R4 zero; LC2..LC4 zero classified silent_correction"
note    = "The silent restatement is booked on night 2 and the book never forgets it; a later correction would be a new night's rows, not an edit."


# ---------------------------------------------------------------------------
# Rollout-harness contract (tasks/harness/).
# ---------------------------------------------------------------------------
[harness]
world_builder = "tests/build_world.py"
grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--workspace", "{workspace}",
              "--world-root", "{world_root}", "--json"]
