grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--workspace", "{workspace}",
              "--world-root", "{world_root}", "--json"]
harness_patch_required = false

# The content-bearing gate (tasks/harness/NATIVE_DRIVER.md) binds only where a
# task declares `warehouse_schemas`. This world ships a populated warehouse at
# t0 - the task is not to build it - so the declaration is real and the gate
# should hold it to content.
warehouse_schemas = ["raw", "warehouse"]

surface_probes = [
  { label = "sql",      tool = "sql_query",     args = { sql = "SELECT 1" } },
  { label = "fs",       tool = "fs_list",       args = { path = "." } },
  { label = "git",      tool = "git_log",       args = { limit = 5 }, covers = ["git_diff"] },
  { label = "sched",    tool = "sched_state",   args = {}, covers = ["sched_list", "sched_trigger"] },
  { label = "sched_log", tool = "sched_logs",   args = {} },
  { label = "logs",     tool = "logs_list",     args = {}, covers = ["logs_get", "logs_search"] },
  { label = "bi_list",  tool = "bi_list",       args = {} },
  { label = "bi_render", tool = "bi_render",    args = { dashboard = "clearing_settlement" }, covers = ["bi_get", "bi_cached"] },
  { label = "docs",     tool = "docs_list",     args = {}, covers = ["docs_search", "docs_get"] },
  { label = "issues",   tool = "issues_list",   args = {}, covers = ["issues_get", "issues_search"] },
