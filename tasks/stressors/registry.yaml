# Stressor registry -- layer 2 of the contract-maintenance generator.
#
# One entry per stressor that EXISTS AS FIXTURE CODE TODAY. A stressor is not a
# task: it is a way to stress a contract, and one stressor serves many contracts
# (docs/implementation_plan/structure/TASK_DESIGN_2026-09-15.md, "Framework proposal").
#
# Every `implemented_in` below was read out of the generator, not out of a
# DESIGN.md or a prompt. Anything not read out of code carries `verified: false`
# and says what would have to be read to confirm it. Nothing here was inferred
# from a row count in a .duckdb file; no .duckdb file was opened.
#
# FIELDS
#   name           snake_case identifier, unique across the corpus
#   task           owning task directory
#   implemented_in file:symbol -- the function or module-level constant that
#                  actually plants it
#   kind           defect | event | context
#   stresses       contract names, from exactly this closed set:
#                    exactly_once        each business event lands once
#                    liveness            it keeps running / lands in time
#                    version_precedence  the newest version of a key wins
#                    cutoff_integrity    a published boundary is respected
#                    consumer_consistency what consumers read agrees with source
#                    auditability        the record of what happened survives
#   state          the shared-state declaration the coupling pre-filter reads:
#                    tables       fully qualified relations it writes/corrupts
#                    checkpoints  watermarks, scheduler state, deploy manifests
#                    window       [[start, end], ...] ISO dates it affects
#                    metrics      the named numbers it moves
#   repair         the step of the task's own solution/ that repairs THIS
#                  stressor alone, or null when the oracle has no isolable step
#   stageable_subset  true when a coupling adapter can build a world with this
#                  stressor present or absent without editing the task
#   notes          anything load-bearing a reader would otherwise have to
#                  re-derive
#
# `state.tables` is DIRECT writes only. Tables the stressor reaches by
# derivation (kpi_daily built from fct_orders, say) are listed under
# `derived_tables` and are deliberately NOT part of the pre-filter: the point of
# the measured test is to find propagation the declaration missed.

contracts:
  - exactly_once
  - liveness
  - version_precedence
  - cutoff_integrity
  - consumer_consistency
  - auditability

stressors:

