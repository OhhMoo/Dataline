# ===========================================================================
# GT009 -- settlement cutoff. Every entry here is an EVENT, and none of them is
# measurable without a clock: the obligation each one creates does not exist
# until the night it arrives, so no repair applied at t0 can satisfy a clause
# about it. `coupling.py --selfcheck` without `--clock` reports exactly that,
# per stressor, rather than returning a verdict computed before the question is
# asked. With `--clock` the adapter stages a world root, the repair lands at
# t0, and the world's own jobs run over the planted nights.
# ===========================================================================
  - name: checkpoint_past_an_unread_partition
