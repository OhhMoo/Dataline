      window: [["2026-01-14", "2026-04-06"]]
      metrics: [declared_tests_in_yaml, manifest_test_nodes]
    repair: "solution/solution.sh step 2 -- narrow .dbtignore to
             models/staging/legacy/stg_billing_v1__*.sql and
             _billing_v1__models.yml (== make_fixture_world.ORACLE_DBTIGNORE)"
    stageable_subset: false
    notes: >
      The ignore swallows models/staging/legacy/_billing__models.yml, the only
