    kind: defect
    verified: true
    stresses: [exactly_once, auditability]
    state:
      tables: [warehouse.fct_orders]
      checkpoints: []
      window: [["2026-02-09", "2026-02-22"]]
      metrics: [order_lines, orders, gross_revenue, aov]
    derived_tables: [warehouse.kpi_daily, warehouse.bi_revenue_extract,
                     reporting.rpt_sku_daily, reporting.rpt_customer_orders_monthly]
    repair: "solution/solution.sh step 3/7 -- DELETE keeping row_number() OVER
             (PARTITION BY order_id, line_nbr ORDER BY load_ts, rowid) = 1"
    stageable_subset: true
    notes: >
      base_orders UNION ALL a copy of WIN_START..WIN_END re-read from
      raw.orders_snapshot and stamped batch_id RETRY_BATCH. The copy carries the
      UNADJUSTED price and is_manual_adjustment FALSE, which is why SELECT
      DISTINCT does not collapse it and why the repair must keep the EARLIEST
      load_ts. warehouse.pipeline_watermark is static (WATERMARK_SQL) and is not
      touched, so this stressor has no checkpoint state.

