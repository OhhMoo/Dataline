                     nova.warehouse.v_revenue_daily]
    repair: "solution/load_nova.py line 71 -- ROW_NUMBER() OVER (PARTITION BY
             order_id ORDER BY version DESC, emitted_at DESC, event_id)"
    stageable_subset: false
    notes: >
      ROW_NUMBER() ... ORDER BY delivered_dt DESC, emitted_at DESC ranks by
      DELIVERY order, not by the `version` column the published contract names.
      Correct for all 30 history nights (history_out_of_order == 0, re-measured
      by _problems_oracle) and wrong from the moment a replay lands. Its delete
      handling and approved-adjustment handling are correct; precedence is the
      only semantic defect, and fixture_contract.MUTATIONS refuses a fixture
      where it has been quietly fixed.

