             terminal_ref IS DISTINCT FROM 'TEST-HARNESS' AND ... 'SMOKE-TEST'
             in pipelines/{build,backfill}_payments.sql; step 2 restates"
    stageable_subset: false
    notes: >
      terminal_ref NOT IN ('TEST-HARNESS','SMOKE-TEST') is NULL-unsafe; the NULL
      terminal_refs come from landing_sql's legacy acquirer branch (M0001..M0006,
      card-not-present). 2,660 rows dropped, mean 6.372%/day inside a 14.75%
