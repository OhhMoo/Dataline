# BI001 - the incident as Finance filed it, and the thread that says who may
# change what. tests/build_world.py appends these issues to the theme's
# backlog (world/world/themes/commerce_analytics/workflow/issues.yaml) and
# re-seeds var/workflow through world.workflow, so every rule the theme's
# corpus obeys (positional comment ids, nothing after the world clock, ASCII)
# holds here too. `authoring` blocks are author-side: the services strip them
# and so does the native harness's staged copy.
#
# Every number below was measured on the built world (tests/run_baselines.py
# gate `ticket_numbers_are_true`): the KPI card of each vendor's PUBLISHED
# Executive Overview, rendered by world.semantic on the warehouse.
issues:
  - id: ANA-241
    title: Executive Overview shows three different Net Revenue numbers
    body: |-
      Getting ready for the February close I put the three Executive
      Overviews side by side - the Power BI one Amy closes from, the Tableau
      one Sales rebuilt, and ours in Sigma. The Net Revenue card says three
      different things, all time to date:

        Power BI   33,733,790.00
        Tableau    76,338,069.00
        Sigma      35,084,324.00

      Completed Orders is off on Tableau too (26,338 against 15,183 on the
      other two), and AOV is different on all three. Sales quote the Tableau
      one in their QBR decks and we work the close from ours. Which one is
      right? And can the other two be fixed before we take February on
      Wednesday?
    status: todo
    reporter: mfischer
    assignee: null
    labels: [revenue, executive-overview, finance, close]
    created_at: "-3d 16:48"
    updated_at: "-1d 11:02"
    comments:
      - id: ANA-241#1
        author: lmorales
        at: "-3d 17:35"
        body: |-
          The Tableau calcs are the same formulas as the Power BI measures -
          Net Revenue is SUM(IF [order_status] = 'completed' THEN
          [order_amount] END) - and I have not touched them since the
          rebuild. I am at the QBRs until Wednesday, so I can't dig into it
          before then.
      - id: ANA-241#2
        author: achen
        at: "-2d 10:15"
        body: |-
          Power BI is the number I close from and the board pack ties to it,
          so nobody touches Power BI. Tableau and Sigma are meant to show the
          dbt number and right now they don't. Putting them back on it is a
          fix, not a definition change, and I am fine with that going out
          during the freeze. Hanna - that is my OK for this ticket.
      - id: ANA-241#3
        author: hkowalski
        at: "-1d 11:02"
        body: |-
          Agreed. Freeze exception for this ticket only: the Tableau and Sigma
          builds may be republished once they match the dbt metrics. Same
          rules as always - fix it in bi/, commit it, publish it the way
          ae/runbooks/bi-release-process says, and check what is published,
          not your local copy. Nothing in the warehouse, the dbt models or
          models/semantic changes for this. Put the numbers back on this
          ticket for Mia when it is done.
    history: []
    links: []
    authoring:
      kind: incident_report_lay
      note: >-
        BI001. The incident as the person who saw it describes it: three
        numbers, a deadline, no mechanism. Two builds are wrong for two
        unrelated reasons and Power BI is right (gen.BI_FAULTS): Sales'
        Tableau data source builds Orders from Custom SQL joining the order
        lines in (every order-grain measure summed once per line), and
        Finance's Sigma workbook computes Net Revenue inline as "status is not
        cancelled" (refunds counted). Lucia's comment is true and points away
        from the data source - the calculated fields ARE the right formulas.
        The two comments after it are the mandate: Tableau and Sigma are
        in-mandate during the freeze, Power BI and every definition are not.
