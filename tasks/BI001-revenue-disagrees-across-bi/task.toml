# BI001 - task package metadata.
#
# The first task that plugs the whole BI stack: an analyst's laptop
# (`da/laptop`) with Power BI, Tableau and Sigma, the commerce_analytics world,
# and the Executive Overview built three times - leadership's in Power BI,
# Sales' in Tableau, Finance's in Sigma. Two of the three builds are wrong for
# two unrelated reasons planted in their committed projects (gen.BI_FAULTS),
# so the three KPI cards disagree. The work is the work as it is done at work:
# find each cause, fix the BI-as-code project in git, publish with the
# vendor's own CLI / API, verify the published numbers against the warehouse,
# tell the stakeholder. Nothing in the warehouse or the dbt project is wrong.
#
# Two arms: `default` (control - both builds are the agent's to fix and
# publish) and `decision` (the controller keeps Finance's Sigma workbook until
# her sign-off; DESIGN.md §12).

[task]
id          = "BI001-revenue-disagrees-across-bi"
version     = "0.1.0"
discipline  = "analytics_engineering"
archetype   = "BI-1"
composed_of = ["BI-1"]
title       = "Three Executive Overviews, three revenue numbers"
summary     = "Finance's ticket: the Power BI, Tableau and Sigma builds of one dashboard show three different Net Revenue figures. Power BI is right; Sales' Tableau data source fans every order out per line, and Finance's Sigma workbook counts refunded orders. Fix both builds in the repo, publish them through Tableau's and Sigma's own tooling, leave Power BI and the warehouse alone, and tell Finance."

[difficulty]
human_hours          = "2-6"
target_pass_at_1     = "0.4"        # a guess, stated as one (DESIGN.md §7); NOT measured
axis                 = "bi"
rubric_points        = 22
rubric_points_source = "tests/manifest.yaml check table"
mechanism = "two independent definition defects in two BI tools' as-code projects (a Custom SQL fan-out join in a Tableau data source; a Sigma workbook formula that keeps refunded orders), visible only as three dashboards that disagree, repairable only in the project files and observable only through each vendor's published state"

[limits]
# PLACEHOLDER, not calibrated against any run: a build is ~10 s, a render
# under a second; the work is reading XML/JSON and four or five API calls.
wall_clock_seconds = 5400
memory_mb          = 2048
disk_mb            = 4096
max_tool_calls     = 600

[environment]
seed          = 11
virtual_now   = "2026-03-02T00:00:00Z"
network       = "none"
# The box: alkera_gateway.plugs da/laptop - files, notebook (Jupyter), the
# DuckDB warehouse, dbt, BI and the human plane - with the BI slot plugging
# the three vendors in place of Metabase. The world's seed records the same
# profile (fixtures/seed.yaml); episode.check_world_profile compares them.
profile       = "da/laptop"
surfaces      = ["duckdb", "dbt", "workflow", "powerbi", "tableau", "sigma"]
engine        = "world.semantic (Power BI PBIP/TMDL/DAX subset, Tableau .tds/.twb calc subset, Sigma workbook/data-model JSON formula subset); dbt-core 1.12.4, duckdb 1.5.5"

[environment.plugs]
bi = ["powerbi", "tableau", "sigma"]

[grading]
mode            = "deterministic"
judge           = "none"
process_signals = "report_only"
entrypoint      = "tests/grade.py"
manifest        = "tests/manifest.yaml"
artifact        = "/workspace/final_report.json"
# The published state of each vendor lives with its service, outside the
# world tree and out of the episode's reach (<rollout>/service-state/bi,
# mounted into native-services only); the harness stages
# it into the grading zone after teardown (tasks/harness/bistate.py) and hands
# its path to the grader as {bi_state}. Every number is re-rendered from the
# staged files by world.semantic: no cache, no service response, is an outcome.
world_root_required = true

# ---------------------------------------------------------------------------
# The agent sees exactly one file: the brief [agent_visible].brief names (or
# the arm's `prompt`). instruction.md is the shipped brief, locked below like
# the alternatives.
# ---------------------------------------------------------------------------
[agent_visible]
brief = "instruction.md"

# THE DIFFICULTY DIAL. Three descriptions of the SAME task: identical world,
# rubric and pass criterion. sha256 over the file's exact bytes (LF, no BOM).
#   ticket   - the hand-over a colleague would write: three numbers disagree,
#              Power BI is what Finance closes from, fix the other two where
#              they are defined, make what people open show the right number,
#              tell Mia. Names no cause, no file, no tool command.
#   guided   - adds the definition of record (the dbt metrics) and that the
#              fault is in the BI projects, not the warehouse.
#   specific - states every end condition the grader checks, in words.
[prompt_variants]
default  = "ticket"
select   = "prompts/variant.py select <name>   (rewrites [agent_visible].brief)"
attribute = "prompts/variant.py identify <run-dir>   (reads each rollout's own prompt.txt)"
ticket   = { file = "instruction.md", sha256 = "e6198ff3740e19746bdf2a41f8faeea87988d26f28e623732b472f4b8e18bc11" }
guided   = { file = "prompts/guided.md", sha256 = "76d707f524214e6f77c79d7b9d8795847020143c76e212729e9107e74714cf5e" }
specific = { file = "prompts/specific.md", sha256 = "9f50223af404d51816b6e28146705ad7385674466e9bb448f95054724e399a93" }

