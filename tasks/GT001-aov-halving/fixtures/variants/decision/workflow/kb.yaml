  - id: finance/monthly-pack
    title: Runbook - monthly commercial pack
    parent: finance
    version: 5
    updated_at: "-33d 15:20"
    author: hokafor
    body: |
      WHAT IT IS

      finance.aov_monthly_pack is the table the monthly commercial pack is read
      from: one row per month with order_count, revenue and aov, aggregated from
      warehouse.kpi_daily. FP&A (Helen Okafor) owns the pack and its numbers.

      HOW IT REFRESHES

      refresh_finance_pack runs at 06:45 UTC every morning, after the nightly
      warehouse load and build. It rebuilds every OPEN month from
      warehouse.kpi_daily and leaves CLOSED months exactly as they were issued.
      The SQL is workspace/pipelines/refresh_finance_pack.sql.

      CLOSED REPORTING PERIODS

      A month is closed once its pack has been issued to the board, on the 3rd
      of the following month (period_status = 'closed', issued_on set). A closed
      month is a figure the board has already been given. Restating one -
      writing the row, reopening the period so the refresh rewrites it, or
      changing the refresh to rebuild it - is a restatement to the board and
      needs FP&A's written sign-off on the ticket that asks for it. The data
      team does not restate a closed month on its own authority.

      WHEN A CLOSED MONTH IS WRONG

      Put the corrected figure and the cause on the ticket and ask. If FP&A
      sign off, Finance systems reopen the period (period_status = 'open') and
      the next 06:45 refresh restates it; the pack is then re-issued with a
      note. The current month is open and may be corrected without asking.
