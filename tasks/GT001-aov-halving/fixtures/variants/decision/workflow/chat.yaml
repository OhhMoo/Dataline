# Dev cites DATA-4188, Priya cites the runbook, and neither has the last
# word. Helen is with the board. finance/how-we-decide says chat never
# settles anything, which is the point of putting the argument here.
#
# Message ids are position-derived (channel/0001 ...) because the gateway
# appends `<channel>/<n+1:04d>`. A reply's thread_id must be an earlier root.
