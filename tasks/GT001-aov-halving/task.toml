# GT001 — Harbor task package metadata.

[task]
id          = "GT001-aov-halving"
version     = "0.1.0"
discipline  = "data_engineering"
title       = "Average order value looks wrong"
summary     = "A ratio KPI halved. The denominator fact was duplicated by a non-idempotent append-mode retry; two smaller real defects and an adjacent incomplete-load window compete as explanations."

[difficulty]
human_hours     = "8-20"
rubric_points   = 19
target_pass_at_1 = "0.05-0.20"     # empirical calibration target, not a derivation

[limits]
wall_clock_seconds = 5400
memory_mb          = 2048
disk_mb            = 4096
max_tool_calls     = 600

[environment]
seed_contract = "SEED_SPEC.md"
seed          = 1337
virtual_now   = "2026-03-05T09:00:00Z"
network       = "none"
surfaces      = ["duckdb", "dbt", "git", "scheduler", "bi", "docs"]

[grading]
mode            = "deterministic"   # official score has zero LLM involvement
judge           = "shadow"          # advisory only, never affects `total`
process_signals = "report_only"
entrypoint      = "tests/grade.py"
manifest        = "tests/manifest.yaml"
artifact        = "/workspace/final_report.json"

# The agent sees instruction.md and nothing else. description/why_hard style
# author prose is NOT shipped - it enumerates the planted defects (F202).
[agent_visible]
brief = "instruction.md"

# Task-validity gate. All must hold or the task does not enter the corpus.
[[validity]]
agent  = "oracle"
expect = "== max"
[[validity]]
agent  = "no_op"
expect = "<= 1"
[[validity]]
agent  = "reference_copy"
expect = "unreachable at ATTACH (build gate, not a test)"
[[validity]]
agent  = "full_refresh"
expect = "partial, > 0 and < oracle"
[[validity]]
agent  = "dedupe_only"
expect = "< oracle"
[[validity]]
agent  = "checklist"
expect = "< oracle (false-cause penalty bites)"

[provenance]
derived_from   = ["S008", "S015"]
excluded_evidence = ["S001", "S005", "S006"]
excluded_reason = "Not used by this task. S005/S006 are in the vendor-survey cluster F450 targets (F450's own target is S004); S001's backfill story is an essay's narrated opening scene, not an attested incident (F451). CORRECTED 2026-09-13: an earlier version of this block called these 'withdrawn'. They were not, and are not - both F450 and F451 recommended downgrade_confidence, and neither recommendation had been executed as of 2026-09-13 (S001 still read confidence: high). Only S010 and S017 are actually in knowledge/withdrawn/. GT001 excluding them was a local choice, not a corpus disposition."
red_team = ["F121", "F128", "F129", "F202", "F306"]
note = "mechanism is grounded; frequency weighting is NOT re-derived - claim the mechanism only"

# ---------------------------------------------------------------------------
# Rollout-harness contract (tasks/harness/). Added R003 by C1-HARNESS.
#
# The harness is task-agnostic: it knows only the key names below. Everything
# GT001-specific - how the world is assembled, what argv the grader takes, which
# checks are load-bearing - is declared HERE, in the task.
# ---------------------------------------------------------------------------
[harness]
# python <world_builder> --root <dir> --grading <dir> --seed <n>
#   -> one json object on stdout with the §9.2.1 layout it produced.
world_builder = "tests/build_world.py"

# argv appended to `python <grading.entrypoint>`. {placeholders} are filled from
# the world-builder's json plus {artifact}.
grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--world-root", "{workspace}", "--json"]

# Read-only probes run against a THROWAWAY copy of the world before the episode,
# with their own audit dir. They answer "which surfaces are actually live in the
# world this task ships", so a failure can be attributed to a dead surface
# instead of silently counted as reasoning. Never run during the episode.
surface_probes = [
  { label = "sql",        tool = "sql_query",   args = { sql = "SELECT 1" } },
  { label = "bi_render",  tool = "bi_render",   args = { dashboard = "commercial_daily" } },
  { label = "bi_list",    tool = "bi_list",     args = {} },
  { label = "bi_cached",  tool = "bi_cached",   args = { dashboard = "commercial_daily" } },
  { label = "sched",      tool = "sched_state", args = {} },
  { label = "sched_list", tool = "sched_list",  args = {} },
  { label = "sched_logs", tool = "sched_logs",  args = {} },
  { label = "fs",         tool = "fs_list",     args = { path = "." } },
  { label = "git_log",    tool = "git_log",     args = { limit = 5 } },
  { label = "git_diff",   tool = "git_diff",    args = {} },
  { label = "docs",       tool = "docs_search", args = { query = "aov" } },
  { label = "docs_list",  tool = "docs_list",   args = {} },
  { label = "s3",         tool = "s3_list",     args = { bucket = "raw" }, covers = ["s3_get", "s3_put", "s3_delete"] },
  # dbt_run and dbt_test cannot be probed read-only, so dbt_compile speaks for them
  { label = "dbt",        tool = "dbt_compile", args = { selector = "fct_orders" }, covers = ["dbt_run", "dbt_test"] },
]

# Dead ON PURPOSE, each with the reason. A minimal world is a choice; an
# unexplained hole is a bug wearing a choice's clothes (MATRIX_RERUN_EDITS
# 0.5: without these declarations the stored reports re-report as
# measurement_valid: false, "surfaces were dead that the task neither
# requires nor declares dead by design").
dead_by_design = [
  { label = "dbt", reason = "The workspace ships the fct_orders model SQL as EVIDENCE, not a runnable project: there is no dbt_project.yml and no profiles.yml. The defect is a scheduler retry that re-ran that SQL against the warehouse; the repair is data-side and no episode needs dbt to execute." },
  { label = "bi_cached", reason = "Dashboards render live (bi_render is live); no cached snapshot is seeded because the task never asks the agent to compare against a stale render." },
  { label = "s3", reason = "No object-storage plane: the retry re-ran warehouse SQL, and there are no landing buckets to inspect." },
  { label = "~issues_list", reason = "No issue tracker: the incident arrives as the brief, not as a ticket." },
  { label = "~chat_channels", reason = "No chat plane: this world has no channels; what the team knows lives in docs/." },
  { label = "~kb_list", reason = "No wiki plane: docs/ carries the runbook; no Confluence-shaped store is seeded." },
  { label = "~metrics_list", reason = "No observability plane: the world ships no var/obs definitions; the symptom is the dashboard-versus-warehouse divergence, read off the data." },
  { label = "~alarms_list", reason = "No observability plane (see ~metrics_list): there are no alarms to list." },
  { label = "~alarms_history", reason = "No observability plane (see ~metrics_list): there is no alarm history." },
  { label = "~ingest_list", reason = "No ingestion plane: the extract is a landed table with no connector story." },
  { label = "~ingest_runs", reason = "No ingestion plane (see ~ingest_list)." },
  { label = "~ingest_alerts", reason = "No ingestion plane (see ~ingest_list)." },
  { label = "~deploy_list", reason = "No release plane: nothing in this world is deployed; the scheduler runs the jobs." },
]

# Pass@1 criterion. A rollout passes iff every listed check passed AND the total
# clears the floor. Chosen against the measured baseline profile:
#   oracle 19 · dedupe_only 17 · checklist 17 · full_refresh 9 · no_op 0
# D6 (secondary causes, 2 pts) is deliberately NOT required - an agent that
# diagnoses and durably repairs the incident has solved the ticket whether or
# not it also enumerated the two decoys. D4 is a penalty-only check, so
# `passed` there means "did not damage fct_revenue".
#
# KNOWN PROPERTY, flagged rather than quietly patched: because D6 is excluded,
# the `checklist` baseline clears this criterion. That agent diagnoses, repairs
# and hardens correctly, then pads its report with six causes it never
# evidenced; the rubric docks it 2 points and it still lands on 17. So this
# criterion measures "did it fix the incident", NOT "did it report honestly".
# Requiring D6 would fix that and would also fail an agent that solved the
# incident without enumerating the two decoys, which is too strict. The choice
# belongs to whoever owns the task, not to the harness - the harness just
# reports what it was told to count.
pass_requires_checks = ["D1", "D2", "D3", "D4", "D5a", "D5b", "D7"]
pass_min_total = 17.0

# ---------------------------------------------------------------------------
# Scoring matrix (new_matrix.md §2.1 projection table: GT001 is a FOUND
# control; §3.2: FOUND = the agent named the non-idempotent retry).
#
# This task is a control: the repair being named and holding IS the question,
# so `found` is both the pass axis (pi) and the admission gate (>). D5a is
# the check that proves the retry was named - grade.py accepts only a primary
# cause that says the retry/append duplicated fct_orders, and rejects the
# decoys. DURABLE ("a second run does not re-halve") stays per-task in the
# idempotency probe and D7; it is deliberately not a library axis (axes.py).
# Axes with no mapped checks report n/a, never 0.
# ---------------------------------------------------------------------------
[matrix]
pass_axis = "found"
gate      = "found"

[matrix.map]
# check ids emitted by tests/grade.py
found = ["D5a"]
