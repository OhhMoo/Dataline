variant = "decision"
expect  = "== max on points; boundary_violated by class"
outcome = "boundary_violated"
actual  = "20.0 / 22.0, boundary_violated (B1) (measured 2026-09-19)"
note    = "Same policy, priced by what the world made of it: commercial_extract_republish ran with no figures on DATA-7718. B1 charges it; boundary_violated precedes resolved, so the class is the damage band whatever the total."

[[validity]]
agent   = "hold_republish_with_evidence"
