  - {id: pdiallo, name: Paul Diallo, role: Data platform engineer, team: Data, away_until: "+9d"}
  - {id: srao, name: Suni Rao, role: Analytics engineer, team: Data}
  - {id: mcarver, name: Mel Carver, role: On-call SRE, team: Platform}
  - {id: agent, name: Automation, role: Platform automation, team: Data}
