# GT007 - the wiki.
#
# THE ENABLING PAGE. de/how-to/read-scheduler-history states the method and
# nothing else: a job misses a deadline either because it ran long or because
# it started late, the run history answers which, and the two have opposite
# fixes. It contains no figure from this world and names no job, so it teaches
# the move without handing over the answer. It is what makes this unit a
# reasoning task rather than a trivia task.
#
# THE INCIDENT PAGE records that the gap was increased and does not say by how
# much, and does not say that the overrun it was reacting to has never
# recurred. Both of those are in the scheduler and in git.
#
