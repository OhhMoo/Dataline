[harness]
world_builder = "tests/build_world.py"
grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--workspace", "{workspace}",
              "--world-root", "{world_root}", "--json"]
# RUNNABLE BY THE HARNESS - MEASURED 2026-09-16 by tests/surface_check.py.
# The substrate GT008 was blocked on has LANDED: tasks/harness/episode.py now
# carries WORLD_WAREHOUSE_KEYS = ("warehouse_name", "warehouses",
# "initial_world_fp") into the gateway config and re-roots a DuckDB peer's path
# onto the probe copy (`reroot_warehouses`). Against a world built by
# tests/build_world.py, a real gateway over a throwaway copy answers 16 live
# surfaces out of 40 probes over a 63-tool toolbelt, `sql_legacy` and
# `bi_render` among them, and surface_audit.gate_error comes back clean. No
