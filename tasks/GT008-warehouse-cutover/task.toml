dead_by_design = [
  { label = "dbt",            reason = "there is no dbt project in this world. Both loaders are python scripts under workspace/pipelines and the scheduler executes them through the `script` exec kind. Probed explicitly so the audit records it as declared-dead." },
  { label = "~ingest_list",   reason = "no ingestion connector plane. The feed is files under workspace/data/orders_feed, which is what the loaders read." },
  { label = "~ingest_runs",   reason = "as ~ingest_list." },
  { label = "~ingest_alerts", reason = "as ~ingest_list." },
  { label = "~airbyte",       reason = "native-mode sweep label for the same absent ingestion plane as ~ingest_*" },
]

# `sql_legacy` requires the two-warehouse surface. MEASURED LIVE 2026-09-16
# (tests/surface_check.py): every name below answers through a real gateway
# stood up by the harness's own config writer, over a throwaway copy of a world
