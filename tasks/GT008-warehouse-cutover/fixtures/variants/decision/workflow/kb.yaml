  - id: de/how-to/warehouse-cutover
    title: How to cut a mart over to a new warehouse
    parent: de
    version: 3
    body: |-
      A cutover is a sequence, and skipping a step is how a migration that
      looked finished on the day goes wrong the week after.

      1. BASELINE. Before you touch anything, write down what the old
         warehouse says: how many rows, how many keys, what the totals are.
         You cannot prove the migration lost nothing if you did not record
         what there was.

      2. BUILD. The target must serve the same tables, built from the SAME
         SOURCE the old one was built from - never by copying the old mart
         across. A copy is right for exactly one night.

      3. DUAL-RUN. Both warehouses loading from the source, every night, until
         you are sure. The target's load must be scheduled, not run by hand.

      4. RECONCILE - rows AND values. Row counts matching proves the keys
         moved. It does not prove the numbers did. Compare the totals, and
         compare the keys, before you repoint anything. A mart whose row
         counts match and whose decimals do not is the most common shape of a
         bad cutover.

      5. REPOINT under a canary. The consumer's pointer moves through the
         deploy surface, which measures what the consumer reads before and
         after. Read the canary. If it breached, roll back - that is what the
         rollback deploy is for - and find out why.

      6. RETIRE the old writer. Two systems of record is no system of record.
         The old warehouse stops being written the moment the consumer is off
         it, not when somebody remembers.

      What "finished" means: the consumer is on the new warehouse, the new
      warehouse is right THE NEXT MORNING and every morning after, and the old
      warehouse is not being written. The first two nights after a cutover
      are the test, not the day of it.
    last_edited_by: rkeane
    last_edited_at: "-45d 15:30"
    edit_comment: add the note about copies and the next-morning test
    history:
