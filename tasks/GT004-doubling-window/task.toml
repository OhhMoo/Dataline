# ---------------------------------------------------------------------------
# Rollout-harness contract (tasks/harness/). The harness is task-agnostic: it
# knows only the key names below and refuses to run a task that has not declared
# them, because each of them decides the measured number.
# ---------------------------------------------------------------------------
[harness]
# python <world_builder> --root <dir> --grading <dir> --seed <n>
#   -> one json object on stdout with the SS9.2.1 layout it produced:
#      {"world_root","workspace","warehouse","scheduler","dashboards",
#       "profiles_dir","grading","virtual_time","seed"}
world_builder = "tests/build_world.py"

# argv appended to `python <grading.entrypoint>`. {placeholders} are filled from
# the world-builder's json plus {artifact}.
# NOTE THE SPLIT - it differs from GT001/GT002, which pass the WORKSPACE as
# --world-root. G5 diffs fingerprint sections that live OUTSIDE the workspace
# (var/sched, var/bi, var/obs, var/workflow, var/world), so this grader needs
# the real world root as well as the agent's tree. Copied from GRADER's
# recommended_harness block in tests/manifest.yaml and checked against
# tests/grade.py's own argparse (--world --grading --artifact --workspace
# --world-root --json).
grade_argv = ["--world", "{warehouse}", "--grading", "{grading}",
              "--artifact", "{artifact}", "--workspace", "{workspace}",
              "--world-root", "{world_root}", "--json"]

# Read-only probes against a THROWAWAY copy of the world, before the episode,
# with their own audit dir. They answer "which surfaces are actually live in the
# world this task ships", so a failure can be attributed to a dead surface
# instead of silently counted as reasoning. `covers` lets one probe speak for
# siblings that cannot be probed read-only; anything unprobed is recorded per
# rollout as `unprobed_tools` and named in the report.
surface_probes = [
  { label = "sql",       tool = "sql_query",      args = { sql = "SELECT 1" } },
  { label = "fs",        tool = "fs_list",        args = { path = "." } },
  { label = "git",       tool = "git_log",        args = { limit = 5 }, covers = ["git_diff"] },
  { label = "dbt",       tool = "dbt_compile",    args = { selector = "*" }, covers = ["dbt_run", "dbt_test"] },
  { label = "sched",     tool = "sched_state",    args = {}, covers = ["sched_list"] },
  { label = "sched_log", tool = "sched_logs",     args = {} },
  { label = "logs",      tool = "logs_list",      args = {}, covers = ["logs_get", "logs_search"] },
  # bi_render/bi_get/bi_cached take a dashboard ID and are therefore NOT probed
  # yet: the dashboard id is a CONTRACT value (probes/exposure.py reads
  # var/bi/dashboards/<id>.yml) and fixtures/fixture_contract.py does not exist
  # at the time of writing. A probe naming a dashboard that is defined nowhere
  # fails against every world the harness can build and reports a surface that
  # was never alive - GT002 shipped exactly that. Add the probe, with the
  # CONTRACT's id, as soon as WORLD lands the dashboard.
  { label = "bi_list",   tool = "bi_list",        args = {} },
  { label = "docs",      tool = "docs_list",      args = {}, covers = ["docs_search", "docs_get"] },
  { label = "ingest",    tool = "ingest_list",    args = {}, covers = ["ingest_get", "ingest_runs", "ingest_run", "ingest_schema", "ingest_alerts"] },
  { label = "metrics",   tool = "metrics_list",   args = {}, covers = ["metrics_get", "metrics_series"] },
  { label = "alarms",    tool = "alarms_list",    args = {}, covers = ["alarms_get", "alarms_history"] },
  { label = "issues",    tool = "issues_list",    args = {}, covers = ["issues_get", "issues_search"] },
  { label = "chat",      tool = "chat_channels",  args = {}, covers = ["chat_history", "chat_thread", "chat_search"] },
  { label = "kb",        tool = "kb_list",        args = {}, covers = ["kb_get", "kb_search"] },
  { label = "deploy",    tool = "deploy_list",    args = {}, covers = ["deploy_history"] },
]

# Pass@1 criterion. A rollout passes iff every listed check passed AND the total
# clears the floor.
#
# All six gates are required, and that is the whole design rather than an
# oversight: DESIGN.md's target comes from composing six roughly-independent
# gates at ~0.85 into 0.377. Dropping one from the conjunction does not make the
# task slightly easier, it removes the composition that is the reason this task
# discriminates where saturated code checks do not.
#
#   G1a/G1b/G1c both defects found and repaired (CODE)
#   G2 idempotency, with liveness   G4 downstream resolves   G6 regression
#   G3 late arrivals                G5 no collateral (penalty-only)
#
# Ids and the floor are GRADER's, copied from the `recommended_harness` block of
# tests/manifest.yaml rather than guessed here; grade.py also prints
# pass_requires_checks in its json, derived from the same table, so the two
# cannot drift silently. G1 is three conjuncts, not one, because its parts fail
# independently.
#
# Hygiene (H1a/H1b/H2) is scored and EXCLUDED from pass/fail, per DESIGN.md.
# That exclusion is only real while the floor cannot readmit it: the required
# checks all passing are worth G1a 5 + G1b 2 + G1c 2 + G2 8 + G3 7 + G4 3 +
# G5 0 + G6 4 = 31, and hygiene can subtract at most 3, so a floor of 28.0 can
# never bind on its own. RAISING IT ABOVE 28 SILENTLY PUTS HYGIENE BACK INTO
# THE PASS CRITERION.
# ---------------------------------------------------------------------------
# REQUIRED SURFACES. Every one of these is verified live before the subject is
# handed the terminal; if any is dead the rollout is a harness_error and is
# never scored, because the agent would not have been given the world this task
# describes.
#
# This list exists because of a measured failure. GT004's first five Opus
# rollouts were scored and reported with EIGHT surfaces dead - alarms, chat,
# dbt, deploy, ingest, issues, kb, metrics - and the harness printed that fact
# under the number instead of refusing to produce one. The cause was not the
# world: the seeded backlog was present and correct the whole time, and the
# harness simply never told the gateway where to look. A number measured in a
# half-absent world is indistinguishable from a real one unless something
# refuses to publish it.
#
# All sixteen are required rather than a design-critical subset, and that is
# deliberate: every one is seeded and was verified live on 2026-09-15, so
# requiring them costs nothing today and turns any future regression into a
# quarantine instead of a quiet mismeasurement. issues/chat/kb in particular are
# not decoration - the scattered human context is half the task design, and the
# only artefact in the world that states the consequence of the primary defect
# lives in the knowledge base.
required_surfaces = [
  "sql", "fs", "git", "dbt", "sched", "sched_log", "logs", "bi_list",
  "docs", "ingest", "metrics", "alarms", "issues", "chat", "kb", "deploy",
]

pass_requires_checks = ["G1a", "G1b", "G1c", "G2", "G3", "G4", "G5", "G6"]

# GRADER's derivation (31 required - 3 hygiene floor), NOT a measurement: no
# baseline has been run, so unlike GT001's 17.0 and GT002's 21.0 this floor has
# not been checked against a baseline profile. The conjunction above is what
# carries the verdict either way. VALIDITY must confirm that no non-oracle
# baseline clears it, and must NOT raise it above 28 to achieve that - see the
# hygiene note above; tighten the checks instead.
pass_min_total = 28.0
pass_min_total_measured = false

