# tokens - every figure, date and identifier the prose quotes
# --------------------------------------------------------------------------
# format:     str | int | comma | money | decimal2 | date | hhmm | pct |
#             words_days | key_tuple | list_items
# visibility: agent_visible - lands in text a tool returns
#             author_side   - only inside an `authoring` block, which
#                             world/workflow.py strips before the agent sees
#                             anything. Still checked: an author-side note that
#                             lies about the world misleads the next builder.
