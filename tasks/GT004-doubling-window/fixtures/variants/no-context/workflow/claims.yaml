# --------------------------------------------------------------------------
# claims - assertions the prose makes that are not a single quoted figure
# --------------------------------------------------------------------------
# Each names the surface that carries it, a verbatim quote that must still be
# present, what it asserts about world state, and what substantiates it.
# `quote` is the drift detector in the other direction: if the prose is edited
# and the sentence disappears, the claim fails rather than silently lapsing.
claims:

  - id: CL-01
    surface: kb
    ref: de/runbooks/revenue-mart-rebuild
    quote: "There is no replace mode."
    asserts: >-
      backfill_orders_window has only an append mode; it inserts into
      warehouse.fct_orders and does not replace the days it is given.
    substantiation:
      kind: file
      path: workspace/pipelines/backfill_orders_window.sql
      digest_key: workspace_sha256.pipelines/backfill_orders_window.sql
    verdict: true
    note: >-
      THE MECHANISM LEG OF THE JOIN. The SQL file states the configuration -
      INSERT INTO, no key, `append` is the default and the only implemented
      mode - and this page states the consequence. No other artefact in the
      world states the consequence in words. It is not, by itself, evidence that
      anything happened: it is a fact about a job. If WORLD ever gave that job a
      merge mode, this page becomes false and the doubling becomes impossible,
      so this is the claim most worth re-checking against the workspace digest.

  - id: CL-02
    surface: kb
    ref: de/runbooks/nightly-load
    quote: "This is safe to re-run."
    asserts: >-
      The older runbook tells the reader that re-running the backfill and the
      build is always safe because both marts are table models.
    substantiation:
      kind: cross_surface
      refs: ["kb:de/runbooks/revenue-mart-rebuild", "kb:de/changelog/materialisation-change",
             "issues:DATA-4372", "file:workspace/pipelines/backfill_orders_window.sql"]
    verdict: deliberately_wrong
    reason: >-
      THE RE-DOUBLING TRAP, and the page G2 is aimed at. It was true of
      fct_revenue until 2025-12-01 and was never true of fct_orders. An agent
      that repairs the window and then follows this page to verify its work
      re-lands, re-runs and doubles it again. Resolvable on evidence the surface
      hands over: 130 days old against the rebuild page's 60, and the rebuild
      page says in its own first line that it supersedes this one. If this page
      ever became accurate, the strongest invitation to re-double would be gone.

  - id: CL-03
    surface: kb
    ref: de/changelog/materialisation-change
    quote: "Raised at the platform sync the week before and written up here on the day; the model change and this page went out together."
    asserts: >-
      ABLATION (R removed): the neutral sentence that replaced "History was
      full-refreshed at the cutover, so every existing row carries the new
      column layout. No backfill is required." It asserts nothing about world
      state - a procedural note in the register of a change record.
    substantiation: {kind: none, path: "unverifiable by construction, like CL-19"}
    verdict: true
    note: >-
      The quote is the drift detector: if the placeholder is edited, this claim
      fails rather than the sentence silently becoming something that DOES say
      something about history. The fact the original claim was checked against
      - 94,097 rows still fail the layout invariant - is still asserted through
      the STALE_ROWS token and the defect_one_only baseline.

  - id: CL-04
    surface: chat
    ref: data-eng/0010
    quote: "anything on the loads or the backfills goes to Divya until I am back"
    asserts: >-
      ABLATION (R removed): the neutral hand-over aside that replaced "yes, I
      full-refreshed fct_revenue when we switched the materialisation. The
      history is fine." in data-eng/0010. It asserts only that kliu is about to
      be away and that Divya covers loads and backfills meanwhile.
    substantiation: {kind: cross_surface, refs: ["chat:data-eng/0011", "users:kliu"]}
    verdict: true
    note: >-
      Consistent with data-eng/0011 (tokafor, the next morning: "Loads and
      backfills to @dpatel") and with kliu's away_until on the roster. The
      quote is the drift detector, as for CL-03: if the placeholder is edited
      this claim fails rather than the message quietly acquiring content. The
      fact the original claim was checked against - 94,097 rows still fail the
      layout invariant - is still asserted through the STALE_ROWS token.

  # CL-05 and CL-06 REMOVED (ABLATION: T). They quoted DATA-4402#1's two false
  # sentences - "nothing to put in them for anything earlier" and "The old rows
  # carry the same money in net_amount, just not broken out." - and asserted
  # their falsity against the world. The ticket is now neutral and carries
  # neither. The facts they rested on (30,110 pre-switch rows with a promo_id;
  # dim_promotions valid across the whole history) are still asserted through
  # the PRESWITCH_PROMO_ROWS token.

  - id: CL-07
    surface: issues
    ref: DATA-4390
    quote: "no de-duplication at all"
    asserts: >-
      pipelines/load_orders_delta.sql is a bare INSERT with a watermark
      predicate, no merge, no unique key and no constraint.
    substantiation:
      kind: file
      path: workspace/pipelines/load_orders_delta.sql
      digest_key: workspace_sha256.pipelines/load_orders_delta.sql
    verdict: true
    note: >-
      THE DECOY, and it is TRUE. Its truth is what makes it dangerous: an agent
      can verify it in the workspace without running anything, find the
      verification satisfying, and never test the causal step. It is also a
      genuine hazard worth fixing, which is what stops it being a straw man - an
      agent that reports it as hardening is right. The false step is made
      elsewhere, by somebody else, in incidents/0004.

  - id: CL-08
    surface: chat
    ref: incidents/0004
    quote: "That is where the extra lines are coming from."
    asserts: The unguarded nightly loader caused the duplication.
    substantiation:
      kind: query
      query: >-
        SELECT COUNT(*) FROM (
          SELECT order_id, line_nbr FROM wh.warehouse.fct_orders
          WHERE batch_id <> 'retry-20260301-0217'
          GROUP BY 1, 2 HAVING COUNT(*) > 1)
    format: comma
    rendered: "0"
    verdict: deliberately_wrong
    reason: >-
      THE FALSE CAUSE the grader's penalty is calibrated against, made by an
      analyst in good faith and agreed with twice. load_orders_delta ran 181
      times, once a night, and its watermark advanced cleanly on every one;
      every duplicated key carries batch_id retry-20260301-0217 and sits inside
      one 14-day window. A loader misfiring nightly would scatter duplicates
      across 181 days. Refuted by one GROUP BY - which is the "query the data
      first" step this task exists to measure - and refuted in prose one message
      later by tokafor, behind an agreement.

  - id: CL-09
    surface: chat
    ref: commercial-reporting/0004
    quote: "Not one of them looks at whether a number is right."
    asserts: >-
      Every check in this world watches freshness, volume or job health, and
      none asserts correctness.
    substantiation:
      kind: cross_surface
      refs: ["kb:de/runbooks/check-reference", "contract:green.dq_check_names",
             "contract:green.uniqueness_checks_present"]
    verdict: true
    note: >-
      The A027 leg. Stronger than the usual form of the claim: a doubled fact
      table clears row_count_gt_zero and a 24-hour freshness threshold MORE
      comfortably than a correct one, so green here is positively misleading,
      not merely uninformative. 0 not-success runs, 0 not-PASS freshness, 0
      not-PASS dq.

  - id: CL-10
    surface: issues
    ref: DATA-4411
    quote: "Row counts look right."
    asserts: >-
      The window was re-landed, the build succeeded, and the row counts the
      engineer checked were correct.
    substantiation:
      kind: cross_surface
      refs: ["query:ops.job_runs for run-20260301-backfill", "chat:data-eng/0013"]
    verdict: true
    note: >-
      Every clause is true and this ticket is still the origin of the incident.
      The counts he checked were the snapshot's, not the mart's, and the ticket
      does not say which - the silence is the content. Nothing here says append,
      merge, mode or full refresh. THE JOIN LIVES HERE: this ticket supplies the
      window and the reason, de/runbooks/revenue-mart-rebuild supplies the
      mechanism, ops.job_runs supplies the invocation, the mart supplies the
      duplicates. Any two are a hypothesis.

  - id: CL-11
    surface: issues
    ref: DATA-4411
    quote: "those corrections have to survive it"
    asserts: >-
      Finance's priced corrections exist in warehouse.fct_orders only; the
      vendor snapshot does not carry them.
    substantiation:
      kind: contract
      keys: [defect_1.manual_adj_total, defect_1.manual_adj_in_window,
             defect_1.adjusted_rows_differing_from_snapshot]
    verdict: true
    note: >-
      The constraint that saves a careful agent from the destructive repair,
      stated three times across three surfaces - here as an aside on a closed
      ticket nine days before the incident, again in
      commercial-reporting/0002, again in the rebuild runbook's pre-flight.
      114 rows differ from the snapshot and 76 sit inside the window, so delete
      and reinsert destroys them.

  - id: CL-12
    surface: chat
    ref: data-eng/0014
    quote: "whether it merged or appended"
    asserts: No human in this world ever established how the re-land was run.
    substantiation:
      kind: structural
      check: chat_thread on data-eng/0014 returns reply_count 0
    verdict: true
    note: >-
      The right question, asked by the right person, of the one person on leave,
      two days before the episode, unanswered. The empty thread is the content
      rather than an empty result, and it is the world's own statement that the
      join this task requires has not been made by anybody.

  - id: CL-13
    surface: users
    ref: kliu
    quote: "away_until"
    asserts: >-
      kliu is on leave for the whole episode, which is why data-eng/0014 has no
      replies and two open tickets carry an assignee who cannot work them.
    substantiation: {kind: local, path: "users.yaml kliu.away_until, a future offset"}
    verdict: true

  - id: CL-14
    surface: kb
    ref: de/metrics/net-revenue
    quote: "**Promotional discount is netted here, before tax.**"
    asserts: >-
      ABLATION (D removed): the definition of record now says the mart nets
      promotional discount before tax, which is what the model has computed
      since 2025-12-01. Every post-switch row must satisfy the page's recipe.
    substantiation:
      kind: query
      query: >-
        SELECT COUNT(*) FROM wh.warehouse.fct_revenue
        WHERE order_dt >= DATE '2025-12-01'
          AND net_amount <> gross_amount - discount_amount + tax_amount
    format: comma
    rendered: "0"
    verdict: true
    note: >-
      The original CL-14 quoted "**Promotional discount is not netted here.**"
      as deliberately wrong and asserted the mart carries non-zero discounts.
      The corrected sentence is checked the other way round: zero post-switch
      rows disagree with it. The pre-switch rows still disagree with it - that
      is defect two, and it is now what the definition of record points at.

  - id: CL-20
    surface: kb
    ref: de/metrics/net-revenue
    quote: "| sales tax at 7.25% on 108.00 | 7.83 |"
    asserts: >-
      The one-line worked example is arithmetic, not a world figure: 120.00 -
      12.00 = 108.00; 108.00 x 0.0725 = 7.83; 108.00 + 7.83 = 115.83.
    substantiation: {kind: none, path: "arithmetic illustration; no world state quoted"}
    verdict: true
    note: >-
      Declared rather than hidden, as CL-19 is. These are the only typed
      numbers in the corpus and they describe no row, day or total in the
      world; the tax rate they use is the TAX_RATE_PCT token.

  - id: CL-15
    surface: kb
    ref: de/policies/certification
    quote: "no hand-written `INSERT`, `UPDATE` or `DELETE` against `warehouse.*`"
    asserts: >-
      A repair that edits the warehouse directly is not certifiable, whatever
      the resulting rows say.
    substantiation: {kind: none, path: authored world policy}
    verdict: true
    note: >-
      The G5 no-collateral rule and the G2 reproducibility rule as an audit
      requirement rather than a grading artefact, on a page edited four days ago
      by the person who raised the headline ticket. The world's own reason why a
      correct row-level diff is not by itself a pass. Not substantiated by data
      because it is a policy, not a measurement - declared here rather than left
      unaccounted.

  - id: CL-16
    surface: issues
    ref: DATA-4418
    quote: "under the dt= folders of the days they correct"
    asserts: >-
      The vendor's late correction lands in raw.orders_landing under the
      partitions of the days it corrects, and never in raw.orders_snapshot.
    substantiation:
      kind: contract
      keys: [late_arrivals.lands_in, late_arrivals.not_in,
             late_arrivals.partitions, layout.payload]
    verdict: true
    note: >-
      The A044 leg, and both clauses are exactly true of the planted payload:
      14 partitions covering the doubled window, arriving 2026-03-09 04:05, into
      the landing table only. It therefore says without saying so that a repair
      reinstating the window from the frozen snapshot is wrong the moment the
      clock advances, and that a lookback keyed on arrival date will not see it.
      Filed as process noise with no link to DATA-4412, because an agent that is
      TOLD late arrivals are coming designs for them and an agent that is merely
      able to find out mostly does not. G3 is scored on the clock advancing, not
      on this ticket being read.

  - id: CL-17
    surface: issues
    ref: DATA-4355
    quote: "There is no uniqueness check anywhere"
    asserts: >-
      No model, test, check or alarm in this world asserts uniqueness on any
      business key, and nothing reconciles net_amount against its components.
    substantiation:
      kind: contract
      keys: [green.uniqueness_checks_present, green.dq_check_names]
    verdict: true
    note: >-
      The control that would have prevented the incident, open since November,
      unassigned. It hands over the business key and describes the layout
      invariant in words without writing it down, and it never says either query
      would return anything today. G6 wants a test that fails pre-repair and
      passes post-repair; this is where the world says which test.

  - id: CL-18
    surface: issues
    ref: DATA-4411
    quote: "is coming out lower than I expect"
    asserts: The fortnight to 2026-02-22 was short.
    substantiation:
      kind: contract
      keys: [symptom.baseline_lines_per_day, symptom.orders_per_day_flat]
    verdict: deliberately_wrong
    reason: >-
      The premise that caused the incident, and it was never true. Order volume
      is flat at 700 a day across the whole history and the reference world puts
      the window at 1,116.79 lines a day against the same 1,116.79 in the
      baseline fortnight before it. It is stated as a perception - "lower than I
      expect" - which is how this kind of mistake is actually phrased, and
      nobody checked it then or since. It is listed as deliberately wrong so
      that an agent's conclusion "the backfill was necessary" can be scored as
      wrong: the backfill was unnecessary AND run in the wrong mode.

  - id: CL-19
    surface: issues
    ref: DATA-4290
    quote: "Eleven views under the legacy_ prefix"
    asserts: Eleven legacy views existed and were dropped 138 days ago.
    substantiation: {kind: none, path: unverifiable by construction}
    verdict: true
    note: >-
      DECLARED RATHER THAN HIDDEN. This is the one figure in the seed that no
      surface can substantiate, because the ticket's whole content is that the
      objects no longer exist. It is noise by design - a closed, irrelevant
      ticket so that issues_list is not nine tickets that all matter - and the
      claim is unfalsifiable rather than false. It is recorded here so that a
      future reader of this manifest does not have to work out whether it was an
      oversight. If the noise ticket is ever rewritten to assert something
      checkable, it gets a real substantiation or it goes.
