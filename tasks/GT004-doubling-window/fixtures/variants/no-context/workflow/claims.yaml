# GT004 workflow plane - the machine-checkable claim manifest.
#
# WHAT THIS IS. Every factual assertion the seeded tickets, chat and wiki make
# about world state, declared against the CONTRACT key or the SQL that
# substantiates it. check_claims.py reads this file and refuses to pass unless
# each one still holds against the world WORLD actually built.
#
# WHY IT EXISTS. Authored narrative that quotes figures nothing re-checks is how
# two previous builders in this repo shipped seeds that became fiction the first
# time a generator moved: the prose still parsed, every structural test still
# passed, and the tracker described a world that no longer existed. Structural
# validation cannot catch this, because a ticket body is a string and every
# string is a valid string.
#
# THE RULE. Nothing in users.yaml, issues.yaml, chat.yaml or kb.yaml may quote a
# number, a date, a row count, an amount, a rate or a relation name that was
# typed rather than derived. Prose that wants a figure adds a token here; it
# does not add a figure.
#
# DELIBERATELY WRONG CLAIMS ARE ASSERTED, NOT EXEMPTED. The stale wiki
# definition, the misread window and the false full-refresh are the measurement.
# A checker that skipped them would let them rot: if a world change ever made
# the stale definition accidentally right, the task would silently lose a gate.
# Each carries verdict: deliberately_wrong, the key or query it must NOT equal,
# and a reason, and check_claims.py asserts the inequality every run.
#
# RESOLVED. fixture_contract.py (seed 4004) and fixtures/build/world.duckdb both
# exist; every token below carries its rendered value and no seed document
# carries a placeholder.
#
#     python check_claims.py --world ../build/world.duckdb
version: 1

surfaces:
  users: users.yaml
  issues: issues.yaml
  chat: chat.yaml
  kb: kb.yaml

# The workflow vocabulary this corpus assumes. It belongs in the theme
# manifest's `workflow:` block; it is restated here so check_claims.py can
# assemble the three documents through world/workflow.py and prove the corpus is
# loadable rather than merely well-formed YAML.
manifest_workflow:
  dir: workflow
  actor: agent
  project: {key: DATA, name: Data platform}
  statuses: [open, triage, in_progress, blocked, done, wontfix]
  workspace: commercial-data
  space: {key: DE, name: Data Engineering}

# The world clock. Read from CONTRACT; the literal is pinned so that a contract
# that moves it is a DRIFT finding rather than a silent re-resolution of every
# offset in the corpus.
vnow: "2026-03-08T09:00:00Z"
vnow_contract_key: virtual_now

