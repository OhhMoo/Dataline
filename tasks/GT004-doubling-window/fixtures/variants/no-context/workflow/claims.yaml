# --------------------------------------------------------------------------
# structural - the shape assertions the whole design rests on
# --------------------------------------------------------------------------
# These are not figures, so no token or quote covers them, and every one of them
# is a single edit away from silently destroying a gate. If somebody "tidies"
# the metric page's last_edited_at forward past the model change, the page stops
# being stale and the headline trap is gone with nothing to say so. Checked
# against the assembled documents, on the resolved world clock, every run.
structural:
  - id: ST-01
    kind: kb_page_edited_before
    page: de/metrics/net-revenue
    contract_key: defect_2.switch_date
    why: >-
      ABLATION (D removed): the page body is corrected but its edit date is
      deliberately left where the original had it, so kb_list's age_days is
      identical across variants and the date cannot be a tell. Asserted so
      nobody "fixes" the date forward and changes the evidence an agent sees.

  - id: ST-02
    kind: kb_page_edited_before
    page: de/runbooks/nightly-load
    contract_key: defect_2.switch_date
    why: >-
      The stale runbook must pre-date the materialisation change for "both marts
      are table models" to read as honestly out of date rather than as a lie.

  - id: ST-03
    kind: kb_page_edited_after
    page: de/runbooks/revenue-mart-rebuild
    contract_key: defect_2.switch_date
    why: >-
      The page that supersedes it must post-date the change, or the wiki's
      contradiction is not resolvable on edit dates and the agent is being asked
      to choose between two documents on taste.

  - id: ST-04
    kind: chat_message_has_no_replies
    channel: data-eng
    message: data-eng/0014
    why: >-
      The question that would have closed the incident must stay unanswered.
      A single seeded reply turns the hardest join in the task into a lookup.

  - id: ST-05
    kind: issue_status_is
