  - id: de/metrics/net-revenue
    title: "Net revenue: definition of record"
    parent: de/metrics
    labels: [metric, definition-of-record, commercial]
    body: |-
      # Net revenue: definition of record

      This is the definition Commercial and Data have agreed. Where a number is
      called net revenue - pack, dashboard, mart, ad-hoc query - it means this
      and nothing else.

      ## Definition

          net revenue = gross revenue + sales tax

      Sales tax is 7.25 per cent. Gross revenue is quantity times unit price,
      before tax, at `order_dt`.

      **Promotional discount is not netted here.** A discounted line still
      contributes its full gross to net revenue. Promotions are a marketing
      cost, Marketing report them against their own budget, and taking them off
      the commercial line as well would count the same money twice. If you need
      the discounted figure, ask Marketing for their promotion report; do not
      derive it from the mart.

      `warehouse.fct_revenue.net_amount` implements this definition, so any
      figure can be checked by recomputing gross plus tax and comparing.

      ## Worked example

      October 2025:

      | component | amount |
      |---|---:|
      | gross revenue | 11,078,704.03 |
      | sales tax at 7.25% | 803,206.06 |
      | **net revenue** | **11,881,910.09** |

      ## Out of scope

      Shipping, inter-company transfers and anything the vendor bills us for are
      not revenue and are not in this table.
    version: 5
    author: tokafor
    last_edited_at: "-120d 11:24"
    last_edited_by: nbrennan
    edit_comment: add the October worked example
    history:
      - {version: 4, at: "-155d 15:02", by: tokafor, comment: "spell out that promo discount is not netted"}
      - {version: 3, at: "-175d 09:40", by: tokafor, comment: "scope out shipping"}
      - {version: 2, at: "-195d 14:15", by: tokafor, comment: null}
      - {version: 1, at: "-205d 12:10", by: tokafor, comment: null}
    authoring:
      kind: stale
      contradicts: [de/changelog/materialisation-change]
      note: >-
        GT4-K2. THE PLANTED STALENESS, and it is deliberately the most
        authoritative-looking artefact in the world: labelled
        definition-of-record, five revisions, last edited by the Head of
        Commercial Reporting herself, written in the register of a standard
        rather than a note, and carrying a worked example that VERIFIES. October
        2025 is entirely before the switch, so 11,078,704.03 + 803,206.06 =
        11,881,910.09 is exactly what warehouse.fct_revenue returns today. An
        agent that spot-checks the page is rewarded with agreement, which is the
        strongest possible endorsement the world can give a document that is
        wrong about the present.
        WHAT IS WRONG. Since 2025-12-01 the model nets promotional discount
        before tax (data-eng/0005, and the model file). The bolded paragraph is
        the false one. Everything else on the page, including the tax rate
        (CONTRACT.defect_2.tax_rate) and the example, is true.
        WHY IT BITES TWICE. First, quantification: an agent that sizes the
        problem with this recipe gets 10,649,255.91 for February against a mart
        that says 10,130,105.08 and has to explain 519,150.83 it cannot explain.
        commercial-reporting/0005 is an NPC doing exactly that, in public,
        uncorrected. Second, and far worse, DIRECTION: the page says the current
        rows are the deviant ones. An agent repairing defect two by conforming
        fct_revenue to the documented definition re-breaks the 108,837 rows that
        are already correct and leaves the 94,097 broken ones alone, which
        inverts the repair while feeling like compliance.
        claims.yaml asserts the page's definition and the model's disagree. If
        that difference ever became zero the page would stop being a trap and
        the task would have quietly lost a gate.

