# GT004: the wiki that is right in some places and out of date in the one place
# that matters most.
#
# RESOLVED against fixtures/fixture_contract.py (seed 4004) and the built world.
# Every figure is declared in claims.yaml with the key or the SQL behind it.
# Page ids carry no derived values: world/workflow.py restricts them to
# [a-z0-9_-./], and an id is something other surfaces link to by hand.
#
# THE TRAP. de/metrics/net-revenue is labelled definition-of-record, is five
# revisions deep, was last edited by the Head of Commercial Reporting, and
# carries a worked example that still reconciles against the warehouse to the
# cent. It is also out of date: on 2025-12-01 the model started netting
# promotional discount before tax, and this page still says the discount is not
# netted at the mart. Nothing on it is marked wrong.
#
# Four reachable signals establish the staleness and none of them is an
# announcement:
#   1. kb_list serves age_days. This page is 120 days old; the change it misses
#      is 97 days old and de/changelog/materialisation-change is dated.
#   2. data-eng/0005 is the superseding statement; data-eng/0007 says "the wiki
#      is just behind" in as many words. Different channel, 98 days ago.
#   3. DATA-4372's closing line asks for this page to be rewritten.
#   4. One query: 34,825 rows in warehouse.fct_revenue carry a non-zero
#      discount_amount that this page says does not exist at the mart.
#
# Every one of those requires having looked somewhere other than this page,
# which is the whole measurement.
#
# THE SECOND WRONG PAGE. de/changelog/materialisation-change states that history
# was full-refreshed at the cutover. It was not. data-eng/0010 repeats the claim
# in the same person's voice, so a reader who cross-checks finds agreement.
