  - id: de/changelog/materialisation-change
    title: fct_revenue materialisation change
    parent: de/changelog
    labels: [changelog, warehouse]
    body: |-
      # fct_revenue materialisation change

      **Date:** 2025-12-01
      **By:** Kenji Liu

      `warehouse.fct_revenue` moved from `materialized='table'` to
      `materialized='incremental'`. The nightly build had been rewriting six
      months of history every night in order to add one day to it.

      The same change split the old tax-inclusive `net_amount` into
      `discount_amount`, `tax_amount` and `net_amount`.

      History was full-refreshed at the cutover, so every existing row carries
      the new column layout. No backfill is required.

      Nothing downstream changes. Same table, same grain, same primary columns.
    version: 1
    author: kliu
    last_edited_at: "-97d 09:02"
    last_edited_by: kliu
    edit_comment: null
    history: []
    authoring:
      kind: confident_wrong
      note: >-
        GT4-K8. DEFECT TWO'S COVER STORY. Three of its four paragraphs are
        exactly true and match pipelines/README.md's own changelog entry. The
        fourth - "History was full-refreshed at the cutover, so every existing
        row carries the new column layout. No backfill is required." - is false:
        94,097 rows before 2025-12-01 still carry discount_amount 0.00,
        tax_amount 0.00 and tax folded into net_amount, and every one of them
        fails net_amount = gross_amount - discount_amount + tax_amount while
        every row after it passes.
        It is written in the flat procedural register of a change record, the
        genre a reader trusts most and questions least, and it is corroborated
        by data-eng/0010, which is the same person saying the same false thing
        in a channel. Two surfaces agreeing is normally how an agent decides
        something is true; here it is one person's assumption written down
        twice.
        Note what it does NOT say: it does not mention that the change also
        started netting promotional discount before tax. That omission is why
        an agent can read this page, read the metric page, find no contradiction
        between them, and still be wrong about both.
        Discoverable by one query, by DATA-4402 (which reports the symptom and
        was closed with a second wrong explanation), and by the absence of any
        full-refresh run in ops.job_runs' 544 rows.

