  - id: de/postmortems/november-extract-cutoff
    title: "Postmortem: the November pack was over the extract"
    parent: de/postmortems
    labels: [postmortem, reporting]
    body: |-
      # Postmortem: the November pack was over the extract

      ## What happened

      The November commercial pack came in above the vendor extract. Commercial
      found it. Nothing in the platform did.

      ## Cause

      The pack query sliced its period on a local-time boundary and picked up
      part of the following day. The warehouse was correct throughout. Fixed in
      the pack.

      ## Why nothing caught it

      Nothing compares a mart to source. Row counts, not-nulls and freshness all
      passed, and they would have passed whatever the numbers were.

      ## Actions

      1. Fix the pack boundary. Done.
      2. Add a uniqueness test on `warehouse.fct_orders (order_id, line_nbr)`.
         **Open.** DATA-4355.
      3. Reconcile the marts against `raw.orders_snapshot` on a schedule. Not
         started, nobody owns it.

      ## What we still do not know

      Whether this class of thing is happening anywhere else. We checked the
      pack query and stopped, because the pack query was where the fault was
      that time.
    version: 2
    author: dpatel
    last_edited_at: "-109d 09:05"
    last_edited_by: dpatel
    edit_comment: mark action 1 done
    history:
      - {version: 1, at: "-110d 16:20", by: dpatel, comment: null}
    authoring:
      kind: accurate_but_partial
      note: >-
        GT4-K10. True, settled, and the anchor of the near-duplicate trap: same
        symptom, different cause, already fixed, written in the register of a
        solved problem. An agent that reads it and stops goes after the pack
        query, which is correct, and takes a collateral hit. It is also
        genuinely useful - action 2 is the regression test G6 wants, action 3 is
        the reconciliation that would have caught this incident, and the last
        paragraph describes this incident 109 days before it happened, including
        the reason nobody found it: they checked the thing that was wrong last
        time and stopped. The page is worth reading and the conclusion it
        invites is wrong, which is the most common shape of a real postmortem.
