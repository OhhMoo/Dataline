  - id: de/changelog/materialisation-change
    title: fct_revenue materialisation change
    parent: de/changelog
    labels: [changelog, warehouse]
    body: |-
      # fct_revenue materialisation change

      **Date:** 2025-12-01
      **By:** Kenji Liu

      `warehouse.fct_revenue` moved from `materialized='table'` to
      `materialized='incremental'`. The nightly build had been rewriting six
      months of history every night in order to add one day to it.

      The same change split the old tax-inclusive `net_amount` into
      `discount_amount`, `tax_amount` and `net_amount`.

      Raised at the platform sync the week before and written up here on the
      day; the model change and this page went out together.

      Nothing downstream changes. Same table, same grain, same primary columns.
    version: 1
    author: kliu
    last_edited_at: "-97d 09:02"
    last_edited_by: kliu
    edit_comment: null
    history: []
    authoring:
      kind: accurate
      note: >-
        GT4-K8 (ABLATION - the refresh claim R removed). The original third
        paragraph - "History was full-refreshed at the cutover, so every
        existing row carries the new column layout. No backfill is required."
        - was false: 94,097 rows before 2025-12-01 still carry discount_amount
        0.00, tax_amount 0.00 and tax folded into net_amount, and every one of
        them fails net_amount = gross_amount - discount_amount + tax_amount.
        It is REPLACED by a neutral procedural sentence of the same length that
        says nothing about the state of history in either direction. The other
        three paragraphs are unchanged and true, and still match
        pipelines/README.md's changelog entry. The page still does not mention
        that the change started netting promotional discount before tax. The
        fact itself is still discoverable by one query and by the absence of
        any full-refresh run in ops.job_runs' 544 rows. data-eng/0010, which
        repeated the claim in the same voice, is neutralised in the same
        variant (see chat.yaml), so the claim is removed from the world and
        not only from the change record.

