  - id: de/metrics/net-revenue
    title: "Net revenue: definition of record"
    parent: de/metrics
    labels: [metric, definition-of-record, commercial]
    body: |-
      # Net revenue: definition of record

      This is the definition Commercial and Data have agreed. Where a number is
      called net revenue - pack, dashboard, mart, ad-hoc query - it means this
      and nothing else.

      ## Definition

          net revenue = (gross revenue - promotional discount) + sales tax

      Sales tax is 7.25 per cent, charged on the discounted amount. Gross
      revenue is quantity times unit price, before discount and tax, at
      `order_dt`.

      **Promotional discount is netted here, before tax.** A discounted line
      contributes its discounted amount to net revenue, and tax is charged on
      what was actually invoiced. Marketing still report promotions against
      their own budget; that is a cost view, not this line. If you need the
      undiscounted figure, use gross revenue; do not add the discount back.

      `warehouse.fct_revenue.net_amount` implements this definition, so any
      figure can be checked by recomputing gross less discount plus tax and
      comparing.

      ## Worked example

      One line:

      | component | amount |
      |---|---:|
      | gross revenue | 120.00 |
      | promotional discount | 12.00 |
      | sales tax at 7.25% on 108.00 | 7.83 |
      | **net revenue** | **115.83** |

      ## Out of scope

      Shipping, inter-company transfers and anything the vendor bills us for are
      not revenue and are not in this table.
    version: 5
    author: tokafor
    last_edited_at: "-120d 11:24"
    last_edited_by: nbrennan
    edit_comment: add the worked example
    history:
      - {version: 4, at: "-155d 15:02", by: tokafor, comment: "spell out how promo discount is treated"}
      - {version: 3, at: "-175d 09:40", by: tokafor, comment: "scope out shipping"}
      - {version: 2, at: "-195d 14:15", by: tokafor, comment: null}
      - {version: 1, at: "-205d 12:10", by: tokafor, comment: null}
    authoring:
      kind: accurate
      note: >-
        GT4-K2 (ABLATION - the stale definition D removed). The original page
        was the planted staleness: labelled definition-of-record, it said net
        revenue = gross + tax with promotional discount NOT netted, which
        stopped being the model's definition on 2025-12-01, and it carried an
        October 2025 worked example that reconciled to the cent against the
        old-layout rows. This variant CORRECTS the body to the definition the
        model implements today (discount netted before tax, tax on the
        discounted amount - dbt_project/models/warehouse/fct_revenue.sql) at
        the same length, same title, same label, same author and same edit
        date. The worked example is one illustrative line rather than a month
        total: no month before the switch reconciles under the current
        definition (the mart's pre-switch rows are broken, and quoting one
        would hand over defect two), and no month after it predates the page's
        edit date. Two metadata strings were neutralised for coherence
        (edit_comment "add the October worked example" -> "add the worked
        example"; v4 history comment "spell out that promo discount is not
        netted" -> "spell out how promo discount is treated"); nothing else on
        the record moved. Applied to history, this page now points AT defect
        two rather than away from it, which is the ablation.
        CONFOUNDS, stated plainly: chat.yaml and issues.yaml are frozen, so
        data-eng/0005 and data-eng/0007 ("the wiki is just behind"), DATA-4372
        ("the metric page needs rewriting") and commercial-reporting/0005 (Rosa
        quoting the OLD definition "off the wiki") still describe the stale
