# GT003 hidden ground truth. Ships to the GRADING ZONE only.
# NEVER mounted inside the episode. NEVER referenced by instruction.md.
# grade.py reads this for tokens, policy and probe parameters; every NUMERIC
# reference is computed from /grading/expected.duckdb at scoring time so the
# two cannot drift apart silently.

task_id: GT003-tuesday-figure
seed_contract: SEED_SPEC.md
frozen: "2026-09-13"

virtual_now: "2026-03-05T09:00:00Z"
history: {start: "2025-11-03", end: "2026-03-04"}

# ---------------------------------------------------------------------------
# The one correct primary cause.
#
# The figure Finance escalated was produced by warehouse.rev_snapshot's extract
# running at 2026-03-03 08:15:00, two seconds after an event-driven rebuild of
# the mart began. The rebuild publishes fact then dim, each with its own
# rename-out / rename-in pair, so for the few hundred milliseconds between them
# the catalog held the NEW fact against the PREVIOUS build's dim. That dim still
# carried two rows for 883 of the 1,180 reseller accounts onboarded on
# 2026-02-25 - a duplication that had been latent and harmless for a week
# because those accounts had no revenue until the channel launched on
# 2026-03-02, whose lines landed in that same late bundle. The join fanned out
# and counted their first day twice.
#
# Nothing in the warehouse is wrong now. The mart is correct, the dim is
# correct, the raw duplication was removed by the same bundle that caused it to
# matter. The only surviving evidence is
#   - warehouse.mart_revenue_dim__dbt_backup, the previous build's dim, left
#     behind because the interrupted swap never ran its final DROP;
#   - the scheduler log's 08:14:58-08:15:39 rebuild against the 08:15:00 extract;
#   - the snapshot row itself, whose fact-derived columns belong to a build its
#     dim-derived column cannot have come from.
# ---------------------------------------------------------------------------
primary_cause:
  id: C-TORN
  label: >
    the BI extract read the mart between the two halves of a rebuild swap and
    joined the new fact to the previous build's duplicated dimension
  torn_snapshot_ts: "2026-03-03 08:15:00"
  rebuild_window: {start: "2026-03-03T08:14:58Z", end: "2026-03-03T08:15:39Z"}
  damage_window: {start: "2026-03-03", end: "2026-03-03"}
  duplicated_accounts: 883
  # accepted paraphrases. STEMS, not whole words: "duplicating" contains none of
  # duplicate / duplicated / duplication, and an oracle wording used it (GT001).
  accept_tokens:
    all_of:
      # the write that was in flight
      - ["swap", "rebuild", "re-build", "rename", "publish", "mid-", "in flight",
         "in-flight", "half-", "partial", "atomic"]
      # the read that landed inside it
      - ["read", "extract", "snapshot", "bi job", "bi_revenue_extract"]
      # the thing that was a build behind
      - ["dimension", "dim", "backup", "previous build", "prior build",
         "earlier build", "older build", "two builds", "different build",
         "stale", "one build behind", "a build behind"]
    any_of:
      - ["duplicat", "doubl", "twice", "two copies", "two rows", "fan out",
         "fan-out", "fanout", "counted again"]
  # Only ever used to EXPLAIN a miss. A positive match wins; an early GT001
  # grader scored the oracle's own correct answer as zero because it named a
  # table it had correctly ruled out.
  reject_if_primary:
    - "the mart is double counting"
    - "mart was double counting"
    - "vendor resent"
    - "vendor re-sent"
    - "exchange rate"
    - "fx rate"
    - "currency conversion"
    - "the load retried"
    - "retry duplicated"
    - "the business declined"
    - "unreproducible"
    - "cannot reproduce"

# ---------------------------------------------------------------------------
# The figure itself. Computed from expected.duckdb; the value here is the
# frozen contract value and fixture_contract.py fails if the fixture drifts.
# ---------------------------------------------------------------------------
reported_figure:
  torn_snapshot_ts: "2026-03-03 08:15:00"
  total_usd: 15385785.19          # sum over the four regions at that tick
  overstatement_usd: 1902974.96   # exactly the DUPLICATED accounts' 2026-03-02 revenue
  tolerance_pct: 0.002
  note: >
    Graded by scanning every number in the final artifact. A bare figure in
    millions ("15.99m", "15.99 million") is accepted; a bare integer is not,
    because day-of-month integers would otherwise collide with the millions
    reading.

# ---------------------------------------------------------------------------
# The compensating change. Ravi's predicate is a DEFECT, not a fix: it removes
# an entire customer segment from the mart across all history.
# ---------------------------------------------------------------------------
compensating_change:
  file: "pipelines/mart_rebuild.sql"
  ticket: "DATA-5518"
  author: "rkulkarni"
  pushed: "2026-03-03T16:40:00Z"
  live_from_snapshot_ts: "2026-03-03 17:15:00"
  excluded_segment: "RESELLER"
  # regexes that must NOT match the repaired file (case-insensitive, whitespace
  # normalised). Any of them means the segment is still being filtered out.
  reject_patterns:
    - "customer_segment\\s*(<>|!=)\\s*'reseller'"
    - "customer_segment\\s+not\\s+in\\s*\\(\\s*'reseller'"
    - "not\\s*\\(\\s*customer_segment\\s*=\\s*'reseller'\\s*\\)"
    - "customer_segment\\s*=\\s*'reseller'\\s+then\\s+0"
  must_still_reference: "stg_revenue_lines"
  note: >
    A043 also specifies a git-diff check. The fixture world carries no git
    history - Track A owns the repo build - so grade.py checks the working-tree
    file only. SEED_SPEC section 9 freezes the commit Track A must create;
    the git half of this check is DEFERRED until that lands.

# ---------------------------------------------------------------------------
# The genuine currency defect. Real, independently fixable, and responsible for
# a real part of the gap: APAC is overstated 8.7% from 2026-02-16 onward.
# "It was all a torn read, nothing is wrong" is a wrong answer.
# ---------------------------------------------------------------------------
currency_defect:
  id: C-FX
  currency: "JPY"
  window: {start: "2026-02-16", end: "2026-03-04"}
  missing_rate_rows: 17
  mechanism: >
    raw.fx_rates_daily has no JPY rows for the window. stg_revenue_lines
    resolves the rate with an AS OF join, so every APAC line from 2026-02-16
    converts at the 2026-02-15 rate. The vendor's redelivery is already staged
    in raw.fx_rates_inbox under source_file fx_jpy_20260216_20260304.csv and
    has not been merged.
  inbox_source_file: "fx_jpy_20260216_20260304.csv"
  exact_tolerance_pct: 0.0        # to the cent
  partial_tolerance_pct: 0.0001   # half credit for a different rounding path

# ---------------------------------------------------------------------------
# The reporting record. rev_snapshot is what Finance quotes from; it is a
# record, not a cache. Only the torn tick may change.
# ---------------------------------------------------------------------------
snapshot_record:
  table: "warehouse.rev_snapshot"
  torn_snapshot_ts: "2026-03-03 08:15:00"
  torn_regions: ["AMER", "EMEA"]
  rows_total: 8980
  rows_outside_torn_tick: 8976
  # Two restatements are accepted, and the grader takes either, applied
  # consistently across all four regions of the tick:
  #   published  - what a reader of the published build would have returned
  #                (the values the 08:00 tick recorded)
  #   landing    - what the build that was landing would have returned
  #                (the values the 08:30 tick recorded)
  # Both are defensible and the world does not disambiguate them, so grading
  # one of them would be grading a coin flip.
  accepted_restatements:
    published: {source_snapshot_ts: "2026-03-03 08:00:00"}
    landing: {source_snapshot_ts: "2026-03-03 08:30:00"}
  # The tick exactly as the episode ships it. Frozen here so the grader can tell
  # "did nothing" from "restated it to the wrong thing" without a free point for
  # the former. fixture_contract.py re-verifies these against the fixture.
  torn_as_shipped:
    - {region: "AMER",  mtd_revenue_usd: "7165533.40", mtd_order_count: 1690, active_accounts: 4853}
    - {region: "APAC",  mtd_revenue_usd: "2092696.82", mtd_order_count: 483,  active_accounts: 1779}
    - {region: "EMEA",  mtd_revenue_usd: "5107096.82", mtd_order_count: 1250, active_accounts: 3582}
    - {region: "LATAM", mtd_revenue_usd: "1020458.15", mtd_order_count: 236,  active_accounts: 849}
  rejected:
    - "deleting the tick (the pack joins on the tick; a region must not go missing)"
    - "regenerating the history from the repaired mart (destroys the record of
       what was reported, and the APAC error in the older rows was real at the time)"

# ---------------------------------------------------------------------------
# The ordering probe. Deterministic interleave: the rebuild script is split into
# statements, the extract is fired after each prefix on a SECOND connection to
# the same database, and the row it writes must match one whole build or no
# build. Paired with a liveness probe so "disable the extract" scores zero.
# ---------------------------------------------------------------------------
ordering_probe:
  rebuild_script: "pipelines/mart_rebuild.sql"
  extract_script: "pipelines/bi_extract.sql"
  probe_snapshot_ts: "2026-03-05 09:15:00"
  probe_customer_id: 501838            # AMER / ENTERPRISE, three March lines
  probe_region_to: "LATAM"
  probe_revenue_delta: 100000.00
  contract_tables: ["staging.stg_revenue_lines", "staging.stg_customer",
                    "warehouse.rev_snapshot"]
  preclear_suffixes: ["__dbt_backup", "__dbt_tmp"]
  assertions:
    - "consistency: at every interleave point the extract writes a row matching
       one whole build, or writes nothing at all"
    - "liveness: with no rebuild in flight the extract writes a FRESH row that
       reflects the probe delta - a disabled or frozen extract scores zero"
  accepted_fix_families:
    - "wrap the publish in one transaction (measured: a reader on another
       connection sees the pre-swap state until COMMIT, DuckDB 1.5.5)"
    - "publish one pre-joined relation so there is no window between two renames"
    - "stamp both relations with a build id and have the extract refuse a
       mismatched pair"
  rejected_fixes:
    - "reschedule the extract off the rebuild's minute (the window still exists;
       the event-driven rebuild is not on the hour)"
    - "disable the extract, or make it write nothing (fails liveness)"
    - "make the extract a single statement (measured: it still observes the
       half-swapped catalog)"

# ---------------------------------------------------------------------------
# Secondary findings and the false-cause penalty. Without the penalty an agent
# emits a textbook checklist and collects credit for free (F128/F129/F306).
# ---------------------------------------------------------------------------
causes:
  - id: C-TORN
    kind: primary
    credit: 0
    detail: "scored by the primary-cause check, not here"

  - id: C-FX
    kind: secondary_real_defect
    credit: 0.5
    label: "the APAC rate series stopped arriving on 2026-02-16 and the AS OF
            join forward-filled the 2026-02-15 rate"
    detail: >
      A genuine defect that accounts for a real part of the gap Finance saw and
      for APAC looking wrong for longer than the analyst's change has been live.
      Independently fixable and separately scored under the currency check.

  - id: C-VDUP
    kind: decoy_real_defect
    credit: 0.5
    label: "31 order lines on 2026-02-24 were delivered twice by the vendor"
    detail: >
      Real, small, all in AMER/USD, and on the wrong date. It survives the
      shallow check an analyst would run - there ARE duplicate business keys in
      raw.revenue_lines - and explains 0.04% of one day. Fixing it is optional;
      it is present in BOTH the broken and the reference world, so an agent is
      not penalised for leaving it. Naming it PRIMARY is a false cause.

  - id: C-RETRY
    kind: true_event_no_defect
    credit: 0
    label: "daily_revenue_load failed at 05:00, 06:00 and 07:00 on 2026-03-03
            and succeeded on the fourth attempt at 08:00:12"
    detail: >
      The single most attractive wrong answer, because a retried load over an
      already-loaded window is the textbook duplication story and the retries
      really are in the scheduler log on exactly the right night. The loader is
      delete+insert by date and the data shows no second copy for 2026-03-02.
      The retries are why the rebuild ran at 08:14:58 instead of 08:07, so they
      are part of the causal setup - but they are not a defect and they did not
      make the number wrong. Asserting them as a CAUSE takes the penalty.

# ---------------------------------------------------------------------------
# Causes that are WRONG here and that models emit anyway. Penalised wherever
# they appear in additional_causes, not only when they survive claim splitting.
#
# F620: GT001's penalty counted list elements while its credit read the joined
# blob, so six causes - four invented - scored 17.0 as a list and 19.0,
# TYING THE ORACLE, semicolon-joined. Atomising the list fixes the arithmetic;
# this list closes the remaining hole, where an agent packs four false causes
# into one sentence that also names a real one.
# ---------------------------------------------------------------------------
known_false_causes:
  - id: F-RETRY
    tokens: ["retried", "retry", "re-ran the load", "reran the load",
             "double loaded", "double-loaded", "loaded twice", "second load"]
    why: "the load did retry, three times, and delete+insert made it a no-op"
  - id: F-SCHEMA
    tokens: ["schema drift", "schema change", "column added", "type change"]
    why: "no schema changed anywhere in the retained history"
  - id: F-CLOCK
    tokens: ["clock skew", "clock drift", "ntp", "time drift"]
    why: "one virtual clock; the scheduler and the warehouse cannot disagree"
  - id: F-TZ
    tokens: ["timezone", "time zone", "utc offset", "daylight", "midnight boundary"]
    why: "every timestamp in this world is UTC and no cast crosses a boundary"
  - id: F-LATE
    tokens: ["late-arriving data", "late arriving data", "watermark",
             "high-water mark", "high water mark", "backfill"]
    why: >
      the 2026-03-02 bundle WAS late, and that is why the rebuild ran off its
      schedule - but lateness is not what made the number wrong, and no row
      arrived outside a window that would have excluded it
  - id: F-BIZ
    tokens: ["business declined", "genuine decline", "seasonal", "demand fell",
             "sales fell"]
    why: "the underlying revenue series has no step at any point in the window"

false_cause_penalty:
  per_unsupported_cause: -1.0
  floor: -3.0
  applies_to: "additional_causes entries matching no manifest cause"
  allow_negative_check: true
  note: >
    Working hypotheses during investigation are free and unscored; only the
    final artifact's additional_causes list is penalised. The check is allowed
    to go negative here - clamping it at zero would let a six-item checklist
    lose only the one point of secondary credit, which is not a penalty.

# ---------------------------------------------------------------------------
# Collateral guard. Worth ZERO points, -2 if violated. A guard an idle agent
# passes by doing nothing is a free point, and free points are how a rubric
# quietly stops discriminating (GT001, D3).
# ---------------------------------------------------------------------------
collateral:
  mart_revenue_dim_rows: 10180
  mart_revenue_dim_unique_on: ["customer_id"]
  note: >
    mart_revenue_dim is already correct. An agent that "deduplicates the
    dimension" because the backup relation has duplicates is attacking the
    wrong relation; an agent that empties or truncates it loses two points.

rubric:
  D1: {max: 4, name: "primary cause: a read inside the publish window"}
  D2: {max: 1, name: "the figure Finance escalated, stated"}
  D3: {max: 4, name: "the compensating change reverted"}
  D4: {max: 3, name: "the late APAC rate applied"}
  D5: {max: 4, name: "the reporting record restated, not rewritten"}
  D6: {max: 3, name: "a read can no longer observe a partial rebuild"}
  D7: {max: 1, name: "secondary findings, minus the false-cause penalty"}
  D8: {max: 0, name: "collateral damage guard (penalty only)"}
  total: 20
