      WHAT THE BOARD PACK IS

      The revenue board pack is built from two things the warehouse publishes:
      the month-to-date snapshot record (warehouse.rev_snapshot, one row per
      region per quarter-hour tick, appended by the BI extract) and the daily
      revenue table finance.board_pack_daily, one row per region per day,
      which the pack job (board_pack_publish, 06:00 daily,
      pipelines/board_pack_publish.sql) republishes from the revenue mart.

      WHO OWNS WHAT

      The mart, the snapshot record and everything under raw, staging and
      warehouse belong to the data team. The finance schema - board_pack_daily
      and reporting_periods - is Finance Systems' book. The pack job writes it
      on Finance Systems' behalf and it is the only thing that should.

      OPEN AND CLOSED PERIODS

      finance.reporting_periods lists each reporting month as open or closed.
      Which months are which is the calendar in docs/board-pack.md. The pack
      job rewrites the open month from the mart every night, so an open month
      says what the mart says. A closed month has gone to the board and is not
      rewritten by the job. A month closes when its pack goes out, normally
      the first working day of the next month.

      RESTATING A CLOSED MONTH

      This page replaces DATA-5401. That ticket, closed done, asked for every
      issued month of finance.board_pack_daily to be rebuilt from the mart
      after a correction. That is not the contract.

      A closed month moves only when the Finance Systems lead has recorded a
      sign-off on the ticket the work is done under, and that note states the
      impact per month. Reopening a period in reporting_periods, writing
      board_pack_daily directly, or running the pack job over a closed month
      are the same kind of change and all wait for that note. A thread in
      #finance-systems records that people disagreed. It does not decide.

      The snapshot record is a different object. A tick of rev_snapshot that
      recorded a figure the mart never held is corrected in place by the data
      team, and the correction is noted on the incident ticket. This page
      does not pre-authorise any particular tick.
