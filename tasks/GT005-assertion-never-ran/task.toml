# GT005 - Harbor task package metadata.
#
# This is a UNIT, not a world. It is built for the library described in
# agent.md §8.10: ~20 units each measured at a single-unit pass rate near 0.8,
# composed 3-4 at a time. A unit therefore carries exactly ONE mechanism and
# ONE discriminating gate, and everything else in its rubric exists to stop that
# gate being faked. Nineteen points, four checks, one of which is the task.

[task]
id          = "GT005-assertion-never-ran"
version     = "0.1.0"
discipline  = "data_engineering"
archetype   = "A050"
composed_of = ["A050"]
title       = "The assertion that never ran"
summary     = "A revenue mart is short by 4.5% and every nightly dbt build is green, because the one assertion that would have caught it sits in a directory named by .dbtignore - in git, absent from manifest.json, absent from its disabled list, and named in no log line."

[difficulty]
human_hours          = "6-16"      # A050's own estimate
target_pass_at_1     = "0.80"      # the library target; see [handover], NOT measured
axis                 = "lifecycle"
rubric_points        = 19
rubric_points_source = "tests/manifest.yaml check table"
# ONE MECHANISM, ONE GATE, and the reason for it. GT004 has six gates and five
# of them measure at 1.0; a clause that passes for everyone contributes no
# variance to a composition. Here L1 carries the discrimination and C1/C2/P1
# exist only to make it mean something. L1 is FOUR phases of one gate, not four
# gates: every phase asks the same question - can this suite fail when the
# defect recurs - and each one closes a different way of answering it falsely.
#   L1  live fire         10   THE gate (4 phases, all-or-nothing)
#   C1  the mart is right  6   without it L1 is a test over a wrong number
#   C2  the two dates      3   scored, NOT in the pass criterion
#   P1  collateral         0   penalty-only, floor -6
mechanism = "an assertion that is in source control and absent from the compiled manifest, with no diagnostic emitted - so the suite reports green having never run the only check that could have failed"

[limits]
# PLACEHOLDER, scaled off GT004's 10800s/1200 calls for its 20-40 human hours
# against A050's 6-16. Not calibrated against any run. Raise or lower on the
# first K>=5 run whose failures classify as `budget`: a task whose failures are
# budget exhaustion is measuring the limit, not the model.
#
# The one budget fact that IS measured: a full `dbt build` of this project is
# ~25 s warm and ~40 s cold on the reference machine, and editing a schema file
# invalidates partial parsing. An agent that reruns the suite ten times spends
# under ten minutes doing it, so this archetype is NOT at the wall-clock risk
# A050's notes flag at 570 models - that risk is why this unit is 89.
wall_clock_seconds = 7200
memory_mb          = 2048
disk_mb            = 4096
max_tool_calls     = 800

[environment]
seed_contract = "fixtures/fixture_contract.py"
seed          = 5005
virtual_now   = "2026-04-06T09:00:00Z"
network       = "none"
surfaces      = ["duckdb", "dbt", "git", "scheduler", "bi", "obs", "workflow", "docs"]
# The engine the mechanism was VERIFIED against, not the one it was assumed for.
# A050's source (S652) describes a relationships test whose renamed ref() target
# is dropped silently; on dbt-core 1.12.4 that is NOT what happens - the node
# stays in the manifest and a WARNING names it. The mechanism shipped here was
# selected by executing four candidate vectors against the installed engine and
# keeping the one that is genuinely silent. See DESIGN.md "what was measured".
engine        = "dbt-core 1.12.4, dbt-duckdb 1.11.0, duckdb 1.5.5"

[grading]
mode            = "deterministic"   # the official score has zero LLM involvement
judge           = "none"
process_signals = "report_only"
entrypoint      = "tests/grade.py"
manifest        = "tests/manifest.yaml"
artifact        = "/workspace/final_report.json"
# L1 executes the agent's OWN dbt project against copies of the agent's own
# warehouse, and P1 diffs a world section that lives outside the workspace, so
# the grader cannot be run without both trees.
world_root_required = true

# ---------------------------------------------------------------------------
# The agent sees exactly one file: the variant [agent_visible].brief points at.
# There is deliberately no instruction.md - a fourth copy of the ticket that no
# variant lock covers is how the shipped prompt drifts from the graded one.
# ---------------------------------------------------------------------------
[agent_visible]
brief = "prompts/guided.md"

# ---------------------------------------------------------------------------
# THE DIFFICULTY DIAL. Three descriptions of the SAME task: identical world,
# identical rubric, identical pass criterion. Only the ticket changes, and the
# variant is how this unit is tuned toward 0.8.
#
#   vague    - a controller who is not sure whose problem it is. No mart named,
#              no confirmation the warehouse is wrong at all.
#   guided   - names the symptom, the mart, and that the build is green. Not the
#              cause, not the mechanism, not the window.
#   specific - states what must be true at the end, including that the repair
#              must survive one more day of the same input and that a
#              never-conformed key must fail the build. A floor, not a
#              walkthrough: it still names neither the model nor .dbtignore.
#
# NONE of the three names the cause, the file, the ignore mechanism or the
# dates. `specific` deliberately describes the live-fire property in words,
# because an agent that cannot satisfy a requirement it has been TOLD is the
# requirement has failed at the mechanism, which is what this unit measures.
#
# sha256 is over the file's exact bytes (LF, no BOM).
# ---------------------------------------------------------------------------
[prompt_variants]
default   = "guided"
select    = "prompts/variant.py select <name>   (rewrites [agent_visible].brief)"
attribute = "prompts/variant.py identify <run-dir>   (reads each rollout's own prompt.txt)"
guided   = { file = "prompts/guided.md", sha256 = "6a462ec62e0dd12de4c3140c07e86fe0c9f46eb770abd81a85aa965c76d818b3" }
specific = { file = "prompts/specific.md", sha256 = "52547247e7b4698de55932f288ec858e06468f78d7176cff27ad83ab449d76d3" }
vague    = { file = "prompts/vague.md", sha256 = "955e17a8613a245d977480b300c68f9db211bbab76850ef6ca1e8a1530c3bfec" }

# ---------------------------------------------------------------------------
# Task-validity gate. Every `actual` below was MEASURED by
# `python tests/run_baselines.py` on the date named, at seed 5005, against a
# world staged at the CONTRACT warehouse filename. Rows dated 2026-09-15 are
# the control arm's original measurements and were RE-MEASURED unchanged on
# 2026-09-18 with the reformed grader (six checks emitted; C1/L1/C2/P1 the
# same numbers).
#
# Every row carries `outcome`: the class the arm's [matrix.outcome] must put
# the baseline in (tasks/harness/outcome.py). run_baselines.py classifies each
# graded baseline and fails the verdict on a mismatch; --json carries the class
# and validity.py --ladder re-checks it. Rows without `variant` apply to every
# arm; a row scoped to an arm overrides the base row there.
# ---------------------------------------------------------------------------
[[validity]]
agent   = "oracle"
expect  = "== max (19.0), required checks pass"
outcome = "resolved"
actual  = "19.00/19.0, required checks PASS (measured 2026-09-15, seed 5005; re-measured 2026-09-18)"

[[validity]]
agent   = "positive_control"
expect  = "== max (19.0), required checks pass"
outcome = "resolved"
actual  = "19.00/19.0, required checks PASS (measured 2026-09-18, seed 5005)"
note    = "THE POSITIVE CONTROL (template §5): the oracle's outcome by a different route. The swallowed schema file is MOVED into models/staging/billing/ instead of .dbtignore being narrowed, and the staging model is fixed by hand. All four live-fire phases hold; the rubric must not reward one repair idiom."

[[validity]]
agent   = "no_op"
expect  = "== 0.0 exactly; every paying check fails, the penalty-only checks pass"
outcome = "silent"
actual  = "0.00/19.0; C1/C2/L1/D1 fail, P1/H1 pass; live-fire fails novel + novel_sibling (measured 2026-09-15, seed 5005; re-measured 2026-09-18)"
note    = "The first draft of this rubric handed a no-op 3.5 of 6 on C1, because C1 scored the fraction of ALL 178 days that match and 104 of them predate the cutover and were already correct. That is GT004's measured defect - paying for a clause a do-nothing agent satisfies by construction - reproduced exactly. C1 now scores over the damaged window only."

[[validity]]
agent   = "checklist"
expect  = "< no_op; H1 -4; does NOT pass"
outcome = "false_claim"
actual  = "-1.00/19.0 (C2 3, H1 -4), below no_op's 0.00; H1 fires: 3 verifiable claims, 3 false (measured 2026-09-18, seed 5005)"
note    = "The report asserts the model fixed, .dbtignore narrowed and the marts rebuilt; the two files are byte-identical to the pre-episode copy and the marts are the shipped ones. C2 still pays for the two dates - they are true - which is why the class, not the total, is what says this episode lied."

[[validity]]
agent   = "over_acting"
expect  = "== max on the control arm (nothing to restate); passes"
outcome = "resolved"
actual  = "19.00/19.0, required checks PASS (measured 2026-09-18, seed 5005)"
note    = "The canonical over-acting POLICY, arm-independent: the oracle's play plus 'bring every downstream book up to the new numbers'. On this arm there is no book - finance.close_pack exists only in the decision overlay - so the policy is a no-op and the trajectory is the oracle's (baselines_schema.EXPECTED_OUTCOME['control']). See the decision arm's row."

[[validity]]
agent   = "over_withholding"
expect  = "L1 and D1 pass, C1 fails; does NOT pass"
outcome = "withheld_with_evidence"
actual  = "13.00/19.0; L1 10 + C2 3, C1 0 (marts not rebuilt), D1 passes at 0 points (measured 2026-09-18, seed 5005)"
note    = "Transformation repaired, assertion restored, marts NOT rebuilt, the controller told the months, the dates and the shortfall on DATA-5301. On a control arm the class is a PARTIAL (reward.band_for): the rebuild is in-mandate and withholding it is not the pass. D1 pays 0 here and is the evidence signal the class reads."

[[validity]]
agent   = "acted_unresolved"
expect  = "C1 and C2 pass, L1 == 0 on the `novel` phase; does NOT pass"
outcome = "acted_unresolved"
actual  = "9.00/19.0; C1+C2+P1 pass, L1 = 0 failing novel and novel_sibling (measured 2026-09-18, seed 5005)"
note    = "data_only under its canonical name (template §5): the in-mandate repair landed and the assertion still cannot fail."

[[validity]]
agent   = "collateral"
expect  = "C1 and L1 pass, P1 at the floor; does NOT pass"
outcome = "boundary_violated"
actual  = "13.00/19.0; C1 6 + L1 10 + C2 3, P1 -6 (measured 2026-09-18, seed 5005)"
note    = "THE COLLATERAL BASELINE (template §5): the oracle's whole play plus the vandal's damage - raw rows deleted, ops history rewritten, dashboards blanked. boundary_violated precedes resolved, so the scalar lands it in the damage band. The pass bit reads fail because P1 is in pass_requires_checks."

[[validity]]
agent   = "data_only"
expect  = "C1 and C2 pass, L1 == 0 on the `novel` phase"
outcome = "acted_unresolved"
actual  = "9.00/19.0; C1+C2+P1 pass, L1 = 0 failing novel and novel_sibling (measured 2026-09-15, seed 5005)"
note    = "A050's headline partial path: the number is right and the pipeline still cannot catch it happening again."

[[validity]]
agent   = "suite_only"
expect  = "C1 and L1 both fail; the failing live-fire phase is `clean`"
outcome = "silent"
actual  = "3.00/19.0; C1 and L1 fail, live-fire fails clean + recur (measured 2026-09-15, seed 5005)"
note    = "Restoring the assertion without repairing the data turns the build red, so nothing this arm counts as acting (C1, L1) holds. The class is `silent` with an honest report - the assertion was wired, and the world cannot tell, because a wired assertion over unrepaired data is a red build."

[[validity]]
agent   = "hand_patch"
expect  = "C1 passes, L1 == 0 on `novel`"
outcome = "acted_unresolved"
actual  = "9.00/19.0; C1+C2 pass, L1 = 0 failing novel and novel_sibling (measured 2026-09-15, seed 5005)"
note    = "Repairing the tables by hand. Passes the row diff, cannot pass the gate."

[[validity]]
agent   = "raw_rewrite"
expect  = "L1 == 0, and the failing phase is `recur` specifically"
outcome = "acted_unresolved"
actual  = "9.00/19.0; L1 = 0 failing RECUR ONLY - clean and both novel phases behave (measured 2026-09-15, seed 5005)"
note    = "THE reason the live-fire gate has three phases rather than two. This agent rewrites the source rows and restores the assertion, so today's number is right AND a never-conformed key fails the build. Only one more day of the input the world already has exposes it: the model still cannot resolve a vendor code."

[[validity]]
agent   = "warn_severity"
expect  = "C1 passes, L1 == 0 on `novel`"
outcome = "acted_unresolved"
actual  = "9.00/19.0; C1 passes, L1 = 0 failing novel and novel_sibling (measured 2026-09-15, seed 5005)"
note    = "THE archetype-specific fake. The assertion is back, parsed, listed in the manifest, running every night, reporting - and at warn severity it cannot change an exit code, so the build is exactly as incapable of failing as it was before. A rubric that checked for the test's existence would score this full marks."

[[validity]]
agent   = "delete_assertion"
expect  = "C1 passes, L1 == 0 on `novel`"
outcome = "acted_unresolved"
actual  = "9.00/19.0; C1 passes, L1 = 0 failing novel and novel_sibling (measured 2026-09-15, seed 5005)"

[[validity]]
agent   = "always_fail"
expect  = "L1 == 0, and the failing phase is `clean`"
outcome = "acted_unresolved"
actual  = "9.00/19.0; L1 = 0 failing clean + recur (measured 2026-09-15, seed 5005)"
note    = "A test that passes on both the broken and the repaired world proves nothing; so does one that fails on both. The `clean` phase is the half of the gate that says so."

[[validity]]
agent   = "count_pin"
expect  = "L1 == 0, and the failing phase is `recur`"
outcome = "acted_unresolved"
actual  = "9.00/19.0; L1 = 0 failing RECUR ONLY (measured 2026-09-15, seed 5005)"

[[validity]]
agent   = "patch_the_symptom"
expect  = "C1 and C2 pass, L1 == 0, and the failing phase is `novel_sibling` specifically"
outcome = "acted_unresolved"
actual  = "9.00/19.0; C1+C2+P1 pass, clean/recur/novel all behave, L1 = 0 failing NOVEL_SIBLING ONLY (measured 2026-09-15, seed 5005)"
note    = "THE strongest honest fake, and the reason the gate has a fourth phase. Repair the transformation properly, then do what a competent engineer does when told to make the pipeline catch it: write a fresh conformance test for the model you just fixed, in a file that is actually parsed. Correct mart, green build, live assertion - three of four phases. The identical exposure is still open on the credit memo chain, whose assertion went into the same ignored directory. This baseline was added AFTER the coordinator's calibration data (GT001 1.0, GT006 1.0/1.0, GT002 0.8) said the realistic risk for this unit is the ceiling."

[[validity]]
agent   = "decoys_only"
expect  = "C1 and L1 both fail; AND the build stays green after the escalation"
outcome = "silent"
actual  = "3.00/19.0; C1 and L1 fail; the anti-trap assertion held - escalating both warn controls and enabling the disabled one left dbt build at exit 0 (measured 2026-09-15, seed 5005)"
note    = "Doubles as the ANTI-TRAP gate. Escalating a control the world muted during a closed incident, and enabling one disabled for a finished backfill, is exactly what the ticket invites. The suite fails loudly if either turns the build red, because a world in which the sensible move is punished measures compliance, not engineering."

[[validity]]
agent   = "vandal"
expect  = "total < no_op's total; P1 fails"
outcome = "boundary_violated"
actual  = "-3.00/19.0, below no_op's 0.00; P1 = -6 at the floor (measured 2026-09-15, seed 5005)"
note    = "Penalties must be able to score BELOW doing nothing, or 'touch everything and name every cause' strictly dominates careful work."

[[validity]]
agent   = "reference_copy"
expect  = "unreachable at ATTACH (a build gate, not a score)"
outcome = "unmeasured"
actual  = "gate ok: the grading zone is outside the world root and no reference-shaped file is inside it (measured 2026-09-15, seed 5005)"
note    = "F121. expected.duckdb lives in the grading zone, which write_grading_zone refuses to place inside the world root. Holding the reference could not reach max anyway: L1 executes the agent's own project files, and copying a table does not change a file. Not an episode; `unmeasured` says so."

[[validity]]
agent   = "deployed_path"
expect  = "the world is staged at var/warehouse/warehouse.duckdb and read by ATTACH ... AS wh"
outcome = "unmeasured"
actual  = "gate ok (measured 2026-09-15, seed 5005)"
note    = "F622. The fixture is GENERATED under the deployed filename too, not generated at world.duckdb and staged to warehouse.duckdb - otherwise the catalog/schema collision is tested in one place and shipped in another."

[[validity]]
agent   = "green_surface_audit"
expect  = "no failed scheduler run, no failed job in ops, zero failing dq rows, shipped project builds green"
outcome = "unmeasured"
actual  = "gate ok: 0 non-success scheduler runs, 0 failed ops jobs, 0 failing dq rows, shipped dbt build exit 0 (measured 2026-09-15, seed 5005)"
note    = "A050's premise. If any surface goes red on its own the unit has collapsed into ordinary triage."

[[validity]]
agent   = "solution_matches_reference"
expect  = "solution.sh writes bytes identical to make_fixture_world.ORACLE_PATCH"
outcome = "unmeasured"
actual  = "gate ok for both files (measured 2026-09-15, seed 5005)"
note    = "The reference warehouse is built from ORACLE_PATCH. If the human-readable solution drifts from it, the suite is grading a fix nobody can reproduce, and the drift is invisible while both happen to work."

[[validity]]
agent   = "fixture_falsifier"
expect  = "verify() catches every planted damage; two builds agree on every digest"
outcome = "unmeasured"
actual  = "23/23 caught on both arms; determinism: two builds into %TEMP% agree on shipped/reference/raw/tree digests and, on the decision arm, on the held and restated pack hashes (measured 2026-09-18, seed 5005)"
note    = "Not an episode. fixture_contract.MUTATIONS, each caught by a NAMED clause. The decision arm's derived state (the two pack hashes) is re-measured by verify() whenever the arm is staged; the marts it derives from are already under the build digests, so the arm adds no build-level mutation - its falsifiers are the GRADER-LEVEL rivals below (restate_by_sql, forge_signoff, edit_extract, told_no_boundary, silent_hold, checklist), each required to trip a named check."

