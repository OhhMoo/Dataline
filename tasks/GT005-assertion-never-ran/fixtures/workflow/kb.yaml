# The wiki. One page states the consequence of the primary defect - that an
# unresolved source system key disappears rather than raising - without naming
# the model it happened to. That is the artefact a careful reader finds; it is
# not an answer key.
pages:
  - id: de
    title: Data Engineering
    parent: null
