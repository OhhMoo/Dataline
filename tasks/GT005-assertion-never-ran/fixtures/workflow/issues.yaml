# The backlog. Every timestamp is an offset from the world clock; a literal date
# would be a lie the moment the clock moved.
#
# NOTHING HERE NAMES THE CAUSE. DATA-5107 says the legacy directory is excluded
# from the parse, which is true and is in the changelog too; it does not say
# that anything live went with it. RFC-118 says the crosswalk row was added,
# which is also true. The trail is real and the conclusion is not written down.
issues:
  - id: DATA-5301
    title: Q1 revenue in the close pack is under the ledger
    status: open
    priority: high
    reporter: tvarga
    assignee: rmehta
    labels: [finance, close, revenue]
    created_at: "-4d 08:40"
    updated_at: "-1d 16:05"
    body: >-
      Finance closed Q1 on our numbers and the ledger disagrees. mart_revenue_by_month
      is under by roughly four and a half per cent and it has been under by about
      the same proportion every month since January. Nothing about the shape looks
      wrong - the daily curve tracks, the currencies are right - it is just
      consistently light. We need to know which months are affected before we
      decide whether to restate, and we need it before the audit pack goes out.
    comments:
      - id: DATA-5301#1
        author: rmehta
        at: "-4d 10:12"
        body: >-
          Checked the obvious things first. The nightly build is green - I went back
          through the last forty runs in the scheduler and every one is PASS with
          zero errors. Nobody has deployed to the revenue models since December.
      - id: DATA-5301#2
        author: sberg
        at: "-3d 09:30"
        body: >-
          The gap is stable month on month, which argues against a one-off load
          problem. If we had lost a day we would see a notch, not a slope.
      - id: DATA-5301#3
        author: jodonnell
        at: "-1d 16:05"
        body: >-
          Handing this to the platform shift. Please work from the extract, not
          from the marts - the marts are the thing under suspicion.

  - id: DATA-5107
    title: Delete models/staging/legacy once the v1 billing extract is switched off
    status: open
    priority: low
    reporter: lchen
    assignee: lchen
    labels: [tech-debt, billing]
    created_at: "-82d 11:20"
    updated_at: "-30d 14:02"
    body: >-
      RFC-118 retired the v1 billing staging models. The v1 raw tables still land
      so the models still compile; they are excluded from the parse via
      dbt_project/.dbtignore until the vendor switches the extract off, which is
      scheduled for 2026.2. Delete the directory then.
    comments:
      - id: DATA-5107#1
        author: lchen
        at: "-30d 14:02"
        body: >-
          Vendor has moved the switch-off to the 2026.2 window. Leaving the ignore
          entry in place until then.

