channels:
  - id: data-platform
    name: data-platform
    purpose: The commercial warehouse, the nightly build, and whatever it did last night.
    members: [agent, rmehta, jodonnell, lchen, sberg]
    messages:
      - id: data-platform/0001
        author: lchen
        at: "-82d 12:20"
        body: >-
          EMEA cutover is done. New instance is live, conformed system registered,
          crosswalk row in. I have pulled the v1 staging models out of the parse -
          they were costing us four seconds a run for output nobody reads.
      - id: data-platform/0002
        author: rmehta
        at: "-81d 08:05"
        body: Build was green overnight. 87 models, 488 tests, zero failures.
      - id: data-platform/0003
        author: jodonnell
        at: "-81d 08:09"
        body: Nice. That is the quietest migration we have had.
      - id: data-platform/0004
        author: rmehta
        at: "-62d 02:40"
        body: >-
          Paged at 02:11 on the amount controls. Gateway feed is sending
          unnormalised amounts. Dropping the two controls to warn so we stop
          paging, INC-2291.
      - id: data-platform/0005
        author: jodonnell
        at: "-60d 15:25"
        body: >-
          Feed is fixed. Put the controls back to error when you get a minute.
      - id: data-platform/0006
        author: rmehta
        at: "-60d 15:31"
        thread_id: data-platform/0005
        body: On the list.
      - id: data-platform/0007
        author: sberg
        at: "-4d 08:45"
        body: >-
          Finance are saying Q1 revenue is under the ledger by about four and a
          half per cent, every month since January. DATA-5301.
      - id: data-platform/0008
        author: rmehta
        at: "-4d 10:15"
        body: >-
          Forty green builds in a row and nobody has touched the revenue models.
          I do not have a theory yet.
      - id: data-platform/0009
        author: jodonnell
        at: "-1d 16:06"
        body: >-
          Passing it to the shift. Whoever picks it up: do not trust the marts to
          tell you the marts are right.

  - id: finance-close
    name: finance-close
    purpose: Month end and quarter end for the commercial book.
    members: [agent, sberg, tvarga, rmehta]
    messages:
      - id: finance-close/0001
        author: tvarga
        at: "-5d 17:30"
        body: >-
          Q1 is closed on the ledger. Warehouse is light against it again - same
          proportion as December, same as January and February.
      - id: finance-close/0002
        author: sberg
        at: "-4d 08:38"
        body: >-
          Raising it with the platform team. If it turns out to be every month
          since January we will have to decide on a restatement, so we need the
          first and last affected dates, not a rounded month.
      - id: finance-close/0003
        author: tvarga
        at: "-1d 11:02"
        body: >-
          To be clear about what we need: the exact first and last invoice dates
          that are affected. The audit pack quotes dates, not quarters.
