  - id: DATA-4402
    title: discount_amount and tax_amount are 0.00 on everything before 2025-12-01
    body: |-
      Every row in warehouse.fct_revenue with order_dt before 2025-12-01 has
      discount_amount 0.00 and tax_amount 0.00. After that date they are
      populated.

      Some of those older rows have a promo_id on them, so they were discounted
      - the discount just is not in the column. Is the history coming?
    status: wontfix
    reporter: rsalas
    assignee: kliu
    labels: [warehouse, data-quality]
    created_at: "-45d 11:18"
    updated_at: "-44d 09:26"
    comments:
      - id: DATA-4402#1
        author: kliu
        at: "-44d 09:26"
        body: |-
          Expected. Those columns only exist from 2025-12-01, so there is
          nothing to put in them for anything earlier. The old rows carry the
          same money in net_amount, just not broken out. Nothing is missing.
          Closing.
    history:
      - {at: "-44d 09:26", actor: kliu, field: status, from: open, to: wontfix}
    links: []
    authoring:
      kind: confident_wrong
      note: >-
        GT4-I6. DEFECT TWO, reported correctly by an analyst 45 days ago and
        closed wontfix with a wrong explanation by the engineer who caused it.
        Both halves of the comment are false. The columns are computable for the
        whole history - warehouse.dim_promotions is valid across the full range
        and 30,110 pre-switch rows carry a promo_id. And the old rows do NOT
        carry the same money: pre-switch net_amount is gross plus tax with the
        promotional discount never netted at all, which is a different and
        larger number than the same row under the current model, not merely a
        less broken-out one. 94,097 rows fail net_amount = gross_amount -
        discount_amount + tax_amount and every post-switch row passes it.
        This is the highest-value ticket in the tracker and it is closed
        wontfix, which is where an agent that filters issues_list on status will
        never look. Rosa's second paragraph is the disproof, and it sits in the
        ticket she filed, directly above the comment that dismisses it.

  - id: DATA-4411
