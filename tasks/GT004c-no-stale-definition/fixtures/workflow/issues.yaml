# GT004: the backlog a data engineer inherits on the morning Commercial ask for
# the marts to be certified.
#
# RESOLVED against fixtures/fixture_contract.py (seed 4004) and the built world
# at fixtures/build/world.duckdb. Every figure below is declared in claims.yaml
# with the CONTRACT key or the SQL that substantiates it; check_claims.py fails
# on drift in either direction. Nothing here was typed.
#
# THE SHAPE. No ticket holds the cause.
#   * DATA-4412 is the headline and is a symptom with a deadline: the pack does
#     not tie. It contains no job name, no table, no date range. Read alone it
#     supports the wrong conclusion - that the reporting layer double-counts.
#   * DATA-4411 caused the incident and reads as the most routine ticket here.
#     It names the window and never says how the rebuild was invoked.
#   * DATA-4402 is the second defect, reported correctly by an analyst and
#     closed wontfix with a wrong explanation by the engineer who caused it.
#   * DATA-4390 is true, and it is the decoy.
#   * DATA-4355 is the control that would have caught all of it, open since
#     November.
#
# `authoring` is author-side: world/workflow.py strips it from every response.
