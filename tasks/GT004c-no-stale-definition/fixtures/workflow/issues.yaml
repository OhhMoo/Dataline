  - id: DATA-4418
    title: The vendor correction file lands under the days it corrects
    body: |-
      Noting this before it bites somebody again.

      When the vendor reissues days, the corrections arrive in the landing
      stream under the dt= folders of the days they correct, not under the day
      they arrive. They do not go into raw.orders_snapshot - that is a frozen
      extract and it never learns about them.

      So a window we have already reconciled and signed off can move under us
      afterwards, and anything keyed on arrival date will miss it. It has
      happened twice.
    status: open
    reporter: nbrennan
    assignee: tokafor
    labels: [vendor, process]
    created_at: "-1d 10:30"
    updated_at: "-1d 10:30"
    comments: []
    history: []
    links: []
    authoring:
      kind: constraint
      note: >-
        GT4-I10. The A044 leg, stated as a standing fact about a vendor rather
        than as a warning about this episode, and both clauses are exactly true
        of the planted payload: it lands in raw.orders_landing, it is not in
        raw.orders_snapshot, and its partitions are the fourteen days of the
        doubled window rather than the day it arrives. It therefore says,
        without saying so, that a repair which reinstates the window from the
        frozen snapshot will be wrong the moment the clock advances, and that a
        lookback keyed on arrival date will not see it.
        Filed as process noise with no link to DATA-4412, because an agent that
        is told "late arrivals are coming" designs for them and an agent that is
        merely able to find out mostly does not. G3 is scored on the clock
        advancing, not on this ticket being read.
