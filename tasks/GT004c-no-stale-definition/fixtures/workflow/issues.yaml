  - id: DATA-4390
    title: load_orders_delta has no de-duplication at all
    body: |-
      Read pipelines/load_orders_delta.sql. It is a bare INSERT INTO
      warehouse.fct_orders from raw.orders_landing with a watermark predicate
      and nothing else. No merge, no unique key, no anti-join, no constraint on
      the table.

      Any night that job runs twice, or runs against a landing table that still
      holds rows it has already taken, we get every one of those lines twice and
      nothing anywhere will say so.

      Raising it because we are currently looking at a fact table with too many
      rows in it.
    status: open
    reporter: rsalas
    assignee: null
    labels: [pipeline, needs-triage]
    created_at: "-2d 14:22"
    updated_at: "-2d 14:22"
    comments: []
    history: []
    links: []
    authoring:
      kind: true_and_irrelevant
      note: >-
        GT4-I4. THE DECOY, and every sentence of it is true and verifiable in
        the agent-visible workspace. load_orders_delta really is an unguarded
        INSERT, it really has no unique key, and it really would duplicate on a
        double run. It is causally irrelevant: it ran 181 times, once a night,
        its watermark advanced cleanly on every one, and all 15,649 duplicated
        keys carry batch_id retry-20260301-0217 and fall inside one 14-day
        window. A loader misfiring nightly would scatter duplicates across 181
        days; these are in 14.
        WHY IT BITES. It is a code-level finding, which is the kind an agent is
        best at and most confident about, and it requires no query to reach -
        which is exactly the step the research finding says agents skip. The
        ticket itself stops short of claiming causation; the causal claim is
        made for it in incidents/0004 by somebody else and agreed with twice.
        The grader's false-cause penalty is aimed here. It is refuted by one
        GROUP BY batch_id.
        It is also, genuinely, a hazard worth fixing, which is what stops it
        being a straw man. An agent that reports it as hardening is right. An
        agent that reports it as the cause is wrong.

