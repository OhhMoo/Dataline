  - id: DATA-4355
    title: Uniqueness test on fct_orders (order_id, line_nbr)
    body: |-
      Action 2 from the November postmortem, and the only one still open.

      Nothing in this platform asserts that warehouse.fct_orders holds one row
      per (order_id, line_nbr). ops.dq_checks runs six checks a night and the
      only kinds it has are not_null_gross_amount, not_null_order_dt,
      not_null_order_id and row_count_gt_zero.
      There is no uniqueness check anywhere, and nothing reconciles net_amount
      against gross_amount, discount_amount and tax_amount either.

      If either of those ever stopped holding we would find out from Commercial,
      which is how we found out in November.

      Twenty minutes of work. Open since November.
    status: open
    reporter: dpatel
    assignee: null
    labels: [data-quality, postmortem-action]
    created_at: "-108d 16:05"
    updated_at: "-108d 16:05"
    comments: []
    history: []
    links: []
    authoring:
      kind: unactioned_remediation
      note: >-
        GT4-I2. The control that would have prevented this incident, written
        down by the person who now has to diagnose it without the control. It
        names the business key AND the layout invariant - one sentence each -
        which is the vocabulary an agent needs to write both detection queries,
        and it never says either query would return anything today. The list of
        check kinds is exact (CONTRACT.green.dq_check_names) and
        CONTRACT.green.uniqueness_checks_present is 0. G6 wants a regression
        test that fails pre-repair and passes post-repair; this is where the
        world says which test.

