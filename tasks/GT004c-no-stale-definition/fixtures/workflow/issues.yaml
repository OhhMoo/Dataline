    comments:
      - id: DATA-4411#1
        author: nbrennan
        at: "-8d 17:12"
        body: |-
          Adding for whoever picks this up: finance have priced corrections
          against four days inside that fortnight and they are applied in the
          warehouse only. The vendor extract does not have them and never will.
          Whatever you do to those days, those corrections have to survive it.
      - id: DATA-4411#2
        author: kliu
        at: "-7d 07:40"
        body: |-
          Re-landed 2026-02-09 to 2026-02-22 overnight and the build is green.
          Row counts look right. Closing so it does not sit over my leave.
    history:
      - {at: "-7d 07:40", actor: kliu, field: status, from: in_progress, to: done}
    links: []
    authoring:
      kind: accurate_but_partial
      note: >-
        GT4-I7. THE ORIGIN, and it reads as the most routine ticket here.
        FIRST, the premise is wrong. The fortnight was never light: order volume
        is flat at 700 orders a day across the whole history, and the reference
        world puts the window at 1,116.79 lines a day against a baseline
        fortnight (2026-01-26 to 2026-02-08) of the same 1,116.79. Rosa's
        perception is the entire reason an unnecessary backfill ran. Checkable,
        and nobody checked it - then or since.
        SECOND, Kenji's comment is true clause by clause - it was re-landed, the
        build was green, the row counts he looked at were the snapshot's - and
        silent about the half that matters. Nothing on this ticket says append,
        merge, mode or full refresh. The word "append" exists in exactly two
        places in the world and neither is in the workflow plane:
        ops.job_runs.detail for run-20260301-backfill, and the usage comment in
        pipelines/backfill_orders_window.sql.
        THE JOIN LIVES HERE. This ticket supplies the window and the reason;
        de/runbooks/revenue-mart-rebuild supplies what an append does to this
        table; ops.job_runs supplies the invocation at 02:17 on 2026-03-01; the
        table supplies 15,649 duplicated keys under one batch id. Any two are a
        hypothesis.
        Nadia's comment is the repair constraint: 114 rows in fct_orders differ
        from raw.orders_snapshot because finance edited them, 76 of those sit
        inside this window, and the obvious repair - delete the window, reinsert
        from the snapshot - destroys every one of them. It is stated as an aside
        on a closed ticket nine days before the incident was raised.

  - id: DATA-4412
    title: February pack does not tie to the vendor extract
    body: |-
      From: Nadia Brennan, Head of Commercial Reporting.

      Revenue in the commercial marts is over the vendor extract and has been
      for a while. It is not every day and it is not a constant amount, which is
      presumably why the daily checks never caught it. Everything reports green.

      February gross on the pack is 14,915,606.02. The same period off the
      vendor extract is 9,933,262.11. Net revenue, oddly, ties.

      We have been asked to certify these marts for the annual audit next month,
      so patching the worst days is not enough. I need the marts demonstrably
      correct across their whole history, a note of exactly which days and which
      downstream numbers were wrong, and enough hardening that an auditor can
      see this will not quietly happen again.

      One practical thing: the nightly schedule keeps running while you work, so
      please do not leave the marts in a worse state overnight than you found
      them.
    status: open
    reporter: nbrennan
    assignee: null
    labels: [revenue, audit, commercial]
    created_at: "-1d 08:11"
    updated_at: "-1d 09:04"
    comments:
      - id: DATA-4412#1
        author: dpatel
        at: "-1d 09:04"
        body: |-
          Picking this up. I am not quoting a number until I have queried the
          tables. We have three figures in circulation and they disagree, and I
          do not yet know which of them is supposed to match what.
    history: []
    links:
      - {type: relates_to, issue: DATA-4398}
    authoring:
      kind: incident_report_lay
      note: >-
        GT4-I8. The incident as the person who found it describes it: no schema,
        no job, no date range, a symptom and an audit deadline. The title is the
        symptom. Read alone it supports a plausible WRONG conclusion - that the
        pack or the reporting layer double-counts - and the relates_to link
        points at the November pack-query incident, which pushes a reader that
        way. A human added that link and a human was guessing.
        The two figures are measured: 14,915,606.02 is SUM(gross_revenue) over
        warehouse.kpi_daily for February 2026 and 9,933,262.11 is the same
        period computed from raw.orders_snapshot. "Net revenue, oddly, ties" is
        the most informative sentence in the tracker and it is thrown away in a
        subordinate clause by somebody who does not know why it matters: gross
        comes from fct_orders, which is doubled, and net comes from fct_revenue,
        which is not. An agent that notices one aggregate doubled while its
        neighbour did not has localised defect one to a table in a single step,
        from a ticket, without a query. It still has to query to get further.

