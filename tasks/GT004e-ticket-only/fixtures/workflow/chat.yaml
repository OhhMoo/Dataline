        author: nbrennan
        at: "-1d 16:40"
        thread_id: null
        text: |-
          Whatever the answer is, I need it per day, not as a total. If a day
          moved I have to reissue that day.
        reactions: {}
        authoring:
          kind: constraint
          note: >-
            GT4-C24. Forces per-day attribution, which the two defects make
            genuinely different work: defect one is fourteen consecutive days
            and defect two is every day before 2025-12-01. A single corrected
            total satisfies neither.
