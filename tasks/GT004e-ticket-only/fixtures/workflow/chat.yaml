# that fct_revenue went incremental on 2025-12-01, and that the same change
# started netting promotional discount before tax. It does NOT know that
# anything was appended, and it does not know either defect exists. The one
# person who could join it up is on leave from data-eng/0011 onward, and the
# question that would have closed the incident is data-eng/0014, addressed to
# him, with no replies under it.
