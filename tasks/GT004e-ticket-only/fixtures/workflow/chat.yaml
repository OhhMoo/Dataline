      - id: commercial-reporting/0005
        author: rsalas
        at: "-1d 14:05"
        thread_id: null
        text: |-
          I tried to size the gap. Took the net revenue definition off the wiki
          - gross plus sales tax at 7.25 per cent, promotional discount not
          netted - and recomputed February off fct_revenue. I get 10,649,255.91.
          The mart's own net_revenue for February is 10,130,105.08. So there is
          519,150.83 sitting somewhere unexplained. Is that the discount?
        reactions: {}
        authoring:
          kind: confident_wrong
          note: >-
            GT4-C23. THE STALE-KB TRAP, demonstrated by an NPC so that an agent
            can watch the wrong method produce a wrong number in public and
            still not be told it is wrong. She followed de/metrics/net-revenue
            exactly, including its tax rate and its explicit statement that
            promotional discount is not netted at the mart. Both figures are
            measured and her subtraction is correct; her conclusion is not. The
            519,150.83 is not "the discount" - February discount_amount is
            484,055.66 and the remaining 35,095.17 is the tax no longer charged
            on the discounted amount - and none of it is unexplained: it is the
            model change of 2025-12-01 that the page does not mention.
            NOBODY ANSWERS HER. The only correction in the world is
            data-eng/0005, in a channel she is not a member of, 98 days earlier,
            phrased as an announcement. An agent that anchors its quantification
            on the wiki reproduces this number and this conclusion, which is
            precisely the behaviour this task exists to separate from querying
            the model. And it is worse than a wasted number: the page implies
            the CURRENT rows are the deviant ones, so an agent that "repairs"
            fct_revenue toward the documented definition re-breaks 108,837
            correct rows and inverts defect two.
