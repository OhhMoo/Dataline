# said kliu full-refreshed the history; its false sentence is replaced by a
# neutral hand-over aside of the same length, matching the changelog page):
#   data-eng/0012             dpatel names the wrong window during a handover
#                             and corrects herself two days later.
#   commercial-reporting/0005 rsalas applies the wiki's definition of the
#                             headline metric in public and gets a number that
#                             reconciles with nothing. Nobody answers her.
