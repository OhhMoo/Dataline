claim: >
  A three-month migration of a client's Alteryx workflows into dbt cut model runtime from six hours to nine minutes, but the load-bearing step was validation: the team materialized both the legacy Alteryx output and the refactored dbt model, compared them with audit_helper, then duplicated the BI report against the new model so the two could be inspected side by side - iterating back into the transformation layer to cast column types or change business rules when values diverged.
