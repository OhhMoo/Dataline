notes: >
  Evidence that BI-layer parity checking is a distinct step after warehouse-layer parity, and that the fix for a visual mismatch often lands back in the transformation code. A container can hold both the legacy artifact and the new model plus a BI definition, and grade on whether the agent validated at both layers rather than only the table.
