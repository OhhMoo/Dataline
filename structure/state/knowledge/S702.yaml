id: S702
rq: RQ1
claim: >
  Snowflake's row access policy documentation states that row-level security is implemented by
  policies that decide which rows a query returns, and that at query runtime Snowflake rewrites
  the access into a dynamic secure inline view. The consequence that matters for compound tasks
  is that the filtering is invisible at the SQL level: identical SELECT text returns different
  row sets to different roles with no error, no warning and no diagnostic in the result.
url: https://docs.snowflake.com/en/user-guide/security-row-intro
quote: "Snowflake supports row-level security through the use of row access policies to determine which rows to return in the query result."
