notes: >
  Confirms the meeting note's claim that analytics tasks involve vague requirements. The post's own framing is that teams are inundated with quick questions and simple requests that do not connect to the bigger picture. For task design: the correct behavior on an ambiguous brief is sometimes to interrogate and disambiguate, and a grader can score whether the agent surfaced the ambiguity instead of silently picking one definition.
