notes: >
  Verdict: COPY-PATTERN (partly adopt). Apache-2.0 (pre-verified). The shared-project +
  per-task setup.sh overlay model (tasks share large dbt projects/databases instead of
  duplicating them) is the pattern to copy for task authoring economics. Its CLI agent
  invocation matrix (claude/codex/gemini with exact flags) and prompt variants per task
