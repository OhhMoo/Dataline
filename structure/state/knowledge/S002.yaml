claim: >
  An experienced practitioner's pattern description, explicitly introduced as the author's
  favourite version of undetected upstream change rather than as an incident he was in: a source
  system migration or library bump silently switches emitted timestamps from UTC to
  local time. Every row shifts by a few hours; no schema check fires because the column name and
  type are unchanged. The symptom surfaces only as an odd business-level artifact - daily totals
  appearing to cut off at 10 PM instead of midnight.
