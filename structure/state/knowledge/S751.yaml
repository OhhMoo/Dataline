rq: RQ1
claim: >
  Debezium mailing-list report from a practitioner running the connector in production: the
  PostgreSQL replication slot kept growing even though Debezium appeared to be consuming the WAL.
  Measured slot size fluctuated from 152 kB to 16 MB after only three rows were inserted into the
  single whitelisted table, on Debezium 0.8.3, with the log repeating "Timed out waiting to flush
  EmbeddedConnector offsets". The poster traced it to EmbeddedEngine.commitOffsets() never
  completing the flush, so confirmed_flush_lsn was never advanced and PostgreSQL retained WAL
  segments indefinitely while, in his words, the production system kept growing.
