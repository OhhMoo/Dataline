notes: >
  Two design implications: (1) a realistic world should ship with a noisy alert backlog so triage-under-noise is part of the task rather than a clean single signal; (2) label lag means the correct answer to 'is the model broken' is often unavailable at task time, forcing proxy-based reasoning - genuine difficulty and a natural LLM-judge axis.
