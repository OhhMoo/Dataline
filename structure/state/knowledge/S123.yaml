id: S123
rq: RQ1
claim: >
  Alert fatigue on ML pipelines is quantified in the same study: one engineer estimated roughly 90 percent of alerts are not immediately actionable, on-call rotations were dreaded enough to be staffed with a shadow member, and an internal de-noising tool reported alerts that had fired around 1,000 times and been ignored 45 percent of the time. Separately, ground-truth labels for live predictions often arrive after an unpredictable delay of two weeks or more, so teams may not know how a model is performing at all.
