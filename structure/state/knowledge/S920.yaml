notes: >
  The quote is TRUNCATED before the mojibake glyphs on purpose: the original shows the BOM
  rendered as three Latin-1 characters, and T3 could not guarantee byte-exact reproduction of
  those glyphs through this pipeline, which would fail G1's literal match. A task author
  reproducing this should regenerate the bytes rather than copy the glyphs. Mechanism confirmed
  independently by measurement: a UTF-8 BOM is EF BB BF, which decoded as cp1252 yields three
  visible characters attached to the first header. NOT re-fetched by T3.
