notes: >
  Liveness checked 2026-09-13 via GitHub REST API: state=open, opened 2020-09-26, 19 comments,
  9 reactions. The quoted line is the compiled output for test_tmp_2 where the source text
  said ref('test_tmp_1'). The issue title, verbatim, is: using {{ ref('anything') }} in a
  set_sql_header call resolves to the current model and not 'anything'. Licensed for the
  mechanism that the dependency you read in the model file is not necessarily the dependency
  that executes, which is the core of the out-of-graph-reference archetype. Six years open is
  itself world texture: a live trap nobody is going to fix under the agent.
