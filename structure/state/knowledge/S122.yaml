rq: RQ1
claim: >
  Notebook-driven workflows produce a distinct reproducible class of incident: one interviewed engineer described running a notebook with the wrong inputs and losing a day and a half of debugging before realising the results were garbage, which drove their company to move anything reproducible or deployable out of notebooks. Other teams take the opposite position and put notebooks in production specifically to minimise dev/prod divergence.
