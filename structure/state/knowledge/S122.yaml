notes: >
  Out-of-order or stale-state notebook execution is a realistic cheaply-seeded initial condition: ship a world containing a notebook whose saved outputs disagree with what re-running it produces. Marked medium because this is one interviewee's anecdote, though the practice split is reported across the cohort.
