notes: >
  Official dbt documentation, so unattested by construction: nobody is claiming an incident
  here, it is guidance. Recorded only to ground the mechanism, and usable_for is narrowed to
  mechanism alone for that reason.
  vividness=medium: the page carries a concrete non-idempotent code block
  (where event_at >= (select max(event_at) from this) with no unique_key) which is directly
  rebuildable, but no org context, no timings, no error strings.
  Why this matters to my assignment: the documented failure is framed as a re-run hazard,
  sequential in time. The same predicate under two OVERLAPPING runs is a different and worse
  failure - run B reads max(event_at) before run A commits, so both runs select the same
  boundary rows and both insert them, and no re-run ever happened. The docs do not say this.
  That gap is the difficulty I am trying to author against.
