id: S610
rq: RQ1
claim: >
  dbt's own idempotence guidance states that an incremental model's result depends on the
  current state of its target table, and that the canonical incremental predicate (filter on
  max(event_at) from this) re-appends boundary rows on re-run when no unique_key is set -
  which is exactly the read-modify-write step two overlapping runs interleave on.
url: https://docs.getdbt.com/best-practices/idempotence
quote: "Incremental models only process new or changed rows, which means they depend on the existing state of the target table. If you're not careful, re-running an incremental model can produce duplicate rows or inconsistent results."
