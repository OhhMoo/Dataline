claim: >
  MLE-bench enforces its rules with two automated detectors: a GPT-4o log-analysis tool that reads agent transcripts for rule violations, and the Dolos source-code plagiarism detector comparing agent code against the top 50 public Kaggle notebooks for that competition, with a 60 percent similarity threshold for disqualification. The log tool was over-sensitive: every violation it flagged on medal-winning runs (up to 14.1 percent of o1-preview AIDE runs flagged as manually-written submissions) was a false positive on human review.
