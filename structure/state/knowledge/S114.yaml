notes: >
  A concrete parameterizable drift world: inject a demand shock at a known date; the correct response is to tune training-window length and scoring cadence, not the architecture. Deterministically gradeable (did the agent shorten the lookback? did it identify the break date?). Three teams reporting the same March 2020 shock (this record, S117 DoorDash, and the Berkeley interviews) are three observers of ONE exogenous event, not three events - the honest reading is that a once-in-a-decade shock is why so many teams have a story about it (F456). This record does NOT license a frequency claim. If drift frequency is needed to weight the DS mix, source it from S117 and S120-S123, which speak to drift MONITORING being routine - a different and better-supported claim.
