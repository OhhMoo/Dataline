id: S019
rq: RQ1
claim: >
  Empirical study mining GitHub projects and Stack Overflow to locate data-pipeline defects:
  data-related issues were primarily caused by incorrect data types (33%) and occurred most often
  in the data cleaning stage (35%), while data integration and ingestion were the most-asked
  developer topics at nearly half (47%) of all questions. The taxonomy of 41 quality-influencing
  factors was validated by interviews with eight data engineering practitioners.
url: https://arxiv.org/abs/2309.07067
