notes: >
  Independent quantitative backing for the type-drift emphasis in S004 and for weighting ingestion
  and integration heavily in any task mix. The paper also isolates compatibility issues (version
  and library mismatches between components) as a separate problem area distinct from the usual
  load / ingest / integrate / clean / transform stages - directly relevant to S020, where a
  pg_dump major-version mismatch is what killed the backups.
