notes: >
  REDESIGN REQUIRED (2026-09-12). Red-teamed by R1/R2/R3; every axis landed
  high-severity attacks. F309 RULING: below the E5 tens-of-hours bar; F310 permutation probe mis-aimed; F257/F258 resource ceilings collide with required surfaces. Do NOT build from this
  specification. Redesign must go through BLIND phase-3 dispatch - authoring
  these with full sight of the attack records is what produced the defects.
  NOT blind-generated - authored by the lead agent to close the DS coverage gap; needs
  red-teaming before it counts as derived. Lowest human-hours estimate of the five new DS
  archetypes and sits at the bottom of the E5 "tens of hours" band; R3 should rule on whether
  it clears the bar or should be merged into a longer task. The permutation probe is the
  anti-memorisation analogue of the planted-partition idempotency check - it forces the
  artefact to demonstrate it is actually a function of the input.
