id: A050
title: The assertion that never ran, inside a suite of four thousand green tests
discipline: data_engineering
description: >
  A dbt project of roughly 570 models carries roughly 4100 generic tests and every scheduled
  build for six weeks reports zero failures. A revenue mart is nevertheless short by a small,
  stable percentage. The single assertion that would have caught the defect is a relationships
  test whose to: ref() target was renamed during a source migration; dbt drops such a test
  silently at parse time, so it is present in git, absent from manifest.json, and absent from
  run_results.json, and no log line anywhere says it was skipped (S652). The underlying defect
  is a staging model that emits a source key the conformed dimension no longer carries, so the
  fact-to-dimension join silently discards those rows. Two further real defects sit in the
  world and each explains part, but only part, of the shortfall: two tests were set to
  severity warn during an unrelated incident and their warnings scroll past inside a
  4100-test log, and one test carries enabled false with a stale comment dating it to a
  migration that finished months ago. The agent must account for the whole discrepancy
  arithmetically, repair the data, and restore the suite to a state where the same defect
  would fail the build.
why_hard: >
  Every surface the agent would normally trust agrees that nothing is wrong: the orchestrator
  is green, the test summary is green, and the model that is actually broken was not touched.
  The contradiction is only visible as a set difference between the tests declared in YAML and
  the test nodes that exist in the compiled manifest, and nothing in the product surfaces that
  difference. Reading 4100 tests is not feasible inside the wall clock, so this task separates
  strategies rather than measuring patience: an agent that diffs dbt ls --resource-type test
  against a parse of the schema YAML files finds the dropped assertion in seconds, while an
  agent that greps for suspicious test names, or reads the run log more carefully, or reruns
  the suite, can burn the entire budget and learn nothing. The two decoys are real defects
  that each account for a genuine slice of the shortfall, so ruling them out requires summing
  the slices rather than judging which looks worst, and an agent that stops after the visible
  disabled test will be short by roughly sixty percent and cannot know it without the
  arithmetic.
human_hours: "6-16"
grading: >
  Deterministic. GRADING REFERENCE IS HARNESS-SIDE (F121): the expected revenue table lives in
  a separate DuckDB file attached read-only at scoring time only and is never present in the
  agent-visible catalog, so it cannot be copied in place of a diagnosis. Checks are a row-level
  diff of the repaired mart over the affected quarter, a structural assertion on the agent's
  post-change manifest.json that the previously-dropped test node exists and is enabled, a
  live-fire probe in which the harness plants one fresh bad source key and requires dbt build
  to exit nonzero (a suite that cannot fail scores zero on that axis), a snapshot-integrity
  check, and an exact-match check on the damage window dates written to a findings file.
  A bounded judge scores only the written explanation of which downstream numbers were wrong.
rubric_points: 22
apps_touched:
  - warehouse
  - dbt
  - git
  - airflow
  - bi_dashboard
deterministic_checks:
  - "row-level diff of the repaired revenue mart against a HARNESS-SIDE reference attached read-only at scoring time, exact match across the affected quarter"
  - "agent's manifest.json contains a test node whose depends_on includes the conformed dimension and whose config.enabled is true - the dropped assertion is back and live"
  - "live-fire probe: harness plants one orphan source key and dbt build must exit nonzero; on the clean world the same command must exit zero"
  - "the two severity warn tests are escalated to error in manifest.json, or carry a config key recording a dated justification - checked structurally, not by prose"
  - "the enabled false test is either enabled true in manifest.json or carries an updated dated rationale in its config"
  - "snapshot snp_dim_source_system retains its pre-episode row count and its original min(dbt_valid_from) - rebuilding it from current state scores zero"
  - "findings file names the first and last affected month boundaries, exact string match against harness-side dates"
judge_axes:
  - code_quality
  - robustness
failure_modes_expected:
  - "trusts the green build and reports that the pipeline is healthy and the mart is correct"
  - "finds the visible enabled false test, re-enables it, declares victory, and is still short by roughly sixty percent of the discrepancy"
  - "finds the two severity warn tests, escalates them, and stops - a partial credit path that must not reach full marks"
  - "reads models rather than artifacts and exhausts the wall clock inside a 4100-test suite"
  - "repairs the mart data by hand without restoring the dropped assertion, so the live-fire probe still cannot fail"
  - "runs dbt snapshot --full-refresh while investigating and destroys the only record of when the rename happened"
existing_coverage: >
  ade-bench and data-eng-bench both contain broken-test tasks, but at a scale where reading
  every test is a viable strategy, which collapses the search dimension entirely. The specific
  mechanism here, an assertion that is in source control and not in the manifest with no
  diagnostic emitted, is not covered anywhere I found, and it is a currently-open dbt bug
  rather than a synthetic contrivance.
