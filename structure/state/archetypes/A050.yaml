agent_visible_brief: >
  Finance closed the quarter and our fct_revenue_daily total is 4.1 percent under their number.
  It has been under by about the same amount since the start of the quarter. Every dbt build in
  that window is green - the last 40 scheduled runs all report zero test failures - and nobody
  has deployed anything to the revenue models in that time. Please work out why the number is
  wrong, fix it, and make sure the pipeline would catch this if it happened again. Finance needs
  to know exactly which months are affected so they can decide whether to restate.
status: draft
notes: >
  HOW THE CLUTTER IS GENERATED, DETERMINISTICALLY. The project is emitted by
  world/gen_dbt.py --seed N from a declarative fixture spec, not hand-authored, which is how
  real projects of this size are actually maintained (S662: python code gen builds the YAML
  from a metadata spec). Determinism comes from a single random.Random(seed) drawn in a fixed
  order, sorted iteration over every collection, and no wall-clock or uuid input. Shape: 12
  source systems in the spec, each with 24 to 32 tables, one stg_ model per source table
  (~340 models), ~140 int_ models each performing one of six real patterns (row_number dedupe,
  pivot to a new grain, date-spine join, bridge fan-out, SCD2 flatten, tenant union), and ~90
  marts. That ratio is a scaled copy of a measured real repo rather than an invented one:
  S664 measures 787 stg_ to 330 int_ to 265 rpt_ to 52 dim_ to 28 fct_ in a live 1507-model
  project. Generic tests are emitted from the spec at roughly 7 per model, giving ~4100, which
  brackets the 5000 measured in S650. THE BULK IS NOT FILLER: every stg_ model is a real
  projection with real renames from a per-source column dictionary, every int_ model does real
  work, and each mart aggregates a real grain, so a model opened at random reads like a model,
  not like padding. CONVENTION NOISE IS SEEDED, NOT UNIFORM: three of the twelve sources are
  marked acquired in the spec and emit rpt_ and base_ prefixes under models/gold/ instead of
  the canonical layout, matching both the measured real distribution (S664) and the documented
  consequence that non-conforming models fall out of layer filters entirely (S656). That is
  what stops grep-by-convention being a one-shot win while keeping the answer findable.
  WHAT A FULL REFRESH DESTROYS: snp_dim_source_system is a dbt snapshot and the only artifact
  that dates the rename; dbt snapshot --full-refresh rebuilds it from current state and erases
  the valid_from the grader asks for. NAIVE BASELINES: rerunning the suite must succeed and
  reveal nothing; re-enabling the visible disabled test must partially succeed; manual data
  repair must pass the row diff and fail the live-fire probe. RESOURCE BUDGET, HONESTLY:
  S650 measures ~3 minutes of cold parse at 1599 models plus 5000 tests, so a cold parse here
  is plausibly 40 to 70 seconds. The image therefore ships a prebuilt target/partial_parse.msgpack
  so episode start is a warm parse of a few seconds. This archetype is the one at risk on that
  budget, because editing a test invalidates partial parsing: the wall clock must allow at
  least eight full reparses. If it cannot, this archetype should be cut to ~300 models rather
  than shipped with a budget it does not fit. That number is an extrapolation from S650 and has
  not been measured.
