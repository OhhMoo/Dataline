fidelity_gap: >
  THE HIGHEST-CONSEQUENCE FIDELITY GAP IN THE INVENTORY, and it is not in dbt - it is in
  the adapter. dbt-duckdb supports delete+insert, append, merge and microbatch
  incremental strategies (S807); dbt-snowflake's merge, its unique_key handling and its
  snapshot semantics do not line up one for one. A002 (positional-INSERT corruption
  after an incremental schema change), A009 and A026 (idempotent repair after a silent
  duplication) and A025 (column misalignment) are all authored ON those exact semantics.
  If the adapter merges where Snowflake would delete+insert, the planted defect either
  does not fire or fires for the wrong reason - and the task still grades, just not on
  the thing we meant, which is the worst failure mode this project has. Every
  incremental-model archetype must be pinned to the exact adapter and version shipped,
  and re-verified whenever that version moves.
evidence:
