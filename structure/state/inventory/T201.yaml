fidelity_gap: >
  moto mocks AWS API behaviour in Python; it is not a storage engine, and its durability
  and performance characteristics are irrelevant by design. Against adobe/S3Mock the
  tradeoff is breadth versus focus: moto covers many AWS services (useful if a task ever
  touches Secrets Manager or Glue), S3Mock covers S3 more single-mindedly and is a
  smaller JVM service. Neither implements IAM policy evaluation well enough for a
  permissions-misconfiguration task.
