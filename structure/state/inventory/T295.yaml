notes: >
  A BLOCKER T3 FOUND BY READING THE CODE, not a nice-to-have. Workspace.read in
  gateway/src/alkera_gateway/files.py ends in content.decode('utf-8') with no errors argument, and
  core.py catches UnicodeError, so the agent gets a clean tool error and NO BYTES. Consequence:
  every flat-file and mainframe theme is currently unbuildable through the toolbelt -- an EBCDIC
  extract, a cp1252 CSV, a UTF-8 BOM, and a packed-decimal field are all unreadable, which means
  the toolbelt sanitizes away precisely the defect the theme exists to plant. PROPOSED FIX: an
  optional encoding parameter plus a base64 bytes mode on fs_read, and the symmetric change on
  fs_write. Also note max_payload_bytes defaults to 1 MiB, which caps how large a generated
  extract may be.
