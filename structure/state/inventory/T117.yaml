fidelity_gap: >
  This is the honest 'no substitute exists' case in the inventory, and the reason is
  specific. dlt and Meltano MOVE DATA; Fivetran's role in these five archetypes is not
  moving data, it is being a control plane that made a schema-drift decision, recorded a
  sync as successful, and showed a green status while rows went missing. No OSS
  ingestion tool reproduces a sync-history timeline, a per-table schema-change policy,
  or a connector alert - because those are product surfaces, not data-movement features.
  Fivetran's own Connector SDK debug mode runs locally and writes a DuckDB warehouse.db
  (S806), a real way to generate believable connector OUTPUT offline, but it downloads a
  roughly 200MB proprietary tester binary on first run and still has no control plane.
  Surface a real task needs, counted honestly: 4 objects (connector, sync run,
  table-level schema config, alert), about 6 read endpoints, 2 actions (re-sync, pause).
  Not 'the Fivetran API'.
