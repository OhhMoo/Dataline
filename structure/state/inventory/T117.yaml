notes: >
  T1 2026-09-13 (round R002, mock-priority pass): RESOLVED from none_found to
  custom_mock_required - and this is the item most likely to eat a week. Five archetypes
  depend on it (A010, A017, A018, A022, A025), more than ticketing, catalog, streaming,
  semantic layer and legacy database combined, so it cannot be dropped. Nothing runs for
  real: Fivetran is SaaS, and the one honest OSS-adjacent path (Airbyte) is
  licence-blocked under ELv2 (T121, T156). The danger is not that it is impossible -
  four objects is a small build - it is that 'connector control plane' sounds like a
  product and will grow endpoints for weeks unless someone writes those four objects
  down and freezes them. See T203 for the build record.
