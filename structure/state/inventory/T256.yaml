notes: >
  NOT ADOPTED. Go plus DuckDB, MIT, 48 stars, 10 open issues, actively pushed. Strictly narrower
  than fakesnow: its README excludes Time Travel, zero-copy cloning, Streams, Tasks, Pipes,
  external stages, JS stored procedures and UDFs. I did not run it - the Python ecosystem fit of
  fakesnow, its dbt compatibility and its 208-star maintenance signal all favour fakesnow, and
  running two emulators is not worth the comparison. Worth a second look only if we ever need a
  single static binary with no Python runtime. OswaldOniSango/snowflake-emulator is a one-star
  fork of this, not a separate project.
