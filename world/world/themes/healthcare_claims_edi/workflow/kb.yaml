  - id: cdp/runbooks/nightly-edi
    title: Nightly EDI cycle
    parent: cdp/runbooks
    labels: [runbook, scheduler]
    body: |-
      # Nightly EDI cycle

      The 837/835 delivery lands at 00:30 UTC. `nightly_edi_load` reloads every raw
      table at 01:10, followed by `adjudication_build`, `settlement_handoffs`, and
      `cms_window_close` on their declared dependencies.

      The loader is a full reload. To recover a corrected partition, place it under
      the same `dt=` folder and rerun the load followed by the downstream jobs in
      DAG order. Do not delete individual raw rows. Check the first failed scheduler
      run and the dbt error before rerunning anything.
    version: 5
    author: jwilson
    last_edited_by: jwilson
    last_edited_at: "-8d 16:00"
    edit_comment: align job names with scheduler
    history:
      - {version: 4, at: "-45d 16:00", by: mbennett, comment: "add recovery order"}
      - {version: 3, at: "-85d 16:00", by: jwilson, comment: null}
  - id: cdp/runbooks/cms-calendar
    title: CMS submission calendar
    parent: cdp/runbooks
    labels: [runbook, cms, cutoff]
    body: |-
      # CMS submission calendar

      Each service month opens for submission on the first day of the following
      month. The standard synthetic regulatory calendar closes on day 5 at 18:00 UTC.
      The acceptance as-of date is two calendar days before the cutoff date.

      Current non-void claims received on or before the acceptance as-of date count
      as eligible. Later receipts count as late. Voids are excluded from eligible
      encounters and reported separately. The cutoff values in dbt vars are the
      machine-readable source for the table.
    version: 3
    author: kkaur
    last_edited_by: kkaur
    last_edited_at: "-5d 08:20"
    edit_comment: restate acceptance lag
    history:
      - {version: 2, at: "-50d 08:20", by: kkaur, comment: "add void treatment"}
      - {version: 1, at: "-110d 08:20", by: mbennett, comment: null}
  - id: cdp/runbooks/capitation
    title: Provider capitation settlement
    parent: cdp/runbooks
    labels: [runbook, capitation, provider]
    body: |-
      # Provider capitation settlement

      Monthly settlement equals contracted member months times PMPM, less the quality
      withhold. The default withhold is 500 basis points and the scheduled payment
      day is the 15th of the following month. Roster terms come from
      `warehouse.dim_provider`.

      Fee-for-service 835 payments and actuarial IBNR are not subtracted from the
      capitation settlement. Provider statements show gross, withhold, and net amounts
      so Provider Finance can reconcile each component.
    version: 2
    author: rortiz
    last_edited_by: rortiz
    last_edited_at: "-3d 12:45"
    edit_comment: separate FFS and capitation
    history:
      - {version: 1, at: "-65d 12:45", by: rortiz, comment: null}
