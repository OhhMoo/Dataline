pages:
  - id: cdp/architecture
    title: Claims data architecture
    parent: null
    labels: [architecture, edi]
    body: |-
      # Claims data architecture

      Nightly synthetic 837 and 835 CSV deliveries land under `data/landing/` and
      rebuild `raw.edi_837_claims`, `raw.edi_835_remits`, and the raw provider roster.
      dbt selects the current claim and remit versions into
      `warehouse.fct_adjudicated_claims`.

      Three consumer products follow the fact: `actuarial_reserve_handoff`,
      `provider_capitation_settlement`, and `cms_submission_window`.
      `warehouse.dim_provider` carries contract terms used by provider reporting.
      The payer_provider_operations dashboard reads only warehouse tables.
    version: 3
    author: jwilson
    last_edited_by: jwilson
    last_edited_at: "-16d 12:00"
    edit_comment: add CMS and capitation consumers
    history:
