  - id: cdp/policies/synthetic-data
    title: Synthetic data handling
    parent: cdp/policies
    labels: [policy, privacy]
    body: |-
      # Synthetic data handling

      This environment is fully synthetic. Member IDs are generated tokens and are
      not real subscriber, patient, or insurance identifiers. The world contains no
      patient names, birth dates, addresses, clinical notes, or real EDI transactions.

      Operational reviews should still use aggregate outputs. Member-level exports
      are not needed for CMS cutoff, capitation, COB, or reserve reconciliation.
    version: 1
    author: kkaur
    last_edited_by: kkaur
    last_edited_at: "-70d 14:00"
    edit_comment: null
    history: []
  - id: cdp/policies/edi-adjustments
    title: EDI adjustment rules
    parent: cdp/policies
    labels: [policy, edi, cob]
    body: |-
      # EDI adjustment rules

      Frequency code 1 is an original claim, 7 is a replacement, and 8 is a void.
      A replacement or void supersedes the earlier version of the same `claim_id`.
      Voids remain in the current fact for traceability and have zero allowed and
      payer-paid amounts.

      For COB claims, `other_payer_paid_amount` equals `cob_adjustment_amount`.
      The simplified remittance identity is billed amount equals payer payment plus
      member responsibility plus contractual adjustment plus COB adjustment.
      Other-payer payment is displayed separately for reconciliation and is not
      added a second time.
    version: 4
    author: mbennett
    last_edited_by: mbennett
    last_edited_at: "-2d 14:10"
    edit_comment: clarify COB identity
    history:
