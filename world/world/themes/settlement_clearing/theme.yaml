name: settlement_clearing
dbt_profile: world_dbt

# Card network events are folded into current payments, published to the
# clearing bank, and acknowledged by the bank's append-only cutoff record.
workflow:
  dir: workflow
  actor: agent
  project: {key: PAY, name: Payments data platform}
  statuses: [open, triage, in_progress, approved, blocked, done, wontfix]
  workspace: settlement-clearing-ops
  space: {key: PAY, name: Payments platform}

jobs:
  payments_nightly:
    command: load_payments
    duration_s: 74
    time: "20:00"
    day_offset: 0
    after: null
    detail: "payments feed dt={day}"
    exec:
      kind: theme
      op: load_raw
      args: [workspace, db]
      tables: [raw.payments_events, raw.merchant_terms, raw.settlement_config,
               raw.settlement_corrections]
  dbt_payments:
    command: dbt_build
    duration_s: 120
    after: {job: payments_nightly, minutes: 10}
    detail: null
    exec:
      kind: dbt
      command: build
      selector: "stg_payment_events stg_merchant_terms fct_payments dim_merchant settlement_corrections load_checkpoint interchange_ledger"
      tables: [warehouse.fct_payments, warehouse.dim_merchant,
               warehouse.settlement_corrections, warehouse.load_checkpoint,
               warehouse.interchange_ledger]
  settlement_publish:
    command: publish_settlement
    duration_s: 31
    after: {job: dbt_payments, minutes: 10}
    detail: null
    exec:
      kind: script
      path: pipelines/publish_settlement.py
      args: ["{db}", "{workspace}"]
      tables: [warehouse.settlement_handoff]
    publishes:
      - {target: warehouse.settlement_handoff, kind: table, consumer: clearing_bank}
      - {target: warehouse.interchange_ledger, kind: table, consumer: finance_reconciliation}
  clearing_window_close:
    command: close_clearing_window
    duration_s: 12
    time: "23:30"
    day_offset: 0
    after: {job: settlement_publish, minutes: 20}
    detail: "clearing cutoff {day}"
    exec:
      kind: script
      path: pipelines/clearing_window_close.py
      args: ["{db}", "{workspace}"]
      tables: [warehouse.clearing_window]
    publishes:
      - {target: warehouse.clearing_window, kind: table, consumer: clearing_bank}

live:
  params: [seed, payments_per_day, amount_cents, merchants, late_gap_days,
           interchange_bps, window_days, cutoff_day]
  arrival:
    name: payments_feed
    op: write_day
    at: {day_offset: 0, time: "04:00"}
  # The clean theme declares its operational fault catalogue disabled. Ordinary
  # stale recovery replays are source traffic generated by write_day, not faults.
  faults:
    - id: feed_late
      kind: late_arrival
      enabled: false
      rate: 0.05
      params: {delay_minutes: 240, missed_by: []}
    - id: feed_missing
      kind: missing_arrival
      enabled: false
      rate: 0.02
    - id: payment_load_timeout
      kind: job_timeout
      enabled: false
      rate: 0.02
      jobs: [payments_nightly]
      params: {timeout_s: 74}
