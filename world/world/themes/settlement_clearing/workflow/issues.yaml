    title: Adopt network feed contract v3
    body: |-
      Card network integrations confirmed that recovery can re-send an older
      payment version after a newer one. The current-payment fold is highest
      version first, with delivery metadata used only for ties. A highest-version
      void withdraws the payment.
    status: done
