version: 2

sources:
  - name: raw
    description: Card-network feed and control files loaded by pipelines/load_payments.py.
    schema: raw
    tables:
      - name: payments_events
        description: Every delivered event version and recovery replay, with its source partition.
      - name: merchant_terms
        description: Merchant display names and contracted interchange basis points.
      - name: settlement_config
        description: Initial cutoff date, cutoff lookback, and default interchange rate.
      - name: settlement_corrections
        description: Controller-approved corrections eligible for closed-window republication.
