name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install -r requirements.txt
      - name: check
        # parse the dbt project and check dags/ against the recorded pipeline
        run: ./run.sh check
        env:
          DBT_TARGET: ci
