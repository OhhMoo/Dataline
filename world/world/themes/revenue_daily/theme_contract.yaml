# Phase-2 domain contract: revenue_daily's native fault-injection surface, for
# the factory compiler (tasks/factory/compiler). Every name below exists in
# this theme: the landing dir under workspace/, the tables built nightly by
# load_raw (gen.py) and the dbt project (workspace/dbt_project/models/), the
# columns in the warehouse schema contract (models/warehouse/schema.yml), the
# jobs in theme.yaml. Concepts the theme does not have are null rather than
# invented.
theme: revenue_daily
# Nightly revenue batch: data/landing/daily_revenue/dt=YYYY-MM-DD/revenue.csv
# (gen.py write_day).
landing_dir: data/landing/daily_revenue
# Primary landing table: one row per order, hive-partitioned on dt. Rebuilt
# from all partitions by daily_load (gen.py load_raw).
raw_table: raw.daily_revenue
# Primary fact: one row per order date (models/warehouse/fct_revenue.sql).
fact_table: warehouse.fct_revenue
# This theme has no handoff/extract, close/window or corrections table.
handoff_table: null
close_window_table: null
corrections_table: null
# fct_revenue grain - "Business date. The grain of this table."
# (models/warehouse/schema.yml: unique + not_null).
grain_keys: [order_date]
# Sum of amount over the date (models/warehouse/schema.yml).
amount_column: revenue
# No version/CDC column: each day's partition is delivered once and loaded
# as-is; raw.daily_revenue carries order_id, order_date, customer_id, amount.
version_column: null
# The partition for business date D is due at 00:00 UTC on D+1 (theme.yaml
# live.arrival); daily_load consumes it at 01:00.
cutoff_time_utc: "00:00"
# Job names exactly as in theme.yaml.
scheduled_jobs: [daily_load, dbt_build]
# Scheduler sync hook path, relative to workspace/. Not shipped in this
# theme's workspace: that tree is inside the fingerprinted historical revenue
# world (world/seed.example.yaml). A built world that contains the file is
# honored; a world without it keeps live.json's order.
schedule_file: orchestration/schedule.yml
