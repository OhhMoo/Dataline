  - id: de/architecture/warehouse-overview
    title: Warehouse overview
    parent: de/architecture
    labels: [architecture]
    body: |-
      # Warehouse overview

      One DuckDB file, three schemas, one dashboard.

      | layer | object | built by |
      |---|---|---|
      | raw | `raw.daily_revenue` | scheduler job `daily_load` |
      | staging | `staging.stg_revenue` | dbt model `stg_revenue` |
      | warehouse | `warehouse.fct_revenue` | dbt model `fct_revenue` |

      `raw.daily_revenue` is as-landed: `order_id`, `order_date`,
      `customer_id`, `amount` (a string at this layer) and the hive partition
      column `dt`. `staging.stg_revenue` casts `amount` to `decimal(12,2)`.
      `warehouse.fct_revenue` is one row per `order_date` with `orders` and
      `revenue`.

      The dashboard `revenue_daily` reads `warehouse.fct_revenue` and has two
      panels: `daily_revenue`, one row per day, and `total_revenue`.

      The warehouse file is reachable only through the `sql_*` tools.
    version: 3
    author: tokafor
    last_edited_by: dpatel
    last_edited_at: "-58d 15:20"
    edit_comment: added the dt partition column
    history:
      - {version: 2, at: "-140d 11:02", by: tokafor, comment: "split staging and warehouse"}
      - {version: 1, at: "-201d 12:30", by: tokafor, comment: null}
    authoring:
      kind: accurate
      note: >-
        RD-K2. Current and correct, every object name checkable through
        sql_tables. It names both dashboard panels without saying what either
        one filters, which is true of most architecture pages and is why the
        panel definition, not the wiki, is where the answer lives.

