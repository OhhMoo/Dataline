  - id: de/policies/change-freeze
    title: Change freeze calendar
    parent: de/policies
    labels: [policy, freeze]
    body: |-
      # Change freeze calendar

      No writes to `warehouse.*` or to the landing zone between the 1st and the
      3rd business day of each month, while finance close the previous period.
      That includes re-landing a partition, because `daily_load` rebuilds
      `raw.daily_revenue` from every `dt=` folder present and a re-landed day
      changes the numbers finance are reconciling against.

      During the freeze:

      - a backfill needs the controller's sign-off on the ticket before it runs
      - `sched_trigger` on `daily_load` is a change, not a read
      - a dbt model change may be merged but must not be deployed

      Outside the freeze, re-land the partition and let the 01:00 run pick it
      up. Do not hand-edit tables in either case.
    version: 4
    author: tokafor
    last_edited_by: tokafor
    last_edited_at: "-31d 10:44"
    edit_comment: spell out that re-landing a partition counts as a write
    history:
      - {version: 3, at: "-120d 09:15", by: tokafor, comment: "added dbt deploys"}
      - {version: 2, at: "-160d 16:40", by: kliu, comment: null}
      - {version: 1, at: "-190d 09:00", by: tokafor, comment: null}
    authoring:
      kind: constraint
      note: >-
        RD-K3. A real limit on the shape of an acceptable solution, and the
        thing DATA-146 is blocked on. Note it is also the one page that states
        the rebuild-from-every-partition behaviour correctly, so the agent can
        corroborate the chat decision from a policy page rather than from a
        runbook - which is exactly the sort of sideways evidence a real wiki
        yields.

