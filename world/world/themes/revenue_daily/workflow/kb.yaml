  - id: de/runbooks/nightly-revenue-load
    title: "Runbook: nightly revenue load"
    parent: de/runbooks
    labels: [runbook, load]
    body: |-
      # Runbook: nightly revenue load

      `daily_load` runs at 01:00 UTC and **appends the one new partition** to
      `raw.daily_revenue`. `dbt_build` follows at 01:05 and rebuilds
      `staging.stg_revenue` and `warehouse.fct_revenue`.

      ## If a day is missing

      Re-run the load for that day only:

          load_daily_revenue --from 2026-02-14 --to 2026-02-16

      It is safe to backfill up to seven days in one run. Beyond that, split
      it, or the load will run past the 01:05 dbt build and the two will
      overlap.

      ## If the load ran twice

      Delete the duplicate rows before rebuilding:

          DELETE FROM raw.daily_revenue WHERE dt = '2026-02-14';

      then re-run the load for that day.

      ## Checking

      `sched_state` should show `daily_load` and `dbt_build` green. Investigate
      the first non-success run, not the last.
    version: 6
    author: kliu
    last_edited_by: kliu
    last_edited_at: "-118d 10:12"
    edit_comment: note the seven-day backfill limit
    history:
      - {version: 5, at: "-145d 09:30", by: kliu, comment: "add the duplicate-rows section"}
      - {version: 4, at: "-171d 14:20", by: dpatel, comment: null}
      - {version: 3, at: "-188d 11:00", by: kliu, comment: null}
      - {version: 2, at: "-195d 10:30", by: kliu, comment: null}
      - {version: 1, at: "-201d 12:20", by: tokafor, comment: null}
    authoring:
      kind: stale
      contradicts: [de/runbooks/revenue-backfill]
      note: >-
        RD-K6. Published, four months untouched, and wrong in three specific
        ways: the load is not append-only, `--from/--to` do not exist, and the
        DELETE it recommends is a destructive write against a table the next run
        rebuilds anyway. It is also the page the repo's own
        docs/runbook_daily_load.md agrees with, so a cross-check against the
        workspace *confirms* the wrong answer. DATA-121 asks for this rewrite
        and has been open 47 days.

  - id: de/runbooks/revenue-backfill
    title: "Runbook: re-landing a day"
    parent: de/runbooks
    labels: [runbook, backfill]
    body: |-
      # Runbook: re-landing a day

      **Supersedes the backfill and duplicate sections of
      de/runbooks/nightly-revenue-load, which describe a loader we stopped
      running in February.** That page has not been updated; read this one.

      `daily_load` does `CREATE OR REPLACE TABLE raw.daily_revenue` over every
      partition under `data/landing/daily_revenue/dt=*/`. It is idempotent.
      There is no incremental mode, there are no `--from` / `--to` flags, and
      there is nothing to de-duplicate: a re-landed day replaces itself.

      ## To re-land a day

      1. Write the corrected CSV into `data/landing/daily_revenue/dt=<day>/`.
      2. Wait for the 01:00 run, or trigger `daily_load` if you have sign-off.
      3. Check `warehouse.fct_revenue` for that `order_date`.

      **Do not run the DELETE in the old runbook.** It removes rows the next
      run would have replaced, and during a freeze it is an unsigned warehouse
      write.

      ## The freeze

      Re-landing a partition is a write. See
      de/policies/change-freeze before doing any of this between the 1st and
      the 3rd business day of a month.
    version: 2
    author: dpatel
    last_edited_by: dpatel
    last_edited_at: "-12d 15:58"
    edit_comment: written up after the third person followed the old page
    history:
      - {version: 1, at: "-12d 15:31", by: dpatel, comment: null}
    authoring:
      kind: current_and_contradicting
      contradicts: [de/runbooks/nightly-revenue-load]
      note: >-
        RD-K7. The page that wins, and it says so in its own first paragraph
        rather than in a field. Twelve days old against the other page's 118,
        and kb_list serves both ages, so the disagreement is resolvable on
        evidence the surface hands over rather than on taste. It is also the
        only *written* record of the decision made in data-eng/0003, and it is
        still not linked from the stale page.

  - id: de/runbooks/alarm-reference
    title: "Runbook: what each alarm means"
    parent: de/runbooks
    labels: [runbook, alarms]
    body: |-
      # Runbook: what each alarm means

      Thresholds live in the world's observability definitions; this page is
      the plain-English version. Check `alarms_list` if a number here looks
      wrong - the definitions are the source of truth and this page is not.

      - **revenue_stale** (critical). Freshness above 180000 s, which is fifty
        hours. Freshness peaks around 176400 s in the hour before each load on
        a healthy night, so a flat two-day threshold would flicker every
        morning. Fifty hours means a partition was genuinely missed.
      - **daily_load_failing** (warning). More than one run in five failing
        over the last ten runs.
      - **daily_load_slow** (warning). The load took over three minutes. It
        normally takes about 45 seconds. A slow run usually means it caught up
        more than one day, which means the *previous* run failed - so this
        alarm points at the recovery, not at the incident.
      - **revenue_volume_floor** (warning). Two consecutive readings under
        thirty orders.
      - **revenue_amount_missing** (warning). Any landed row with no amount.

      None of these say anything about a number being *wrong*. They watch
      freshness, volume and job health. A correct pipeline serving a
      mislabelled panel fires none of them.
    version: 2
    author: dpatel
    last_edited_by: dpatel
    last_edited_at: "-40d 09:12"
    edit_comment: add revenue_amount_missing after the January postmortem
    history:
      - {version: 1, at: "-96d 14:00", by: tokafor, comment: null}
    authoring:
      kind: accurate
      note: >-
        RD-K8. Current, and every threshold on it matches the theme's
        obs/definitions.yaml, so alarms_list corroborates it exactly - which is
        what makes the *stale* runbook's disagreement with reality legible by
        contrast. The last paragraph is the sentence that closes the incident
        and it is the easiest one on the page to skim past.
