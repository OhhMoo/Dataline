  - id: de/postmortems/2026-01-19-missing-amounts
    title: "Postmortem: missing amounts, 2026-01-19"
    parent: de/postmortems
    labels: [postmortem, data-quality]
    body: |-
      # Postmortem: missing amounts, 2026-01-19

      ## What happened

      Rows landed in `raw.daily_revenue` with a blank `amount`. The load
      succeeded, dbt succeeded, and the dashboard rendered a lower number
      without anything going red. Finance found it, four days later.

      ## Why nothing caught it

      Nothing asserts anything about `amount`. `stg_revenue` casts it and an
      empty string casts to null without complaint. The
      `revenue_amount_missing` alarm was added afterwards and reads
      `revenue_amount_null_rate` off the raw table, so it reports the problem
      after a load rather than preventing one.

      ## Actions

      1. Add a `not_null` test on `amount` and `order_date` in
         `staging.stg_revenue`. **Open.** DATA-118.
      2. Add the `revenue_amount_missing` alarm. Done.
      3. Agree what the dashboard is allowed to be used for. Not started, and
         nobody owns it.

      ## What we still do not know

      Whether any other panel has the same shape as the one we fixed here. We
      checked `daily_revenue` and stopped.
    version: 2
    author: dpatel
    last_edited_by: dpatel
    last_edited_at: "-42d 17:05"
    edit_comment: mark action 2 done
    history:
      - {version: 1, at: "-43d 11:30", by: dpatel, comment: null}
    authoring:
      kind: accurate_but_partial
      note: >-
        RD-K4. True, and silent about the half that matters. Action 1 is the
        unactioned remediation (DATA-118). Action 3 and the "what we still do
        not know" section point straight at the current incident - a panel
        nobody checked, used for something it was not - and were written seven
        weeks before it happened. An agent that reads postmortems gets the
        answer early; nothing forces it to.

