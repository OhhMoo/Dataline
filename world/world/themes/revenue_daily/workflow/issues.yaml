  - id: DATA-149
    title: February revenue pack does not match the dashboard any more
    body: |-
      I took the February revenue total off the revenue_daily dashboard on the
      morning of the 1st and it said 139,823.60. I built the pack on that and
      circulated it. I looked again this morning and the same panel says a
      bigger number, and it went up again overnight.

      I did not change anything. It is the same dashboard and the same panel.

      The board pack goes out on Thursday, so I need to know which number is
      right before Wednesday noon.
    status: open
    reporter: mrivera
    assignee: null
    labels: [revenue, dashboard, finance]
    created_at: "-1d 08:14"
    updated_at: "-1d 08:52"
    comments:
      - id: DATA-149#1
        author: dpatel
        at: "-1d 08:52"
        body: |-
          Picking this up. First thing to check is what the panel actually
          covers, because I do not think it is February.
    history: []
    links:
      - {type: relates_to, issue: DATA-134}
    authoring:
      kind: incident_report_lay
      note: >-
        RD-I7. The incident as a non-engineer describes it: no schema, no job
        name, a symptom and a deadline. There is no defect in the pipeline. The
        total_revenue panel in var/bi/dashboards/revenue_daily.yml is
        `select sum(revenue) from warehouse.fct_revenue` with no date filter, so
        it grows every night and was never a February number. Measured: the
        panel reads 150001.10 at the world clock, February alone is 139823.60,
        and the 10177.50 between them is 2026-03-01 (4428.24) plus 2026-03-02
        (5749.26). Everything needed to say so is in bi_render plus one
        sql_query. The `relates_to` link points at the wrong ticket, because a
        human added it.

