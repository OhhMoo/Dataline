# revenue_daily: the backlog a data engineer inherits on their first morning.
#
# The world itself is clean - this theme ships its fault catalogue disabled, so
# every one of the 60 scheduler runs is green and every partition is present.
# That is deliberate: the mess here is the *organisation* around a healthy
# pipeline, which is what a data engineer actually spends the morning on. Two
# people have filed the same ticket, the loudest diagnosis is arithmetic rather
# than evidence, the remediation from January's postmortem is still open, and
# two tickets are assigned to somebody on leave.
#
# Every claim a ticket makes is checkable through another surface, and the
# numbers below were measured against a built world, not invented:
#   sum(revenue) over warehouse.fct_revenue            150001.10
#   the same sum for February alone                    139823.60
#   warehouse.fct_revenue on 2026-03-01 / 2026-03-02   4428.24 / 5749.26
#   lowest revenue day: 2026-02-17                     49 orders / 4135.90
#   orders per day across the month                    43 .. 60, mean 50.1
#   raw.daily_revenue                                  1504 rows / 30 dt values
#   rows with a missing amount                         0
#   scheduler runs                                     60, all success
#
# `authoring` is author-side: workflow.py strips it from every tool response.
issues:
  - id: DATA-107
    title: Pin duckdb in the image instead of tracking latest
    body: |-
      The image installs duckdb unpinned, so a rebuild can move the engine
      under us between one world and the next. Pin it in requirements.lock and
      let dependabot raise the bump as a PR.
    status: done
    reporter: tokafor
    assignee: dpatel
    labels: [maintenance, build]
    created_at: "-96d 11:03"
    updated_at: "-88d 16:41"
    comments:
      - id: DATA-107#1
        author: dpatel
        at: "-88d 16:41"
        body: Pinned and merged. No behaviour change in the nightly build.
    history:
      - {at: "-88d 16:41", actor: dpatel, field: status, from: in_progress, to: done}
    links: []
    authoring:
      kind: noise
      note: >-
        RD-I1. True, closed, and irrelevant to anything a task will ask. It
        exists so issues_list is not eight tickets that all matter, which is
        the shape that turns a backlog into a solution manual.

  - id: DATA-118
    title: Add a not_null test on raw.daily_revenue.amount
    body: |-
      Action 1 from the 19 January postmortem. We found rows landing with a
      blank amount and nothing anywhere failed - not the load, not dbt, not the
      dashboard. The revenue_amount_missing alarm was added afterwards and it
      reads the null rate, but an alarm tells you after the fact; a dbt test
      stops the build.

      Model: staging.stg_revenue. Add not_null on amount and order_date.
    status: open
    reporter: dpatel
    assignee: null
    labels: [data-quality, postmortem-action]
    created_at: "-43d 09:26"
    updated_at: "-43d 09:26"
    comments: []
    history: []
    links: []
    authoring:
      kind: unactioned_remediation
      note: >-
        RD-I2. The control that would have caught January's defect, still open
        six weeks later and unassigned. Currently harmless - the built world has
        zero rows with a missing amount - which is exactly why nobody has done
        it, and exactly why it is still the first thing that should be done.

