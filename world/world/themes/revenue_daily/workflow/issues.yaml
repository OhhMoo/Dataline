      de/runbooks/nightly-revenue-load still says the job appends the new
      partition and that a hand backfill needs --from/--to. That has not been
      true since Kenji changed it. docs/runbook_daily_load.md in the repo says
      the same thing.

      Whoever picks this up: the accurate version is in #data-eng, not in the
      wiki.
    status: open
    reporter: tokafor
    assignee: kliu
    labels: [documentation]
    created_at: "-47d 14:02"
    updated_at: "-46d 08:19"
    comments:
      - id: DATA-121#1
        author: kliu
        at: "-46d 08:19"
        body: Will do after the Q1 freeze.
    history: []
    links: []
    authoring:
      kind: stale
      note: >-
        RD-I3. Open 47 days, one comment promising a rewrite, assignee on
        leave. The page it asks for has since been written as a *separate*
        page (de/runbooks/revenue-backfill) and nobody closed this or deleted
        the old one, which is how the wiki came to hold both.

  - id: DATA-134
    title: Revenue dropped on 17 February
    body: |-
      The daily_revenue panel shows 4,135.90 for 2026-02-17, which is the
      lowest day in the month. Asking whether the load ran short.
    status: wontfix
    reporter: jbeck
    assignee: dpatel
    labels: [revenue, dashboard]
    created_at: "-13d 09:41"
    updated_at: "-12d 10:55"
    comments:
      - id: DATA-134#1
        author: dpatel
        at: "-12d 10:55"
        body: |-
          Checked. daily_load and dbt_build are both green for that night in
          sched_state and the partition has 49 orders, which is mid-band -
          daily volume runs 43 to 60 across the month. It is a quiet day, not a
          short load. The revenue_volume_floor alarm did not fire either.
    history:
      - {at: "-12d 10:55", actor: dpatel, field: status, from: open, to: wontfix}
    links: []
    authoring:
      kind: near_duplicate_trap
      note: >-
        RD-I4. The same symptom as DATA-149 - a revenue number that looks too
        low - with a completely different and already-settled cause. An agent
        that pattern-matches on "revenue looks low" lands here. The comment is
        true and measured: 2026-02-17 really is the minimum revenue day at
        4135.90, with 49 orders against a 43-60 band.

  - id: DATA-142
    title: The loader has been dropping rows since the dbt bump
    body: |-
      raw.daily_revenue is about 1,500 rows for a month that should hold 1,800.
      At 60 orders a day over 30 days that is 300 rows short, and the only
      thing that changed in that window is the dbt upgrade in DATA-107.

      We should roll the loader back.
    status: open
    reporter: jbeck
    assignee: tokafor
    labels: [revenue, needs-triage]
    created_at: "-2d 09:12"
    updated_at: "-2d 09:12"
    comments: []
    history: []
    links:
      - {type: relates_to, issue: DATA-107}
    authoring:
      kind: confident_wrong
      note: >-
        RD-I5. Stated flatly, linked to an unrelated ticket, and wrong. The row
        count is real (1504 across 30 dt values); the 1800 is the reporter's own
        arithmetic on the top of the band. Measured, orders per day run 43 to 60
        with a mean of 50.1, so 1504 is exactly what the month should hold.
        Disprovable in one query, and repeated in #incidents where it collects
        two agreements.

