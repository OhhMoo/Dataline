  body: 'Only received ASNs add on-hand stock. Cases convert to eaches through the
    UOM table. Movements reduce stock. Cycle counts are a separate control and customs
    declarations freeze after three days.


    Historical restatements after the cutoff require the domain controller approval
    recorded in the issue tracker.'
