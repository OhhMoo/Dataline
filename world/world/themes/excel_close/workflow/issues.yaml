# excel_close: a finance service desk in the first week of a month-end close.
#
# `waiting_on_finance` exists in this world's status set because most of this
# queue is not blocked on engineering - it is blocked on a controller signing
# something (theme.yaml declares the set). A tracker without it files all of
# those under in_progress and misreports the backlog.
#
# Measured against a built world - nothing below is invented:
#   warehouse.fct_gl_monthly 202602    net_amount 276509.97, adj_total 227.20
#   the two added together              276737.17
#   warehouse.fct_gl_monthly 202603    net_amount 17665.39, adj_total 170.48
#   raw.gl_lines                        1129 rows in 202602, 75 in 202603
#   raw.manual_adj                      9 rows: 4 in 202602, 5 in 202603
#   202602 by account                   4000-REV 47070.73 / 4100-REV 44599.88
#                                       4200-REV 53712.60 / 5000-COGS 40402.84
#                                       5100-OPEX 45854.06 / 5200-PAYROLL 44869.86
#   202602 adjustments                  +52.43, +15.58, -335.94, +495.13
#   202603 adjustments to 5000-COGS     -463.28, +455.45, -466.04, +456.95
#   workbooks on disk                   CLOSE_202602.xlsx, CLOSE_202603.xlsx
#   scheduler runs                      60, all success
#
# `authoring` is author-side: workflow.py strips it from every tool response.
issues:
