  - id: FIN-233
    title: Why does 5000-COGS have four adjustments already this month?
    body: |-
      March is two days old and 5000-COGS has four manual adjustments on it:
      -463.28, +455.45, -466.04, +456.95. They very nearly cancel. Two are
      labelled prior-period correction.

      Is somebody correcting the same thing over and over, or is this normal?
    status: waiting_on_finance
    reporter: a.patel
    assignee: j.chen
    labels: [manual-adjustments, review]
    created_at: "-1d 15:05"
    updated_at: "-1d 16:30"
    comments:
      - id: FIN-233#1
        author: j.chen
        at: "-1d 16:30"
        body: |-
          Two of those are mine and they are what the runbook asks for - a late
          correction to February goes into the March workbook as a new line,
          not back into a closed period. Whether four of them in two days is
          normal is a question for the controller, not for me.
    history:
      - {at: "-1d 16:30", actor: a.patel, field: status, from: open, to: waiting_on_finance}
    links: []
    authoring:
      kind: true_and_irrelevant
      note: >-
        EC-I8. Every number in it is real - those are the four 202603
        adjustments to 5000-COGS and they do net to -16.92 - and it has nothing
        to do with FIN-231. It is also policy-compliant: the repo runbook does
        say a late correction goes into the current period as a new line. An
        agent that reads "prior-period correction" as a smell will spend the
        morning here, and the status is the honest one, which is a status
        revenue_daily's tracker cannot express.
