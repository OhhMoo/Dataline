  - id: fin/postmortems/2026-01-23-missing-adjustment
    title: "Postmortem: missing adjustment, 2026-01-23"
    parent: fin/postmortems
    labels: [postmortem, warehouse]
    body: |-
      # Postmortem: missing adjustment, 2026-01-23

      ## What happened

      `ADJ-202601-03` was keyed on the January workbook against a dormant
      intercompany account and never appeared in `fct_gl_monthly`. Group
      reporting found it when the pack would not tie.

      ## Why

      The model joins `raw.manual_adj` onto the GL lines from the GL side. The
      account had no postings in January, so there was no row to join onto and
      the adjustment was dropped. No error, no warning, no row.

      ## Actions

      1. Make an orphaned adjustment visible rather than silent. **Open.**
         FIN-217.
      2. Book January by hand for the pack. Done.
      3. Say in the wiki what `net_amount` actually is. **Open.** FIN-214.

      ## What we still do not know

      Whether the pack figure has been right in any month. We checked that
      January's adjustment was missing and we never checked what the pack takes
      off the dashboard in a normal month.
    version: 2
    author: rboateng
    last_edited_by: rboateng
    last_edited_at: "-39d 10:50"
    edit_comment: record both open actions
    history:
      - {version: 1, at: "-40d 16:20", by: rboateng, comment: null}
    authoring:
      kind: accurate_but_partial
      note: >-
        EC-K6. True, and silent about the half that matters. It diagnoses a real
        mechanism that does not apply to February, which is what makes FIN-221
        such a comfortable wrong answer; and its closing paragraph states this
        week's finding - nobody ever checked what the pack takes off the
        dashboard - six weeks early, as an open question nobody picked up.
