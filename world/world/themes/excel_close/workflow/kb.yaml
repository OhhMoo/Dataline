  - id: fin/warehouse/fct-gl-monthly
    title: fct_gl_monthly
    parent: fin/warehouse
    labels: [warehouse, model]
    body: |-
      # fct_gl_monthly

      One row per period and account.

      | column | meaning |
      |---|---|
      | `period` | YYYYMM, from the workbook |
      | `account` | the GL account code |
      | `lines` | how many GL lines were posted |
      | `net_amount` | the **final** figure for the account: GL lines net of the manual adjustments for that period |
      | `adj_total` | the adjustments, shown separately for information |

      Because `net_amount` already includes the adjustments, the close pack can
      be taken straight off it. Do not add `adj_total` on top - that would
      count the adjustments twice.

      The dashboard `close_summary` reads this table.
    version: 3
    author: rboateng
    last_edited_by: rboateng
    last_edited_at: "-149d 14:50"
    edit_comment: clarify that adj_total is informational
    history:
      - {version: 2, at: "-190d 10:15", by: rboateng, comment: null}
      - {version: 1, at: "-240d 09:30", by: a.patel, comment: null}
    authoring:
      kind: stale
      contradicts: [fin/warehouse/reading-the-close-numbers]
      note: >-
        EC-K4. Published, 149 days untouched, and it states the exact opposite
        of the truth with a warning attached that makes the correct action look
        like the error. The model is one file away:
        fct_gl_monthly.sql selects sum(g.amount) as net_amount and
        coalesce(a.adj_total, 0) as adj_total without ever adding them. Measured,
        202602 is net_amount 276509.97 and adj_total 227.20, and the workbook
        total the controller is quoting is 276737.17 - the sum. This page is why
        the pack has been GL-only all year and why FIN-231 reads as a defect.

  - id: fin/warehouse/reading-the-close-numbers
    title: Reading the close numbers
    parent: fin/warehouse
    labels: [warehouse, close, current]
    body: |-
      # Reading the close numbers

      **This supersedes fin/warehouse/fct-gl-monthly, which has `net_amount`
      backwards.** That page is still up; FIN-214 is the ticket to take it
      down.

      ## What the columns are

      - `net_amount` is the sum of the GL lines for that period and account.
        **It does not include the manual adjustments.** The model never adds
        them.
      - `adj_total` is the sum of `raw.manual_adj` for the same period and
        account, or zero where there are none.

      ## The figure the pack needs

          net_amount + adj_total

      per account, or summed over the period. The `close_summary` dashboard's
      `monthly_net_by_account` panel selects `net_amount` only, so the number
      on the screen is the GL-only figure, not the close figure. That is the
      panel, not the model, and changing it is a change like any other.

      ## Why it is built this way

      Adjustments are not postings. Keeping them in their own column means the
      workbook, `raw.manual_adj` and the fact table all agree line for line,
      and an adjustment can always be traced to the person who keyed it.

      ## Known gap

      An adjustment for a period and account with no GL lines never appears at
      all - the join runs from the GL side. FIN-217. It has not bitten since
      January.
    version: 2
    author: rboateng
    last_edited_by: rboateng
    last_edited_at: "-10d 10:55"
    edit_comment: add the known gap
    history:
      - {version: 1, at: "-38d 15:10", by: rboateng, comment: null}
    authoring:
      kind: current_and_contradicting
      contradicts: [fin/warehouse/fct-gl-monthly]
      note: >-
        EC-K5. The page that wins, saying so in its own first line, ten days old
        against the other page's 149. Every claim is checkable against
        fct_gl_monthly.sql and close_summary.yml. It is the complete answer to
        FIN-231, it names the open gap that makes FIN-221 a red herring for
        February, and nobody in #close has read it - which is exactly how a wiki
        fails in practice.

