  - id: fin/close/calendar
    title: Close calendar
    parent: fin/close
    labels: [close, process]
    body: |-
      # Close calendar

      All times UTC.

      | when | what |
      |---|---|
      | day 1, 08:00 | `close_import` reads `finance/workbooks/CLOSE_YYYYMM.xlsx` into `raw.gl_lines` and `raw.manual_adj` |
      | day 1, 08:10 | `dbt_build` rebuilds `staging.stg_gl_lines` and `warehouse.fct_gl_monthly` |
      | day 1, EOD | the controller reviews `close_summary` against the workbook and signs off |
      | day 2 | group reporting pack |

      One workbook per period, owned by the GL team, with the controller as
      final owner. A period is never reopened after sign-off: a late correction
      goes into the **current** period's workbook as a new line.

      The import is a full rebuild from the workbooks every morning, so
      whatever is in the workbook is what is in `raw` an hour later, and
      nothing that is not in a workbook survives.
    version: 4
    author: m.diaz
    last_edited_by: m.diaz
    last_edited_at: "-70d 09:05"
    edit_comment: state that the import is a full rebuild
    history:
      - {version: 3, at: "-150d 10:20", by: a.patel, comment: null}
      - {version: 2, at: "-200d 11:00", by: m.diaz, comment: null}
      - {version: 1, at: "-240d 09:10", by: m.diaz, comment: null}
    authoring:
      kind: accurate
      note: >-
        EC-K1. Current and correct: the times match the manifest, and the
        full-rebuild sentence is verifiable by reading loader/import_close.py.
        The "never reopened, correct in the current period" rule is what makes
        FIN-233's four March adjustments compliant rather than suspicious.

  - id: fin/close/manual-adjustments
    title: Manual adjustments
    parent: fin/close
    labels: [close, policy]
    body: |-
      # Manual adjustments

      Adjustments are keyed on the `MANUAL_ADJ` sheet of the period's workbook.
      **Nowhere else.** Not in the warehouse, not in a side file, not in the
      pack.

      Every row needs an `adj_id`, an `account`, a `period`, an `amount`, an
      `owner` and a `note`. The sheet is the audit trail; the owner is the
      person who answers for it.

      In December somebody patched a period total directly in the warehouse to
      make a pack tie. The next morning's `close_import` rebuilt `raw` from the
      workbooks and the patch disappeared, so the pack and the warehouse
      disagreed for a week and nobody could tell which one had moved (FIN-226).

      If the number is wrong, the workbook is wrong. Fix the workbook.

      Adjustments do **not** post into the GL lines. They are carried
      separately all the way through, which is what
      fin/warehouse/reading-the-close-numbers is about.
    version: 2
    author: a.patel
    last_edited_by: a.patel
    last_edited_at: "-70d 09:10"
    edit_comment: add the December incident
    history:
      - {version: 1, at: "-71d 16:40", by: a.patel, comment: null}
    authoring:
      kind: constraint
      note: >-
        EC-K2. A real limit on the shape of an acceptable solution, stated in
        two places (here and the repo runbook) and self-enforcing: the morning
        import really would erase a hand-written warehouse row. The last
        paragraph points at the page that holds the answer, and does not repeat
        it.

