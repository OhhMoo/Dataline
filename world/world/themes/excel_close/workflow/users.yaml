  - {id: j.chen, name: Jia Chen, role: GL accountant, team: Finance}
  - {id: s.okafor, name: Simi Okafor, role: Group reporting, team: Finance}
  - {id: a.patel, name: Arjun Patel, role: Finance systems analyst, team: Finance systems}
  - id: rboateng
    name: Rita Boateng
    role: Data engineer
    team: Data
