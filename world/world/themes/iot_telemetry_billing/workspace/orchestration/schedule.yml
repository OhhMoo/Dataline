# Deployment source of truth for the iot_telemetry_billing nightly, all times UTC.
feed_window: {lands_at: "00:30"}
jobs:
  load_usage:
    time: "01:00"
    command: load_iot_telemetry
  finalize_billing:
    after: {job: load_usage, minutes: 10}
    command: build_usage_and_finalize_invoices
    publishes:
      - {target: warehouse.fct_billable_usage, kind: table, consumer: usage_billing_dashboard}
      - {target: warehouse.invoice_run_handoff, kind: table, consumer: enterprise_erp}
      - {target: warehouse.billing_period_lock, kind: table, consumer: billing_close_control}
