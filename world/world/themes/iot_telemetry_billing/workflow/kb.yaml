  - id: mb/architecture/metering-semantics
    title: Counter, delta, and rollup semantics
    parent: mb/architecture
    labels: [metering, reference]
    body: |-
      # Counter, delta, and rollup semantics

      A cumulative counter uses the difference from the prior heartbeat for the
      same device. When the reading decreases, treat it as a reset and count the
      current reading as that heartbeat's usage. Never emit a negative delta.

      A delta event already contains its window usage. A daily edge rollup
      already contains the sum of its source windows. Neither is subtracted from
      its predecessor. Rollup ids are stable across gateway retries.

      Direct and edge devices are disjoint. Usage is attributed to
      `usage_date`; `collected_at` records arrival and drives close lateness.
    version: 3
    author: jlee
    last_edited_by: jlee
    last_edited_at: "-39d 14:20"
    edit_comment: Counter reboot example
    history:
      - {version: 2, at: "-90d 10:00", by: jlee, comment: Rollup idempotency}
