  - id: mb/policies/billing-close
    title: Enterprise billing close policy
    parent: null
    labels: [policy, billing-close]
    body: |-
      # Enterprise billing close policy

      The contract commit is the authority for committed units, monthly minimum,
      overage rate, and grace days. Overage is charged in 1,000-unit blocks with
      a partial block rounded up. Money is calculated in integer cents.

      A customer-month locks when the telemetry collection watermark reaches the
      month-end grace cutoff. Only locked months enter the ERP handoff. Telemetry
      collected at or after the cutoff remains in the usage fact with zero
      billable units and appears in `late_units_excluded`.

      Billing Operations and Revenue Control reconcile the lock and handoff.
      Locked invoices are not rewritten for late telemetry. An approved
      adjustment is posted as a separate memo: Revenue Control approves the
      amount and Billing Operations posts it.
    version: 6
    author: kbennett
    last_edited_by: fdubois
    last_edited_at: "-2d 15:10"
    edit_comment: Memo approval roles
