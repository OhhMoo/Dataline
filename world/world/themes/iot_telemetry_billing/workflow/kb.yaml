pages:
  - id: mb/architecture
    title: Metering and billing architecture
    parent: null
    labels: [architecture]
    body: |-
      # Metering and billing architecture

      Direct devices send cumulative-counter or delta heartbeats. Edge devices
      send non-overlapping daily rollups through store-and-forward gateways.
      Contracts arrive as monthly customer commits.

      At 00:30 UTC the landing flush arrives. `load_usage` rebuilds raw tables
      at 01:00 and `finalize_billing` runs dbt at 01:10. The warehouse exposes
      `fct_billable_usage`, `billing_period_lock`, and `invoice_run_handoff`.
      The Usage and Enterprise Billing dashboard reads those warehouse tables.

      - [Metering semantics](mb/architecture/metering-semantics)
      - [Close policy](mb/policies/billing-close)
    version: 4
    author: mokafor
    last_edited_by: jlee
    last_edited_at: "-18d 10:30"
    edit_comment: Add the three warehouse consumers
