  - id: mb/runbooks/nightly
    title: Nightly metering runbook
    parent: null
    labels: [runbook, on-call]
    body: |-
      # Nightly metering runbook

      Investigate `load_usage` before `finalize_billing`. The loader rereads all
      landed partitions, so a recovered gateway needs no manual backfill command.
      Check rollup ids and original usage-day folders after a multi-day flush.

      A dbt conservation failure means reported or billable units are invalid;
      inspect the raw device sequence. Do not suppress resets or move late rows
      to a different usage date. Rerun the loader and build after the source
      delivery is intact.
    version: 5
    author: mokafor
    last_edited_by: jlee
    last_edited_at: "-12d 15:00"
    edit_comment: Recovered gateway checks
