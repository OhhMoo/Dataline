  - id: fin/subscriptions/revrec-policy
    title: Revenue recognition policy
    parent: fin/subscriptions
    labels: [asc606, revrec, policy]
    body: |-
      # Revenue recognition policy

      Subscription consideration is recognized daily, straight line over the
      service window carried by each subscription event. Amounts are integer
      cents. Positive billing and signed credits are shown separately from
      recognition.

      `warehouse.revrec_close_window` is the account-period ASC-606 subledger.
      Its deferred balance is cumulative net billing less cumulative recognized
      revenue. Periods before the latest materialized period are closed; the
      current period remains open while new daily recognition arrives.

      Source corrections belong in Billing. Do not post manual warehouse
      adjustments to make the dashboard and close packet agree.
    version: 2
    author: a.shah
    last_edited_by: n.ellis
    last_edited_at: "-14d 16:30"
    edit_comment: approve the account-period close rule
    history:
      - {version: 1, at: "-48d 13:45", by: a.shah, comment: null}

  - id: fin/subscriptions/close-calendar
    title: Close calendar and data handoff
    parent: fin/subscriptions
    labels: [close, operations]
    body: |-
      # Close calendar and data handoff

      All times UTC. Source files land at 00:00 on the day after their business
      date. `ingest_webhooks` starts at 01:00, `fold_subscriptions` at 01:10,
      and `revrec_window_close` at 01:20.

      Finance uses the published tables only after the closing job succeeds.
      The detailed operating checks are in `docs/runbook_nightly.md` in the
      revenue-data repository.
    version: 2
    author: t.okafor
    last_edited_by: t.okafor
    last_edited_at: "-28d 16:15"
    edit_comment: publish the three-stage nightly calendar
    history:
      - {version: 1, at: "-60d 09:00", by: t.okafor, comment: null}
