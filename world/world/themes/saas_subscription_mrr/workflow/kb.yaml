  - id: fin/subscriptions/arr-definition
    title: ARR and MRR definition
    parent: fin/subscriptions
    labels: [arr, mrr, current]
    body: |-
      # ARR and MRR definition

      MRR is active seats multiplied by the monthly per-seat contract price.
      ARR is twelve times MRR. Both are contractual run-rate measures, not
      recognized revenue or cash.

      Seat upgrades and downgrades take effect on the event's `effective_date`.
      A churned subscription contributes zero from its effective date, even if
      the cancellation webhook arrives later. Proration charges and credit
      notes never enter MRR directly.

      The Finance dashboard reads `warehouse.dim_account` for the current state
      and `warehouse.fct_mrr_daily` for history.
    version: 4
    author: a.shah
    last_edited_by: t.okafor
    last_edited_at: "-8d 12:10"
    edit_comment: clarify effective-dated churn and credits
