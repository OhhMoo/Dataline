  body: 'Represented disputes can finish won or lost. Reserve release requires a risk
    officer approval and a chargeback ratio below the policy threshold. A payout request
    alone does not authorize release.


    Historical restatements after the cutoff require the domain controller approval
    recorded in the issue tracker.'
