# DW-1 world seed (tasks/DW001-live-revenue). The shocks are NOT declared
# here: they are sampled from tasks/DW001-live-revenue/shock_spec.yaml and
# installed into var/world/live.json after the build, so one built world can
# be replayed under any shock realisation.
theme: revenue_live           # world/world/themes/<name>/
seed: 1
vtime_start: "2026-02-01T00:00:00Z"
days: 30                      # landing partitions dt=2026-02-01 .. dt=2026-03-02
orders_per_day: [40, 60]      # uniform range per day
customers: 500
amount_cents: [500, 20000]    # order amount range, integer cents (no floats)
git_author: "Data Platform <data@example.com>"
