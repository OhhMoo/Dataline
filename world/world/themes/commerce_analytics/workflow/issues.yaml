# commerce_analytics: the analytics team's backlog on the first morning of the
# February close (world clock Monday 2026-03-02T00:00Z).
#
# The pipeline is healthy - every fault ships OFF, every seeded run is green,
# every dbt test passes. The mess is where it usually is in a BI-heavy team: a
# number on a dashboard that does not match a number Finance already sent to
# the board, two people filing it twice, a confident diagnosis that is wrong,
# a postmortem action nobody picked up, and the person who owns the Power BI
# model on leave.
#
# Every number below was measured against a built world (seed.example.yaml),
# never invented. The ones the tickets rest on:
#   January 2026 Net Revenue, data through 2026-02-03 (the close)   2420528.00
#   January 2026 Net Revenue, data through 2026-02-28 (now)         2386405.00
#   difference                                                       34123.00
#   = January orders whose `refunded` version landed in dt=2026-02-04 .. 02-26:
#     20 orders, 34123.00 of order_amount; no cancellations in that window
#   December 2025 Net Revenue at its close (data through 2026-01-05) 3388969.00
#   shipping on completed December orders, same data                  57097.10
#   orders placed 2026-02-01 00:00-08:00 UTC (31 Jan evening Pacific): 6, 20235.00
#   bi_refresh / dbt_build / daily_load runs                         425 each, all success
