  - id: ANA-236
    title: Power BI is shifting late-evening orders into the next month (UTC)
    body: |-
      Orders placed on the evening of 31 January Pacific are showing as
      1 February on Executive Overview, because Power BI converts order dates
      to UTC. That is why January is lower than the close number. We should
      switch the report to Pacific time.
    status: todo
    reporter: sokoro
    assignee: hkowalski
    labels: [executive-overview, timezone]
    created_at: "-3d 09:20"
    updated_at: "-3d 09:20"
    comments: []
    history: []
    links:
      - {type: relates_to, issue: ANA-238}
    authoring:
      kind: confident_wrong
      note: >-
        CA-I9. Stated flatly, linked to the incident, and wrong about the
        incident. Half of it is true: order_date is the UTC calendar date, set
        in dbt (stg_orders casts ordered_at to a date), and 6 orders worth
        20235.00 were placed 00:00-08:00 UTC on 1 Feb. But that has been the
        definition since cutover; those 6 orders were in February on the tile
        Finance closed from too. A fixed definition cannot make the same tile
        read 2420528.00 on 4 Feb and 2386405.00 now. Disprovable from
        raw.orders in one query.

  - id: ANA-238
    title: Exec dashboard revenue doesn't match Finance's close number
    body: |-
      January net revenue on the Executive Overview now says 2,386,405.00.
      When we closed January on 4 February the same tile said 2,420,528.00,
      and that is the number in the board pack.

      Nobody told Finance anything changed. Which number is right? And will
      February move the same way after we close it this week? We sign off
      February on Wednesday.
    status: todo
    reporter: achen
    assignee: null
    labels: [revenue, executive-overview, finance, close]
    created_at: "-3d 08:05"
    updated_at: "-3d 08:40"
    comments:
      - id: ANA-238#1
        author: hkowalski
        at: "-3d 08:40"
        body: |-
          Looking at it Monday with whoever is on call. Nobody touches the
          Power BI model or the metric definitions during the close.
    history: []
    links:
      - {type: relates_to, issue: ANA-205}
    authoring:
      kind: incident_report_lay
      note: >-
        CA-I10. The incident as the controller describes it: a tile, two
        numbers, a deadline. There is no defect in the pipeline. Net Revenue is
        the order's CURRENT status on the order's date (stg_orders keeps the
        latest CDC version), so a refund processed after the close removes the
        order from the closed month. Measured: January read 2420528.00 on data
        through 2026-02-03 and reads 2386405.00 now; the 34123.00 between them
        is exactly 20 January orders whose refunded version landed in
        dt=2026-02-04 .. 2026-02-26. Both numbers are right for when they were
        taken. February WILL move the same way (refunds lag up to 45 days), and
        so will January again, until mid-March. Everything needed is
        raw.orders plus bi_render. The relates_to link points at the wrong
        ticket, because a human added it.

