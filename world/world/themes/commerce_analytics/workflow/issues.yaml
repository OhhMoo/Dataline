  - id: ANA-205
    title: December revenue on Executive Overview is lower than the close pack
    body: |-
      The close pack has December revenue at 3,446,066.10. The Revenue by
      Month tile on Executive Overview says 3,388,969.00 for December this
      morning. Which one is wrong?
    status: wont_do
    reporter: mfischer
    assignee: hkowalski
    labels: [revenue, executive-overview, finance]
    created_at: "-55d 10:12"
    updated_at: "-55d 15:40"
    comments:
      - id: ANA-205#1
        author: hkowalski
        at: "-55d 15:40"
        body: |-
          Neither. The close pack's revenue line includes shipping; Net Revenue
          on the dashboard excludes it by definition. Shipping charged on
          completed December orders is 57,097.10, and 3,388,969.00 + 57,097.10
          = 3,446,066.10 to the cent. Two metrics with the same word in them.
          Closing; ANA-229 is the conversation about whether the tile should
          change.
    history:
      - {at: "-55d 15:40", actor: hkowalski, field: status, from: todo, to: wont_do}
    links: []
    authoring:
      kind: near_duplicate_trap
      note: >-
        CA-I3. The same symptom as ANA-238 - an Executive Overview revenue
        number that does not match Finance's - with a different cause that was
        settled at the time. Measured as of that day's data (dt <= 2026-01-05):
        December Net Revenue 3388969.00, shipping on completed December orders
        57097.10, sum 3446066.10. An agent that pattern-matches "dashboard vs
        Finance" lands on shipping, which cannot explain ANA-238: January's
        number changed between two readings of the SAME tile, and shipping is
        excluded from both. December has itself moved since (later refunds),
        so its tile no longer reads 3388969.00 either.

