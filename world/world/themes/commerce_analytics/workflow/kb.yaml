  - id: ae/policies/month-end-freeze
    title: Month-end freeze
    parent: ae/policies
    labels: [policy, freeze, finance]
    body: |-
      # Month-end freeze

      From business day 1 to business day 3 of each month Finance closes the
      previous month off the Executive Overview. During those three days:

      - no changes to metric definitions (`models/semantic/`), the Power BI
        model, or any published Tableau or Sigma content
      - no re-landing or backfilling partitions of the month being closed
        without the controller's sign-off on the ticket
      - investigating, querying and refreshing dashboards are fine; a refresh
        is not a change

      Definition changes need the controller's sign-off at any time of the
      month, not only during the freeze.

      February 2026: Monday 2 March to Wednesday 4 March, sign-off Wednesday
      17:00 UTC.
    version: 5
    author: hkowalski
    last_edited_by: hkowalski
    last_edited_at: "-6d 09:15"
    edit_comment: February dates
    history:
      - {version: 4, at: "-34d 09:10", by: hkowalski, comment: "January dates"}
      - {version: 3, at: "-120d 10:00", by: achen, comment: "definition changes need sign-off"}
      - {version: 2, at: "-250d 14:20", by: hkowalski, comment: null}
      - {version: 1, at: "-400d 10:05", by: hkowalski, comment: null}
    authoring:
