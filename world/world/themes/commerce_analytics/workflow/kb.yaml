  - id: ae/runbooks/nightly-on-call
    title: "Runbook: nightly on-call"
    parent: ae/runbooks
    labels: [runbook, on-call]
    body: |-
      # Runbook: nightly on-call

      `sched_state` should show `daily_load`, `dbt_build` and `bi_refresh`
      green for the night. Investigate the first failure, not the last.

      ## The extract is late or missing

      The load is a full reload of every partition on disk, so a late
      partition needs no backfill:

      1. Wait for `data/landing/*/dt=<day>/` to appear.
      2. Trigger `daily_load`, then `dbt_build`.
      3. Check `warehouse.fct_orders` has the day.

      The dashboards pick it up at their next scheduled refresh.

      ## dbt build failed

      Read the first failing node in the run's error. A failed test on
      `stg_order_lines` or `assert_order_amount_matches_lines` almost always
      means the order_lines file for the night is short or was delivered
      twice: look at the partition before touching a model. The marts keep
      the previous night's rows until the build passes.

      ## Never

      - hand-edit `raw.*` or `warehouse.*`
      - delete a landed partition without saying so in #data-incidents
    version: 6
    author: tbrennan
    last_edited_by: tbrennan
    last_edited_at: "-75d 09:50"
    edit_comment: dbt test failures
    history:
      - {version: 5, at: "-150d 17:00", by: hkowalski, comment: null}
      - {version: 4, at: "-220d 10:30", by: tbrennan, comment: "full reload"}
      - {version: 3, at: "-300d 11:15", by: tbrennan, comment: null}
      - {version: 2, at: "-380d 09:00", by: hkowalski, comment: null}
      - {version: 1, at: "-420d 09:30", by: tbrennan, comment: null}
    authoring:
      kind: accurate_but_partial
      note: >-
        CA-K6. Correct about the load and dbt, and last edited before the
        January incident: "the dashboards pick it up at their next scheduled
        refresh" is the sentence the team agreed to replace in
        analytics-eng/0002 (trigger bi_refresh by hand after the rerun) and
        never did. The repo's docs/runbook_nightly.md says the same as this
        page, so a cross-check confirms the incomplete version.

