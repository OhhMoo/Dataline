  - id: ae/architecture/data-dictionary
    title: Data dictionary
    parent: ae/architecture
    labels: [reference, warehouse]
    body: |-
      # Data dictionary

      All money is USD, DECIMAL(12,2). All dates are UTC calendar dates.

      ## warehouse.fct_orders - one row per order

      | column | type | |
      |---|---|---|
      | order_id | INTEGER | |
      | order_date | DATE | the UTC date the order was placed |
      | customer_id | INTEGER | -> dim_customer |
      | order_status | VARCHAR | completed, refunded, cancelled - the order's status as of the latest extract |
      | order_amount | DECIMAL(12,2) | merchandise subtotal = sum of the order's lines; excludes shipping |
      | shipping_amount | DECIMAL(12,2) | shipping charged |

      ## warehouse.fct_order_lines - one row per order line

      order_line_id, order_id, product_id, quantity, line_amount (at the price
      paid), and the order's order_date and customer_id carried down.

      ## warehouse.dim_customer

      customer_id, customer_name, segment (Enterprise, SMB, Consumer -
      current), region (NA, EMEA, APAC), signup_date.

      ## warehouse.dim_product

      product_id, product_name, category (Desks, Seating, Accessories,
      Lighting, Services), unit_price - today's list price, not what any
      historical order paid.

      ## warehouse.dim_date

      date_day, year, quarter, month, month_name, week_start (Monday),
      is_weekend. First order to last order, no gaps.
    version: 3
    author: hkowalski
    last_edited_by: lmorales
    last_edited_at: "-70d 10:45"
    edit_comment: unit_price is the current list price
    history:
      - {version: 2, at: "-300d 16:00", by: hkowalski, comment: "dim_date"}
      - {version: 1, at: "-415d 11:00", by: hkowalski, comment: null}
    authoring:
