  - id: ae/postmortems/2026-01-12-stale-dashboards
    title: "Postmortem: stale dashboards, 2026-01-12"
    parent: ae/postmortems
    labels: [postmortem, bi, freshness]
    body: |-
      # Postmortem: stale dashboards, 2026-01-12

      ## What happened

      The shop extract for Sunday 11 January landed at 07:40 instead of 02:00.
      `daily_load` and `dbt_build` ran on time on the 10th's data and
      succeeded. `bi_refresh` ran at 06:00 on the same data and succeeded, so
      every dashboard - Power BI, Tableau and Sigma - showed Saturday.
      Leadership read Saturday's numbers on Monday morning; the
      `orders_stale` alarm fired at 06:07 and nobody looked at the dashboards
      until 09:00.

      ## Why nothing stopped it

      The refresh runs on a clock. Nothing tells it the warehouse is a day
      short, and a refresh of yesterday's data is a successful refresh.

      ## Actions

      1. Run `bi_refresh` on `dbt_build` success instead of at 06:00.
         **Open.** ANA-219.
      2. Log every refresh with the business date it showed, and alarm on how
         old the dashboards' data is. **Merged 27 Feb, ships with the 1 March
         release.**
      3. Add "refresh the dashboards by hand after a rerun" to the on-call
         runbook. **Not done.**

      ## What we still do not know

      How many people read a stale dashboard on a morning nobody noticed.
    version: 3
    author: tbrennan
    last_edited_by: tbrennan
    last_edited_at: "-3d 18:25"
    edit_comment: action 2 merged
    history:
      - {version: 2, at: "-47d 10:00", by: hkowalski, comment: "actions"}
      - {version: 1, at: "-48d 11:00", by: tbrennan, comment: null}
    authoring:
      kind: accurate
      note: >-
        CA-K9. True and current. Action 1 is the unactioned remediation
        (ANA-219); action 3 is the undocumented decision (analytics-eng/0002)
        that the on-call page still lacks; action 2 is why
        raw.bi_refresh_history appears with the first refresh after the world
        clock and not before.

