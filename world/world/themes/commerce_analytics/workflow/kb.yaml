  - id: ae/metrics/net-revenue
    title: Net Revenue and friends
    parent: ae/metrics
    labels: [metrics, definitions]
    body: |-
      # Net Revenue and friends

      The definitions of record are the dbt metrics in
      `dbt_project/models/semantic/metrics.yml`. This page is the plain-English
      version. Every BI tool must agree with the dbt metric; when one does
      not, the BI tool is wrong.

      - **Net Revenue** - merchandise subtotal of orders whose status is
        `completed`, on the order date. Excludes refunded and cancelled
        orders. Excludes shipping.
      - **Gross Revenue** - the same, whatever the status.
      - **Completed Orders** - count of completed orders.
      - **AOV** - Net Revenue / Completed Orders.
      - **Units** - quantity sold, whatever the status.
      - **Revenue LY** - Net Revenue for the same period a year earlier.
      - **YoY Growth** - (Net Revenue - Revenue LY) / Revenue LY.
      - **Revenue YTD** - Net Revenue from 1 January to the date in context.
      - **Shipping Revenue** - shipping charged on completed orders. Finance's
        revenue line is Net Revenue + Shipping Revenue; ours is not.

      Two Executive Overview measures are not in the semantic layer, because
      MetricFlow cannot express them, so each BI model defines its own:
      **Segment Share** (Net Revenue over Net Revenue across all segments;
      Power BI and Tableau - Sigma has no way to say it, so Finance's build
      leaves it out) and **List Price Revenue** (quantity x the product's
      current list price; all three).

      Segments are the account's CURRENT segment: an account upgraded from SMB
      to Enterprise counts as Enterprise for all of its history.
    version: 5
    author: hkowalski
    last_edited_by: hkowalski
    last_edited_at: "-30d 10:40"
    edit_comment: the Tableau and Sigma builds carry their own measures too
    history:
      - {version: 4, at: "-54d 11:30", by: hkowalski, comment: "Finance's revenue line, after ANA-205"}
      - {version: 3, at: "-200d 09:40", by: rdesai, comment: "Segment Share, List Price Revenue"}
      - {version: 2, at: "-250d 15:00", by: hkowalski, comment: "YTD, LY"}
      - {version: 1, at: "-260d 10:10", by: hkowalski, comment: null}
    authoring:
      kind: accurate_but_partial
      note: >-
        CA-K4. Every definition matches metrics.yml exactly. "Status is
        completed" is true and silent on WHEN: the status is the latest one,
        so a closed month loses an order whenever it is refunded. The page
        handles the shipping difference (ANA-205) explicitly and the
        restatement not at all - the gap ANA-238 falls into.

