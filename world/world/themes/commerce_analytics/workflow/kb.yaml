  - id: ae/architecture/analytics-stack
    title: The analytics stack
    parent: ae/architecture
    labels: [architecture, bi]
    body: |-
      # The analytics stack

      ## Nightly, all UTC

      | time | what | where |
      |---|---|---|
      | 02:00 | shop platform drops the day's CDC extract | `data/landing/<entity>/dt=<day>/` |
      | 02:30 | `daily_load` rebuilds `raw.*` from every partition | `loader/load_extracts.py` |
      | 02:40 | `dbt_build` - staging, marts, tests, semantic layer | `dbt_project/` |
      | 06:00 | `bi_refresh` - every dashboard re-reads the marts | `dags/bi_refresh.py` |

      The refresh is its own DAG, on a clock, not downstream of the build. On
      a normal night there are three hours of slack.

      ## Layers

      - `raw` - every version of every record, as landed. VARCHAR.
      - `staging` - views; latest version of each record, typed.
      - `warehouse` - the star schema the dashboards read: `fct_orders`,
        `fct_order_lines`, `dim_customer`, `dim_product`, `dim_date`.
      - Semantic layer - dbt semantic models and metrics in
        `dbt_project/models/semantic/`. The definition of record for every
        metric a dashboard shows.

      ## Dashboards

      The Executive Overview exists three times, one build per BI tool, all
      over the same `Commerce` model: leadership reads it in Power BI, Sales
      rebuilt it in Tableau when they moved there, and Finance rebuilt it in
      Sigma for the close. Each build is a project in the repo, and every one
      of them must agree with the dbt metrics.

      | dashboard | tool | owner | project in the repo |
      |---|---|---|---|
      | Executive Overview | Power BI | Hanna | `bi/powerbi` |
      | Executive Overview (Sales' build) | Tableau | Lucia | `bi/tableau` |
      | Executive Overview (Finance's build) | Sigma | Mia | `bi/sigma` |
      | Sales Overview | Tableau | Lucia | none - edited on the server |
      | Customer Health | Sigma | Sade | none - edited on the server |

      `dbt_project/models/exposures.yml` lists what each one reads.
    version: 6
    author: hkowalski
    last_edited_by: hkowalski
    last_edited_at: "-30d 10:20"
    edit_comment: the three Executive Overview builds
    history:
