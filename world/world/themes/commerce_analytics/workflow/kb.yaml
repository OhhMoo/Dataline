  - id: ae/runbooks/bi-release-process
    title: "Runbook: BI release process"
    parent: ae/runbooks
    labels: [runbook, bi, deploy]
    body: |-
      # Runbook: BI release process

      **Supersedes ae/runbooks/publishing-dashboards, which describes how we
      published before the dashboards moved into the repo.** That page has
      not been retired; follow this one.

      Every dashboard is a project in the repo under `bi/`, changed by pull
      request, checked by CI, and published by tooling. Nobody publishes from
      a desktop client to production. The repo is the source of truth: CI
      republishes main, so anything published that is not committed is
      overwritten by the next merge.

      ## Power BI - `bi/powerbi`

      A PBIP project: the semantic model as TMDL, the report as PBIR. Open the
      `.pbip` in Desktop to edit, commit the text files. Merging to main
      deploys the semantic model to the `Commerce Analytics` workspace through
      the Fabric API (`updateDefinition`) and refreshes it through the Power
      BI REST API. It is an import model: what the report shows is the last
      refresh.

      ## Tableau - `bi/tableau`

      The published data source and the workbook as XML
      (`datasources/*.tds`, `workbooks/*.twb`). CI signs in to the default
      site with the service account's personal access token and publishes
      with tabcmd:

          tabcmd login --server "$TABLEAU_SERVER_URL" --token-name "$TABLEAU_PAT_NAME" --token-value "$TABLEAU_PAT_SECRET"
          tabcmd publish bi/tableau/datasources/Commerce.tds --name Commerce --overwrite

      The workbooks read the published data source, so a data source change
      needs no workbook publish. The connection is live; there is no extract
      to refresh.

      ## Sigma - `bi/sigma`

      Each file is what the Sigma API returns for the document, and CI
      publishes it back the same way: a workbook with
      `PUT /v2/workbooks/{workbookId}/contents`, the data model with
      `PUT /v2/dataModels/{dataModelId}/spec`, after `POST /v2/auth/token`
      with the API client's credentials. Live connection, nothing to refresh.

      ## By hand, in an incident

      On call can run the same steps from a checkout of main with the
      variables in `.envrc`. Commit first, publish what you committed, and
      check the published numbers afterwards - not your local files.

      ## Refreshes are not releases

      Publishing a Tableau or Sigma change shows at once. The legacy SQL
      dashboards are refreshed by the 06:00 `bi_refresh` job
      (`dags/bi_refresh.py`); trigger it if a change has to show before then.

      ## Checks before you merge

      - Measures agree with the dbt metric of the same name
        (`dbt_project/models/semantic/metrics.yml`).
      - The PR names the exposure it changes (`models/exposures.yml`).
      - Not during a close: see ae/policies/month-end-freeze.
    version: 3
    author: hkowalski
    last_edited_by: hkowalski
    last_edited_at: "-30d 11:05"
    edit_comment: how each tool is published, and the by-hand path
    history:
      - {version: 2, at: "-38d 14:00", by: hkowalski, comment: "written up after the third hand publish got overwritten"}
      - {version: 1, at: "-38d 11:20", by: hkowalski, comment: null}
