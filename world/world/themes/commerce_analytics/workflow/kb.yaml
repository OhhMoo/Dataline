      # Runbook: publishing dashboards

      ## Power BI (Executive Overview)

      1. Open `Executive Overview.pbix` from the Analytics shared drive.
      2. Refresh in Desktop and check the KPI cards against last week.
      3. File > Publish > the `Commerce` workspace. Overwrite.

      ## Tableau (Sales Overview)

      Publish from Desktop to the `commerce` site with "Embed password" ticked
      for the warehouse connection, or the extract refresh fails at 06:00.

      ## Sigma (Customer Health)

      Edit the workbook in place and Publish.

      Tell #bi-requests when you publish anything.
