name: commerce_analytics
version: "1.0.0"
config-version: 2
# the profile name is shared with every other project on the platform; the
# outputs differ (config/profiles.yml here, ~/.dbt for a bare `dbt`).
profile: world_dbt
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  commerce_analytics:
    # staging: one view per raw entity, latest version of each record, typed.
    staging: {+materialized: view, +schema: staging}
    # marts: the star schema every dashboard reads. Tables, not views - the BI
    # tools query these all day and a view would re-run the CDC dedupe on
    # every tile.
    marts: {+materialized: table, +schema: warehouse}
