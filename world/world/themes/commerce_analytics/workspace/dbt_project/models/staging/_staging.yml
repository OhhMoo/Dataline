version: 2

models:
  - name: stg_orders
    description: Orders, typed, one row per order at its latest status.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
      - name: order_status
        data_tests:
          - accepted_values:
              arguments: {values: [completed, refunded, cancelled]}
      - name: order_amount
        description: Merchandise subtotal. Excludes shipping. Equals the sum of the order's lines.
        data_tests: [not_null]
      - name: shipping_amount
        data_tests: [not_null]
      - name: currency
        description: Always USD today. Nothing downstream converts; a second currency would be summed as if it were dollars.
        data_tests:
          - accepted_values:
              arguments: {values: [USD]}

  - name: stg_order_lines
    description: Order lines, typed. Immutable at the source.
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_orders'), field: order_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_products'), field: product_id}
      - name: quantity
        data_tests: [not_null]

  - name: stg_customers
    description: Accounts, latest version (SCD1).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments: {values: [Enterprise, SMB, Consumer]}
      - name: region
        data_tests:
          - accepted_values:
              arguments: {values: [NA, EMEA, APAC]}

  - name: stg_products
    description: Catalogue, latest version. unit_price is today's list price.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments: {values: [Desks, Seating, Accessories, Lighting, Services]}
