version: 2

# What reads the marts, so `dbt ls --select +exposure:executive_overview` is
# the blast radius of a change. The vendor projects themselves live under
# bi/ at the repo root (bi/README.md); the urls are the published copies.

exposures:
  - name: executive_overview
    label: Executive Overview
    type: dashboard
    maturity: high
    url: https://powerbi.internal/groups/commerce-analytics/reports/executive-overview
    description: >
      The leadership dashboard (Power BI, bi/powerbi). KPIs, revenue by month
      against last year, revenue by segment, top products, and a regions page.
      Finance pulls the monthly Net Revenue for the close pack from here.
      Refreshes 06:00 UTC daily.
    depends_on:
      - ref('fct_orders')
      - ref('fct_order_lines')
      - ref('dim_customer')
      - ref('dim_product')
      - ref('dim_date')
      - metric('net_revenue')
      - metric('aov')
      - metric('yoy_growth')
    owner:
      name: Hanna Kowalski
      email: hanna.kowalski@example.com
    config:
      tags: [powerbi, tier-1]

  - name: sales_overview
    label: Sales Overview
    type: dashboard
    maturity: high
    url: https://tableau.internal/#/site/commerce/views/SalesOverview/Overview
    description: >
      Sales leadership's dashboard (Tableau, bi/tableau). Revenue and orders by
      region, category and month; top accounts. Extract refresh 06:00 UTC daily.
    depends_on:
      - ref('fct_orders')
      - ref('fct_order_lines')
      - ref('dim_customer')
      - ref('dim_product')
      - ref('dim_date')
    owner:
      name: Lucia Morales
      email: lucia.morales@example.com
    config:
      tags: [tableau, tier-1]

  - name: customer_health
    label: Customer Health
    type: dashboard
    maturity: medium
    url: https://sigma.internal/commerce/workbook/Customer-Health
    description: >
      Account-level workbook (Sigma, bi/sigma) used by sales ops: new accounts,
      order frequency and refund rate by segment. Live connection, no extract.
    depends_on:
      - ref('fct_orders')
      - ref('dim_customer')
      - ref('dim_date')
    owner:
      name: Sade Okoro
      email: sade.okoro@example.com
    config:
      tags: [sigma]

  - name: finance_close_pack
    label: Finance close pack
    type: analysis
    maturity: low
    url: https://sigma.internal/commerce/workbook/Finance-Close-Pack
    description: >
      Finance's month-end workbook. Copies Net Revenue and Shipping Revenue for
      the closed month out of the warehouse on business day 3; what it holds
      after that is a snapshot, not a live number.
    depends_on:
      - ref('fct_orders')
      - ref('dim_date')
      - metric('net_revenue')
      - metric('shipping_revenue')
    owner:
      name: Amy Chen
      email: amy.chen@example.com
    config:
      tags: [sigma, finance]
