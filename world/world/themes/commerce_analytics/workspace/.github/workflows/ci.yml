name: ci

on: [push, pull_request]

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # parse validates the semantic layer as well as the models: a metric
      # that references a missing measure fails here, not in a dashboard.
      - name: dbt parse + dag check
        run: ./run.sh check
        env:
          DBT_TARGET: ci
      - name: semantic layer
        run: ./run.sh sl
        env:
          DBT_TARGET: ci
