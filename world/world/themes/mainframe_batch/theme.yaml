name: mainframe_batch
dbt_profile: world_dbt

# Job `publishes` targets enter var/world/live.json only when the seed sets
# publish_receipts: true. seed.example.yaml turns that on; historical seeds
# omit it, so their fingerprinted live section stays as it was.
publication_opt_in: true

# The human-context plane (gateway/SURFACES.md#workflow). Content is data, in
# workflow/{users,issues,chat,kb}.yaml; timestamps are offsets from the world
# clock ("-12d 09:15"), resolved at build time.
#
# An insurer's claims platform runs its work through an ITSM queue, not a
# developer tracker: an incident is raised, assigned, worked, and then waits on
# a change record before anybody may touch production. `pending_change` is the
# status that makes the change-control constraint representable at all.
workflow:
  dir: workflow
  actor: agent                  # the id the agent writes as (workflow_actor)
  project: {key: CLM, name: Claims data services}
  statuses: [new, assigned, work_in_progress, pending_change, resolved, closed]
  workspace: policymaster-ops
  space: {key: BATCH, name: Batch operations}

jobs:
  nightly_extract:
    command: extract_claims
    duration_s: 300
    time: "23:00"
    day_offset: 0
    after: null
    detail: "dt={day}"
    # The extract itself is produced by the arrival stream (that is what the
    # system of record does, and it is outside the batch window we model), so
    # this job verifies the delivery rather than creating it: a real count of
    # real files, and a real failure when TONIGHT's extract did not arrive.
    #
    # `{day}` is the execution day in ISO, which is the dialect this landing
    # tree speaks - gen.write_day writes dt=<YYYY-MM-DD>/CLAIMS.DAT from the
    # data day (gen.py:60) - and day_offset: 0 means the 23:00 job is looking
    # for the extract cut at 23:00 that same night. Arrivals sort before jobs
    # at the same instant, so on an unfaulted night the file is already there.
    #
    # The pattern used to be `dt=*/CLAIMS.DAT` with min: 1 over a CUMULATIVE
    # tree, so from the second night onward the count could not fall below the
    # minimum and the scan could not fail - which made this theme's
    # `late_arrival` fault, shipped enabled, cost nothing a scheduler could
    # see. min: 1 stays meaningful now that the glob names one night: a night
    # delivers exactly one CLAIMS.DAT, and zero is the failure.
    exec:
      kind: scan
      path: data/landing/claims_extract
      pattern: "dt={day}/CLAIMS.DAT"
      min: 1
  batch_load:
    command: load_claims_extract
    duration_s: 120
    after: {job: nightly_extract, minutes: 45}
    detail: null
    # Runs the workspace's own loader/load_extract.py through the theme hook.
    exec:
      kind: theme
      op: load_raw
      args: [workspace, db]
      tables: [raw.claims_extract]
    publishes:
      - {target: raw.claims_extract, kind: table, consumer: dbt_marts}
  dbt_build:
    command: dbt_build
    duration_s: 90
    after: {job: batch_load, minutes: 10}
    detail: null
    exec:
      kind: dbt
      command: build
      tables: [warehouse.fct_claims_daily]
    publishes:
      - {target: warehouse.fct_claims_daily, kind: table, consumer: claims_daily_dashboard}

live:
  params: [seed, claims_per_day, customers, amount_cents]
  # the extract for day D is cut at D 23:00, just as the nightly job starts;
  # arrivals sort before jobs at the same instant, so the file is there.
  arrival:
    name: claims_extract
    op: write_day
    at: {day_offset: 0, time: "23:00"}

  # The backstory carries the catalogue too. A batch window that is never
  # missed is not a batch window, and one that has never been missed UNTIL
  # tonight is not a batch shop - so batch_overrun (0.20) and batch_abend
  # (0.06) draw over the seeded nights as well, and the run history opens on a
  # load that has overrun several times and abended at least once. That is the
  # scar tissue an operator reads before deciding tonight is different.
  # Arrival faults contribute nothing here; see extract_late.
  faults_in_history: true

  # ------------------------------------------------------------------
  # Seeded fault layer. mainframe_batch ships ENABLED: the batch window is the
  # whole subject of this theme, and a batch window that is never missed is not
  # a batch window.
  # ------------------------------------------------------------------
  faults:
    # The extract is cut 90 minutes late.
    #
    # MEASURED, both before and after. BEFORE the scan was day-scoped this
    # fault was inert: nightly_extract globbed `dt=*/CLAIMS.DAT` across a
    # cumulative tree with min: 1 and counted 30+ older partitions, so it
    # SUCCEEDED on a night whose extract had been deferred past it, and the
    # night's only signature was batch_load's effects (rows_after ==
    # rows_before) and the claim day landing one night behind. AFTER: the same
    # occurrence counts 0 files matching `dt=<that night>/CLAIMS.DAT` and
    # FAILS.
    #
    # `missed_by: [nightly_extract]` is that measurement written down, and
    # `missed_error` is the executor's own message with `{day}` resolved per
    # night, so the backstory quotes what the live path produces. batch_load is
    # NOT named: it is a theme load_raw hook that reloads every partition it
    # finds and succeeds with one night fewer in it.
    - id: extract_late
      kind: late_arrival
      enabled: true
      rate: 0.15
      params:
        delay_minutes: 90
        missed_by: [nightly_extract]
        missed_error: "data/landing/claims_extract holds 0 file(s) matching dt={day}/CLAIMS.DAT, expected at least 1"
    # 120s nominal, 8x = 16 minutes, which reaches past the 10-minute gap to
    # dbt_build: the load is still recorded as running when the build starts.
    # Overlapping windows in the run history; the execution itself is strictly
    # sequential, because nothing here is allowed to race.
    - id: batch_overrun
      kind: job_overrun
      enabled: true
      rate: 0.20
      jobs: [batch_load]
      params: {multiplier: 8}
    # A classic abend: the step is cancelled at the window boundary having
    # produced nothing.
    - id: batch_abend
      kind: job_timeout
      enabled: true
      rate: 0.06
      jobs: [batch_load]
      params: {timeout_s: 1800,
               error: "IEF450I STEP ABEND S322 - job cancelled at the window boundary"}
    # Declared and off: CLAIMS.DAT is fixed-block, so truncating it leaves a
    # partial 31-byte record, and the copybook reader is entitled to raise
    # rather than round-trip it. Real, but a rougher edge than the CSV themes -
    # and it does not heal, since nothing rewrites the truncated file. That is
    # why the backstory never carries torn_write (faults.py,
    # HISTORY_ARRIVAL_KINDS): the built landing zone is whole.
    - id: extract_torn
      kind: torn_write
      enabled: false
      rate: 0.08
      params: {match: "CLAIMS.DAT", keep_fraction: 0.6}
    - id: batch_partial
      kind: partial_write
      enabled: false
      rate: 0.05
      jobs: [batch_load]
      params: {table: raw.claims_extract, partition_column: dt,
               order_column: claim_id, keep_fraction: 0.5}
