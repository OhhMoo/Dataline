# Verification pipeline. This is not a deployment pipeline: releases are cut
# from a tag by the release job in the platform group, not from here.

stages:
  - verify

default:
  image: python:3.11-slim
  before_script:
    - pip install --quiet -r requirements.txt

verify:
  stage: verify
  script:
    - ./run.sh check
  variables:
    DBT_TARGET: ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

