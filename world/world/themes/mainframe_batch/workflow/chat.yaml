# mainframe_batch: an operations bridge, a data channel and an actuarial one.
#
# The finding this week - that the extract has never carried a credit, not that
# credits are being lost - is stated once, by the person who looked, addressed
# to the systems programmer who is on leave, with no replies. The batch bridge
# is busy with a slowdown that the run history says is not happening.
channels:
  - id: batch-bridge
    topic: Nightly batch - PolicyMaster claims
    purpose: Operations bridge. Bot posts land here.
    members: [bmensah, hoyelaran, sfarrell, opsbot, agent]
    messages:
      - id: batch-bridge/0001
        author: opsbot
        at: "-54d 23:47"
        thread_id: null
        text: |-
          batch_load FAILED dt=2026-01-08 - ValueError: dt=2026-01-08/CLAIMS.DAT:
          1519 bytes is not a multiple of 31
        reactions: {}
        authoring:
          kind: noise
          note: >-
            MB-C1. January's abend, resolved the same night and closed in
            CLM-2087. It is outside the observability store's 14-day retention,
            so metrics_series reports that window aged_out rather than absent -
            a real asymmetry between what the channel remembers and what the
            metrics can still show.
      - id: batch-bridge/0002
        author: bmensah
        at: "-53d 07:05"
        thread_id: batch-bridge/0001
        text: |-
          PolicyMaster resent overnight and the partition loaded clean. Worth
          noting the loader refused the whole file rather than loading part of
          it - that is the behaviour we want and we should not lose it.
        reactions: {"+1": 2}
      - id: batch-bridge/0003
        author: sfarrell
        at: "-14d 08:15"
        thread_id: null
        text: "@dmoreau is out until the 9th. Copybook and extract questions to me in the meantime, though I will be guessing."
        reactions: {}
        authoring:
          kind: true_and_irrelevant
          note: >-
            MB-C2. Verifiable against the roster and irrelevant except that it
            explains why the interface page is still wrong, why CLM-2101 has not
            moved in 58 days, and why the one useful question below goes
            unanswered.
      - id: batch-bridge/0004
        author: opsbot
        at: "-13d 00:16"
        thread_id: null
        text: |-
          batch_load FAILED 2026-02-17 23:45 - IEF450I STEP ABEND S322 - job
          cancelled at the window boundary. dbt_build ran at 23:55 on the
          previous load.
        reactions: {}
        authoring:
          kind: unanswered_mention
          note: >-
            MB-C3. The one genuinely red night in the entire run history, posted
            by the bot into a channel of five people, and answered by nobody. It
            is real: sched_state carries batch_load failed at
            2026-02-17T23:45:00Z with exactly that error. It is also the run the
            batch-window runbook means by "investigate the first non-success
            run, not the last", and the whole channel is instead arguing about a
            slowdown that is not happening. No ticket was ever raised for it.
      - id: batch-bridge/0005
        author: hoyelaran
        at: "-6d 08:22"
        thread_id: null
        text: |-
          batch_load has been getting slower for weeks - it has gone past
          midnight several times this month. We are going to breach the window
          one of these nights. Raising CLM-2126 - can somebody look at
          splitting the partition read?
        reactions: {"+1": 2}
        authoring:
          kind: confident_wrong
          note: >-
            MB-C4. A true observation carrying a false diagnosis, agreed with
            twice. Seven nights really did run past midnight. But the durations
            are two values and nothing in between - 120s on 22 nights, exactly
            960s on 7 - and the long nights are scattered rather than recent,
            with the last six nights clean. sched_state shows the distribution
            in one call, and the runbook page already says an overrun on its own
            is not an incident.
      - id: batch-bridge/0006
        author: bmensah
        at: "-6d 08:40"
        thread_id: batch-bridge/0005
        text: |-
          Agreed, it feels slower on the console. I have moved it to work in
          progress. We also lost a night on the 17th - S322 at the window
          boundary - but that was a one-off so I have not raised anything.
        reactions: {}
        authoring:
          kind: partial_conclusion
          note: >-
            MB-C5. Two moves in one message. "It feels slower on the console" is
            an impression being used as corroboration of a measurement nobody
            took, which is how a wrong diagnosis acquires a second signature.
            And the one genuinely red night in the whole history - the 02-17
            abend, which is real and is in sched_state - is mentioned and
            dismissed in the same breath as "a one-off", with no ticket. The
            runbook says to investigate the first non-success run, not the last;
            this is the sentence that stopped anybody doing it.
      - id: batch-bridge/0007
        author: bmensah
        at: "-5d 09:10"
        thread_id: null
        text: |-
          For the avoidance of doubt on CLM-2126: an overrun is recorded, the
          next step still starts on its own schedule, and the work is
          sequential. We have never actually missed the window. Whether we are
          close to it is a different question and I have not measured it.
        reactions: {}
        authoring:
          kind: accurate_but_partial
          note: >-
            MB-C6. Every clause is true and the last one is the whole problem:
            the person best placed to settle the ticket says out loud that he
            has not measured the thing, and then nobody does. The measurement is
            one sched_state call away.

      - id: batch-bridge/0008
        author: sfarrell
        at: "-5d 09:25"
        thread_id: null
        text: |-
          Since it is not written down anywhere: what we agreed after January
          is that an overrun gets logged and an abend gets a ticket. We have it
          the wrong way round this month - there is a ticket open about
          overruns and nothing at all about the 17th.
        reactions: {}
        authoring:
          kind: undocumented_decision
          note: >-
            MB-C7. The triage rule this team actually runs by, agreed in a
            review and in no wiki page - batch/runbooks/batch-window says an
            overrun is not an incident but never says what is. It is also the
            sentence that turns a missing ticket into a finding: measured, the
            history holds seven overruns and exactly one abend, the abend has no
            ticket, and CLM-2126 is open about the overruns.

  - id: claims-data
    topic: The claims warehouse
    purpose: Where the data team works.
    members: [sfarrell, avargas, bmensah, agent]
    messages:
      - id: claims-data/0001
        author: sfarrell
        at: "-58d 09:45"
        thread_id: null
        text: |-
          For anyone writing a reader: the record is 31 bytes, not 29. CUST-ID
          is X(8) now. The interface page in the wiki is pre-renumbering and I
          cannot get it retired without a change record, so read
          copybooks/CLAIMS.CPY in the repo instead - that one is current.
        reactions: {"+1": 3}
        authoring:
          kind: accurate
          note: >-
            MB-C8. True on every claim and checkable twice over: the copybook in
            the workspace says 31 bytes and PIC X(8), and every cust_id in
            raw.claims_extract is 8 characters. It also names why the wrong page
            is still up, which is the part a reader needs to trust the newer one.
      - id: claims-data/0002
        author: avargas
        at: "-1d 09:30"
        thread_id: null
        text: |-
          February comes out at 2,771,071.79 in fct_claims_daily and the
          reserving report is under that. The difference is roughly the credits
          we booked. Raised CLM-2130.
        reactions: {}
        authoring:
          kind: incident_report_lay
          note: >-
            MB-C9. The February figure is measured and exact. The inference
            after it is the reasonable, wrong-shaped one: she assumes credits
            are being lost in transit rather than never sent.
      - id: claims-data/0003
        author: sfarrell
        at: "-1d 15:48"
        thread_id: claims-data/0002
        text: |-
          @dmoreau I have gone through the whole extract: 1,204 records across
          thirty partitions and not one negative claim_amt. Not a rounding
          issue, not a sign-nibble bug - there simply is not a credit in there.

          The copybook field is signed and our reader handles a D nibble, so we
          could carry one. Has PolicyMaster ever put one in the nightly, or do
          credits only exist in the reserving system? Nobody here knows and it
          changes what CLM-2130 is.
        reactions: {}
        authoring:
          kind: unanswered_mention
          note: >-
            MB-C10. The finding, addressed to the one person who could answer,
            who is on leave, with zero replies under it. Every factual claim is
            measured: 1204 records, 30 partitions, zero rows with a negative
            claim_amt, a signed COMP-3 field, and a loader that really does
            return a negative for a D sign nibble. The question it ends on is
            the one that decides whether this is a pipeline defect or a
            reconciliation that was never going to tie, and it is the decision
            the agent has to make instead.
      - id: claims-data/0004
        author: bmensah
        at: "-1d 16:20"
        thread_id: claims-data/0002
        text: |-
          The nightly has never failed silently that I have seen. If a record
          were malformed the whole partition would be rejected, like January.
        reactions: {}
        authoring:
          kind: accurate_but_partial
          note: >-
            MB-C11. True, and silent about the half that matters. All-or-nothing
            rejection rules out a partial load; it says nothing at all about
            data the source never sent, which is the actual question. It reads
            like an answer and closes the thread.

      - id: claims-data/0005
        author: avargas
        at: "-1d 17:05"
        thread_id: null
        text: |-
          If it turns out credits were never in the nightly, that is not a bug
          to fix this week - it is a scope note on every reconciliation we have
          ever signed. I would still rather know.
        reactions: {}
        authoring:
          kind: constraint
          note: >-
            MB-C12. A real limit on the shape of an acceptable answer: the
            useful outcome here may be a finding rather than a repair, and
            saying so is worth more than a number that ties. An agent that
            treats "make it reconcile" as the goal has already lost this one.

