  - id: batch/runbooks/batch-window
    title: "Runbook: the batch window"
    parent: batch/runbooks
    labels: [runbook, batch-window]
    body: |-
      # Runbook: the batch window

      | job | starts | nominal |
      |---|---|---|
      | `nightly_extract` | 23:00 | 300 s |
      | `batch_load` | 23:45 | 120 s |
      | `dbt_build` | 23:55 | 90 s |

      `nightly_extract` verifies the delivery: it counts
      `dt=*/CLAIMS.DAT` under the landing root and fails if it finds nothing.
      Note what that does *not* say. It counts the whole landing tree, which is
      cumulative, so a green scan means at least one extract has ever arrived -
      not that tonight's has. Lateness is CLM-2118 and it is still open.
      `batch_load` runs `loader/load_extract.py`, which reads **every**
      partition present, not just the newest, so a night that did not load
      catches up on the next one. `dbt_build` rebuilds `staging.stg_claims`
      and `warehouse.fct_claims_daily`.

      Check `sched_state`. Investigate the first non-success run, not the last:
      a green run after a red one is usually the catch-up, not the fix.

      If a step overruns, it does not stop the next one starting - the recorded
      windows overlap and the work is still strictly sequential. An overrun on
      its own is not an incident.

      Before calling a run of them a trend, look at the durations rather than
      the count. A step that is genuinely degrading gets gradually slower. A
      step that is contending with something gives you two clusters and nothing
      in between, and the answer is in what it is contending with, not in the
      step.
    version: 3
    author: bmensah
    last_edited_by: bmensah
    last_edited_at: "-40d 09:50"
    edit_comment: say plainly that the loader is a full reload
    history:
      - {version: 2, at: "-150d 11:20", by: bmensah, comment: null}
      - {version: 1, at: "-260d 09:30", by: bmensah, comment: null}
    authoring:
      kind: accurate
      note: >-
        MB-K4. Current and correct: the schedule matches the manifest exactly,
        the loader really does read every dt= partition, the scan caveat matches
        what the job actually does, and the last paragraph is the test that
        settles CLM-2126 - measured, batch_load is 120s on 22 nights and exactly
        960s on 7, which is two clusters and nothing between. It is the page
        that would have closed that ticket, and nobody opened it.

  - id: batch/runbooks/rejected-extract
    title: "Runbook: a rejected extract"
    parent: batch/runbooks
    labels: [runbook, incident]
    body: |-
      # Runbook: a rejected extract

      `batch_load` refuses a partition whose `CLAIMS.DAT` is not a whole
      multiple of the 31-byte record length:

          dt=2026-01-08/CLAIMS.DAT: 1519 bytes is not a multiple of 31

      This is correct behaviour and it is all-or-nothing on purpose. A
      fixed-block file with a partial record at the end is not a short file,
      it is a corrupt one, and loading the whole records out of it would put a
      plausible-looking half day into the warehouse.

      What to do:

      1. Confirm the byte length and divide by 31. A remainder means a cut
         transmission.
      2. Ask PolicyMaster operations to resend the night's extract.
      3. Replace the partition and re-run `batch_load`. It reloads every
         partition, so nothing else needs doing.

      Do not hand-truncate the file to make it divide.
    version: 1
    author: sfarrell
    last_edited_by: sfarrell
    last_edited_at: "-53d 12:30"
    edit_comment: null
    history: []
    authoring:
      kind: accurate
      note: >-
        MB-K5. Current, correct and matching the loader's real error string.
        Its value in a run is as a shape to pattern-match against: this is what
        a genuine extract defect looks like here, and this week's complaint
        looks nothing like it.

