  - id: batch/policies/change-control
    title: Change control
    parent: batch/policies
    labels: [policy, change]
    body: |-
      # Change control

      Anything that alters what crosses an interface needs a change record and
      a CAB slot. That includes:

      - the copybook, the extract JCL and our reader
      - the batch schedule and any job's timeout
      - retiring or replacing a page in the interface catalogue, because
        downstream teams code against it

      It does **not** include reading, querying, re-running a failed step, or
      replacing a partition with a corrected resend of the same layout.

      The March CAB is the next window. CHG-4471 (widen CLAIM-AMT) is in it.

      Nobody changes a record layout unilaterally, including in an emergency.
      If the extract is wrong, we take the night's loss and fix it in the
      window.
    version: 5
    author: hoyelaran
    last_edited_by: hoyelaran
    last_edited_at: "-19d 15:40"
    edit_comment: add the interface-catalogue clause
    history:
      - {version: 4, at: "-120d 10:30", by: hoyelaran, comment: null}
      - {version: 3, at: "-180d 14:00", by: bmensah, comment: null}
      - {version: 2, at: "-220d 09:10", by: hoyelaran, comment: null}
      - {version: 1, at: "-260d 09:50", by: hoyelaran, comment: null}
    authoring:
      kind: constraint
      note: >-
        MB-K6. The real limit on the shape of an acceptable solution, and the
        page that explains a fact an agent would otherwise read as neglect: the
        wrong interface page is still up because taking it down is a change.
        The second list matters as much as the first - reading, querying and
        re-running are explicitly allowed, so the constraint does not make the
        world unworkable, it makes one class of answer unavailable.

