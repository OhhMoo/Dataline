# mainframe_batch: the interface catalogue, and the reason a wrong page stays
# up in a shop with change control - retiring a page is itself a change.
#
# The contradiction here is settleable from primary source rather than from
# recency alone: copybooks/CLAIMS.CPY is in the agent's own workspace, and the
# data agrees with it (every cust_id is 8 characters, every partition divides
# by 31). A reader who opens the copybook needs nothing else. A reader who
# trusts the interface catalogue slices the amount out of the wrong offset.
