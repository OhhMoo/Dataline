  - id: batch/postmortems/2026-01-08-short-extract
    title: "Postmortem: short extract, 2026-01-08"
    parent: batch/postmortems
    labels: [postmortem, extract]
    body: |-
      # Postmortem: short extract, 2026-01-08

      ## What happened

      The night's `CLAIMS.DAT` was 1519 bytes. 1519 is not a multiple of 31, so
      `batch_load` raised and the partition did not load. PolicyMaster resent
      the following morning and the next night's run caught the day up.

      ## Why it was caught

      Because the record length is fixed and the loader checks it. That is the
      only assertion anywhere in this pipeline, and it is a structural one -
      it says nothing about whether the *contents* are right.

      ## Actions

      1. Alert on a late extract rather than on the downstream miss.
         **Open.** CLM-2118.
      2. Ask PolicyMaster operations to confirm the record count in the
         transmission trailer. Not started; there is no trailer.

      ## What we still do not know

      We have never reconciled a month of this extract against the reserving
      system, so we do not know whether the nightly is a complete picture of a
      claim's life or only the openings. Nobody has asked for that and it would
      take a week.
    version: 2
    author: sfarrell
    last_edited_by: sfarrell
    last_edited_at: "-53d 13:05"
    edit_comment: record the open action
    history:
      - {version: 1, at: "-53d 11:50", by: sfarrell, comment: null}
    authoring:
      kind: accurate_but_partial
      note: >-
        MB-K7. True, and silent about the half that matters. "It says nothing
        about whether the contents are right" and the closing paragraph - never
        reconciled against reserving, may only be openings - are this week's
        answer, written seven weeks early by somebody who did not know they were
        writing it. An agent that reads postmortems is handed the shape of
        CLM-2130 before it starts.
