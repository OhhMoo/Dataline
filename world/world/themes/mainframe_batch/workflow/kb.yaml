  - id: batch/interfaces/policymaster-claims
    title: PolicyMaster claims extract
    parent: batch/interfaces
    labels: [interface, policymaster]
    body: |-
      # PolicyMaster claims extract

      One extract per night from the claims system of record, cut at 23:00 and
      delivered to `data/landing/claims_extract/dt=YYYY-MM-DD/CLAIMS.DAT`.

      Fixed block, **29 bytes** per record, no record delimiters. Character
      fields are code page 037 (EBCDIC).

      | field | picture | bytes |
      |---|---|---|
      | CLAIM-ID | PIC X(10) | 10 |
      | CLAIM-DATE | PIC 9(8) | 8 |
      | CUST-ID | PIC X(6) | 6 |
      | CLAIM-AMT | PIC S9(7)V99 COMP-3 | 5 |

      CLAIM-AMT is packed decimal with two implied decimal places, so the
      value on the file is in cents.

      To read a record, slice at offsets 0, 10, 18 and 24.
    version: 4
    author: dmoreau
    last_edited_by: dmoreau
    last_edited_at: "-148d 11:30"
    edit_comment: correct the COMP-3 description
    history:
      - {version: 3, at: "-198d 14:10", by: dmoreau, comment: null}
      - {version: 2, at: "-230d 09:40", by: bmensah, comment: null}
      - {version: 1, at: "-260d 09:10", by: dmoreau, comment: null}
    authoring:
      kind: stale
      contradicts: [batch/interfaces/claims-record-layout]
      note: >-
        MB-K2. Published, 148 days untouched, and pre-renumbering: CUST-ID is
        X(8) and the record is 31 bytes. Everything else on the page is right,
        which is what makes it dangerous - the COMP-3 paragraph is correct and
        the offsets are not. Three independent refutations exist:
        copybooks/CLAIMS.CPY in the workspace, the 8-character cust_id values in
        raw.claims_extract, and any partition's byte length (dt=2026-02-16 is
        1550, which is 50 x 31 and is not divisible by 29). CLM-2101 asks for
        this page to be retired and has not moved in 58 days, because retiring
        it is itself a change.

  - id: batch/interfaces/claims-record-layout
    title: Claims record layout (current)
    parent: batch/interfaces
    labels: [interface, policymaster, current]
    body: |-
      # Claims record layout (current)

      **This supersedes the layout table in
      batch/interfaces/policymaster-claims, which is pre-renumbering and has
      CUST-ID at X(6).** That page is still published because retiring it needs
      an interface-catalogue change record (CLM-2101).

      The authority is `copybooks/CLAIMS.CPY` in the repository. If this page
      and the copybook ever disagree, the copybook is right.

      Fixed block, **31 bytes**, no record delimiters, cp037 for character
      fields.

      | field | picture | offset | bytes |
      |---|---|---|---|
      | CLAIM-ID | PIC X(10) | 0 | 10 |
      | CLAIM-DATE | PIC 9(8) | 10 | 8 |
      | CUST-ID | PIC X(8) | 18 | 8 |
      | CLAIM-AMT | PIC S9(7)V99 COMP-3 | 26 | 5 |

      CLAIM-AMT is signed packed decimal: nine digits and a sign nibble in five
      bytes, two implied decimals. The sign nibble is C or F for positive and D
      for negative, so **the field can carry a credit**. Our reader decodes D
      as negative.

      A quick check on any partition: its byte length must divide by 31.
    version: 2
    author: dmoreau
    last_edited_by: dmoreau
    last_edited_at: "-22d 10:15"
    edit_comment: spell out the sign nibble
    history:
      - {version: 1, at: "-58d 09:05", by: dmoreau, comment: null}
    authoring:
      kind: current_and_contradicting
      contradicts: [batch/interfaces/policymaster-claims]
      note: >-
        MB-K3. The page that wins, saying so in its own first line, 22 days old
        against the other page's 148, and naming its primary source rather than
        asking to be believed. The sign-nibble paragraph is the one sentence in
        the whole wiki that bears on CLM-2130: the field can carry a credit, the
        reader handles it, and the extract has never contained one. Nothing
        connects that paragraph to that ticket.

