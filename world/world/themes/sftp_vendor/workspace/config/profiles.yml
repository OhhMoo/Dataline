# run.sh sets DBT_PROFILES_DIR=config. if you run bare dbt you get whatever is
# in ~/.dbt/profiles.yml, which for most of us is still pointing at the old
# shared file. don't.
world_dbt:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:

    dev:
      type: duckdb
      path: "{{ env_var('DBT_WAREHOUSE_PATH', '../var/warehouse/warehouse.duckdb') }}"
      threads: 1

    ci:
      type: duckdb
      path: "/tmp/ci_warehouse.duckdb"
      threads: 1

    # prod is snowflake. the migration off duckdb was half done when the
    # backfill work took over: models are built here, then copied by the
    # platform's own loader. dbt-snowflake is NOT in requirements.txt, so
    # `--target prod` fails on the adapter before it ever tries to connect.
    # that is fine - nothing in this repo is supposed to write to prod.
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'unset') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'unset') }}"
      role: TRANSFORMER
      warehouse: WH_TRANSFORM_XS
      database: ANALYTICS
      schema: VENDOR
      threads: 4
