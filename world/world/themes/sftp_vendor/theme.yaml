name: sftp_vendor
dbt_profile: world_dbt

# The human-context plane (gateway/WORKFLOW_CONTRACT.md). Content is data, in
# workflow/{users,issues,chat,kb}.yaml; timestamps are offsets from the world
# clock ("-12d 09:15"), resolved at build time.
#
# Two statuses on purpose. The contract says the status set is declared by the
# world rather than hardcoded, and the integrations team that owns these feeds
# runs its backlog in GitHub Issues, where a ticket is open or it is closed and
# the labels carry everything else. If the surface only ever served the same
# six-state Jira vocabulary, "declared by the world" would be untested prose.
workflow:
  dir: workflow
  actor: agent                  # the id the agent writes as (workflow_actor)
  project: {key: FEEDS, name: Vendor feeds}
  statuses: [open, closed]
  workspace: acme-integrations
  space: {key: INT, name: Integrations}

jobs:
  sftp_poll:
    command: sftp_poll
    duration_s: 20
    time: "05:30"
    day_offset: 1
    after: null
    detail: null
    # A real poll of the real drop folders: it counts THIS NIGHT's delivery
    # sentinels and fails if the vendor did not deliver.
    #
    # `{day_compact}` is the execution day in the dialect the drop folder
    # speaks - gen.write_day names its files ORDERS_<YYYYMMDD>.csv/.done from
    # the data day (gen.py:68), and this job's day_offset: 1 means the 05:30
    # poll on D+1 is looking for day D's delivery. Verified against the seeded
    # history: the run record for 2026-03-04T05:30:00Z carries
    # execution_date 2026-03-03, which is the stamp on the files it wants.
    #
    # Scoping matters more than it looks. The pattern used to be `*/*.done`
    # with min: 1 over a CUMULATIVE tree, so from day two onward the count
    # could not fall below the minimum and the poll could not fail - which
    # made this theme's `late_arrival` fault, shipped enabled, cost nothing a
    # scheduler could see.
    #
    # min: 2 because a night's delivery is BOTH feeds: acme ORDERS and globex
    # RETURNS. That also gives vendor_partial_upload (torn_write) something to
    # bite: it withholds the ORDERS sentinel, and faults.apply_torn_write's
    # own docstring claims "a poll that checks for one genuinely reports the
    # vendor as not finished" - with a day-scoped min: 2 that claim is true.
    exec:
      kind: scan
      path: data/drop
      pattern: "*/*_{day_compact}.done"
      min: 2
  vendor_load:
    command: vendor_load
    duration_s: 60
    after: {job: sftp_poll, minutes: 10}
    detail: "dt={day}"
    # Runs the workspace's own loader/vendor_load.py - the script the agent
    # reads is the script that runs.
    exec:
      kind: theme
      op: load_raw
      args: [workspace, db]
      tables: [raw.vendor_orders, raw.vendor_returns]
  dbt_build:
    command: dbt_build
    duration_s: 90
    after: {job: vendor_load, minutes: 5}
    detail: null
    exec:
      kind: dbt
      command: build
      tables: [warehouse.fct_orders_daily]

live:
  params: [seed, orders_per_day, returns_per_day, customers, amount_cents]
  arrival:
    name: vendor_drop
    op: write_day
    at: {day_offset: 1, time: "05:00"}

  # The backstory carries the catalogue too, so this world's past looks like
  # its present rather than like thirty flawless nights that stop the moment
  # the episode opens. sftp_connection_reset draws over the seeded days at the
  # same 0.15 it draws at now, so `sched_logs` opens on a poll that has been
  # dropping its connection every week or so, and telling "this is new" from
  # "this has always been broken" becomes work the agent has to do.
  # In practice this is the job faults only: see vendor_late_delivery below for
  # the measured reason the arrival fault records nothing in the past.
  faults_in_history: true

  # ------------------------------------------------------------------
  # Seeded fault layer. sftp_vendor ships its catalogue ENABLED: a vendor drop
  # folder is the least reliable integration in any real stack, and this theme
  # exists to model one. "This world has a flaky vendor feed" is an authoring
  # decision made here, and it reproduces byte for byte on every rebuild.
  # A seed file can quiet it down: faults: {vendor_partial_upload: {enabled: false}}
  # ------------------------------------------------------------------
  faults:
    # The vendor uploads two and a half hours late.
    #
    # MEASURED, both before and after. BEFORE the scan was day-scoped this
    # fault was inert: at 05:30 on 2026-03-04, with day 2026-03-03's delivery
    # deferred to 07:30, sftp_poll's cumulative `*/*.done` glob counted 60
    # older sentinels and SUCCEEDED, so the night's entire signature was
    # vendor_load's effects (rows_after == rows_before) and the day landing one
    # night behind. AFTER: the same occurrence counts 0 files matching
    # `*/*_20260303.done` against min: 2 and FAILS, which is the poll this
    # theme always claimed to have.
    #
    # `missed_by: [sftp_poll]` is that measurement written down, and
    # `missed_error` is the executor's own message for the night, with
    # `{day_compact}` resolved per night so the seeded backstory quotes what
    # the live path produces rather than paraphrasing it. vendor_load is NOT
    # named: it is a theme load_raw hook that parses whatever is in the drop
    # folder and succeeds with one day fewer in it.
    #
    # The delivery lands at 07:30 and the next night's load picks it up, so the
    # landing zone the builder wrote is still the landing zone this fault would
    # have left - which is the whole reason `late_arrival` is the one arrival
    # fault the backstory carries (faults.py, HISTORY_ARRIVAL_KINDS).
    - id: vendor_late_delivery
      kind: late_arrival
      enabled: true
      rate: 0.20
      params:
        delay_minutes: 150
        missed_by: [sftp_poll]
        missed_error: "data/drop holds 0 file(s) matching */*_{day_compact}.done, expected at least 2"
    # The signature pathology this theme was built for: a read landing inside a
    # write. The ORDERS csv is cut mid-line at 55% and its .done sentinel never
    # appears, so the folder holds exactly what a delivery in flight looks like.
    # The loader skips unsentinelled files, so the day does not load; drop the
    # sentinel requirement and it reads a file with a torn final record.
    # It does NOT heal, measured: a world advanced three nights past a torn
    # 2026-03-04 upload still has no 2026-03-04 in raw.vendor_orders, because
    # the file stays truncated and unsentinelled and the loader never revisits
    # it. That permanence is why the seeded backstory does not carry this kind
    # (faults.py, HISTORY_ARRIVAL_KINDS) - the built landing zone is complete,
    # so a torn night in the past would be a story the data contradicts.
    - id: vendor_partial_upload
      kind: torn_write
      enabled: true
      rate: 0.12
      params: {match: "ORDERS_*.csv", remove: "ORDERS_*.done", keep_fraction: 0.55}
    # The vendor re-sends the batch. raw.vendor_orders is append-only and keyed
    # on _source_file, so a differently-named copy of the same rows is loaded
    # again and the day's revenue doubles.
    - id: vendor_double_delivery
      kind: duplicate_arrival
      enabled: true
      rate: 0.08
      params: {match: "ORDERS_*.csv", suffix: ".resend"}
    # SFTP drops the connection. The first attempt never reaches the folder;
    # seven minutes later the poll runs for real.
    - id: sftp_connection_reset
      kind: job_retry
      enabled: true
      rate: 0.15
      jobs: [sftp_poll]
      params: {attempts: 2, retry_delay_minutes: 7, fail_after_s: 8,
               error: "paramiko.ssh_exception.SSHException: Connection reset by peer"}
    # Declared and off: the loader is append-only, so a torn commit here does
    # NOT heal on the next night the way it does in the reload themes. That is
    # a sharper defect than a task author usually wants by default.
    - id: vendor_load_partial
      kind: partial_write
      enabled: false
      rate: 0.05
      jobs: [vendor_load]
      params: {table: raw.vendor_orders, partition_column: order_date,
               order_column: order_id, keep_fraction: 0.5}

ingest:
  # The connector control plane (gateway/INGEST_CONTRACT.md). One sync per
  # connector per day, timed after sftp_poll and before vendor_load; row counts
  # come from the same per-day RNG as the drop folders.
  #
  # It reads the SAME seeded-fault decision the run history does
  # (faults.history_arrivals), so the nights sftp_poll failed on are the nights
  # these connectors failed on. It used to seed a green sync unconditionally,
  # which after the poll was day-scoped left six nights where `ingest_runs`
  # claimed rows out of files `sched_logs` says were still two hours from
  # landing. A withheld night is now a failed sync with zero rows and a
  # `sync_failed` alert, and the next morning's sync carries both nights.
  connectors:
    acme_orders:
      name: "Acme orders (SFTP drop)"
      source: {type: sftp, location: data/drop/acme}
      destination: {schema: raw, tables: [vendor_orders]}
      status: active
      schedule: "31 5 * * *"
      time: "05:31"
      duration_s: 40
      feed: orders
      rows_per_sync: 50
      columns: [order_id, order_date, customer_id, amount]
      column_added: propagate
      column_removed: ignore
    globex_returns:
      name: "Globex returns (SFTP drop)"
      source: {type: sftp, location: data/drop/globex}
      destination: {schema: raw, tables: [vendor_returns]}
      status: active
      schedule: "32 5 * * *"
      time: "05:32"
      duration_s: 30
      feed: returns
      rows_per_sync: 2
      columns: [return_id, order_id, return_date, amount]
      column_added: propagate
      column_removed: ignore
