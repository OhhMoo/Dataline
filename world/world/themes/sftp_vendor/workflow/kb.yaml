  - id: int/vendors/acme-orders
    title: Acme - orders feed
    parent: int/vendors
    labels: [vendor, acme]
    body: |-
      # Acme - orders feed

      One file per day into `data/drop/acme/`, named `ORDERS_YYYYMMDD.csv`,
      followed by `ORDERS_YYYYMMDD.done` when the transfer completes. The
      sentinel contains the row count of the file it belongs to.

      Columns: `order_id`, `order_date`, `customer_id`, `amount`. Everything is
      a string in `raw.vendor_orders`; `staging.stg_orders` casts. The loader
      adds `_source_file`, which is how a redelivery is matched to the rows it
      replaces.

      Volume runs roughly 40-60 orders a day. Connector: `acme_orders`, cron
      `31 5 * * *`.
    version: 4
    author: pnovak
    last_edited_by: pnovak
    last_edited_at: "-60d 11:40"
    edit_comment: document the sentinel row count
    history:
