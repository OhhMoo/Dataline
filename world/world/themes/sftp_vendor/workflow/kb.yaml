  - id: int/postmortems/2026-01-12-duplicate-orders
    title: "Postmortem: duplicate orders, 2026-01-12"
    parent: int/postmortems
    labels: [postmortem, loader]
    body: |-
      # Postmortem: duplicate orders, 2026-01-12

      ## What happened

      Acme resent `ORDERS_20260112.csv` with a corrected amount column. The
      day was loaded by hand with `--on-redelivery append`, because the runbook
      says append is the default. Every order for the day existed twice and the
      day's gross doubled. Finance found it.

      ## Why

      The runbook is wrong. The flag defaults to `overwrite`, which deletes by
      `_source_file` and reinserts. Nobody had read the script in months.

      ## Actions

      1. Fix or delete int/runbooks/vendor-load. **Open.** FEEDS-44.
      2. Compare the sentinel's row count against rows inserted, and fail the
         load when they disagree. **Open.** FEEDS-47.
      3. Reload the affected day. Done.

      ## What we still do not know

      Whether any other day was loaded by hand with the same flag. We checked
      January and stopped. A day loaded twice and a day delivered empty look
      nothing alike in the fact table, but nobody has ever checked which days
      the returns feed delivered empty either.
    version: 2
    author: rhaddad
    last_edited_by: rhaddad
    last_edited_at: "-49d 11:55"
    edit_comment: record both open actions
    history:
      - {version: 1, at: "-49d 10:30", by: rhaddad, comment: null}
    authoring:
      kind: accurate_but_partial
      note: >-
        SV-K7. True, and silent about the half that matters. Two of its three
        actions are still open, and the closing paragraph names this week's
        question - which days the returns feed delivered empty - seven weeks
        before anybody asked it, and then says nobody checked. An agent that
        reads postmortems is handed the shape of the answer early.
