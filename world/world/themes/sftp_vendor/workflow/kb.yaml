  - id: int/vendors/globex-returns
    title: Globex - returns feed
    parent: int/vendors
    labels: [vendor, globex]
    body: |-
      # Globex - returns feed

      One file per **business day** into `data/drop/globex/`, named
      `RETURNS_YYYYMMDD.csv` with a matching `.done`. Globex do not run their
      export at weekends, so expect five files a week and do not raise a
      chaser for a Saturday.

      Columns: `return_id`, `order_id`, `return_date`, `amount`. Lands in
      `raw.vendor_returns`.

      A return always references an order from the same day.
    version: 2
    author: pnovak
    last_edited_by: pnovak
    last_edited_at: "-172d 14:05"
    edit_comment: note the weekday-only schedule
    history:
      - {version: 1, at: "-180d 09:20", by: pnovak, comment: null}
    authoring:
      kind: stale
      note: >-
        SV-K2. Published, 172 days untouched, and false in the way that matters
        this week: Globex deliver every day. Measured, all 30 RETURNS files are
        present in data/drop/globex including weekends, and six of them are
        header-only. A reader who believes this page will explain away a zero
        day as a weekend and stop looking - and 2026-02-27 is a Friday, so the
        explanation does not even fit. One fs_list settles it.

