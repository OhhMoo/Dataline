      - {version: 2, at: "-150d 09:20", by: rhaddad, comment: null}
      - {version: 1, at: "-180d 09:10", by: pnovak, comment: null}
    authoring:
      kind: accurate
      note: >-
        SV-K1. Current and correct on every checkable claim - the sentinel does
        carry a row count, _source_file does exist, the connector id and cron
        match var/ingest/state.json, and measured volume is 43 to 60. It is the
