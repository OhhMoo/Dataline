fidelity_gap: >
  FOUR OBJECTS: dashboard (name, owner, tiles); tile (title, the number, the query or
  metric behind it, last_refreshed_at); metric definition (name, expression, owner, the
  doc it is described in); refresh event (tile, ran_at, source_watermark). What it will
  NOT have: a query builder, drill-down, permissions beyond a simple row filter for
  A021, scheduling UI, or chart rendering beyond a rendered value. The deliberate design
  choice is that WE own the refresh and watermark model, because that is the axis A001,
  A003, A006, A022 and A029 grade on - 'the dashboard disagrees with the warehouse' is a
  claim about staleness, and borrowing Superset's or Tableau's caching semantics for it
  means grading on someone else's implementation detail.
notes: >
  T1 2026-09-13 (round R002, mock-priority pass): NEW RECORD - the highest-leverage
  build on the list, and the one that makes four 'none found' BI rows disappear at once.
  Fifteen archetypes touch bi_dashboard, joint second-highest demand in the corpus, and
  every one of them needs a number, its definition, and when it last refreshed. Tableau
  (T113), Power BI (T114), Looker (T115) and Sigma (T128) become names on this surface
  rather than four separate impossible mocks. It also agrees with ground rule 6, which
  already freezes v1 on 'a BI-values + docs surface' - so this is less a new proposal
  than a costed one. Superset (T137, Apache-2.0, PROBED pass by T1 2026-09-13: /health
  returned OK) remains the escape hatch for a task that needs a real BI tool.
