fidelity_gap: >
  MetricFlow compiles metric definitions into SQL, which is what A030 needs in order to
  consolidate near-duplicate metric definitions into one. It is not the dbt Cloud
  Semantic Layer API, so nothing turning on the hosted metrics endpoint, its caching or
  its entitlements is reproducible. Running MetricFlow against dbt-duckdb rather than a
  warehouse adapter is the usual integration friction, and it is why this is medium
  rather than easy.
