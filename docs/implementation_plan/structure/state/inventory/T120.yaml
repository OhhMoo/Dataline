notes: >
  T1 2026-09-13 (round R002, mock-priority pass): RESOLVED from none_found to
  native_oss, and it corrects a widely-held belief worth stating plainly: MetricFlow is
  Apache-2.0, not BSL. Verified twice on 2026-09-13 - the GitHub API reports Apache-2.0
  for dbt-labs/metricflow, and the LICENSE file itself opens 'Apache License Version
  2.0, January 2004' (S812). Anyone who remembers the Transform-era licensing and writes
  this off without checking will drop a shippable dependency for no reason. lkml covers
  the LookML dialect of the same surface and was probed pass. Only one archetype (A030)
  needs any of this today.
