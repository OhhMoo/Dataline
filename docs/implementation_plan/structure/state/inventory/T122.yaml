fidelity_gap: >
  The risk here is inverted from everywhere else. A003 is literally 'the quality gate is
  the bug' - silent loss caused by a validation - so the gate's behaviour IS the planted
  defect. Building that on a third-party library makes the defect depend on that
  library's version semantics, and GX's API has churned hard across major versions. A
  hand-written check, or plain dbt tests, gives a defect we own. Use GX for texture and
  realism; do not let it own the grading-critical behaviour.
