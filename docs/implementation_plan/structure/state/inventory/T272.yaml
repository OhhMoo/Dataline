notes: >
  RESOLVED THIS ROUND, and the answer is no. Teradata Vantage Express does still exist and is
  still offered free, but it is distributed as an 80GB virtual machine image behind an account
  login, described by the vendor as an evaluation copy intended for trial use and not officially
  supported. There is no database-engine container: the containers published under the vendor's
  name are Python and R CLIENT sandboxes, not the engine. An 80GB trial-licensed VM is
  incompatible with a 2GB, sub-60-second, thousands-of-sandboxes budget by roughly three orders of
  magnitude. FORTUNATELY IT IS NOT NEEDED: the mechanism worth building (SET tables silently
  discarding duplicate rows on a set-based load, S932 plus S933) is a CONSEQUENCE that a world
  builder can simply materialize, by having the load path apply the dedup. Pair that with T291's
  sqlglot teradata dialect for surface dialect realism. We are not emulating Teradata; we are
  reproducing what an engineer sees when a Teradata load lies to them.
