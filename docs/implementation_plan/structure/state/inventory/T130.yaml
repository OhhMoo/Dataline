notes: >
  B4 probe 2026-09-11: installs clean on Python 3.11 Windows, fakesnow 0.11.16,
  imports OK.
  Covers T107 (Snowflake). Patches snowflake-connector-python in-process, so it is
  invisible to agents that shell out to snowsql or curl the REST API (the known
  sdk_reshape weakness, role doc + F2 section 4). Fakesnow also ships a standalone
  HTTP server mode that serves JDBC/CLI/Go connectors (S316) -- if adopted, that mode
  upgrades this to wire_protocol and should be preferred. Fidelity caveats from F2:
  non-deterministic row ordering and a liberal SQL dialect mean graders need explicit
  ORDER BY and must not rely on Snowflake rejecting malformed SQL. Declared real,
  Apache-2.0, actively maintained (pushed 2026-09-11) per role brief; G2 to confirm.
