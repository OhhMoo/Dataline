notes: >
  Verified at 30.15.0 on 2026-09-13 with a 30-statement Snowflake corpus. Sharpens S318's
  'transpiler, not validator' warning into a concrete boundary: sqlglot translates the
  EXPRESSION layer well onto DuckDB (VARIANT path access, OBJECT_CONSTRUCT, FLATTEN, QUALIFY,
  LISTAGG, TABLESAMPLE, IFF/NVL/ZEROIFNULL all got native forms) and gives you NOTHING on the
  PLATFORM layer - AT/BEFORE, CLONE, CREATE STREAM, CREATE TASK, RESULT_SCAN, GET_DDL, SYSTEM$
  functions and ACCOUNT_USAGE all pass through verbatim, and UNDROP raises 'Unsupported
  expression type Undrop'. That platform layer is exactly what fakesnow's transforms package
  exists to supply, and exactly what any Snowflake mock has to build itself.
