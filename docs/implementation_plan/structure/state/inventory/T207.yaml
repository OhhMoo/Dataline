fidelity_gap: >
  Elementary reads dbt's artifacts (manifest, run_results) rather than imposing its own
  configuration tree, which is lighter than Great Expectations in a dbt-centric world
  and keeps the test definitions where the models are. The cost is coupling: it inherits
  whatever dbt-duckdb does, so the adapter fidelity gap recorded on T105 propagates into
  the quality surface too.
notes: >
