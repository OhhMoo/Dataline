notes: >
  No usable free edition known to T3. PROPOSED PROXY, and this one is nearly free: the distinctive
  property versus a modern orchestrator is that dependencies are expressed as TIME rather than as
  DATA. A downstream job fires at 03:00 whether or not the 02:00 upstream finished, so a late-but-
  successful upstream produces a downstream run over stale data with every status green. The
  existing deterministic scheduler already has logical dates and run history; this is a
  scheduling-semantics option on it, not a service. SOURCE GAP, stated plainly: T3 found no
  verified firsthand incident report of this specific failure, only descriptions of the feature.
  The mechanism is sound and the attestation is missing.
