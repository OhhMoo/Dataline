fidelity_gap: >
  Atlan is not reproduced by anything and is not being reproduced. Unity Catalog OSS is
  a real governance server but a heavy one, and what A019 and A021 need is narrower than
  either product: A019 needs column-level lineage so a rename's blast radius is
  discoverable, A021 needs a grants-and-masking table with contradictory entries. Both
  are a table and a graph. Standing up a 2.6GB Java catalog, or OpenMetadata's Java +
  Elasticsearch + MySQL stack, to serve two archetypes is a poor trade unless catalog
  demand grows.
