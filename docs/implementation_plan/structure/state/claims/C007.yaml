id: C007
claim: >
  The warehouse/database tier of the inventory is mock-able by direct OSS substitution
  without any HTTP interception: Snowflake tasks run hermetically on fakesnow-over-DuckDB
  (standalone HTTP-server mode gives per-connection isolated databases for parallel rollouts),
  Redshift/BigQuery surfaces map onto Postgres or DuckDB with sqlglot transpiling dialects at
  task-build time, and ClickHouse is itself open source. Snowflake's own data-eng-bench
  validates the pattern by running all 103 tasks on a baked-in DuckDB backend with a real
  Snowflake variant only as the dialect-fidelity axis.
