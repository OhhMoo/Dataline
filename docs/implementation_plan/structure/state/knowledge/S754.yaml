id: S754
rq: RQ1
claim: >
  dbt's own documentation states the append-duplication mechanism normatively: if an incremental
  model does not specify a unique_key, most adapters fall back to append-only behaviour and dbt
  inserts every row the model's SQL returns into the pre-existing target table with no regard for
  whether those rows are duplicates. The same page warns that a unique_key whose columns contain
  nulls may fail to match rows and generate duplicates anyway.
url: https://docs.getdbt.com/docs/build/incremental-models
quote: "which means dbt inserts all rows returned by the model's SQL into the preexisting target table without regard for whether the rows represent duplicates"
