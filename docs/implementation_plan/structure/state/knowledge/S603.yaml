id: S603
rq: RQ1
claim: >
  A coordinator crash between "Iceberg commit succeeded" and "control-topic offset advanced"
  makes the replacement coordinator re-consume a stale DATA_WRITTEN event and register the
  same physical parquet file in a second snapshot; the table is internally consistent, every
  row in that file is simply counted twice, and the only evidence is two snapshots sharing a
  file_path.
