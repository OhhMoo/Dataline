id: S752
rq: RQ1
claim: >
  PostgreSQL's own documentation specifies the WAL-retention mechanism behind replication-slot disk
  exhaustion: a slot guarantees the primary will not remove WAL segments until every standby
  consuming that slot has received them, and will not remove rows that could cause a recovery
  conflict, and it does this even while the standby is disconnected. That guarantee is
  unconditional - a slot whose consumer is dead retains WAL at the database's full write rate until
  the volume fills.
url: https://www.postgresql.org/docs/17/warm-standby.html
quote: "Replication slots provide an automated way to ensure that the primary server does not remove WAL segments until they have been received by all standbys"
source_type: docs
