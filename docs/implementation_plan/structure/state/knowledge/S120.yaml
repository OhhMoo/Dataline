id: S120
rq: RQ1
claim: >
  In an interview study of 18 ML engineers running production pipelines, data leakage - training on data unavailable at serving time - was reported as a routine bug that surfaces only AFTER deployment, once wrong live predictions have been made. Named variants included training an embedding model on the same split as the downstream model, a class-imbalance mismatch between training and serving populations, and ignoring feedback delay (the lag before ground-truth labels arrive) during training.
url: https://arxiv.org/html/2209.09125v1
