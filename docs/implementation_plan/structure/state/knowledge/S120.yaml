notes: >
  Corroborates leakage-is-pervasive (S111/S112) from industry rather than academia, and adds three mechanisms the science taxonomy does not cover: shared split between an upstream embedding and a downstream model, serving-population imbalance, and label-lag leakage. The 'only discovered after deployment' timing is what makes it a multi-hop diagnosis task.
