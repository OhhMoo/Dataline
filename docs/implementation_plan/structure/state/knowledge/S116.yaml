id: S116
rq: RQ1
claim: >
  The same Google document records a real dropped-data incident from copying a pipeline: the Google Plus What's Hot pipeline deliberately discarded older posts, was copied to power Google Plus Stream where older posts are meaningful, and kept silently dropping them. A parallel case in Play: a new pipeline for Play Apps Home also contained examples from the Play Games landing page with no feature to distinguish their origin.
url: https://developers.google.com/machine-learning/guides/rules-of-ml
quote: 'Be careful about dropped data when copying pipelines.'
