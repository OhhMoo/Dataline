notes: >
  A copied-pipeline-with-inherited-filter defect is trivially plantable and hard to spot: the code runs, metrics look plausible, and the only symptom is a subtly wrong training distribution. The Play example - two data sources merged with no provenance column - is a second distinct plantable defect.
