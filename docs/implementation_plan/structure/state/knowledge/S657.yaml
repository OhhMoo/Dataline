notes: >
  Verified verbatim against the raw HTML of the page on 2026-09-13 by exact substring match,
  not by eyeballing a rendering. The adjacent caveat, also verified verbatim in raw HTML, is:
  Column-level lineage relies on SQL parsing. Errors can occur when parsing fails or a
  column's origin is unknown (like with JSON unpacking, lateral joins, and so on). In these
  cases, lineage may be incomplete and ... This is documentation, not an incident, so
  attestation is unattested and vividness is medium; its value is that it establishes the
  blind spot as designed behaviour rather than as a bug, which is what makes a WHERE-clause
  needle fair rather than unfair.
