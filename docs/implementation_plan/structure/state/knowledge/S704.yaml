id: S704
rq: RQ1
claim: >
  A dbt-core bug report (issue 5138, CT-547) filed against dbt 1.0 on Snowflake states that the
  first run of an incremental model does not apply unique_key or the incremental strategy, so any
  duplicates present in the model's own select land in the target table on that first run and
  survive every subsequent incremental run. The issue was closed as wontfix, which means the
  behaviour is current and by design - a dormant duplication hazard that never expresses itself
  until something causes a rebuild or a replay.
url: https://github.com/dbt-labs/dbt-core/issues/5138
quote: "When running an incremental model for the first time it doesn't use the unique_key plus incremental_strategy. This means that if your model doesn't have duplicate elimination inside of it that duplicates will appear on the first run of model."
