notes: >
  Issue #403, opened 2026-08-31, CONFIRMED STILL OPEN at retrieval. Reporter runs fakesnow in
  docker for a Postgres-to-Snowflake sync service's integration tests and enumerates eight
  failures across CREATE OR REPLACE STAGE / CREATE FILE FORMAT / FORMAT_NAME / PUT / table
  stages / MERGE row counts. I independently reproduced the 500-then-retry-loop class on
  2026-09-13 with SELECT $1 FROM VALUES (1),(2) - a duckdb InvalidInputException became a 500
  and the connector reached retryCount=42 before I killed it. This is a hang, not an error, and
  would silently consume an episode's wall-clock budget.
