claim: >
  fakesnow's server mode turns unhandled internal exceptions into HTTP 500, and snowflake-
  connector-python treats 500 as retryable, so an unsupported statement hangs the client in a
  retry loop for minutes instead of returning an error.
url: https://github.com/tekumara/fakesnow/issues/403
quote: "returning HTTP 500. The snowflake connector then retries the 500 in a loop, so the client hangs for ~10 minutes instead of failing fast."
