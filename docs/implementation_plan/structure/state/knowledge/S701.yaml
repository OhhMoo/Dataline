id: S701
rq: RQ1
claim: >
  InfoQ's write-up of Joel Koshy's account of LinkedIn's Kafka production incidents describes an
  offset manager that was fed a stale offset, causing consumers to re-read messages they had
  already consumed and re-deliver duplicate emails. The same write-up describes a later incident
  in which the cleanup of stale offsets interacted with delayed log compaction and a concurrent
  offset-load to strand replication - a fix to one problem exposing a second latent one.
url: https://www.infoq.com/news/2016/06/linkedin-kafka-debugging
quote: "a formatting change to messages, and the subsequent termination of cache loading on an offset manager that had been fed a stale offset"
source_type: blog
