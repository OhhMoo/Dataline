notes: >
  confidence is medium, not high, for two reasons I want on the record. First, this is InfoQ
  reporting a conference talk, so it is secondhand - the incident is LinkedIn's, the words are a
  journalist's. Second, the quoted span was extracted by a fetch-and-summarise step and I did not
  independently re-read the surrounding paragraph to confirm the span is contiguous and unedited.
  Treat it as needing a human re-read before it is leaned on. The mechanism it licenses, that
  rewinding a consumer position causes redelivery of already-processed records, is independently
