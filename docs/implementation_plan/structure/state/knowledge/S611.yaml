id: S611
rq: RQ1
claim: >
  DuckDB combines MVCC with optimistic concurrency control inside a single writer process:
  conflicting edits fail loudly, but appends never conflict even on the same table - so two
  interleaved appending writers both succeed and leave a table that is internally consistent
  and factually impossible, with no error anywhere to find.
url: https://duckdb.org/docs/current/connect/concurrency.html
quote: "As long as there are no write conflicts, multiple concurrent writes will succeed. Appends will never conflict, even on the same table."
source_type: docs
