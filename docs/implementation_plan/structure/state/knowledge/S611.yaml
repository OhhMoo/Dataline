notes: >
  Official DuckDB documentation. Unattested (guidance, not an incident) and therefore cannot
  license frequency; recorded because DuckDB is one of the five frozen v1 surfaces and this
  is the buildability constraint for every archetype in my block.
  The operative consequence: a concurrency archetype on DuckDB cannot rely on the engine
  raising a conflict. Interleaving has to be staged by the world generator as committed
  artifacts (two writers' rows, two load-log entries, two scheduler state rows) rather than
  produced live by a racing harness - which is also what makes it deterministic and
  replayable. The page does document a conflict error string
  ("Transaction conflict: cannot update a table that has been altered!") for the
  update/alter path, which is available as world texture if a task needs a loud failure
  somewhere in the log.
  Note: duckdb.org/docs/stable/connect/concurrency.html 301-redirects to this /current/ URL;
  citing /current/ so G1 does not trip on the redirect.
