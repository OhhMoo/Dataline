id: S867
rq: RQ4
claim: >
  Snowflake CREATE ... CLONE is a metadata operation whose result is affected by Time Travel and
  data retention on the source object, so cloning and Time Travel are one coupled feature rather
  than two independent ones.
url: https://docs.snowflake.com/en/sql-reference/sql/create-clone.md
quote: "Creates a copy of an existing object in the system. This command is primarily used for creating"
source_type: docs
