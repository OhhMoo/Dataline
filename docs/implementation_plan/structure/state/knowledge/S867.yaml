notes: >
  The companion cloning-considerations page states that factors 'such as DDL and DML
  transactions (on the source object), Time Travel, and data retention periods can affect the
  object clone'. Design consequence: if Time Travel is built on DuckLake snapshots, CREATE TABLE
  ... CLONE AT(...) is a CTAS from a pinned snapshot and comes almost free; without Time Travel,
  clone degrades to a plain copy that is observably wrong the moment an archetype depends on the
  source changing afterwards.
