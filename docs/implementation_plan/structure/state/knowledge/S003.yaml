id: S003
rq: RQ1
claim: >
  Teams monitor whether a job ran and whether rows were written, but not whether the rows are
  correct. Freshness monitoring is near-universal and correctness monitoring near-absent, which
  is why bad data sits in production for months before a human notices and a backfill becomes
  necessary at all.
