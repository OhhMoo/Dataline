notes: >
  Evidence the defect is reachable under at least two distinct incremental configurations - NOT
  evidence of frequency (F455): two issues filed fourteen months apart against one adapter, with
  zero and one comment respectively, have no denominator and no duplicate pile-up.
  CLOSED AND FIXED: re-verified via the GitHub API 2026-09-13 - state=closed, labels 'not an issue'
  and 'external issue', with a collaborator comment confirming the fix shipped in dbt-databricks
  1.11.7 on 2026-04-17 (replace_where and microbatch now emit INSERT BY NAME where the runtime
  supports it). A world built on this mechanism must pin the adapter below 1.11.7. The failure is partition-scoped (REPLACE WHERE on a
  snapshot date), so only the days processed after the schema change are corrupt while earlier
  partitions are fine. That mixed-state table is a good initial condition: the repair requires
  detecting the boundary date and re-processing only beyond it.
