id: S606
rq: RQ1
claim: >
  When a dbt incremental model's temp relation cannot be session-scoped it is materialized as
  a permanent table in the shared schema under a deterministic model__dbt_tmp name, so two
  concurrent runs of the same model collide on one intermediate object and each run can read
  or clobber the other's staged rows.
url: https://github.com/dbt-labs/dbt-adapters/issues/1893
quote: "When running incremental models on Iceberg (catalog-linked) tables in Snowflake, the tmp relation is created as a permanent table because temporary tables are not supported in catalog-linked database schemas."
