notes: >
  Strong evidence for the 'must read external docs' hypothesis: resolving this class of mismatch requires reading the source system's documented semantics (time zone setting, refund lifecycle, which statuses are counted), not just reading SQL. A natural scattered-docs task where the answer only exists in a vendor doc placed in the world.
