id: S206
rq: RQ1
claim: >
  Shopify's own UI reports and a warehouse built from Shopify's API systematically disagree: the UI uses the shop's configured local time zone while the API returns UTC with no DST adjustment, so daily totals drift at DST transitions, and the UI's order-status and refund handling (pending vs completed refunds, restock without refund, zero-dollar refunds) differs from what lands in the warehouse.
url: https://weld.app/blog/shopify-analytics-discrepancies
quote: "Without adjusting for DST, your warehouse daily totals will drift around March/October (EU) or March/November (US)"
