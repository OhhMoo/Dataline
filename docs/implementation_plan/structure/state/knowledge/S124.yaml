claim: >
  In the Kaggle Santander Value Prediction Challenge (2018, 4459 teams, $60k prize) the anonymised feature matrix turned out to encode a time series, and the discovered leak dominated every legitimate modelling effort. One competitor's documented ladder shows the gap precisely: a tuned CatBoost/XGBoost/LightGBM ensemble with feature selection, PCA and statistical features reached private LB 1.37273 at rank 2206, while the leakage-exploiting model reached 0.53032 at rank 28. The same write-up notes that anonymised data with leakage leaves almost no room for feature engineering.
