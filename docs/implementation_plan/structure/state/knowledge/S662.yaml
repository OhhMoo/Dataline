notes: >
  Fetched 2026-09-13 through the Discourse JSON API for topic 6835; topic reports 1944 views.
  Also verbatim in the same post: we can have code generation that inspects some metadata
  that indicates what customers should have what data models/data pipelines, and then
  generate the corresponding assets (models, seeds, and corresponding yaml) in the
  corresponding locations in the dbt project. This is the load-bearing realism argument for
  every archetype in the A050 block: a 500-model world does not have to pretend to be
  hand-written, because real projects at that size are themselves machine-generated from a
  metadata spec. Generated bulk is the realistic case, not the shortcut.
