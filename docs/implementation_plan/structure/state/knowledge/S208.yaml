claim: >
  The same team reported a three-week traffic decline that did not exist. TWO SEPARATE DEFECTS, which an earlier version of this record wrongly fused into one (F458): (a) the comparison window was five days LONG against a seven-day current window - unequal window lengths, which is what the quoted line is about; and (b) roughly 28% of finalized days in the upstream analytics source came back near zero (16 to 293 impressions against normal days of 1,200 to 3,700, clustered, every week or two), so the current seven-day window held four near-empty days and roughly three valid ones. Measured per valid day the metric had doubled while the totals fell; both statements were true.
