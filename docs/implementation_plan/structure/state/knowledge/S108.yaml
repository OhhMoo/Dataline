  Every MLE-bench task was screened by at least two ML engineers at frontier labs against a 9-point written admissibility checklist, including: the description must be self-contained enough to be solvable without consulting discussion forums, the evaluation metric must be locally computable, the dataset must not be heavily used outside Kaggle (MNIST is explicitly excluded), train and test must be same-distribution so a new split can be cut, and the dataset license must permit inclusion.
