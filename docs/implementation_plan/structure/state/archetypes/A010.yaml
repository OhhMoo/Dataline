# Task content grounded in filed bugs S013/S014/S015/S022.

id: A010
title: Schema-drift corruption repair across the ingestion-to-dbt path
discipline: data_engineering
description: >
  An upstream source added one column and removed another. The ingestion connector,
  configured to propagate field changes, silently lost rows on sync. Downstream, an
  incremental dbt model with on_schema_change enabled now INSERTs with positional
  column matching, so values from the new column land in the wrong target columns
  while row counts still look plausible. The agent must trace the corruption from a
  destination-row-count anomaly back through the raw layer, repair the corrupted
  columns, recover the lost rows where possible, and reconfigure both connector and
  model so drift is handled explicitly.
why_hard: >
  This is silent data corruption, not a crash: every run succeeds and aggregates stay
  in a believable range, so detection requires comparing distributions and checking
  column-level semantics, not reading error logs. The two defects (row loss at
  ingestion, column permutation at transformation) have interacting symptoms, and the
  'append-only' raw table has also shrunk, breaking the usual assumption that the raw
  layer is a safe source of truth for replay.
human_hours: "8-20"
grading: >
  Deterministic: per-column checksum comparison of the repaired model against a
  reference table; destination-vs-source row-count reconciliation per business day;
  assertion that the previously mis-mapped column pairs now hold semantically valid
  values (value-range and regex-format checks); dbt schema tests on the drifted
  columns pass; connector configuration diff shows explicit (not positional) column
  mapping. Rubric: 20 points across defect isolation (ingestion vs transformation),
  correctness of repaired values, recovery of recoverable rows, and drift-hardening
  of the configuration.
rubric_points: 20
apps_touched:
  - warehouse
  - dbt
  - ingestion
deterministic_checks:
  - "per-column checksum diff vs reference table"
  - "source-vs-destination row-count reconciliation per day"
  - "value-format assertions on previously mis-mapped columns"
  - "dbt schema tests on drifted columns"
judge_axes:
  - code_quality
  - robustness
failure_modes_expected:
  - "full-refreshes everything instead of repairing the corrupted window"
  - "fixes the dbt model but never notices the connector row loss"
  - "traps on the shrunken raw table and declares rows unrecoverable prematurely"
  - "leaves positional INSERT semantics in place for the next drift event"
existing_coverage: >
  Filed-bug mechanics are directly translatable to broken-world initial conditions;
  no known bench combines connector row loss with positional-INSERT corruption.
agent_visible_brief: >
  From: Gemma Alarcon, Sales Operations. Ticket DATA-2088.
  The account reporting we pull out of the warehouse has stopped agreeing with the source
  system. My team exported their own list on Monday and the totals are not close, and when they
  went through a sample the records that are there did not all look right either. Nothing has
  changed on our side beyond the usual admin work as far as anyone here knows, and I am told
  the pipeline has not failed once. We plan territories off these reports and the quarter
  starts in two weeks. I need the warehouse copy actually matching the source, whatever is
  recoverable recovered, and some way of us knowing next time that does not depend on one of
  my reps noticing first.
